/* ===================================================================
   eFOOTBALL FRIENDS LEAGUE  ·  PORTFOLIO THEME
   One light, editorial look. Fonts: Barlow Condensed (headings) + Barlow (text).
   =================================================================== */
:root {
  --bg:#e8edf7; --card:#ffffff; --line:#d3dbec; --text:#0a1030; --muted:#5b6585;
  --accent:#0c3ce0; --gold:#0c3ce0; --red:#d62839; --ink:#061046; --soft:#dfe6f5; --blue:#0c3ce0; --sky:#8fb6ff;
  --font-head:"League Gothic","Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --font-ui:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; scroll-behavior:smooth; }
body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:16px; line-height:1.5; }
h1,h2,h3,h4,nav button,.rounds button,.score,.stat b,.ovc b { font-family:var(--font-head); }
h2,h3 { text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
.wrap { max-width:1040px; margin:0 auto; }
main { padding:26px 16px 64px; }

/* ---------- header ---------- */
header.brand { position:relative; overflow:hidden; background:var(--ink); color:#fff; padding:26px 16px 30px; border-bottom:5px solid var(--accent); }
header.brand::after { content:""; position:absolute; right:-110px; top:-120px; width:380px; height:380px; border:2px solid rgba(255,255,255,.1); border-radius:50%; }
.brand-row { position:relative; z-index:1; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
.brand-logo { flex:none; width:78px; }
.brand-svg { display:block; width:100%; height:auto; }
.brand-text { flex:1 1 280px; min-width:0; }
.brand-kicker { color:var(--accent); font:700 13px var(--font-head); letter-spacing:6px; text-transform:uppercase; }
.brand-title { font:800 clamp(46px,10vw,92px)/.9 var(--font-head); font-style:italic; text-transform:uppercase; letter-spacing:1px; }
.brand-title .seasonName { display:inline-block; vertical-align:middle; margin-left:12px; padding:5px 14px; border-radius:999px; background:#fff; color:var(--ink);
  font:700 15px var(--font-head); font-style:normal; letter-spacing:1px; transform:translateY(-6px); }
header.brand #subTitle { margin:10px 0 0; color:#b9bac4; font-size:14px; }
.brand-tools { position:relative; z-index:1; margin-left:auto; }
.sbar { display:inline-flex; align-items:center; gap:8px; color:#b9bac4; font:600 12px var(--font-head); letter-spacing:2px; text-transform:uppercase; }
.sbar select { width:auto; min-width:150px; background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:9px 14px; font:600 15px var(--font-body); letter-spacing:0; text-transform:none; }
.sbar select option, .sbar select optgroup { color:#101114; background:#fff; }

/* ---------- ticker ---------- */
.ticker { background:var(--accent); color:#fff; overflow:hidden; white-space:nowrap; padding:9px 0; }
.track { display:inline-block; animation:scroll 40s linear infinite; }
.ticker:hover .track { animation-play-state:paused; }
.tick { display:inline-block; margin:0 22px; font:600 15px var(--font-head); letter-spacing:.8px; text-transform:uppercase; color:rgba(255,255,255,.85); }
.tick b { color:#fff; }
.tick em { font-style:normal; background:var(--ink); color:#fff; padding:2px 9px; border-radius:4px; margin:0 6px; }
.tickmsg { padding:0 16px; font:600 15px var(--font-head); letter-spacing:.8px; text-transform:uppercase; }
@keyframes scroll { from { transform:translateX(0); } to { transform:translateX(-50%); } }

/* ---------- navigation ---------- */
nav { position:sticky; top:0; z-index:50; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding:10px 14px; background:rgba(243,241,234,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
nav::-webkit-scrollbar { display:none; }
nav button { flex:none; background:none; border:0; color:var(--muted); font-size:16px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; padding:9px 16px; border-radius:999px; cursor:pointer; white-space:nowrap; }
nav button:hover { color:var(--text); background:var(--soft); }
nav button.on { background:var(--ink); color:#fff; }
nav button.inst { color:var(--accent); }

/* ---------- page title (01 / Standings) ---------- */
.ptitle { display:flex; align-items:flex-end; gap:14px; margin:0 0 22px; padding-bottom:14px; border-bottom:2px solid var(--ink); }
.ptitle span { font:600 15px var(--font-head); color:var(--accent); letter-spacing:3px; padding-bottom:10px; }
.ptitle h2 { margin:0; font:800 clamp(44px,9vw,84px)/.88 var(--font-head); font-style:italic; text-transform:uppercase; letter-spacing:0; }

/* ---------- cards ---------- */
.card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; margin-bottom:18px; transition:box-shadow .25s, transform .25s; }
.card:hover { box-shadow:0 14px 34px rgba(16,17,20,.08); }
.card h2,.card h3 { margin:0 0 12px; font-size:22px; }
.legend { color:var(--muted); font-size:13px; margin:4px 2px; }
.scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.status { color:var(--accent); font-size:13px; margin:0 0 10px; min-height:18px; font-weight:600; }

/* ---------- tables ---------- */
table { width:100%; border-collapse:collapse; min-width:520px; }
th { color:var(--muted); font:600 12px var(--font-head); text-transform:uppercase; letter-spacing:1.4px; }
th,td { padding:11px 8px; text-align:center; border-bottom:1px solid var(--line); }
th.left,td.left { text-align:left; }
table tr:last-child td { border-bottom:0; }
table tr:hover td { background:var(--bg); }
tr.top4 td:first-child { box-shadow:inset 4px 0 0 var(--accent); font-weight:700; }
td.pts { font:700 20px var(--font-head); }
.tl { color:var(--text); font-weight:700; cursor:pointer; text-decoration:none; border-bottom:2px solid transparent; }
.tl:hover { border-bottom-color:var(--accent); }

/* ---------- badges, form ---------- */
.badge { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; background:var(--soft); color:var(--ink); font:700 11px var(--font-head); margin-right:8px; vertical-align:middle; }
.badge.logo { background:transparent !important; border-radius:0; }
.badge img { width:100%; height:100%; object-fit:contain; display:block; }
.badge.big { width:64px; height:64px; font-size:22px; margin:0; }
.badge.big img { padding:3px; }
.form span { display:inline-block; width:21px; height:21px; line-height:21px; text-align:center; border-radius:5px; font:700 11px var(--font-body); margin-right:2px; color:#fff; }
.W { background:#16a34a; } .D { background:#8a8a93; } .L { background:var(--red); }
.mv { font-size:11px; margin-left:6px; font-weight:700; }
.mv.up { color:#16a34a; } .mv.down { color:var(--red); } .mv.same { color:var(--muted); }
.bdg { margin-left:5px; font-size:15px; cursor:help; display:inline-block; }
.gt { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:999px; background:var(--ink); color:#fff; font-size:12px; font-weight:700; }
.pill { display:inline-block; min-width:30px; text-align:center; padding:2px 7px; border-radius:6px; font-size:12px; font-weight:700; color:#fff; }
.pill.D { background:#8a8a93; }

/* ---------- inputs & buttons ---------- */
input,select,textarea { font:inherit; color:var(--text); background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
input:focus,select:focus,textarea:focus { outline:2px solid var(--ink); outline-offset:1px; }
select { width:100%; }
.login input { display:block; width:100%; max-width:340px; margin-bottom:10px; }
.btn { background:var(--ink); color:#fff; border:0; border-radius:999px; padding:11px 22px; font:700 15px var(--font-head); letter-spacing:1.2px; text-transform:uppercase; cursor:pointer; transition:transform .15s, background .2s; }
.btn:hover { background:var(--accent); transform:translateY(-1px); }
.btn:active { transform:scale(.96); }
.btn.out { background:none; color:var(--text); border:1.5px solid var(--ink); }
.btn.out:hover { background:var(--ink); color:#fff; }
.back { margin-bottom:16px; }
.thead { display:none; }
.mfull { display:none; }

/* ---------- fixtures ---------- */
.rounds { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
.rounds button { background:#fff; border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:7px 14px; cursor:pointer; font-size:15px; font-weight:600; }
.rounds button:hover { border-color:var(--ink); color:var(--text); }
.rounds button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.match { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; padding:13px 0; border-bottom:1px solid var(--line); }
.match:last-child { border-bottom:0; }
.match .h { text-align:right; } .match .a { text-align:left; }
.match input { width:48px; text-align:center; font-weight:700; padding:8px 4px; }
.score { min-width:72px; text-align:center; font-weight:700; font-size:22px; background:var(--ink); color:#fff; border-radius:10px; padding:3px 12px; letter-spacing:2px; }

/* ---------- playoffs ---------- */
.po { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; }
.pocard { background:var(--card); border:1px solid var(--line); border-left-width:7px; border-radius:20px; padding:18px; transition:box-shadow .25s, transform .25s; }
.pocard:hover { box-shadow:0 14px 34px rgba(16,17,20,.1); transform:translateY(-2px); }
.pocard > b { font:700 22px var(--font-head); text-transform:uppercase; letter-spacing:.5px; }
.pocard small { color:var(--muted); display:block; margin-bottom:10px; }
.pocard .vs { font-weight:600; margin-bottom:10px; }
.champ { text-align:center; font:800 30px var(--font-head); text-transform:uppercase; font-style:italic; color:var(--ink); background:#8fb6ff; border-radius:20px; padding:24px; margin-top:18px; }
.shield { background:var(--ink); color:#8fb6ff; border-radius:16px; padding:14px 18px; margin-bottom:16px; font:700 18px var(--font-head); letter-spacing:1px; text-transform:uppercase; }

/* ---------- squads ---------- */
.sq { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
.sq .card { margin:0; }
.sq label { display:block; margin:10px 0 4px; font-weight:600; }
.sq input,.sq textarea { width:100%; }
.owner { color:var(--muted); margin:0 0 10px; }
.plist { margin:0; padding-left:24px; columns:2; font-size:15px; }
.plist li { margin-bottom:4px; }
li { margin-bottom:8px; }

/* ---------- featured hero (leaders / team page) ---------- */
.feat { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:space-between; gap:20px; min-height:260px; padding:28px; margin-bottom:18px; border-radius:28px; background:var(--ink); color:#fff; }
.feat::before { content:""; position:absolute; right:-80px; top:50%; width:420px; height:420px; transform:translateY(-50%); border-radius:50%; background:var(--accent); opacity:.95; }
.feat-txt { position:relative; z-index:1; min-width:0; }
.feat-txt small { display:block; color:#8fb6ff; font:700 13px var(--font-head); letter-spacing:4px; text-transform:uppercase; }
.feat-txt h2 { margin:6px 0 10px; font:800 clamp(38px,8vw,78px)/.9 var(--font-head); font-style:italic; text-transform:uppercase; letter-spacing:0; }
.feat-txt .legend { color:#d6d7de; font-size:15px; margin:0 0 16px; }
.feat-txt .btn { background:#fff; color:var(--ink); }
.feat-txt .btn:hover { background:#8fb6ff; }
.feat-txt .form { margin-top:6px; }
.feat-logo { position:relative; z-index:1; flex:none; display:flex; align-items:center; justify-content:center; width:168px; height:168px; border-radius:50%; background:#fff; }
.feat-logo .badge.big { width:132px; height:132px; font-size:40px; }
.strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:20px; }
.strip div { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 8px; text-align:center; }
.strip b { display:block; font:800 32px var(--font-head); color:var(--ink); }
.strip small { color:var(--muted); text-transform:uppercase; letter-spacing:1.2px; font-size:11px; font-weight:600; }

/* ---------- stats, awards, records, hall ---------- */
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; margin-bottom:16px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; text-align:center; }
.stat b { display:block; font-size:26px; font-weight:800; }
.stat small { color:var(--muted); }
.two { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:18px; }
.tm { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
.tm span:nth-child(2) { flex:1; }
.awards,.recs,.hlgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
.hlgrid { margin-bottom:14px; }
.award,.rec,.hlbox,.hbox,.ovc,.chip,.mteam { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; transition:transform .2s, box-shadow .2s; }
.award:hover,.rec:hover,.hbox:hover,.chip:hover { transform:translateY(-3px); box-shadow:0 12px 28px rgba(16,17,20,.1); }
.award .ic,.rec .ic,.hlbox .ic { font-size:28px; }
.award b,.rec b { display:block; font:700 19px var(--font-head); text-transform:uppercase; letter-spacing:.5px; }
.award small,.rec small,.hlbox small,.hbox small { display:block; color:var(--muted); margin-bottom:6px; }
.award .none { color:var(--muted); font-size:13px; }
.hl { background:var(--ink); color:#fff; border-color:var(--ink); }
.hl .legend { color:#b9bac4; }
.hl .hlbox { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.14); }
.hl .hlbox small { color:#b9bac4; }
.hl h3 { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
.hlbox .t { font:700 18px var(--font-head); text-transform:uppercase; color:#8fb6ff; letter-spacing:.5px; }
.hlbox .m { margin-top:6px; font-size:15px; }
.tor { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
.chip { display:flex; align-items:center; gap:10px; padding:8px 16px 8px 8px; border-radius:999px; }
.hl .chip { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.16); }
.chip .badge { margin:0; background:#fff; }
.chip b { display:block; line-height:1.2; }
.chip small { color:var(--muted); font-size:12px; }
.hl .chip small { color:#b9bac4; }
.hall { border-color:var(--ink); }
.hall h2 { margin:0 0 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.tag { font:600 12px var(--font-body); padding:3px 11px; border-radius:999px; text-transform:none; letter-spacing:0; }
.tdone { background:#8fb6ff; color:var(--ink); }
.tlive { background:#16a34a; color:#fff; }
.hgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
.hbox { border-top:5px solid var(--accent); }
.hbox .ic { font-size:30px; }
.hbox .ht { font:700 18px var(--font-head); text-transform:uppercase; color:var(--accent); letter-spacing:.5px; }
.hbox .hm { font:700 24px/1.2 var(--font-head); margin-bottom:4px; }

/* ---------- golden boot ---------- */
.boot { display:grid; gap:10px; }
.brow { display:grid; grid-template-columns:34px 38px 1fr 48px; gap:10px; align-items:center; padding:11px 14px; background:var(--card); border:1px solid var(--line); border-radius:16px; position:relative; overflow:hidden; transition:transform .2s; }
.brow:hover { transform:translateY(-2px); }
.brow .fill { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,rgba(229,32,46,.16),rgba(229,32,46,0)); z-index:0; transition:width .6s ease; }
.brow > *:not(.fill) { position:relative; z-index:1; }
.brow .rk { font:700 22px var(--font-head); color:var(--muted); text-align:center; }
.brow.first { border-color:var(--ink); border-width:2px; }
.brow .badge { margin:0; }
.brow small { display:block; color:var(--muted); }
.brow .g { font:800 28px var(--font-head); text-align:right; color:var(--accent); }

/* ---------- overview strip, progress ---------- */
.ov { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:18px; }
.ovc small { display:block; color:var(--muted); font-size:12px; }
.ovc b { display:block; font-size:24px; line-height:1.2; margin:2px 0; }
.pbar { height:6px; background:var(--soft); border-radius:99px; overflow:hidden; margin-top:6px; }
.pbar i { display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .9s ease; }

/* ---------- overlays ---------- */
.modal { position:fixed; inset:0; z-index:200; background:rgba(16,17,20,.55); display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .25s ease both; }

.ovl.closing .ovp { animation:sheetDown .2s ease both; }

@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes fadeOut { from { opacity:1; } to { opacity:0; } }
@keyframes sheetUp { from { opacity:0; transform:translateY(40px) scale(.97); } to { opacity:1; transform:none; } }
@keyframes sheetDown { from { opacity:1; } to { opacity:0; transform:translateY(30px); } }

/* ---------- toast & loading ---------- */
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:300; background:var(--ink); color:#fff; padding:11px 20px; border-radius:999px; box-shadow:0 12px 30px rgba(0,0,0,.3); font-weight:600; animation:toastIn .3s ease both; }
.toast.err { background:var(--red); }
.toast.out { animation:toastOut .3s ease both; }
@keyframes toastIn { from { opacity:0; transform:translate(-50%,20px); } to { opacity:1; transform:translate(-50%,0); } }
@keyframes toastOut { from { opacity:1; transform:translate(-50%,0); } to { opacity:0; transform:translate(-50%,20px); } }
.skel { height:46px; border-radius:14px; margin-bottom:8px; background:linear-gradient(90deg,var(--soft) 25%,#fff 50%,var(--soft) 75%); background-size:200% 100%; animation:shimmer 1.2s linear infinite; }
@keyframes shimmer { from { background-position:200% 0; } to { background-position:-200% 0; } }
@keyframes pop { from { transform:scale(0); } to { transform:scale(1); } }
@keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

/* ---------- page transitions ---------- */
#app { view-transition-name:page; }
::view-transition-old(root),::view-transition-new(root) { animation:none; }
::view-transition-old(page) { animation:pgOut .16s ease both; }
::view-transition-new(page) { animation:pgIn .36s cubic-bezier(.22,.9,.3,1) both; }
@keyframes pgOut { to { opacity:0; transform:translateY(-6px); } }
@keyframes pgIn { from { opacity:0; transform:translateY(14px); } }
#app.enter > * { animation:fadeUp .4s ease both; }
html.vt #app.enter > * { animation:none; }
@media (prefers-reduced-motion:reduce) { *,::view-transition-group(*),::view-transition-old(*),::view-transition-new(*) { animation:none !important; transition:none !important; } }

        return { id: "R" + (r + 1) + "-" + (i + 1), home: t[0], away: t[1] };
      });
    });
  }

  // =============== STANDINGS LOGIC ===============
  function getPlayedMatches() {
    const played = [];
    buildFixtures().flat().forEach(function (m) {
      const r = results[m.id];
      if (r && r.h !== "" && r.a !== "" && r.h !== null && r.a !== null) {
        played.push({ home: m.home, away: m.away, homeGoals: Number(r.h), awayGoals: Number(r.a) });
      }
    });
    return played;
  }

  function buildStandings() {
    const table = Object.keys(teams).map(function (code) {
      return { code: code, name: teams[code], played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, points: 0, form: [] };
    });
    function find(code) { return table.find(function (row) { return row.code === code; }); }

    for (const m of getPlayedMatches()) {
      const home = find(m.home), away = find(m.away);
      home.played++; away.played++;
      home.gf += m.homeGoals; home.ga += m.awayGoals;
      away.gf += m.awayGoals; away.ga += m.homeGoals;
      if (m.homeGoals > m.awayGoals) { home.won++; away.lost++; home.points += 3; home.form.push("W"); away.form.push("L"); }
      else if (m.homeGoals < m.awayGoals) { away.won++; home.lost++; away.points += 3; away.form.push("W"); home.form.push("L"); }
      else { home.drawn++; away.drawn++; home.points++; away.points++; home.form.push("D"); away.form.push("D"); }
    }
    table.sort(function (a, b) {
      return b.points - a.points || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf;
    });
    return table;
  }

    // =============== AWARDS AND BADGES ===============
  function computeBadges(rows) {
    const out = {};
    rows.forEach(function (r) { out[r.code] = []; });
    function add(code, icon, name, why) { out[code].push({ icon: icon, name: name, why: why }); }

    // streaks, from each team's results in match order
    rows.forEach(function (r) {
      let wins = 0;
      for (let i = r.form.length - 1; i >= 0 && r.form[i] === "W"; i--) { wins++; }
      let unbeaten = 0;
      for (let i = r.form.length - 1; i >= 0 && r.form[i] !== "L"; i--) { unbeaten++; }
      if (wins >= 3) { add(r.code, "🔥", "On Fire", wins + " wins in a row"); }
      if (unbeaten >= 5) { add(r.code, "🎯", "Unbeaten", unbeaten + " matches unbeaten"); }
    });

    // best defence and top scorers (teams with at least 3 matches played)
    const enough = rows.filter(function (r) { return r.played >= 3; });
    if (enough.length) {
      const minGA = Math.min.apply(null, enough.map(function (r) { return r.ga; }));
      enough.filter(function (r) { return r.ga === minGA; })
            .forEach(function (r) { add(r.code, "🧱", "Best Defence", r.ga + " goals conceded"); });
      const maxGF = Math.max.apply(null, enough.map(function (r) { return r.gf; }));
      if (maxGF > 0) {
        enough.filter(function (r) { return r.gf === maxGF; })
              .forEach(function (r) { add(r.code, "⚡", "Top Scorers", r.gf + " goals scored"); });
      }
    }

    // giant killer: beat the team that is top of the table right now
    const leader = rows[0];
    if (leader && leader.played >= 3) {
      const killers = {};
      getPlayedMatches().forEach(function (m) {
        if (m.home === leader.code && m.awayGoals > m.homeGoals) { killers[m.away] = true; }
        if (m.away === leader.code && m.homeGoals > m.awayGoals) { killers[m.home] = true; }
      });
      Object.keys(killers).forEach(function (code) {
        add(code, "🗡️", "Giant Killer", "Beat league leaders " + leader.name);
      });
    }
    return out;
  }

    // =============== ROUND HIGHLIGHTS ===============
  function roundHighlights(ri) {
    const ms = buildFixtures()[ri];
    const played = ms.filter(function (m) {
      const r = results[m.id];
      return r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "";
    }).map(function (m) { return { m: m, h: Number(results[m.id].h), a: Number(results[m.id].a) }; });
    if (!played.length) { return ""; }

    function line(p) {
      return teams[p.m.home] + " <b>" + p.h + " - " + p.a + "</b> " + teams[p.m.away];
    }
    function box(icon, title, note, text) {
      return "<div class='hlbox'><span class='ic'>" + icon + "</span><div class='t'>" + title + "</div><small>" + note + "</small><div class='m'>" + text + "</div></div>";
    }

    // match of the round: most goals, then biggest margin
    const motr = played.slice().sort(function (x, y) {
      return (y.h + y.a) - (x.h + x.a) || Math.abs(y.h - y.a) - Math.abs(x.h - x.a);
    })[0];
    // biggest win: largest margin, then most goals
    const big = played.filter(function (p) { return p.h !== p.a; }).sort(function (x, y) {
      return Math.abs(y.h - y.a) - Math.abs(x.h - x.a) || (y.h + y.a) - (x.h + x.a);
    })[0];

    // team of the round: best winning performances
    const perf = [];
    played.forEach(function (p) {
      perf.push({ code: p.m.home, gf: p.h, ga: p.a, opp: p.m.away });
      perf.push({ code: p.m.away, gf: p.a, ga: p.h, opp: p.m.home });
    });
    const winners = perf.filter(function (x) { return x.gf > x.ga; }).sort(function (x, y) {
      return (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf;
    }).slice(0, 3);

    let html = "<div class='card hl'><h3><span>🏅 Round " + (ri + 1) + " Highlights</span><span class='legend'>" +
               played.length + " of " + ms.length + " matches played</span></h3><div class='hlgrid'>";
    html += box("⭐", "Match of the Round", "Most goals scored", line(motr));
    if (big && big.m.id !== motr.m.id) {
      html += box("💥", "Biggest Win", "Largest winning margin", line(big));
    }
    html += "</div><div class='t' style='font-family:var(--font-head);letter-spacing:.5px;color:var(--gold)'>Team of the Round</div>";
    if (winners.length) {
      html += "<div class='tor'>" + winners.map(function (w) {
        return "<div class='chip'><span class='badge'>" + initials(teams[w.code]) + "</span><div><b>" + teams[w.code] +
               "</b><small>beat " + teams[w.opp] + " " + w.gf + "-" + w.ga + "</small></div></div>";
      }).join("") + "</div>";
    } else {
      html += "<p class='legend'>No winning team yet this round.</p>";
    }
    return html + "</div>";
  }

  async function savePlayoff(stage, a, b) {
    if (!isAdmin) return;
    const hv = document.getElementById("ph-" + stage).value, av = document.getElementById("pa-" + stage).value;
    const pick = document.getElementById("pw-" + stage);
    const hasScore = hv !== "" && av !== "";
    let winner = pick ? pick.value : "";
    if (hasScore && Number(hv) !== Number(av)) { winner = Number(hv) > Number(av) ? a : b; }
    if (!hasScore && !winner) {
      const del = await sb.from("playoffs").delete().eq("season", currentSeason).eq("stage", stage);
      delete playoffWinners[stage]; delete playoffScores[stage];
      setStatus(del.error ? "Could not save: " + del.error.message : ""); render(); return;
    }
    if (!winner) { setStatus("Draw: pick who won on penalties, then it saves."); return; }
    const row = { season: currentSeason, stage: stage, winner: winner };
    if (hasScore) { row.home_goals = Number(hv); row.away_goals = Number(av); row.home_team = a; row.away_team = b; }
    else { row.home_goals = null; row.away_goals = null; row.home_team = null; row.away_team = null; }
    const res = await sb.from("playoffs").upsert(row, { onConflict: "season,stage" });
    setStatus(res.error ? "Could not save: " + res.error.message : "");
    if (!res.error) {
      playoffWinners[stage] = winner;
      if (hasScore) { playoffScores[stage] = { home: a, away: b, hg: Number(hv), ag: Number(av) }; } else { delete playoffScores[stage]; }
      toast("Saved ✓");
    }
    render();
  }

    // =============== LEAGUE RECORDS ===============
  function computeRecords() {
    const rounds = buildFixtures();
    const played = [];
    const roundGoals = [];
    rounds.forEach(function (round, ri) {
      let goals = 0, count = 0;
      round.forEach(function (m) {
        const r = results[m.id];
        if (r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "") {
          played.push({ ri: ri, home: m.home, away: m.away, h: Number(r.h), a: Number(r.a) });
          goals += Number(r.h) + Number(r.a);
          count++;
        }
      });
      roundGoals.push({ ri: ri, goals: goals, count: count, total: round.length });
    });
    const rec = { played: played };

    function pickMax(list, score) {
      let best = null;
      list.forEach(function (x) {
        const s = score(x);
        if (best === null || s > best.s) { best = { s: s, items: [x] }; }
        else if (s === best.s) { best.items.push(x); }
      });
      return best;
    }

    const wins = played.filter(function (p) { return p.h !== p.a; });
    rec.biggestWin = pickMax(wins, function (p) { return Math.abs(p.h - p.a) * 100 + p.h + p.a; });
    rec.mostGoals = pickMax(played, function (p) { return p.h + p.a; });

    const seq = {};
    Object.keys(teams).forEach(function (c) { seq[c] = []; });
    played.forEach(function (p) {
      seq[p.home].push(p.h > p.a ? "W" : p.h === p.a ? "D" : "L");
      seq[p.away].push(p.a > p.h ? "W" : p.h === p.a ? "D" : "L");
    });
    const streaks = Object.keys(teams).map(function (c) {
      let w = 0, bw = 0, u = 0, bu = 0;
      seq[c].forEach(function (x) {
        w = (x === "W") ? w + 1 : 0;
        u = (x !== "L") ? u + 1 : 0;
        if (w > bw) { bw = w; }
        if (u > bu) { bu = u; }
      });
      return { code: c, win: bw, unbeaten: bu };
    });
    rec.winStreak = pickMax(streaks, function (x) { return x.win; });
    rec.unbeaten = pickMax(streaks, function (x) { return x.unbeaten; });

    const home = {}, away = {};
    Object.keys(teams).forEach(function (c) {
      home[c] = { code: c, p: 0, pts: 0, gd: 0 };
      away[c] = { code: c, p: 0, pts: 0, gd: 0 };
    });
    played.forEach(function (p) {
      const hp = p.h > p.a ? 3 : p.h === p.a ? 1 : 0;
      const ap = p.a > p.h ? 3 : p.h === p.a ? 1 : 0;
      home[p.home].p++; home[p.home].pts += hp; home[p.home].gd += p.h - p.a;
      away[p.away].p++; away[p.away].pts += ap; away[p.away].gd += p.a - p.h;
    });
    function bestSide(table) {
      const list = Object.keys(table).map(function (c) { return table[c]; }).filter(function (x) { return x.p > 0; });
      return pickMax(list, function (x) { return x.pts * 1000 + x.gd * 10 + 500 - x.p; });
    }
    rec.bestHome = bestSide(home);
    rec.bestAway = bestSide(away);

    // only rounds where every match has been played
    const complete = roundGoals.filter(function (x) { return x.count === x.total; });
    rec.roundGoals = pickMax(complete, function (x) { return x.goals; });
    return rec;
  }

  function pageRecords() {
    const r = computeRecords();
    if (!r.played.length) {

    function line(p) {

    return html + "</div>";

    // =============== TEAM PROFILE ===============
  function openTeam(code) {
    currentTeam = code;

  function teamMatches(code) {
    const out = [];
    buildFixtures().forEach(function (round, ri) {
      round.forEach(function (m) {
        if (m.home !== code && m.away !== code) { return; }
        const r = results[m.id];
        const played = !!(r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "");
        const isHome = (m.home === code);
        const o = { ri: ri, isHome: isHome, opp: isHome ? m.away : m.home, played: played };
        if (played) {
          o.gf = Number(isHome ? r.h : r.a);
          o.ga = Number(isHome ? r.a : r.h);
          o.res = o.gf > o.ga ? "W" : (o.gf === o.ga ? "D" : "L");
        }
        out.push(o);
      });
    });
    return out;
  }

  function pointsChart(done) {
    if (!done.length) { return "<p class='legend'>The chart appears after the first result.</p>"; }
    const pts = [0];
    done.forEach(function (x) { pts.push(pts[pts.length - 1] + (x.res === "W" ? 3 : x.res === "D" ? 1 : 0)); });
    const max = Math.max(3, pts[pts.length - 1]);
    const n = done.length;
    function X(i) { return 12 + i * (296 / n); }
    function Y(v) { return 98 - (v / max) * 86; }
    const line = pts.map(function (v, i) { return X(i).toFixed(1) + "," + Y(v).toFixed(1); }).join(" ");
    const colors = { W: "#16a34a", D: "#9ca3af", L: "#ef4444" };
    let svg = "<svg viewBox='0 0 320 110' style='width:100%;height:auto'>" +
      "<line x1='12' y1='98' x2='308' y2='98' stroke='var(--line)'/>" +
      "<polyline points='" + line + "' fill='none' stroke='var(--accent)' stroke-width='2.5' stroke-linejoin='round'/>";
    done.forEach(function (x, i) {
      svg += "<circle cx='" + X(i + 1).toFixed(1) + "' cy='" + Y(pts[i + 1]).toFixed(1) + "' r='5' fill='" + colors[x.res] + "'/>";
    });
    return svg + "</svg><p class='legend'>Points after each match. Green = win, grey = draw, red = loss. Now: " + pts[pts.length - 1] + " pts.</p>";
  }

const STAGE_NAMES = { q1: "Qualifier 1", ko1: "Knockout 1", ko2: "Knockout 2", el: "Eliminator", el1: "Eliminator 1", q2: "Qualifier 2", f: "Final" };

  function teamPlayoffGames(code) {
    return Object.keys(playoffScores).filter(function (st) { return playoffScores[st].home === code || playoffScores[st].away === code; }).map(function (st) {
      const s = playoffScores[st], isH = s.home === code;
      const gf = isH ? s.hg : s.ag, ga = isH ? s.ag : s.hg;
      let res = gf > ga ? "W" : gf < ga ? "L" : "D";
      return { stage: st, opp: isH ? s.away : s.home, gf: gf, ga: ga, res: res, pens: gf === ga && playoffWinners[st] === code ? "won on pens" : (gf === ga ? "lost on pens" : "") };
    });
  }

  function allCompetitionsCard(code, row) {

  // =============== GOLDEN BOOT ===============
  function bootTotals() {
    const map = {};
    goalLog.forEach(function (g) {
      const k = g.team + "|" + g.player;
      if (!map[k]) { map[k] = { team: g.team, player: g.player, goals: 0 }; }
      map[k].goals += g.goals;
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) {
      return b.goals - a.goals || a.player.localeCompare(b.player);
    });
  }

  async function saveGoal() {
    if (!isAdmin) { return; }
    const player = document.getElementById("bp").value;
    const goals = parseInt(document.getElementById("bg").value, 10);
    const round = document.getElementById("br").value;
    if (!player) { setStatus("Pick a player first (add the squad in the Squads tab)."); return; }
    if (!goals || goals < 1) { setStatus("Enter at least 1 goal."); return; }
    const row = { season: currentSeason, team: bootTeam, player: player, goals: goals };
    if (round) { row.round = Number(round); }
    const res = await sb.from("goals").insert(row).select();
    if (res.error) { setStatus("Could not save: " + res.error.message); return; }
    goalLog.push(res.data[0]);
    setStatus(player + ": " + goals + " goal(s) saved.");
    render();
  }

  async function deleteGoal(id) {
    if (!isAdmin) { return; }
    const res = await sb.from("goals").delete().eq("id", id);
    if (res.error) { setStatus("Could not delete: " + res.error.message); return; }
    goalLog = goalLog.filter(function (g) { return g.id !== id; });
    render();
  }

    // =============== PLAYER STATS ===============
  function goalMap() {
    const map = {};
    goalLog.forEach(function (g) {
      const k = g.team + "|" + g.player;
      map[k] = (map[k] || 0) + g.goals;
    });

  function goalTag(team, player) {
    const n = goalMap()[team + "|" + player] || 0;
    return n ? " <span class='gt'>⚽ " + n + "</span>" : "";

  function pageStats() {
    const map = goalMap();
    let rows = [];
    const seen = {};
    Object.keys(teams).forEach(function (c) {
      playerList((squads[c] || { players: "" }).players).forEach(function (p) {
        const k = c + "|" + p;
        if (seen[k]) { return; }
        seen[k] = true;
        rows.push({ team: c, player: p, goals: map[k] || 0, extra: false });
      });
    });
    // goals logged for a name that is no longer in the squad list are kept visible
    Object.keys(map).forEach(function (k) {
      if (!seen[k]) {
        const i = k.indexOf("|");
        rows.push({ team: k.slice(0, i), player: k.slice(i + 1), goals: map[k], extra: true });
      }
    });

    if (statTeam !== "all") { rows = rows.filter(function (r) { return r.team === statTeam; }); }
    rows.sort(function (a, b) {
      if (statSort === "name") { return a.player.localeCompare(b.player); }
      return b.goals - a.goals || a.player.localeCompare(b.player);
    });

    const totalGoals = rows.reduce(function (s, r) { return s + r.goals; }, 0);

      "<select onchange=\"statSort=this.value;render()\"><option value='goals'" + (statSort === "goals" ? " selected" : "") + ">Sort: most goals</option>" +
      "<option value='name'" + (statSort === "name" ? " selected" : "") + ">Sort: name A-Z</option></select>" +
      "<span class='legend'>" + rows.length + " players · " + totalGoals + " goals logged</span></div>";

    if (!rows.length) {
      return html + "<div class='card'><p class='legend'>No players yet. Squads are added on the Squads tab.</p></div>";
    }
    html += "<div class='card scroll'><table><tr><th>#</th><th class='left'>Player</th><th class='left'>Team</th><th>Goals</th></tr>";
    rows.forEach(function (r, i) {
      html += "<tr><td>" + (i + 1) + "</td><td class='left'>" + esc(r.player) + (r.extra ? " <span class='legend'>(not in squad list)</span>" : "") +
        "</td><td class='left'><span class='badge'>" + initials(teams[r.team] || r.team) + "</span>" + (teams[r.team] || r.team) + "</td>" +
        "<td class='pts'>" + r.goals + "</td></tr>";
    });

  // =============== HALL OF FAME ===============
  let allResults = [], allPlayoffs = [], allGoals = [], allSquads = [], allTransfers = [];

  function seasonSummary(no) {
    const cfg = SEASONS[no];
    const res = {};
    allResults.forEach(function (r) { if ((r.season || 1) === no) { res[r.id] = r; } });

    const rows = {};
    Object.keys(cfg.teams).forEach(function (c) { rows[c] = { code: c, name: cfg.teams[c], p: 0, pts: 0, gf: 0, ga: 0 }; });
    let total = 0, played = 0;
    cfg.schedule.forEach(function (round, ri) {
      round.forEach(function (code, i) {
        total++;
        const t = code.split("-");
        const r = res["R" + (ri + 1) + "-" + (i + 1)];
        if (!r || r.home_goals === null || r.away_goals === null) { return; }
        played++;
        const h = rows[t[0]], a = rows[t[1]], hg = r.home_goals, ag = r.away_goals;
        h.p++; a.p++; h.gf += hg; h.ga += ag; a.gf += ag; a.ga += hg;
        if (hg > ag) { h.pts += 3; } else if (hg < ag) { a.pts += 3; } else { h.pts++; a.pts++; }
      });
    });
    const table = Object.keys(rows).map(function (c) { return rows[c]; }).sort(function (x, y) {
      return y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf;
    });
    const top = table.map(function (r) { return r.code; });

    const pw = {};
    allPlayoffs.forEach(function (p) { if ((p.season || 1) === no) { pw[p.stage] = p.winner; } });
    function ok(stage, a, b) { const w = pw[stage]; return (a && b && (w === a || w === b)) ? w : null; }
    const q1w = ok("q1", top[0], top[1]);
    const q1l = q1w ? (q1w === top[0] ? top[1] : top[0]) : null;
    let q2w;
    if (cfg.playoff === "six") {
      const k1 = ok("ko1", top[2], top[5]), k2 = ok("ko2", top[3], top[4]);
      q2w = ok("q2", q1l, ok("el1", k1, k2));
    } else {
      q2w = ok("q2", q1l, ok("el", top[2], top[3]));
    }
    const champion = ok("f", q1w, q2w);
    const runnerUp = champion ? (q1w === champion ? q2w : q1w) : null;

    const sums = {};
    allGoals.forEach(function (g) {
      if ((g.season || 1) === no) { const k = g.team + "|" + g.player; sums[k] = (sums[k] || 0) + g.goals; }
    });
    let best = 0, boot = [];
    Object.keys(sums).forEach(function (k) {
      if (sums[k] > best) { best = sums[k]; boot = [k]; } else if (sums[k] === best) { boot.push(k); }
    });
    boot = boot.map(function (k) {
      const i = k.indexOf("|");
      return { team: cfg.teams[k.slice(0, i)] || k.slice(0, i), code: k.slice(0, i), player: k.slice(i + 1) };
    });
    return { name: cfg.name, played: played, total: total, complete: played === total, shield: table[0],
             champion: champion ? cfg.teams[champion] : null, runnerUp: runnerUp ? cfg.teams[runnerUp] : null,
             boot: boot, bootGoals: best };
  }

  function pageHall() {
    const nos = Object.keys(SEASONS).map(Number).sort(function (a, b) { return b - a; });
    function box(icon, title, note, main, sub) {
      return "<div class='hbox'><span class='ic'>" + icon + "</span><div class='ht'>" + title + "</div><small>" + note + "</small>" +
             "<div class='hm'>" + (main ? main : "<span class='legend'>Not decided yet</span>") + "</div>" +
             (sub ? "<div class='legend'>" + sub + "</div>" : "") + "</div>";
    }
    let html = "<p class='legend'>The winners of every season.</p>";
    nos.forEach(function (n) {
      const s = seasonSummary(n);
      const done = s.complete && s.champion;
      const started = s.played > 0;
      html += "<div class='card hall'><h2>" + esc(s.name) + " <span class='tag " + (done ? "tdone" : "tlive") + "'>" + (done ? "Complete" : "In progress") + "</span></h2><div class='hgrid'>";
      html += box("🛡️", "League Shield", s.complete ? "Winners" : "Current leaders",
                  started ? esc(s.shield.name) : null, started ? s.shield.pts + " points from " + s.shield.p + " matches" : "");
      html += box("🏆", "Champions", "Playoff winners", s.champion ? esc(s.champion) : null, s.runnerUp ? "Runners-up: " + esc(s.runnerUp) : "");
      html += box("👟", "Golden Boot", s.complete ? "Top scorer" : "Current leader",
                  s.boot.length ? s.boot.map(function (b) { return esc(b.player) + " <span class='legend'>(" + esc(b.team) + ")</span>"; }).join("<br>") : null,
                  s.boot.length ? s.bootGoals + " goals" : "");
      html += "</div></div>";
    });
    return html;
  }

  // =============== TOAST, LOADING, OVERVIEW, MOVEMENT AND MATCH OVERLAY ===============
  function toast(msg, type) {
    const old = document.querySelector(".toast");
    if (old) { old.remove(); }
    const t = document.createElement("div");
    t.className = "toast" + (type === "err" ? " err" : "");
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () {
      t.classList.add("out");
      setTimeout(function () { t.remove(); }, 300);
    }, 3000);

  function skeleton() {
    return Array.from({ length: 10 }, function () { return "<div class='skel'></div>"; }).join("");

  // standings order using only the first n rounds
  function tableUpTo(nRounds) {
    const rows = {};
    Object.keys(teams).forEach(function (c) { rows[c] = { code: c, pts: 0, gf: 0, ga: 0 }; });
    SCHEDULE.slice(0, nRounds).forEach(function (round, ri) {
      round.forEach(function (code, i) {
        const r = results["R" + (ri + 1) + "-" + (i + 1)];
        if (!r || r.h === null || r.h === "" || r.a === null || r.a === "") { return; }
        const t = code.split("-"), hg = Number(r.h), ag = Number(r.a);
        rows[t[0]].gf += hg; rows[t[0]].ga += ag; rows[t[1]].gf += ag; rows[t[1]].ga += hg;
        if (hg > ag) { rows[t[0]].pts += 3; } else if (hg < ag) { rows[t[1]].pts += 3; } else { rows[t[0]].pts++; rows[t[1]].pts++; }
      });
    });
    return Object.keys(rows).map(function (c) { return rows[c]; }).sort(function (a, b) {
      return b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf;
    }).map(function (r) { return r.code; });
  }

  function lastPlayedRound() {
    let last = 0;
    SCHEDULE.forEach(function (round, ri) {
      round.forEach(function (code, i) {
        const r = results["R" + (ri + 1) + "-" + (i + 1)];
        if (r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "") { last = ri + 1; }
      });
    });
    return last;
  }

  // arrow showing how a team moved since before the latest round
  function moveTag(code, pos) {
    const last = lastPlayedRound();
    if (last < 2) { return ""; }
    const d = tableUpTo(last - 1).indexOf(code) - pos;
    if (d > 0) { return "<span class='mv up' title='Up since the previous round'>▲" + d + "</span>"; }
    if (d < 0) { return "<span class='mv down' title='Down since the previous round'>▼" + (-d) + "</span>"; }
    return "<span class='mv same'>–</span>";
  }

  function overviewStrip() {
    const total = SCHEDULE.reduce(function (s, r) { return s + r.length; }, 0);
    const played = getPlayedMatches();
    const goals = played.reduce(function (s, m) { return s + m.homeGoals + m.awayGoals; }, 0);
    const rows = buildStandings();
    const pct = total ? Math.round(played.length / total * 100) : 0;
    let next = null, left = 0;
    for (let ri = 0; ri < SCHEDULE.length && next === null; ri++) {
      const n = SCHEDULE[ri].filter(function (code, i) {
        const r = results["R" + (ri + 1) + "-" + (i + 1)];
        return !(r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "");
      }).length;
      if (n > 0) { next = ri + 1; left = n; }
    }
    const boot = (typeof bootTotals === "function") ? bootTotals()[0] : null;
    function card(label, big, sub, extra) {
      return "<div class='ovc'><small>" + label + "</small><b>" + big + "</b>" + (sub ? "<small>" + sub + "</small>" : "") + (extra || "") + "</div>";
    }
    return "<div class='ov'>" +
      card("Matches played", "<span data-count='" + played.length + "'>" + played.length + "</span> / " + total, pct + "% of the season",
           "<div class='pbar'><i style='width:" + pct + "%'></i></div>") +
      card("Goals scored", "<span data-count='" + goals + "'>" + goals + "</span>",
           played.length ? (goals / played.length).toFixed(1) + " per match" : "No matches yet") +
      card("League leader", played.length ? esc(rows[0].name) : "TBD", played.length ? rows[0].points + " points" : "") +
      card("Top scorer", boot ? esc(boot.player) : "TBD", boot ? boot.goals + " goals · " + esc(teams[boot.team] || boot.team) : "") +
      card("Next up", next ? "Round " + next : "Season complete", next ? left + " match" + (left === 1 ? "" : "es") + " to play" : "") +
      "</div>";
  }

  // numbers count up and the progress bar fills, once each time you open a page
  let lastCountKey = "";
  function animateCounts() {
    if (!loaded) { return; }
    const key = currentSeason + "|" + currentTab;
    if (key === lastCountKey) { return; }
    lastCountKey = key;
    document.querySelectorAll("[data-count]").forEach(function (el) {
      const to = Number(el.getAttribute("data-count")), start = performance.now();
      function step(t) {
        const p = Math.min(1, (t - start) / 700);
        el.textContent = Math.round(to * p);
        if (p < 1) { requestAnimationFrame(step); }
      }
      requestAnimationFrame(step);
    });
    document.querySelectorAll(".pbar i").forEach(function (el) {
      const w = el.style.width;
      el.style.width = "0";
      requestAnimationFrame(function () { requestAnimationFrame(function () { el.style.width = w; }); });
    });
  }

  function matchInfoHtml(id) {
    let found = null;
    SCHEDULE.forEach(function (round, ri) {
      round.forEach(function (code, i) {
        if ("R" + (ri + 1) + "-" + (i + 1) === id) { const t = code.split("-"); found = { ri: ri, home: t[0], away: t[1] }; }
      });
    });
    if (!found) { return ""; }
    const r = results[id];
    const done = !!(r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "");
    const rows = buildStandings();

    function side(code) {
      const pos = rows.findIndex(function (x) { return x.code === code; });
      const row = rows[pos];
      const form = row.form.slice(-5).map(function (f) { return "<span class='" + f + "'>" + f + "</span>"; }).join("");
      return "<div class='mteam'><span class='badge'>" + initials(teams[code]) + "</span><div><b>" + esc(teams[code]) + "</b></div>" +
             "<div class='legend'>#" + (pos + 1) + " · " + row.points + " pts · " + row.played + " played</div>" +
             "<div class='form'>" + (form || "<span class='legend'>No form yet</span>") + "</div></div>";
    }

    let html = "<button class='ovx' onclick='closeOverlay()'>✕</button><h3 style='margin:0'>Round " + (found.ri + 1) + "</h3>" +
      "<div class='legend'>" + (SEASONS[currentSeason].single ? "" : (found.ri < SCHEDULE.length / 2 ? "First leg · " : "Second leg · ")) + (done ? "Full time" : "Upcoming") + "</div>" +
      "<div class='mscore'><div class='t'>" + esc(teams[found.home]) + "<div class='legend'>Home</div></div><div class='s'>" + (done ? r.h + " : " + r.a : "vs") +
      "</div><div class='t'>" + esc(teams[found.away]) + "<div class='legend'>Away</div></div></div>" +
      "<div class='mteams'>" + side(found.home) + side(found.away) + "</div>";

    // the return match between the same two teams (double round-robin seasons)
    let back = null;
    SCHEDULE.forEach(function (round, ri) {
      round.forEach(function (code, i) {
        const t = code.split("-");
        if (t[0] === found.away && t[1] === found.home) { back = { ri: ri, id: "R" + (ri + 1) + "-" + (i + 1) }; }
      });
    });
    if (back) {
      const b = results[back.id];
      const bd = !!(b && b.h !== null && b.h !== "" && b.a !== null && b.a !== "");
      html += "<div class='msec'><h4>Return match</h4>Round " + (back.ri + 1) + ": " + esc(teams[found.away]) + " " +
              (bd ? "<b>" + b.h + " - " + b.a + "</b>" : "vs") + " " + esc(teams[found.home]) + (bd ? "" : " <span class='legend'>(not played yet)</span>") + "</div>";
    }

    // scorers: goals logged on the Golden Boot tab for this round
    const sc = goalLog.filter(function (g) { return Number(g.round) === found.ri + 1 && (g.team === found.home || g.team === found.away); });
    html += "<div class='msec'><h4>Scorers</h4>";
    if (sc.length) {
      [found.home, found.away].forEach(function (c) {
        const mine = sc.filter(function (g) { return g.team === c; });
        if (mine.length) {
          html += "<div><b>" + esc(teams[c]) + ":</b> " + mine.map(function (g) { return esc(g.player) + (g.goals > 1 ? " ×" + g.goals : ""); }).join(", ") + "</div>";
        }
      });
    } else {
      html += "<span class='legend'>No scorers logged for this round.</span>";
    }
    html += "</div><div class='msec'>" +
      "<button class='btn out' onclick=\"closeOverlay();openTeam('" + found.home + "')\">" + esc(teams[found.home]) + " profile</button> " +
      "<button class='btn out' onclick=\"closeOverlay();openTeam('" + found.away + "')\">" + esc(teams[found.away]) + " profile</button></div>";
    return html;
  }

  function applyLogos(root) {
    const byIni = {};
    Object.keys(CLUBS).forEach(function (n) { byIni[initials(n)] = n; });
    (root || document).querySelectorAll(".badge").forEach(function (b) {
      if (b.getAttribute("data-done")) { return; }
      const ini = b.textContent.trim();
      const name = byIni[ini];
      if (!name) { return; }
      b.setAttribute("data-done", "1");
      const c = CLUBS[name];
      function kit() { b.classList.remove("logo"); b.textContent = ini; b.style.background = c.bg; b.style.color = c.fg; }
      const img = document.createElement("img");
      img.alt = name;
      img.onerror = kit;
      img.src = c.logo;
      b.classList.add("logo");
      b.textContent = "";
      b.appendChild(img);
    });
  }

  // =============== ROUND SUMMARY FOR WHATSAPP ===============
  function tableDataUpTo(nRounds) {
    const rows = {};
    Object.keys(teams).forEach(function (c) { rows[c] = { code: c, p: 0, pts: 0, gf: 0, ga: 0 }; });
    SCHEDULE.slice(0, nRounds).forEach(function (round, ri) {
      round.forEach(function (code, i) {
        const r = results["R" + (ri + 1) + "-" + (i + 1)];
        if (!r || r.h === null || r.h === "" || r.a === null || r.a === "") { return; }
        const t = code.split("-"), hg = Number(r.h), ag = Number(r.a);
        rows[t[0]].p++; rows[t[1]].p++;
        rows[t[0]].gf += hg; rows[t[0]].ga += ag; rows[t[1]].gf += ag; rows[t[1]].ga += hg;
        if (hg > ag) { rows[t[0]].pts += 3; } else if (hg < ag) { rows[t[1]].pts += 3; } else { rows[t[0]].pts++; rows[t[1]].pts++; }
      });
    });
    return Object.keys(rows).map(function (c) { return rows[c]; }).sort(function (a, b) {
      return b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf;
    });
  }

  function roundSummaryText(ri) {
    const lines = ["⚽ eFootball Friends League · " + SEASONS[currentSeason].name, "📅 Round " + (ri + 1) + " results"];
    SCHEDULE[ri].forEach(function (code, i) {
      const t = code.split("-"), r = results["R" + (ri + 1) + "-" + (i + 1)];
      const done = r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "";
      lines.push(teams[t[0]] + (done ? " " + r.h + "-" + r.a + " " : " vs ") + teams[t[1]]);
    });
    const q = qualifiers();
    lines.push("", "📊 Table after Round " + (ri + 1));
    tableDataUpTo(ri + 1).forEach(function (r, i) {
      const gd = r.gf - r.ga;
      lines.push((i + 1) + ". " + (i < q ? "✅ " : "") + teams[r.code] + " – " + r.pts + " pts (GD " + (gd > 0 ? "+" : "") + gd + ")");
    });
    lines.push("", "✅ = playoff places (top " + q + ")", "🔗 " + location.href.split("#")[0].split("?")[0]);
    return lines.join("\n");
  }

  async function copySummary() {
    const text = roundSummaryText(currentRound);
    try {
      await navigator.clipboard.writeText(text);
      toast("Round summary copied ✓");
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e2) {}
      ta.remove();
      toast(ok ? "Round summary copied ✓" : "Could not copy. Use the WhatsApp button instead.", ok ? "ok" : "err");

  async function saveRound() {
    if (!isAdmin) { return; }
    const ri = currentRound, vals = {};
    document.querySelectorAll(".ovp .re").forEach(function (f) {
      const id = f.getAttribute("data-id");
      vals[id] = vals[id] || {};
      vals[id][f.getAttribute("data-side")] = f.value;
    });
    const save = [], clear = [];
    const ids = Object.keys(vals);
    for (let k = 0; k < ids.length; k++) {
      const id = ids[k], h = vals[id].h, a = vals[id].a;
      if (h === "" && a === "") { clear.push(id); }
      else if (h === "" || a === "") { toast("Fill both boxes for every match you save.", "err"); return; }
      else if (!(Number(h) >= 0 && Number(a) >= 0)) { toast("Scores must be 0 or more.", "err"); return; }
      else { save.push({ season: currentSeason, id: id, home_goals: Number(h), away_goals: Number(a) }); }
    }
    if (save.length) {
      const res = await sb.from("results").upsert(save, { onConflict: "season,id" });
      if (res.error) { setStatus("Could not save: " + res.error.message); return; }
    }
    if (clear.length) {
      const res = await sb.from("results").delete().eq("season", currentSeason).in("id", clear);
      if (res.error) { setStatus("Could not save: " + res.error.message); return; }
    }
    closeOverlay(true);
    await loadData();
    toast("Round " + (ri + 1) + " saved ✓ (" + save.length + " result" + (save.length === 1 ? "" : "s") + ")");
  }

// =============== STAGE 2: NEWS, QUALIFICATION TRACKER, TITLE RACE ===============
  function isPlayed(r) { return r && r.h !== "" && r.a !== "" && r.h !== null && r.a !== null && r.h !== undefined; }
  function endRun(form, ok) { let n = 0; for (let i = form.length - 1; i >= 0 && ok(form[i]); i--) { n++; } return n; }

  function buildNews() {
    const items = [], table = buildStandings(), fx = buildFixtures();
    let last = -1;
    fx.forEach(function (rd, i) { if (rd.some(function (m) { return isPlayed(results[m.id]); })) { last = i; } });
    if (last < 0 && !Object.keys(playoffScores).length) { return [{ icon: "🕐", title: "Season not started", text: "Match reports appear here automatically after the first result." }]; }
    if (playoffWinners.f) {
      const sc = playoffScores.f;
      items.push({ icon: "🏆", title: teams[playoffWinners.f] + " are champions!", text: sc ? "Final: " + teams[sc.home] + " " + sc.hg + " - " + sc.ag + " " + teams[sc.away] + "." : "They won the playoff Final." });
    }
    Object.keys(playoffScores).filter(function (k) { return k !== "f"; }).forEach(function (k) {
      const sc = playoffScores[k];
      items.push({ icon: "⚔️", title: STAGE_NAMES[k] + ": " + teams[playoffWinners[k] || sc.home] + " go through", text: teams[sc.home] + " " + sc.hg + " - " + sc.ag + " " + teams[sc.away] + "." });
    });
    if (last >= 0) {
      const lead = table[0], gap = lead.points - table[1].points;
      items.push({ icon: "🛡️", title: teams[lead.code] + " lead the table", text: lead.points + " points" + (gap ? ", " + gap + " clear of " + teams[table[1].code] : ", level with " + teams[table[1].code]) + " after round " + (last + 1) + "." });
      const ms = fx[last].filter(function (m) { return isPlayed(results[m.id]); });
      let big = null, goals = null, draws = 0;
      ms.forEach(function (m) {
        const h = Number(results[m.id].h), a = Number(results[m.id].a);
        if (h === a) { draws++; }
        if (!big || Math.abs(h - a) > big.d) { big = { d: Math.abs(h - a), m: m, h: h, a: a }; }
        if (!goals || h + a > goals.t) { goals = { t: h + a, m: m, h: h, a: a }; }
      });
      if (big && big.d > 0) { items.push({ icon: "💥", title: "Round " + (last + 1) + " big win", text: teams[big.m.home] + " " + big.h + " - " + big.a + " " + teams[big.m.away] + " (margin " + big.d + ")." }); }
      if (goals && goals.t >= 5 && goals !== big) { items.push({ icon: "⚽", title: "Goal fest in round " + (last + 1), text: teams[goals.m.home] + " " + goals.h + " - " + goals.a + " " + teams[goals.m.away] + ": " + goals.t + " goals." }); }
      if (draws) { items.push({ icon: "🤝", title: draws + (draws === 1 ? " draw" : " draws") + " in round " + (last + 1), text: "Points shared in " + draws + " of " + ms.length + " matches." }); }
    }
    table.forEach(function (r) {
      const w = endRun(r.form, function (f) { return f === "W"; }), u = endRun(r.form, function (f) { return f !== "L"; }), l = endRun(r.form, function (f) { return f === "L"; });
      if (w >= 3) { items.push({ icon: "🔥", title: teams[r.code] + " on fire", text: w + " wins in a row." }); }
      else if (u >= 5) { items.push({ icon: "🧱", title: teams[r.code] + " unbeaten", text: u + " games without defeat." }); }
      if (l >= 3) { items.push({ icon: "📉", title: teams[r.code] + " in a slump", text: l + " defeats in a row." }); }
    });
    const boot = typeof bootTotals === "function" ? bootTotals() : [];
    if (boot.length) { items.push({ icon: "👟", title: "Golden Boot: " + boot[0].player, text: boot[0].goals + " goals for " + teams[boot[0].team] + "." }); }
    return items;

  function qualStatus() {
    const table = buildStandings(), q = qualifiers(), total = SCHEDULE.length;
    const rows = table.map(function (r) { return { r: r, left: total - r.played, max: r.points + 3 * (total - r.played) }; });
    return rows.map(function (x, i) {
      const others = rows.filter(function (y) { return y.r.code !== x.r.code; });
      const canCatch = others.filter(function (y) { return y.max >= x.r.points; }).length;
      const ahead = others.filter(function (y) { return y.r.points > x.max; }).length;
      const shield = others.every(function (y) { return y.max < x.r.points; });
      let st = "hunt", label = "In the hunt";
      if (x.left === 0 && i < q) { st = "in"; label = "Qualified"; }
      else if (canCatch < q) { st = "in"; label = "Qualified"; }
      else if (ahead >= q) { st = "out"; label = "Eliminated"; }
      if (shield) { label = "🛡️ Shield won"; }
      return { code: x.r.code, pos: i + 1, pts: x.r.points, left: x.left, max: x.max, st: st, label: label };
    });
  }

  const LINE_COLORS = ["#2ecc88", "#f5b301", "#ef4444", "#3b82f6", "#a855f7", "#f97316", "#14b8a6", "#ec4899", "#eab308", "#94a3b8"];

  function raceChart() {
    const fx = buildFixtures(), codes = Object.keys(teams), pts = {};
    codes.forEach(function (c) { pts[c] = [0]; });
    let rounds = 0;
    fx.forEach(function (rd, i) {
      const add = {}; let any = false;
      codes.forEach(function (c) { add[c] = 0; });
      rd.forEach(function (m) {
        const r = results[m.id]; if (!isPlayed(r)) { return; }
        any = true; const h = Number(r.h), a = Number(r.a);
        if (h > a) { add[m.home] += 3; } else if (h < a) { add[m.away] += 3; } else { add[m.home]++; add[m.away]++; }
      });
      if (any) { rounds = i + 1; }
      codes.forEach(function (c) { pts[c].push(pts[c][i] + add[c]); });
    });
    if (rounds < 1) { return "<p class='legend'>The chart appears after the first result.</p>"; }
    const W = 640, H = 300, L = 34, B = 24, T = 10, R = 10;
    let max = 3; codes.forEach(function (c) { max = Math.max(max, pts[c][rounds]); });
    const x = function (i) { return L + (W - L - R) * i / Math.max(rounds, 1); }, y = function (v) { return T + (H - T - B) * (1 - v / max); };
    const order = buildStandings().map(function (r) { return r.code; });
    let svg = "<svg viewBox='0 0 " + W + " " + H + "' style='width:100%;height:auto'>";
    for (let g = 0; g <= 4; g++) { const v = Math.round(max * g / 4); svg += "<line x1='" + L + "' x2='" + (W - R) + "' y1='" + y(v) + "' y2='" + y(v) + "' stroke='var(--line)'/><text x='4' y='" + (y(v) + 4) + "' fill='var(--muted)' font-size='11'>" + v + "</text>"; }
    for (let i = 0; i <= rounds; i++) { svg += "<text x='" + x(i) + "' y='" + (H - 6) + "' fill='var(--muted)' font-size='10' text-anchor='middle'>" + (i || "") + "</text>"; }
    order.slice().reverse().forEach(function (c) {
      const rank = order.indexOf(c), col = LINE_COLORS[rank % 10], top = rank < 3;
      svg += "<polyline fill='none' stroke='" + col + "' stroke-width='" + (top ? 3 : 1.5) + "' opacity='" + (top ? 1 : .55) + "' points='" + pts[c].slice(0, rounds + 1).map(function (v, i) { return x(i) + "," + y(v); }).join(" ") + "'/>";
    });
    svg += "</svg><div class='legend' style='display:flex;flex-wrap:wrap;gap:4px 14px'>" + order.map(function (c, i) { return "<span><b style='color:" + LINE_COLORS[i % 10] + "'>●</b> " + esc(teams[c]) + "</span>"; }).join("") + "</div>";
    return svg;
  }

  function pageRace() {

    html += "<div class='card'><h3>Qualification tracker <span class='legend'>top " + qualifiers() + " reach the playoffs</span></h3><div class='scroll'><table><tr><th>#</th><th class='left'>Team</th><th>Pts</th><th>Left</th><th>Max pts</th><th>Status</th></tr>";

    }).join("");
    return html + "</table></div><p class='legend'>Status counts points only. Teams level on points are split by goal difference, so a team marked Qualified or Eliminated is mathematically certain.</p></div>";

  function pageAwards() {
    const table = buildStandings(), fx = buildFixtures().flat();
    const done = table.every(function (r) { return r.played === SCHEDULE.length; });
    const boot = typeof bootTotals === "function" ? bootTotals() : [];
    function best(key, dir) { return table.slice().sort(function (a, b) { return dir * (a[key] - b[key]); })[0]; }
    let big = null;
    fx.forEach(function (m) { const r = results[m.id]; if (!isPlayed(r)) { return; } const d = Math.abs(r.h - r.a); if (!big || d > big.d) { big = { d: d, m: m, r: r }; } });
    const cards = [];
    function aw(icon, title, code, detail) { cards.push("<div class='pocard' style='border-left-color:var(--gold)'><small>" + icon + " " + title + "</small><div style='display:flex;align-items:center;gap:10px'>" +
      (code ? "<span class='badge big'>" + initials(teams[code]) + "</span>" : "") + "<div><b style='font-size:18px'>" + esc(code ? teams[code] : detail[0]) + "</b><div class='legend'>" + esc(code ? detail[0] : detail[1]) + "</div></div></div></div>"); }
    if (playoffWinners.f) { aw("🏆", "Champions", playoffWinners.f, ["Playoff winners"]); }
    if (table[0].played > 0) { aw("🛡️", done ? "League Shield" : "League Shield (leaders now)", table[0].code, [table[0].points + " points"]); }
    if (boot.length) { aw("👟", "Golden Boot", boot[0].team, [boot[0].player + " · " + boot[0].goals + " goals"]); }
    if (table[0].played > 0) {
      const a = best("gf", -1), d = best("ga", 1), w = best("won", -1);
      aw("⚔️", "Best attack", a.code, [a.gf + " goals scored"]); aw("🧤", "Best defence", d.code, [d.ga + " goals conceded"]); aw("💪", "Most wins", w.code, [w.won + " wins"]);
    }
    if (big && big.d > 0) { aw("💥", "Biggest win", big.r.h > big.r.a ? big.m.home : big.m.away, [teams[big.m.home] + " " + big.r.h + " - " + big.r.a + " " + teams[big.m.away]]); }
    if (!cards.length) { return "<div class='card'><p class='legend'>Awards appear as the season is played.</p></div>"; }
    return "<p class='legend'>" + (done ? "Final awards for the season." : "Provisional awards: they update with every result.") + "</p><div class='po'>" + cards.join("") + "</div>";
  }
