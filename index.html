  // ---------- awards (used by the Awards page and the share card) ----------
  function awardsList() {
    const table = buildStandings(), fx = buildFixtures().flat();
    const done = table.every(function (r) { return r.played === SCHEDULE.length; });
    const boot = bootTotals(), out = [];
    function add(icon, title, code, main, detail) { out.push({ icon: icon, title: title, code: code, main: main, detail: detail }); }
    function best(key, dir) { return table.slice().sort(function (a, b) { return dir * (a[key] - b[key]); })[0]; }
    if (playoffWinners.f) { add("🏆", "Champions", playoffWinners.f, teams[playoffWinners.f], "Playoff winners"); }
    if (table[0].played > 0) { add("🛡️", done ? "League Shield" : "League Shield (leaders now)", table[0].code, teams[table[0].code], table[0].points + " points"); }
    if (boot.length) { add("👟", "Golden Boot", boot[0].team, boot[0].player, boot[0].goals + " goals · " + teams[boot[0].team]); }
    const gk = gkAgg([currentSeason]);
    if (gk.length) { add("🧤", "Golden Glove", codeByName(gk[0].team), gk[0].player, gk[0].cs + " clean sheets · " + gk[0].saves + " saves · " + gk[0].team); }
    const pw = potsWinner(currentSeason);
    if (pw && done) { add("🌟", "Player of the Season", pw.players[0].code, pw.players.map(function (p) { return p.player; }).join(", "), pw.votes + " vote" + (pw.votes === 1 ? "" : "s")); }
    const club = hatClub(hatTrickList([currentSeason]));
    if (club.length) { add("🎩", "Hat-trick king", codeByName(club[0].team), club[0].player, club[0].n + " hat-trick" + (club[0].n === 1 ? "" : "s") + " · " + club[0].team); }
    if (table[0].played > 0) {
      const a = best("gf", -1), d = best("ga", 1), w = best("won", -1), cs = cleanSheetRows()[0];
      add("⚔️", "Best attack", a.code, a.name, a.gf + " goals scored");

  // =====================================================================

  var msRound = -1;   // -1 = latest round, "all" = whole season, otherwise a round index
  const MS = { pSeason: [5, 10, 15, 20, 25, 30, 40, 50], pCareer: [10, 25, 50, 75, 100, 150, 200], tWins: [5, 10, 15, 20, 25, 30], tGoals: [25, 50, 75, 100, 125, 150],
               tCs: [3, 5, 10, 15], streak: [3, 5, 7, 10], unbeaten: [5, 10, 15], gkCs: [3, 5, 10, 15], gkSaves: [10, 25, 50, 100], lGoals: [25, 50, 100, 150, 200, 250, 300, 400, 500], lMatches: [10, 25, 50, 75, 100] };
  function msCross(list, prev, now) { let hit = 0; list.forEach(function (t) { if (prev < t && now >= t) { hit = t; } }); return hit; }

  function milestoneList() {
    const ms = chronoMatches(), out = [];
    if (!ms.length) { return out; }
    function add(ri, icon, title, text, team, w) { out.push({ ri: ri, icon: icon, title: title, text: text, team: team || null, w: w || 1 }); }
    const T = {}, gkc = {}, lg = { goals: 0, matches: 0 };
    Object.keys(teams).forEach(function (c) { T[c] = { w: 0, gf: 0, cs: 0, streak: 0, unb: 0 }; });

    // ---- team, league and keeper milestones, match by match ----
    ms.forEach(function (m) {
      const ri = m.ri;
      [[m.home, m.hg, m.ag], [m.away, m.ag, m.hg]].forEach(function (x) {
        const c = x[0], f = x[1], a = x[2], t = T[c], N = teams[c];
        const pw = t.w, pg = t.gf, pcs = t.cs;
        t.gf += f; if (a === 0) { t.cs++; }
        if (f > a) { t.w++; t.streak++; t.unb++; } else if (f === a) { t.streak = 0; t.unb++; } else { t.streak = 0; t.unb = 0; }
        const w = msCross(MS.tWins, pw, t.w); if (w) { add(ri, "🏅", N + " reach " + w + " wins", N + " have won " + w + " matches this season.", c, 2); }
        const g = msCross(MS.tGoals, pg, t.gf); if (g) { add(ri, "🥅", N + " hit " + g + " goals", N + " have scored " + g + " goals this season.", c, 2); }
        const k = msCross(MS.tCs, pcs, t.cs); if (k) { add(ri, "🧱", N + " reach " + k + " clean sheets", N + " have kept " + k + " clean sheets this season.", c, 1); }
        if (f > a && MS.streak.indexOf(t.streak) !== -1) { add(ri, "🔥", N + ": " + t.streak + " wins in a row", N + " are on a " + t.streak + "-match winning streak.", c, 3); }
        if (f <= a && t.unb > 0 && MS.unbeaten.indexOf(t.unb) !== -1) { add(ri, "🎯", N + ": " + t.unb + " unbeaten", N + " have gone " + t.unb + " matches without defeat.", c, 2); }
      });
      const pg = lg.goals, pm = lg.matches;
      lg.goals += m.hg + m.ag; lg.matches++;
      const lgl = msCross(MS.lGoals, pg, lg.goals); if (lgl) { add(ri, "💯", "The league reaches " + lgl + " goals", "Goal number " + lgl + " of the season has been scored.", null, 3); }
      const lmt = msCross(MS.lMatches, pm, lg.matches); if (lmt) { add(ri, "📅", lmt + " matches played", "The " + lmt + "th match of the season is in the books.", null, 1); }
      if (m.hg + m.ag >= 7) { add(ri, "🤯", "A " + (m.hg + m.ag) + "-goal game", teams[m.home] + " " + m.hg + "-" + m.ag + " " + teams[m.away] + " is a goal feast.", null, 3); }
      // keepers
      gkLog.filter(function (g) { return g.match_ref === m.id; }).forEach(function (g) {
        const key = g.team + "|" + g.player, o = gkc[key] || (gkc[key] = { cs: 0, sv: 0 }), conceded = g.team === m.home ? m.ag : m.hg, who = cleanPlayer(g.player) + " (" + teams[g.team] + ")";
        const pcs = o.cs, psv = o.sv;
        if (conceded === 0) { o.cs++; } o.sv += Number(g.saves) || 0;
        const c1 = msCross(MS.gkCs, pcs, o.cs); if (c1) { add(ri, "🧤", who + ": " + c1 + " clean sheets", who + " has kept " + c1 + " clean sheets this season.", g.team, 2); }
        const s1 = msCross(MS.gkSaves, psv, o.sv); if (s1) { add(ri, "🙌", who + ": " + s1 + " saves", who + " has made " + s1 + " saves this season.", g.team, 2); }
      });
    });

    // ---- player goals: season, career in this league, hat-tricks ----
    const lgKey = SEASONS[currentSeason].league === "mini" ? "mini" : "main", before = {};
    allGoals.forEach(function (g) {
      const no = g.season || 1;
      if (no < currentSeason && hallLeagueNos(lgKey).indexOf(no) !== -1) { const k = normName(g.player); before[k] = (before[k] || 0) + g.goals; }
    });
    const rounds = {};
    goalLog.forEach(function (g) { const r = Number(g.round); if (r > 0) { (rounds[r] = rounds[r] || []).push(g); } });
    const seasonTot = {}, careerTot = {}, hats = {};
    let firstHat = true;
    Object.keys(rounds).map(Number).sort(function (a, b) { return a - b; }).forEach(function (r) {
      const per = {};
      rounds[r].forEach(function (g) { const k = g.team + "|" + g.player; per[k] = per[k] || { team: g.team, player: g.player, goals: 0 }; per[k].goals += g.goals; });
      Object.keys(per).forEach(function (k) {
        const p = per[k], who = p.player + " (" + teams[p.team] + ")", n = normName(p.player);
        const ps = seasonTot[k] || 0; seasonTot[k] = ps + p.goals;
        const s1 = msCross(MS.pSeason, ps, seasonTot[k]);
        if (s1) { add(r - 1, "⚽", who + " reaches " + s1 + " goals", p.player + " has scored " + s1 + " goals for " + teams[p.team] + " this season.", p.team, 3); }
        const pc = (before[n] || 0) + (careerTot[n] || 0); careerTot[n] = (careerTot[n] || 0) + p.goals;
        if (before[n]) {
          const c1 = msCross(MS.pCareer, pc, pc + p.goals);
          if (c1) { add(r - 1, "💫", p.player + ": " + c1 + " career goals", p.player + " reaches " + c1 + " goals in the " + (lgKey === "mini" ? "Mini League" : "Masters League") + ".", p.team, 4); }
        }
        if (p.goals >= 3) {

          else if (hats[n] > 1) { add(r - 1, "🎩", p.player + ": hat-trick number " + hats[n], p.player + " has " + hats[n] + " hat-tricks this season.", p.team, 3); }
        }
      });
    });
    return out.sort(function (a, b) { return b.ri - a.ri || b.w - a.w || a.title.localeCompare(b.title); });
  }

  function milestoneSelection() {
    const all = milestoneList();
    if (!all.length) { return { all: all, shown: [], rounds: [], sel: msRound }; }
    const rounds = []; all.forEach(function (x) { if (rounds.indexOf(x.ri) === -1) { rounds.push(x.ri); } });
    rounds.sort(function (a, b) { return b - a; });
    const sel = msRound === "all" ? "all" : (rounds.indexOf(msRound) === -1 ? rounds[0] : msRound);
    return { all: all, rounds: rounds, sel: sel, shown: sel === "all" ? all : all.filter(function (x) { return x.ri === sel; }) };
  }

  function pulseTable() {

      title = "TROPHY CABINETS";
      H.list.filter(function (a) { return a.tr.length; }).sort(function (x, y) { return y.tr.length - x.tr.length || x.name.localeCompare(y.name); }).slice(0, 10).forEach(function (a) {
        rows.push(cs_award("🏆", a.tr.length + (a.tr.length === 1 ? " award" : " awards"), a.name, a.groups.slice(0, 3).map(function (g) { return g.icon + " " + g.title + (g.seasons.length > 1 ? " x" + g.seasons.length : ""); }).join("  ·  ")));
      });
    }
    if (!rows.length) { return null; }
    return { title: title, sub: nm, rows: rows, file: file, caption: title + " · Hall of Fame" };
  }

  function extraCardSpec(kind) {
    const nm = fullName(currentSeason), mode = SEASONS[currentSeason].league === "mini" ? "Mini League" : "Masters League";
    if (kind === "hall") { return hallCardSpec(); }
    if (kind === "boot") {
      const b = bootTotals().slice(0, 10);
      if (!b.length) { return null; }
      const total = goalLog.reduce(function (n, g) { return n + g.goals; }, 0), rows = [{ t: "line", text: total + " goals logged this season" }];
      b.forEach(function (p, i) { rows.push(cs_stat(i + 1, p.player, teams[p.team], teams[p.team], p.goals)); });
      return { title: "GOLDEN BOOT", sub: nm, rows: rows, file: "golden-boot.png", caption: "Golden Boot · " + nm };
    }
    if (kind === "glove") {
      const gk = gkAgg([currentSeason]);
      if (!gk.length) { return null; }
      const rows = [{ t: "head", text: "Golden Glove" }];
      gk.slice(0, 5).forEach(function (g, i) { rows.push(cs_stat(i + 1, g.player, g.team, g.team + " · " + g.saves + " saves · " + g.ga + " conceded", g.cs)); });
      const sv = gk.filter(function (g) { return g.saves > 0; }).sort(function (a, b) { return b.saves - a.saves || a.m - b.m; }).slice(0, 5);
      if (sv.length) { rows.push({ t: "head", text: "Most saves" }); sv.forEach(function (g, i) { rows.push(cs_stat(i + 1, g.player, g.team, g.team + " · " + g.m + " matches", g.saves)); }); }
      return { title: "GOLDEN GLOVE", sub: nm, rows: rows, file: "golden-glove.png", caption: "Golden Glove · " + nm };
    }
    if (kind === "news") {
      const items = buildNews().slice(0, 8);
      if (!items.length) { return null; }
      return { title: "LEAGUE NEWS", sub: nm, rows: items.map(function (it) { return cs_award(it.icon, "News", it.title, it.text); }), file: "news.png", caption: "News · " + nm };
    }
    if (kind === "playoffs") {
      const b = bracketData(), rows = b.list.map(function (m) { return { t: "match", home: m.a ? teams[m.a] : "TBD", away: m.b ? teams[m.b] : "TBD", score: m.sc ? m.sc.hg + " - " + m.sc.ag : "vs", note: m.title + (m.w ? " · " + teams[m.w] + " win" : "") }; });
      if (!rows.length) { return null; }
      if (b.champion) { rows.push({ t: "award", icon: "🏆", title: "Champions", main: teams[b.champion], detail: nm }); }
      return { title: "PLAYOFFS", sub: nm, rows: rows, file: "playoffs.png", caption: "Playoffs · " + nm };
    }
    if (kind === "transfers") {
      if (!transfersOn()) { return null; }
      const tr = seasonTransfers().reverse(), moved = tr.filter(function (t) { return !isNewSigning(t); }), fresh = tr.filter(isNewSigning), rows = [];
      if (!tr.length) { return null; }
      if (moved.length) { rows.push({ t: "head", text: "Transferred players" }); moved.slice(0, 8).forEach(function (t) { rows.push(cs_award("🔁", "Transfer", t.player, (teams[t.from_team] || "?") + " → " + (teams[t.to_team] || "?"))); }); if (moved.length > 8) { rows.push({ t: "line", text: "+ " + (moved.length - 8) + " more transfers" }); } }
      if (fresh.length) { rows.push({ t: "head", text: "New players" }); fresh.slice(0, 8).forEach(function (t) { rows.push(cs_award("🆕", "New player", t.player, "→ " + (teams[t.to_team] || "?"))); }); if (fresh.length > 8) { rows.push({ t: "line", text: "+ " + (fresh.length - 8) + " more new players" }); } }
      return { title: "TRANSFERS", sub: nm, rows: rows, file: "transfers.png", caption: "Transfers · " + nm };
    }
    if (kind === "squads") {
      const a = squadAnalysis(), codes = Object.keys(teams);
      if (!codes.some(function (c) { return a.rows[c].size; })) { return null; }
      const rows = [{ t: "line", text: codes.reduce(function (n, c) { return n + a.rows[c].size; }, 0) + " players across " + codes.length + " squads" }];
      codes.slice().sort(function (x, y) { return a.rows[y].size - a.rows[x].size || teams[x].localeCompare(teams[y]); }).forEach(function (c, i) {
        const r = a.rows[c];
        rows.push(cs_stat(i + 1, teams[c], teams[c], ((squads[c] && squads[c].owner) ? squads[c].owner + " · " : "") + "GK " + r.gk + (transfersOn() ? " · in " + r.inn + " · out " + r.out : ""), r.size));
      });
      return { title: "SQUADS", sub: nm, rows: rows, file: "squads.png", caption: "Squads · " + nm };
    }
    if (kind === "cards") {
      const list = playerCards().sort(function (a, b) { return b.ovr - a.ovr || b.goals - a.goals || a.name.localeCompare(b.name); }).slice(0, 10);
      if (!list.length) { return null; }
      const rows = list.map(function (x, i) {
        const ed = x.special ? { boot: "Golden Boot edition", glove: "Golden Glove edition", star: "Player of the Week edition" }[x.special] : (cardMode() === "all" ? x.tier + " card" : "base card");
        return cs_stat(i + 1, x.name, teams[x.team], teams[x.team] + " · " + (x.isGK ? "GK" : x.goals + " goals") + " · " + ed, x.ovr);
      });
      return { title: "PLAYER CARDS", sub: nm + " · " + (cardMode() === "all" ? "All card types" : "Base cards"), rows: rows, file: "player-cards.png", caption: "Top rated players · " + nm };
    }
    if (kind === "pots") {
      const c = seasonPlayers().slice(0, 5);
      if (!c.length) { return null; }
      const done = buildStandings().every(function (r) { return r.played === SCHEDULE.length; });
      return { title: "PLAYER OF THE SEASON", sub: nm + (done ? " · Candidates" : " · Early favourites"), rows: c.map(function (x, i) { return cs_stat(i + 1, x.player, x.team, x.team + " · " + x.goals + " goals · " + x.hat + " hat-tricks · " + x.cs + " CS · " + x.potw + " POTW", Math.round(x.score)); }), file: "player-of-season.png", caption: "Player of the Season · " + nm };
    }
    if (kind === "milestones") {
      const S = milestoneSelection();
      if (!S.shown.length) { return null; }
      return { title: "MILESTONES", sub: nm + (S.sel === "all" ? " · Whole season" : " · Round " + (S.sel + 1)), rows: S.shown.slice(0, 10).map(function (x) { return cs_award(x.icon, "Round " + (x.ri + 1), x.title, x.text); }), file: "milestones.png", caption: "Milestones · " + nm };
    }
    if (kind === "drama") {
      const d = dramaList();
      if (!d.length) { return null; }
      return { title: "UPSETS & DRAMA", sub: nm, rows: d.map(function (x) { return cs_award(x.icon, x.title, x.main, x.detail); }), file: "drama.png", caption: "Upsets and drama · " + nm };
    }
    if (kind === "records") {
      const r = computeRecords();
      if (!r.played.length) { return null; }
      const rows = [];
      function ln(p) { return teams[p.home] + " " + p.h + "-" + p.a + " " + teams[p.away] + " (R" + (p.ri + 1) + ")"; }
      if (r.biggestWin) { rows.push(cs_award("💥", "Biggest win", r.biggestWin.items.map(ln).join(" · "), "Largest winning margin")); }
      if (r.mostGoals) { rows.push(cs_award("⚽", "Highest-scoring match", r.mostGoals.items.map(ln).join(" · "), "Most goals in one game")); }
      if (r.winStreak && r.winStreak.s > 0) { rows.push(cs_award("🔥", "Longest winning streak", r.winStreak.items.map(function (x) { return teams[x.code]; }).join(", ") + " (" + r.winStreak.s + ")", "Wins in a row")); }
      if (r.unbeaten && r.unbeaten.s > 0) { rows.push(cs_award("🎯", "Longest unbeaten run", r.unbeaten.items.map(function (x) { return teams[x.code]; }).join(", ") + " (" + r.unbeaten.s + ")", "Matches without a loss")); }
      if (r.bestHome) { rows.push(cs_award("🏠", "Best home record", r.bestHome.items.map(function (x) { return teams[x.code] + " " + x.pts + " pts"; }).join(", "), "Most home points")); }
      if (r.bestAway) { rows.push(cs_award("✈️", "Best away record", r.bestAway.items.map(function (x) { return teams[x.code] + " " + x.pts + " pts"; }).join(", "), "Most away points")); }
      if (r.roundGoals) { rows.push(cs_award("📈", "Most goals in a round", r.roundGoals.items.map(function (x) { return "Round " + (x.ri + 1) + " (" + x.goals + ")"; }).join(", "), "Completed rounds only")); }
      return { title: "LEAGUE RECORDS", sub: nm, rows: rows, file: "records.png", caption: "Records · " + nm };
    }
    if (kind === "wrapped") {
      const ms = chronoMatches();
      if (!ms.length) { return null; }
      const rows_ = buildStandings(), sum = seasonSummary(currentSeason), goals = ms.reduce(function (n, m) { return n + m.hg + m.ag; }, 0);
      const att = rows_.slice().sort(function (a, b) { return b.gf - a.gf; })[0], def = rows_.slice().sort(function (a, b) { return a.ga - b.ga; })[0];
      const big = ms.slice().sort(function (a, b) { return Math.abs(b.hg - b.ag) - Math.abs(a.hg - a.ag) || (b.hg + b.ag) - (a.hg + a.ag); })[0];
      const hi = ms.slice().sort(function (a, b) { return (b.hg + b.ag) - (a.hg + a.ag); })[0];
      const boot = bootTotals(), hat = hatTrickList([currentSeason]), rows = [];
      rows.push(cs_award("⚽", "Goals", goals + " in " + ms.length + " matches", (goals / ms.length).toFixed(2) + " per match"));
      rows.push(cs_award("🏆", sum.champion ? "Champions" : "League leaders", sum.champion || rows_[0].name, sum.runnerUp ? "Runners-up: " + sum.runnerUp : "Season in progress"));
      rows.push(cs_award("🔥", "Best attack", att.name, att.gf + " goals scored"));
      rows.push(cs_award("🧱", "Best defence", def.name, def.ga + " goals conceded"));
      rows.push(cs_award("🎢", "Match of the season", teams[hi.home] + " " + hi.hg + "-" + hi.ag + " " + teams[hi.away], (hi.hg + hi.ag) + " goals"));
      rows.push(cs_award("💥", "Biggest win", teams[big.home] + " " + big.hg + "-" + big.ag + " " + teams[big.away], "Round " + (big.ri + 1)));
      if (boot.length) { rows.push(cs_award("👟", "Golden Boot", boot[0].player + " (" + teams[boot[0].team] + ")", boot[0].goals + " goals")); }
      rows.push(cs_award("🎩", "Hat-tricks", String(hat.length), hat.length ? hat.slice(0, 3).map(function (h) { return h.player; }).join(", ") : "None yet"));
      return { title: "SEASON WRAPPED", sub: nm + (sum.complete ? "" : " · So far"), rows: rows, file: "wrapped.png", caption: "Season Wrapped · " + nm };
    }
    return undefined;
  }

  function cardSpec(kind) {
    const extra = extraCardSpec(kind);
    if (extra !== undefined) { return extra; }
    const nm = fullName(currentSeason), q = qualifiers();
    if (kind === "round") {
      let rows, title, kicker, file;
      if (currentRound === "PO") {
        const b = bracketData();
        rows = b.list.map(function (m) { return { t: "match", home: m.a ? teams[m.a] : "TBD", away: m.b ? teams[m.b] : "TBD", score: m.sc ? m.sc.hg + " - " + m.sc.ag : "vs", note: m.title + (m.w ? " · " + teams[m.w] + " win" : "") }; });
        if (b.champion) { rows.push({ t: "award", icon: "🏆", title: "Champions", main: teams[b.champion], detail: nm }); }
        title = "PLAYOFFS"; kicker = ""; file = "playoffs.png";
      } else {
        const fx = buildFixtures()[currentRound];
        let n = 0;
        rows = fx.map(function (m) {
          const r = results[m.id], ok = isPlayed(r);
          if (ok) { n++; }
          return { t: "match", home: teams[m.home], away: teams[m.away], score: ok ? r.h + " - " + r.a : "vs", note: "" };
        });
        const w = potwForRound(currentRound);
        if (w) { rows.push({ t: "award", icon: "⭐", title: "Player of the Week", main: w.player + " (" + teams[w.team] + ")", detail: w.detail }); }
        title = "ROUND " + (currentRound + 1); kicker = n === fx.length ? " · Results" : n === 0 ? " · Fixtures" : " · Results & fixtures";
        file = "round-" + (currentRound + 1) + ".png";
      }
      return { title: title, sub: nm + (kicker || ""), rows: rows, file: file, caption: title + " · " + nm };
    }
    if (kind === "table") {
      const t = buildStandings(), last = lastPlayedRound();
      const rows = [{ t: "thead" }].concat(t.map(function (r, i) { const gd = r.gf - r.ga; return { t: "table", pos: i + 1, name: r.name, p: r.played, gd: gd > 0 ? "+" + gd : String(gd), pts: r.points, hl: i < q }; }));
      rows.push({ t: "line", text: "Red bar = playoff places (top " + q + ")" });
      return { title: "LEAGUE TABLE", sub: nm + (last ? " · After round " + last : ""), rows: rows, file: "table.png", caption: "League table · " + nm };
    }
    if (kind === "stats") {
      const played = getPlayedMatches(), goals = played.reduce(function (n, m) { return n + m.homeGoals + m.awayGoals; }, 0);
      const rows = [{ t: "line", text: played.length + " matches · " + goals + " goals · " + (played.length ? (goals / played.length).toFixed(1) : "0.0") + " per match" }];
      const boot = bootTotals().slice(0, 5), gk = gkAgg([currentSeason]).slice(0, 3), cs = cleanSheetRows().slice(0, 3).filter(function (r) { return r.cs > 0; });
      if (boot.length) { rows.push({ t: "head", text: "Golden Boot" }); boot.forEach(function (p, i) { rows.push({ t: "stat", rank: i + 1, name: p.player, team: teams[p.team], sub: teams[p.team], value: p.goals }); }); }
      if (gk.length) { rows.push({ t: "head", text: "Golden Glove" }); gk.forEach(function (g, i) { rows.push({ t: "stat", rank: i + 1, name: g.player, team: g.team, sub: g.team + " · " + g.saves + " saves · " + g.ga + " conceded", value: g.cs }); }); rows.push({ t: "line", text: "Value shown = clean sheets" }); }
      if (cs.length) { rows.push({ t: "head", text: "Clean sheets by team" }); cs.forEach(function (r, i) { rows.push({ t: "stat", rank: i + 1, name: r.name, team: r.name, sub: r.p + " played · " + r.ga + " conceded", value: r.cs }); }); }
      if (!boot.length && !gk.length) { rows.push({ t: "line", text: "Player stats appear after goals are logged." }); }
      return { title: "SEASON STATS", sub: nm, rows: rows, file: "stats.png", caption: "Season stats · " + nm };
    }
    if (kind === "awards") {
      const A = awardsList();
      if (!A.list.length) { return null; }
      return { title: "AWARDS", sub: nm + (A.done ? " · Final" : " · Provisional"), rows: A.list.map(function (x) { return { t: "award", icon: x.icon, title: x.title, main: x.main, detail: x.detail }; }), file: "awards.png", caption: "Awards · " + nm };
    }
    return null;
  }

  async function shareCard(kind) {
    const spec = cardSpec(kind);
    if (!spec) { toast("Nothing to share yet.", "err"); return; }
    toast("Building image…");
    try { const cv = await renderCard(spec); showCardModal(cv, spec.file, spec.caption); }
    catch (e) { toast("Could not build the image: " + e.message, "err"); }
  }


  // =============== START ===============
  async function start() {
    applySeason();
    buildSeasonSelect();
    const s = await sb.auth.getSession();
    isAdmin = !!(s.data && s.data.session);
    render();
    loadData();
    // refresh every 30 seconds, but not while someone is typing
    setInterval(function () {
      const tag = document.activeElement ? document.activeElement.tagName : "";
      if (tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA") { loadData(); }
    }, 30000);
  }


    let deferredInstall = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstall = e;
  });
  window.addEventListener("appinstalled", function () {
    deferredInstall = null;
    render();
  });

  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }

  function installButton() {
    return isStandalone() ? "" : "<button class='inst' onclick='installApp()'>📲 Install</button>";
  }

  async function installApp() {
    if (deferredInstall) {
      deferredInstall.prompt();
      await deferredInstall.userChoice;
      deferredInstall = null;
      render();
      return;
    }
    showInstallHelp();
  }

  function showInstallHelp() {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const steps = ios
      ? "<ol><li>Open this site in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with an arrow).</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol>"
      : "<ol><li>Open this site in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu (top right).</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>";
    const box = document.createElement("div");
    box.className = "modal";
    box.innerHTML = "<div class='modalbox'><h3>📲 Install the league app</h3>" + steps +
      "<p class='legend'>If you opened this link inside WhatsApp or another app, first choose <b>Open in browser</b> from its menu.</p>" +
      "<button class='btn' onclick='this.closest(\".modal\").remove()'>Got it</button></div>";
    box.addEventListener("click", function (e) { if (e.target === box) { box.remove(); } });
    document.body.appendChild(box);
  }

  start();
    // lets the site be installed as an app
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

</script>
