<style>
  :root { --bg:#0b1220; --card:#131c2e; --line:#243049; --text:#e8edf5; --muted:#94a3b8;
          --accent:#2ecc88; --gold:#f5b301; --red:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Inter",system-ui,Arial,sans-serif; line-height:1.5; }
  h1,h2,h3,nav button,.rounds button { font-family:"Oswald","Inter",sans-serif; }

  header { background:linear-gradient(135deg,#5a0000,#7b0101 45%,#0b1220); padding:28px 16px 22px; border-bottom:1px solid var(--line); }
  .wrap { max-width:980px; margin:0 auto; }
  header h1 { margin:0; font-size:32px; letter-spacing:1px; text-transform:uppercase; }
  header p { margin:6px 0 0; color:#f1d6d6; font-size:14px; }

  nav { position:sticky; top:0; z-index:10; background:var(--card); border-bottom:1px solid var(--line); display:flex; overflow-x:auto; padding:0 8px; }
  nav button { background:none; border:0; color:var(--muted); font-size:16px; letter-spacing:.5px; padding:14px 18px; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; }
  nav button:hover { color:var(--text); }
  nav button.on { color:var(--accent); border-bottom-color:var(--accent); }
  main { padding:18px 14px 40px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  .card h2,.card h3 { margin:0 0 10px; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:520px; }
  th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
  th,td { padding:10px 8px; text-align:center; border-bottom:1px solid var(--line); }
  th.left,td.left { text-align:left; }
  tr.top4 td:first-child { box-shadow:inset 4px 0 0 var(--accent); }
  tr.top4 { background:rgba(46,204,136,.08); }
  td.pts { font-weight:800; font-size:16px; }
  .badge { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; background:#1e2a44; color:var(--accent); font-size:11px; font-weight:800; margin-right:8px; vertical-align:middle; }
  .form span { display:inline-block; width:20px; height:20px; line-height:20px; border-radius:4px; font-size:11px; font-weight:700; margin-right:2px; color:#fff; }
  .W { background:#16a34a; } .D { background:#6b7280; } .L { background:var(--red); }
  .legend { color:var(--muted); font-size:13px; margin:4px 2px; }

  .rounds { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .rounds button { background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:6px 11px; cursor:pointer; font-size:14px; }
  .rounds button.on { background:var(--accent); color:#05281a; border-color:var(--accent); font-weight:700; }
  .match { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
  .match .h { text-align:right; } .match .a { text-align:left; }
  .score { min-width:70px; text-align:center; font-weight:800; font-size:18px; }
  input { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .match input { width:46px; text-align:center; font-weight:700; padding:7px 4px; }

  .po { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
  .pocard { background:var(--card); border:1px solid var(--line); border-left-width:6px; border-radius:14px; padding:14px; }
  .pocard small { color:var(--muted); display:block; margin-bottom:8px; }
  .pocard .vs { font-weight:600; margin-bottom:10px; }
  select { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:7px; width:100%; }
  .champ { text-align:center; font-size:22px; font-weight:800; color:var(--gold); background:rgba(245,179,1,.1); border:1px solid var(--gold); border-radius:14px; padding:20px; margin-top:16px; }
  .shield { background:rgba(245,179,1,.1); border:1px solid var(--gold); color:var(--gold); border-radius:12px; padding:12px 16px; margin-bottom:14px; font-weight:700; }

  .login input { display:block; width:100%; max-width:320px; margin-bottom:10px; }
  .btn { background:var(--accent); color:#05281a; border:0; border-radius:8px; padding:10px 18px; font:inherit; font-weight:700; cursor:pointer; }
  .btn.out { background:none; border:1px solid var(--line); color:var(--text); }
  .status { color:var(--gold); font-size:13px; margin:0 0 10px; min-height:18px; }
    .sq { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:14px; }
  .sq .card { margin:0; }
  .sq label { display:block; margin:10px 0 4px; }
  .sq input, .sq textarea { width:100%; }
  textarea { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .owner { color:var(--muted); margin:0 0 10px; }
  .plist { margin:0; padding-left:22px; columns:2; font-size:14px; }
  .plist li { margin-bottom:3px; }
  li { margin-bottom:8px; }
  @media (max-width:520px) { header h1 { font-size:24px; } .match { font-size:14px; } }
  /* ===== SPORTS LOOK ===== */
  header { position:relative; overflow:hidden;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 70px, transparent 70px 140px),
      linear-gradient(135deg,#5a0000,#7b0101 50%,#0b1220); }
  header::after { content:""; position:absolute; right:-70px; top:-70px; width:240px; height:240px;
    border:3px solid rgba(255,255,255,.12); border-radius:50%; }
  header h1 { animation: slideDown .7s ease both; }
  header p  { animation: slideDown .7s .15s ease both; }

  /* live results ticker */
  .ticker { background:#05080f; border-bottom:2px solid var(--accent); overflow:hidden; white-space:nowrap; padding:8px 0; }
  .track { display:inline-block; animation: scroll 40s linear infinite; }
  .ticker:hover .track { animation-play-state: paused; }
  .tick { display:inline-block; margin:0 22px; font-family:"Oswald",sans-serif; letter-spacing:.5px; font-size:14px; color:var(--muted); }
  .tick b { color:var(--text); }
  .tick em { font-style:normal; color:var(--accent); background:#10301f; padding:2px 8px; border-radius:4px; margin:0 6px; }
  .tickmsg { padding:0 16px; color:var(--muted); font-family:"Oswald",sans-serif; }
  @keyframes scroll { from { transform:translateX(0); } to { transform:translateX(-50%); } }

  /* page transitions */
  #app.enter > * { animation: fadeUp .45s ease both; }
  #app.enter > *:nth-child(2) { animation-delay:.08s; }
  #app.enter > *:nth-child(3) { animation-delay:.16s; }
  #app.enter tr { animation: rowIn .4s ease both; }
  #app.enter tr:nth-child(2){animation-delay:.05s} #app.enter tr:nth-child(3){animation-delay:.1s}
  #app.enter tr:nth-child(4){animation-delay:.15s} #app.enter tr:nth-child(5){animation-delay:.2s}
  #app.enter tr:nth-child(6){animation-delay:.25s} #app.enter tr:nth-child(7){animation-delay:.3s}
  #app.enter tr:nth-child(8){animation-delay:.35s} #app.enter tr:nth-child(9){animation-delay:.4s}
  #app.enter tr:nth-child(10){animation-delay:.45s} #app.enter tr:nth-child(11){animation-delay:.5s}
  @keyframes fadeUp   { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes rowIn    { from { opacity:0; transform:translateX(-18px); } to { opacity:1; transform:none; } }
  @keyframes slideDown{ from { opacity:0; transform:translateY(-14px); } to { opacity:1; transform:none; } }

  /* interactive feel */
  tbody tr, table tr { transition: background .2s; }
  table tr:hover td { background: rgba(255,255,255,.04); }

  nav button, .rounds button, .btn { transition: transform .15s, background .2s, color .2s, box-shadow .2s; }
  nav button:hover, .rounds button:hover { transform: translateY(-2px); }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(46,204,136,.35); }
  .btn:active, .rounds button:active { transform: scale(.95); }
  .card { transition: transform .25s, box-shadow .25s, border-color .25s; }
  .card:hover { border-color: #33466b; }
  .badge { transition: transform .25s; }
  tr:hover .badge { transform: scale(1.18) rotate(-6deg); }

  /* scoreboard look for scores */
  .score { font-family:"Oswald",sans-serif; background:#05080f; border:1px solid var(--line); border-radius:8px; padding:4px 12px; letter-spacing:2px; color:var(--accent); }
  .match { transition: background .2s; }
  .match:hover { background: rgba(46,204,136,.06); }
  .rounds button.on { box-shadow: 0 0 14px rgba(46,204,136,.5); }

  /* top of the table glows */
  tr.top4 td:first-child { animation: pulseBar 2.4s ease-in-out infinite; }
  @keyframes pulseBar { 0%,100% { box-shadow: inset 4px 0 0 var(--accent); } 50% { box-shadow: inset 7px 0 0 var(--accent); } }
  .shield { animation: glow 2s ease-in-out infinite alternate; }
  .form span:last-child { animation: pop .5s ease both; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

  /* turn animations off for people who prefer less motion */
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  @keyframes glow { from { box-shadow: 0 0 6px rgba(245,179,1,.3); } to { box-shadow: 0 0 28px rgba(245,179,1,.8); } }

  /* ===== OPENING INTRO ===== */
  #intro { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:20px; cursor:pointer; overflow:hidden;
    background: radial-gradient(circle at center, #0f2a1f 0%, #0b1220 70%);
    transition: opacity .8s ease, transform .8s ease; }
  #intro.hide { opacity:0; transform:scale(1.08); pointer-events:none; }
  #intro::before { content:""; position:absolute; width:520px; height:520px; max-width:90vw; max-height:90vw;
    border:3px solid rgba(46,204,136,.25); border-radius:50%; animation: ring 2.4s ease-out both; }
  #intro::after { content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:rgba(46,204,136,.18);
    transform-origin:center; animation: line 1.2s ease-out both; }
  .i-shield { font-size:86px; animation: shieldIn 1.2s cubic-bezier(.2,1.4,.4,1) both, spin3d 3s 1.2s linear infinite; position:relative; z-index:1; }
  .i-title { font-family:"Oswald",sans-serif; font-size:clamp(28px,7vw,54px); letter-spacing:3px; text-transform:uppercase;
    margin:14px 0 4px; position:relative; z-index:1; }
  .i-title span { display:inline-block; opacity:0; animation: letterIn .5s ease forwards; }
  .i-sub { font-family:"Oswald",sans-serif; font-size:clamp(16px,4vw,24px); letter-spacing:6px; color:var(--accent);
    opacity:0; animation: fadeUp .8s 1.6s ease forwards; position:relative; z-index:1; }
  .i-skip { position:absolute; bottom:28px; color:var(--muted); font-size:13px; opacity:0; animation: fadeUp .6s 1.2s ease forwards; }
  @keyframes shieldIn { from { transform:scale(0) rotate(-200deg); opacity:0; } to { transform:scale(1) rotate(0); opacity:1; } }
  @keyframes letterIn { from { opacity:0; transform:translateY(24px) scale(.7); } to { opacity:1; transform:none; } }
  @keyframes ring { from { transform:scale(.2); opacity:1; } to { transform:scale(1.5); opacity:0; } }
  @keyframes line { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes spin3d { from { transform:rotateY(0deg); } to { transform:rotateY(360deg); } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

  /* ===== COUNTDOWN INTRO ===== */
  #intro::before { animation: pulseRing .8s ease-out infinite; }
  .i-top { font-family:"Oswald",sans-serif; letter-spacing:4px; font-size:clamp(14px,3.6vw,20px); color:var(--muted);
    text-transform:uppercase; position:relative; z-index:1; animation: fadeUp .6s ease both; }
  .count { position:relative; z-index:1; min-height:clamp(130px,40vw,270px); display:flex; align-items:center; justify-content:center; }
  .count span { display:block; font-family:"Oswald",sans-serif; font-weight:700; line-height:1;
    font-size:clamp(120px,40vw,260px); color:var(--text); text-shadow:0 0 40px rgba(46,204,136,.5);
    animation: numPop .8s ease both; }
  .count span.go { font-size:clamp(46px,14vw,110px); color:var(--gold); letter-spacing:4px; text-transform:uppercase;
    text-shadow:0 0 36px rgba(245,179,1,.7); animation: kick .8s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes pulseRing { from { transform:scale(.3); opacity:.9; } to { transform:scale(1.4); opacity:0; } }
  @keyframes numPop { 0% { transform:scale(2.4); opacity:0; } 25% { transform:scale(1); opacity:1; } 80% { opacity:1; } 100% { transform:scale(.85); opacity:.15; } }
  @keyframes kick { 0% { transform:scale(.3); opacity:0; } 45% { transform:scale(1.15); opacity:1; } 100% { transform:scale(1); opacity:1; } }

</style>
</head>
<body>

<div id="intro">
  <div class="i-top">🛡️ eFootball Friends League · Season 1</div>
  <div class="count" id="count"></div>
  <div class="i-skip">Tap to skip</div>
</div>

<header>
  <div class="wrap">
    <h1><span class="spin">🛡️</span> eFootball Friends League · Season 1</h1>
    <p>10 teams · home &amp; away · 18 rounds</p>
  </div>
</header>
<div class="ticker" id="ticker"></div>

<nav id="nav"></nav>
<main><div class="wrap"><p class="status" id="status"></p><div id="app"></div></div></main>

<script>
  // =============== CONNECTION ===============
  const SUPABASE_URL = "https://fzygrjvkjwfpjzmkauan.supabase.co";
  const SUPABASE_KEY = "sb_publishable_unDth4ipGBL5Q6KQk5a_Cw_9RxZwT9J";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // =============== DATA ===============
  const teams = {
    T1: "Chelsea", T2: "Manchester United", T3: "AC Milan", T4: "Inter Milan", T5: "Borussia Dortmund",
    T6: "Barcelona", T7: "Arsenal", T8: "Manchester City", T9: "Melbourne City", T10: "Liverpool"
  };

  let results = {};          // filled from the database
  let playoffWinners = {};   // filled from the database
  let squads = {};           // filled from the database
  let isAdmin = false;

  const tabs = ["Standings", "Fixtures", "Playoffs", "Squads", "Rules", "Admin"];
  let currentTab = "Standings";
  let currentRound = 0;

  function setStatus(text) { document.getElementById("status").textContent = text || ""; }

  function initials(name) {
    const w = name.split(" ");
    return (w.length > 1 ? w[0][0] + w[1][0] : name.slice(0, 3)).toUpperCase();
  }

  // =============== LOAD FROM DATABASE ===============
  async function loadData() {
    const r = await sb.from("results").select("*");
    const p = await sb.from("playoffs").select("*");
    const s = await sb.from("squads").select("*");
    if (r.error || p.error || s.error) { setStatus("Could not load data. Check your internet and refresh."); return; }
    setStatus("");
    results = {};
    r.data.forEach(function (row) { results[row.id] = { h: row.home_goals, a: row.away_goals }; });
    playoffWinners = {};
    p.data.forEach(function (row) { playoffWinners[row.stage] = row.winner; });
    squads = {};
    s.data.forEach(function (row) { squads[row.team] = { owner: row.owner || "", players: row.players || "" }; });
    render();
  }

  // =============== FIXTURES (circle method) ===============
  function buildFixtures() {
    let order = Object.keys(teams);
    const firstLeg = [];
    for (let r = 0; r < 9; r++) {
      const round = [];
      for (let i = 0; i < 5; i++) {
        let home = order[i];
        let away = order[9 - i];
        if ((r + i) % 2 === 1) { const t = home; home = away; away = t; }
        round.push({ id: "R" + (r + 1) + "-" + (i + 1), home: home, away: away });
      }
      firstLeg.push(round);
      order = [order[0], order[9]].concat(order.slice(1, 9));
    }
    const secondLeg = firstLeg.map(function (round, r) {
      return round.map(function (m, i) {
        return { id: "R" + (r + 10) + "-" + (i + 1), home: m.away, away: m.home };
      });
    });
    return firstLeg.concat(secondLeg);
  }

  // =============== STANDINGS LOGIC ===============
  function getPlayedMatches() {
    const played = [];
    buildFixtures().flat().forEach(function (m) {
      const r = results[m.id];
      if (r && r.h !== "" && r.a !== "" && r.h !== null && r.a !== null) {
        played.push({ home: m.home, away: m.away, homeGoals: Number(r.h), awayGoals: Number(r.a) });
      }
    });
    return played;
  }

  function buildStandings() {
    const table = Object.keys(teams).map(function (code) {
      return { code: code, name: teams[code], played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, points: 0, form: [] };
    });
    function find(code) { return table.find(function (row) { return row.code === code; }); }

    for (const m of getPlayedMatches()) {
      const home = find(m.home), away = find(m.away);
      home.played++; away.played++;
      home.gf += m.homeGoals; home.ga += m.awayGoals;
      away.gf += m.awayGoals; away.ga += m.homeGoals;
      if (m.homeGoals > m.awayGoals) { home.won++; away.lost++; home.points += 3; home.form.push("W"); away.form.push("L"); }
      else if (m.homeGoals < m.awayGoals) { away.won++; home.lost++; away.points += 3; away.form.push("W"); home.form.push("L"); }
      else { home.drawn++; away.drawn++; home.points++; away.points++; home.form.push("D"); away.form.push("D"); }
    }
    table.sort(function (a, b) {
      return b.points - a.points || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf;
    });
    return table;
  }

  // =============== SAVING (admin only; the database also enforces this) ===============
  async function saveScore(id) {
    if (!isAdmin) return;
    const h = document.getElementById("h-" + id).value;
    const a = document.getElementById("a-" + id).value;
    results[id] = { h: h, a: a };
    if (h === "" && a === "") {
      const res = await sb.from("results").delete().eq("id", id);
      delete results[id];
      if (res.error) { setStatus("Could not delete: " + res.error.message); }
    } else if (h !== "" && a !== "") {
      const res = await sb.from("results").upsert({ id: id, home_goals: Number(h), away_goals: Number(a) });
      setStatus(res.error ? "Could not save: " + res.error.message : "");
    }
    render();
  }

  async function pickWinner(stage, code) {
    if (!isAdmin) return;
    let res;
    if (code === "") {
      delete playoffWinners[stage];
      res = await sb.from("playoffs").delete().eq("stage", stage);
    } else {
      playoffWinners[stage] = code;
      res = await sb.from("playoffs").upsert({ stage: stage, winner: code });
    }
    setStatus(res.error ? "Could not save: " + res.error.message : "");
    render();
  }

  // =============== LOGIN ===============
  async function login() {
    const email = document.getElementById("em").value.trim();
    const password = document.getElementById("pw").value;
    const res = await sb.auth.signInWithPassword({ email: email, password: password });
    if (res.error) { setStatus("Login failed: " + res.error.message); return; }
    isAdmin = true;
    setStatus("");
    currentTab = "Fixtures";
    render();
  }
  async function logout() {
    await sb.auth.signOut();
    isAdmin = false;
    currentTab = "Standings";
    render();
  }

  // =============== PAGES ===============
  function pageStandings() {
    const rows = buildStandings();
    const done = rows.every(function (r) { return r.played === 18; });
    let html = "";
    if (done) { html += "<div class='shield'>🛡️ League Shield winners: " + rows[0].name + "</div>"; }
    html += "<div class='card scroll'><table><tr><th>#</th><th class='left'>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>Form</th></tr>";
    rows.forEach(function (r, i) {
      const gd = r.gf - r.ga;
      const form = r.form.slice(-5).map(function (f) { return "<span class='" + f + "'>" + f + "</span>"; }).join("");
      html += "<tr class='" + (i < 4 ? "top4" : "") + "'><td>" + (i + 1) + "</td>" +
        "<td class='left'><span class='badge'>" + initials(r.name) + "</span>" + r.name + (i === 0 ? " 🛡️" : "") + "</td>" +
        "<td>" + r.played + "</td><td>" + r.won + "</td><td>" + r.drawn + "</td><td>" + r.lost + "</td>" +
        "<td>" + r.gf + "</td><td>" + r.ga + "</td><td>" + (gd > 0 ? "+" + gd : gd) + "</td>" +
        "<td class='pts'>" + r.points + "</td><td class='form'>" + form + "</td></tr>";
    });
    html += "</table></div><p class='legend'>Green bar = playoff places (top 4). 1st place after 18 rounds wins the League Shield. Ties are split by goal difference, then goals scored.</p>";
    return html;
  }

  function pageFixtures() {
    const rounds = buildFixtures();
    let html = "<div class='rounds'>";
    for (let i = 0; i < 18; i++) {
      html += "<button class='" + (i === currentRound ? "on" : "") + "' onclick='currentRound=" + i + ";render()'>R" + (i + 1) + "</button>";
    }
    html += "</div><div class='card'><h3>Round " + (currentRound + 1) + " <span style='color:var(--muted);font-size:13px;font-weight:400'>" +
            (currentRound < 9 ? "First leg" : "Second leg") + "</span></h3>";
    rounds[currentRound].forEach(function (m) {
      const r = results[m.id] || { h: "", a: "" };
      const h = (r.h === null) ? "" : r.h, a = (r.a === null) ? "" : r.a;
      let middle;
      if (isAdmin) {
        middle = "<input id='h-" + m.id + "' type='number' min='0' value='" + h + "' onchange=\"saveScore('" + m.id + "')\"> : " +
                 "<input id='a-" + m.id + "' type='number' min='0' value='" + a + "' onchange=\"saveScore('" + m.id + "')\">";
      } else {
        middle = "<span class='score'>" + ((h !== "" && a !== "") ? h + " : " + a : "vs") + "</span>";
      }
      html += "<div class='match'><span class='h'>" + teams[m.home] + "</span><span>" + middle + "</span><span class='a'>" + teams[m.away] + "</span></div>";
    });
    return html + "</div>";
  }

  function validWinner(stage, a, b) {
    const w = playoffWinners[stage];
    return (a && b && (w === a || w === b)) ? w : null;
  }

  function matchCard(stage, title, note, a, b, color) {
    let html = "<div class='pocard' style='border-left-color:" + color + "'>";
    html += "<b style='color:" + color + "'>" + title + "</b><small>" + note + "</small>";
    html += "<div class='vs'>" + (a ? teams[a] : "TBD") + " <span style='color:var(--muted)'>vs</span> " + (b ? teams[b] : "TBD") + "</div>";
    if (a && b) {
      if (isAdmin) {
        html += "<select onchange=\"pickWinner('" + stage + "', this.value)\"><option value=''>Pick winner...</option>" +
          "<option value='" + a + "'" + (playoffWinners[stage] === a ? " selected" : "") + ">" + teams[a] + "</option>" +
          "<option value='" + b + "'" + (playoffWinners[stage] === b ? " selected" : "") + ">" + teams[b] + "</option></select>";
      } else {
        const w = validWinner(stage, a, b);
        html += "<div>" + (w ? "Winner: <b>" + teams[w] + "</b>" : "<span style='color:var(--muted)'>Not played yet</span>") + "</div>";
      }
    }
    return html + "</div>";
  }

  function pagePlayoffs() {
    const table = buildStandings();
    const done = table.every(function (r) { return r.played === 18; });
    const top = table.slice(0, 4).map(function (r) { return r.code; });
    const t1 = top[0], t2 = top[1], t3 = top[2], t4 = top[3];
    const q1Winner = validWinner("q1", t1, t2);
    const q1Loser = q1Winner ? (q1Winner === t1 ? t2 : t1) : null;
    const elWinner = validWinner("el", t3, t4);
    const q2Winner = validWinner("q2", q1Loser, elWinner);
    const champion = validWinner("f", q1Winner, q2Winner);

    let html = "<p class='legend'>" + (done ? "League stage complete. The playoff line-up is set." :
               "Provisional: based on the current top 4. Final after all 18 rounds.") + "</p><div class='po'>";
    html += matchCard("q1", "Qualifier 1", "1st vs 2nd. Winner goes to the Final", t1, t2, "#2ecc88");
    html += matchCard("el", "Eliminator", "3rd vs 4th. Loser is out", t3, t4, "#ef4444");
    html += matchCard("q2", "Qualifier 2", "Loser of Q1 vs winner of Eliminator", q1Loser, elWinner, "#3b82f6");
    html += matchCard("f", "Final", "Winner of Q1 vs winner of Q2", q1Winner, q2Winner, "#f5b301");
    html += "</div>";
    if (champion) { html += "<div class='champ'>🏆 Champions: " + teams[champion] + "</div>"; }
    return html;
  }
  function esc(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function playerList(text) {
    return text.split("\n").map(function (x) { return x.trim(); }).filter(function (x) { return x !== ""; });
  }

  async function saveSquad(code) {
    if (!isAdmin) return;
    const owner = document.getElementById("own-" + code).value.trim();
    const players = document.getElementById("pl-" + code).value;
    const count = playerList(players).length;
    const res = await sb.from("squads").upsert({ team: code, owner: owner, players: players });
    if (res.error) { setStatus("Could not save: " + res.error.message); return; }
    squads[code] = { owner: owner, players: players };
    setStatus(teams[code] + " saved. " + ((count < 23 || count > 25) ? "Note: squad has " + count + " players (expected 23 to 25)." : count + " players."));
    render();
  }

  function pageSquads() {
    let html = "<p class='legend'>Team owners and squads (23 to 25 players each).</p><div class='sq'>";
    Object.keys(teams).forEach(function (code) {
      const s = squads[code] || { owner: "", players: "" };
      const list = playerList(s.players);
      html += "<div class='card'><h3><span class='badge'>" + initials(teams[code]) + "</span>" + teams[code] + "</h3>";
      if (isAdmin) {
        html += "<label class='legend'>Owner name</label><input id='own-" + code + "' value=\"" + esc(s.owner) + "\">" +
                "<label class='legend'>Players (one per line, " + list.length + " now)</label>" +
                "<textarea id='pl-" + code + "' rows='12'>" + esc(s.players) + "</textarea>" +
                "<p><button class='btn' onclick=\"saveSquad('" + code + "')\">Save squad</button></p>";
      } else {
        html += "<p class='owner'>Owner: <b style='color:var(--text)'>" + (s.owner ? esc(s.owner) : "TBA") + "</b></p>";
        if (list.length) {
          html += "<p class='legend'>" + list.length + " players</p><ol class='plist'>" +
                  list.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ol>";
        } else {
          html += "<p class='legend'>Squad not added yet.</p>";
        }
      }
      html += "</div>";
    });
    return html + "</div>";
  }

  function pageRules() {
    return "<div class='card'><h2>League rules</h2><ol>" +
      "<li><b>Format:</b> 10 teams, home and away. Each team plays every other team twice, so 18 matches each.</li>" +
      "<li><b>Game:</b> Matches are played in the eFootball 2027 app (friend match). The home player creates the room.</li>" +
      "<li><b>Points:</b> Win 3, draw 1, loss 0.</li>" +
      "<li><b>Ranking:</b> Points, then goal difference, then goals scored.</li>" +
      "<li><b>League Shield:</b> The team in 1st place after the league stage wins the shield.</li>" +
      "<li><b>Playoffs (IPL format):</b> Top 4 qualify. Qualifier 1: 1st vs 2nd (winner to the Final). Eliminator: 3rd vs 4th (loser out). Qualifier 2: loser of Q1 vs winner of the Eliminator. Final: winner of Q1 vs winner of Q2.</li>" +
      "<li><b>Results:</b> Both players confirm the score after full time and share a screenshot in the group chat. The admin enters the result on this site.</li>" +
      "<li><b>Disputes:</b> The league admin's decision is final.</li></ol></div>";
  }

  function pageAdmin() {
    if (isAdmin) {
      return "<div class='card'><h2>Admin</h2><p>You are logged in. Enter scores in <b>Fixtures</b> and pick winners in <b>Playoffs</b>. Everyone sees the changes.</p>" +
             "<button class='btn out' onclick='logout()'>Log out</button></div>";
    }
    return "<div class='card login'><h2>Admin login</h2><p class='legend'>Only the league admin can enter results.</p>" +
           "<input id='em' type='email' placeholder='Email' autocomplete='username'>" +
           "<input id='pw' type='password' placeholder='Password' autocomplete='current-password'>" +
           "<button class='btn' onclick='login()'>Log in</button></div>";
  }

  // =============== DRAW THE PAGE ===============
    let lastKey = "";
  let lastTicker = "";

  function renderTicker() {
    const played = buildFixtures().flat().filter(function (m) {
      const r = results[m.id];
      return r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "";
    }).slice(-10);
    let html;
    if (played.length === 0) {
      html = "<div class='tickmsg'>⚽ Season kicks off soon. Latest results will scroll here.</div>";
    } else {
      const items = played.map(function (m) {
        const r = results[m.id];
        return "<span class='tick'><b>" + teams[m.home] + "</b><em>" + r.h + " - " + r.a + "</em><b>" + teams[m.away] + "</b></span>";
      }).join("");
      html = "<div class='track'>" + items + items + "</div>";
    }
    if (html !== lastTicker) {
      document.getElementById("ticker").innerHTML = html;
      lastTicker = html;
    }
  }

  function render() {
    document.getElementById("nav").innerHTML = tabs.map(function (t) {
      const label = (t === "Admin" && isAdmin) ? "Admin ✓" : t;
      return "<button class='" + (t === currentTab ? "on" : "") + "' onclick=\"currentTab='" + t + "';render()\">" + label + "</button>";
    }).join("");
    const pages = { Standings: pageStandings, Fixtures: pageFixtures, Playoffs: pagePlayoffs, Squads: pageSquads, Rules: pageRules, Admin: pageAdmin };
    const app = document.getElementById("app");
    app.innerHTML = pages[currentTab]();

    // play the entrance animation only when the tab or round changes
    const key = currentTab + (currentTab === "Fixtures" ? currentRound : "");
    if (key !== lastKey) {
      app.classList.remove("enter");
      void app.offsetWidth;          // restarts the animation
      app.classList.add("enter");
      lastKey = key;
    }
    renderTicker();
  }

  // =============== START ===============
  async function start() {
    const s = await sb.auth.getSession();
    isAdmin = !!(s.data && s.data.session);
    render();
    loadData();
    // refresh every 30 seconds, but not while someone is typing
    setInterval(function () {
      const tag = document.activeElement ? document.activeElement.tagName : "";
      if (tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA") { loadData(); }
    }, 30000);
  }
  start();
    // =============== OPENING COUNTDOWN ===============
  (function () {
    const intro = document.getElementById("intro");
    let seen = false;
    try { seen = sessionStorage.getItem("introSeen") === "1"; } catch (e) {}
    if (seen) { intro.remove(); return; }

    const box = document.getElementById("count");
    const steps = ["3", "2", "1", "KICK OFF!"];
    let i = 0;

    function closeIntro() {
      intro.classList.add("hide");
      try { sessionStorage.setItem("introSeen", "1"); } catch (e) {}
      setTimeout(function () { intro.remove(); }, 900);
    }

    function show() {
      const last = (i === steps.length - 1);
      // a fresh element each time, so the animation restarts
      box.innerHTML = "<span class='" + (last ? "go" : "") + "'>" + steps[i] + "</span>";
      i++;
      if (i < steps.length) { setTimeout(show, 800); }
      else { setTimeout(closeIntro, 1300); }
    }

    intro.addEventListener("click", closeIntro);
    show();
  })();

</script>
</body>
</html>
