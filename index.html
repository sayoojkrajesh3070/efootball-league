/* ===================================================================
   eFOOTBALL FRIENDS LEAGUE  ·  PORTFOLIO THEME
   One light, editorial look. Fonts: Barlow Condensed (headings) + Barlow (text).
   =================================================================== */
:root {
  --bg:#e8edf7; --card:#ffffff; --line:#d3dbec; --text:#0a1030; --muted:#5b6585;
  --accent:#0c3ce0; --gold:#0c3ce0; --red:#d62839; --ink:#061046; --soft:#dfe6f5; --blue:#0c3ce0; --sky:#8fb6ff;
  --font-head:"League Gothic","Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --font-ui:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent; scroll-behavior:smooth; }
body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:16px; line-height:1.5; }
h1,h2,h3,h4,nav button,.rounds button,.score,.stat b,.ovc b { font-family:var(--font-head); }
h2,h3 { text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
.wrap { max-width:1040px; margin:0 auto; }
main { padding:26px 16px 64px; }

/* ---------- header ---------- */
header.brand { position:relative; overflow:hidden; background:var(--ink); color:#fff; padding:26px 16px 30px; border-bottom:5px solid var(--accent); }
header.brand::after { content:""; position:absolute; right:-110px; top:-120px; width:380px; height:380px; border:2px solid rgba(255,255,255,.1); border-radius:50%; }
.brand-row { position:relative; z-index:1; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
.brand-logo { flex:none; width:104px; }
.brand-svg { display:block; width:100%; height:auto; object-fit:contain; }
.brand-text { flex:1 1 280px; min-width:0; }
.brand-kicker { color:var(--accent); font:700 13px var(--font-head); letter-spacing:6px; text-transform:uppercase; }
.brand-title { font:800 clamp(46px,10vw,92px)/.9 var(--font-head); font-style:italic; text-transform:uppercase; letter-spacing:1px; }
.brand-title .seasonName { display:inline-block; vertical-align:middle; margin-left:12px; padding:5px 14px; border-radius:999px; background:#fff; color:var(--ink);
  font:700 15px var(--font-head); font-style:normal; letter-spacing:1px; transform:translateY(-6px); }
header.brand #subTitle { margin:10px 0 0; color:#b9bac4; font-size:14px; }
.brand-tools { position:relative; z-index:1; margin-left:auto; }
.sbar { display:inline-flex; align-items:center; gap:8px; color:#b9bac4; font:600 12px var(--font-head); letter-spacing:2px; text-transform:uppercase; }
.sbar select { width:auto; min-width:150px; background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:9px 14px; font:600 15px var(--font-body); letter-spacing:0; text-transform:none; }
.sbar select option, .sbar select optgroup { color:#101114; background:#fff; }

/* ---------- ticker ---------- */
.ticker { background:var(--accent); color:#fff; overflow:hidden; white-space:nowrap; padding:9px 0; }
.track { display:inline-block; animation:scroll 40s linear infinite; }
.ticker:hover .track { animation-play-state:paused; }
.tick { display:inline-block; margin:0 22px; font:600 15px var(--font-head); letter-spacing:.8px; text-transform:uppercase; color:rgba(255,255,255,.85); }
.tick b { color:#fff; }
.tick em { font-style:normal; background:var(--ink); color:#fff; padding:2px 9px; border-radius:4px; margin:0 6px; }
.tickmsg { padding:0 16px; font:600 15px var(--font-head); letter-spacing:.8px; text-transform:uppercase; }
@keyframes scroll { from { transform:translateX(0); } to { transform:translateX(-50%); } }

/* ---------- navigation ---------- */
nav { position:sticky; top:0; z-index:50; display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding:10px 14px; background:rgba(243,241,234,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
nav::-webkit-scrollbar { display:none; }
nav button { flex:none; background:none; border:0; color:var(--muted); font-size:16px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; padding:9px 16px; border-radius:999px; cursor:pointer; white-space:nowrap; }
nav button:hover { color:var(--text); background:var(--soft); }
nav button.on { background:var(--ink); color:#fff; }
nav button.inst { color:var(--accent); }

/* ---------- page title (01 / Standings) ---------- */
.ptitle { display:flex; align-items:flex-end; gap:14px; margin:0 0 22px; padding-bottom:14px; border-bottom:2px solid var(--ink); }
.ptitle span { font:600 15px var(--font-head); color:var(--accent); letter-spacing:3px; padding-bottom:10px; }
.ptitle h2 { margin:0; font:800 clamp(44px,9vw,84px)/.88 var(--font-head); font-style:italic; text-transform:uppercase; letter-spacing:0; }

/* ---------- cards ---------- */
.card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; margin-bottom:18px; transition:box-shadow .25s, transform .25s; }
.card:hover { box-shadow:0 14px 34px rgba(16,17,20,.08); }
.card h2,.card h3 { margin:0 0 12px; font-size:22px; }
.legend { color:var(--muted); font-size:13px; margin:4px 2px; }
.scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.status { color:var(--accent); font-size:13px; margin:0 0 10px; min-height:18px; font-weight:600; }

/* ---------- tables ---------- */
table { width:100%; border-collapse:collapse; min-width:520px; }
th { color:var(--muted); font:600 12px var(--font-head); text-transform:uppercase; letter-spacing:1.4px; }
th,td { padding:11px 8px; text-align:center; border-bottom:1px solid var(--line); }
th.left,td.left { text-align:left; }
table tr:last-child td { border-bottom:0; }
table tr:hover td { background:var(--bg); }
tr.top4 td:first-child { box-shadow:inset 4px 0 0 var(--accent); font-weight:700; }
td.pts { font:700 20px var(--font-head); }
.tl { color:var(--text); font-weight:700; cursor:pointer; text-decoration:none; border-bottom:2px solid transparent; }
.tl:hover { border-bottom-color:var(--accent); }

/* ---------- badges, form ---------- */
.badge { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; background:var(--soft); color:var(--ink); font:700 11px var(--font-head); margin-right:8px; vertical-align:middle; }
.badge.logo { background:transparent !important; border-radius:0; }
.badge img { width:100%; height:100%; object-fit:contain; display:block; }
.badge.big { width:64px; height:64px; font-size:22px; margin:0; }
.badge.big img { padding:3px; }
.form span { display:inline-block; width:21px; height:21px; line-height:21px; text-align:center; border-radius:5px; font:700 11px var(--font-body); margin-right:2px; color:#fff; }
.W { background:#16a34a; } .D { background:#8a8a93; } .L { background:var(--red); }
.mv { font-size:11px; margin-left:6px; font-weight:700; }
.mv.up { color:#16a34a; } .mv.down { color:var(--red); } .mv.same { color:var(--muted); }
.bdg { margin-left:5px; font-size:15px; cursor:help; display:inline-block; }
.gt { display:inline-block; margin-left:6px; padding:1px 8px; border-radius:999px; background:var(--ink); color:#fff; font-size:12px; font-weight:700; }
.pill { display:inline-block; min-width:30px; text-align:center; padding:2px 7px; border-radius:6px; font-size:12px; font-weight:700; color:#fff; }
.pill.D { background:#8a8a93; }

/* ---------- inputs & buttons ---------- */
input,select,textarea { font:inherit; color:var(--text); background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
input:focus,select:focus,textarea:focus { outline:2px solid var(--ink); outline-offset:1px; }
select { width:100%; }
.login input { display:block; width:100%; max-width:340px; margin-bottom:10px; }
.btn { background:var(--ink); color:#fff; border:0; border-radius:999px; padding:11px 22px; font:700 15px var(--font-head); letter-spacing:1.2px; text-transform:uppercase; cursor:pointer; transition:transform .15s, background .2s; }
.btn:hover { background:var(--accent); transform:translateY(-1px); }
.btn:active { transform:scale(.96); }
.btn.out { background:none; color:var(--text); border:1.5px solid var(--ink); }
.btn.out:hover { background:var(--ink); color:#fff; }
.back { margin-bottom:16px; }
.thead { display:none; }
.mfull { display:none; }

/* ---------- fixtures ---------- */
.rounds { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
.rounds button { background:#fff; border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:7px 14px; cursor:pointer; font-size:15px; font-weight:600; }
.rounds button:hover { border-color:var(--ink); color:var(--text); }
.rounds button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
.match { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; padding:13px 0; border-bottom:1px solid var(--line); }
.match:last-child { border-bottom:0; }
.match .h { text-align:right; } .match .a { text-align:left; }
.match input { width:48px; text-align:center; font-weight:700; padding:8px 4px; }
.score { min-width:72px; text-align:center; font-weight:700; font-size:22px; background:var(--ink); color:#fff; border-radius:10px; padding:3px 12px; letter-spacing:2px; }

/* ---------- playoffs ---------- */
.po { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:16px; }
.pocard { background:var(--card); border:1px solid var(--line); border-left-width:7px; border-radius:20px; padding:18px; transition:box-shadow .25s, transform .25s; }
.pocard:hover { box-shadow:0 14px 34px rgba(16,17,20,.1); transform:translateY(-2px); }
.pocard > b { font:700 22px var(--font-head); text-transform:uppercase; letter-spacing:.5px; }
.pocard small { color:var(--muted); display:block; margin-bottom:10px; }
.pocard .vs { font-weight:600; margin-bottom:10px; }
.champ { text-align:center; font:800 30px var(--font-head); text-transform:uppercase; font-style:italic; color:var(--ink); background:#8fb6ff; border-radius:20px; padding:24px; margin-top:18px; }
.shield { background:var(--ink); color:#8fb6ff; border-radius:16px; padding:14px 18px; margin-bottom:16px; font:700 18px var(--font-head); letter-spacing:1px; text-transform:uppercase; }

/* ---------- squads ---------- */
.sq { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
.sq .card { margin:0; }
.sq label { display:block; margin:10px 0 4px; font-weight:600; }
.sq input,.sq textarea { width:100%; }
.owner { color:var(--muted); margin:0 0 10px; }
.plist { margin:0; padding-left:24px; columns:2; font-size:15px; }
.plist li { margin-bottom:4px; }
li { margin-bottom:8px; }

/* ---------- featured hero (leaders / team page) ---------- */
.feat { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:space-between; gap:20px; min-height:260px; padding:28px; margin-bottom:18px; border-radius:28px; background:var(--ink); color:#fff; }
.feat::before { content:""; position:absolute; right:-80px; top:50%; width:420px; height:420px; transform:translateY(-50%); border-radius:50%; background:var(--accent); opacity:.95; }
.feat-txt { position:relative; z-index:1; min-width:0; }
.feat-txt small { display:block; color:#8fb6ff; font:700 13px var(--font-head); letter-spacing:4px; text-transform:uppercase; }
.feat-txt h2 { margin:6px 0 10px; font:800 clamp(38px,8vw,78px)/.9 var(--font-head); font-style:italic; text-transform:uppercase; letter-spacing:0; }
.feat-txt .legend { color:#d6d7de; font-size:15px; margin:0 0 16px; }
.feat-txt .btn { background:#fff; color:var(--ink); }
.feat-txt .btn:hover { background:#8fb6ff; }
.feat-txt .form { margin-top:6px; }
.feat-logo { position:relative; z-index:1; flex:none; display:flex; align-items:center; justify-content:center; width:168px; height:168px; border-radius:50%; background:#fff; }
.feat-logo .badge.big { width:132px; height:132px; font-size:40px; }
.strip { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:20px; }
.strip div { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 8px; text-align:center; }
.strip b { display:block; font:800 32px var(--font-head); color:var(--ink); }
.strip small { color:var(--muted); text-transform:uppercase; letter-spacing:1.2px; font-size:11px; font-weight:600; }

/* ---------- stats, awards, records, hall ---------- */
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:10px; margin-bottom:16px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; text-align:center; }
.stat b { display:block; font-size:26px; font-weight:800; }
.stat small { color:var(--muted); }
.two { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:18px; }
.tm { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
.tm span:nth-child(2) { flex:1; }
.awards,.recs,.hlgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
.hlgrid { margin-bottom:14px; }
.award,.rec,.hlbox,.hbox,.ovc,.chip,.mteam { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; transition:transform .2s, box-shadow .2s; }
.award:hover,.rec:hover,.hbox:hover,.chip:hover { transform:translateY(-3px); box-shadow:0 12px 28px rgba(16,17,20,.1); }
.award .ic,.rec .ic,.hlbox .ic { font-size:28px; }
.award b,.rec b { display:block; font:700 19px var(--font-head); text-transform:uppercase; letter-spacing:.5px; }
.award small,.rec small,.hlbox small,.hbox small { display:block; color:var(--muted); margin-bottom:6px; }
.award .none { color:var(--muted); font-size:13px; }
.hl { background:var(--ink); color:#fff; border-color:var(--ink); }
.hl .legend { color:#b9bac4; }
.hl .hlbox { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.14); }
.hl .hlbox small { color:#b9bac4; }
.hl h3 { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
.hlbox .t { font:700 18px var(--font-head); text-transform:uppercase; color:#8fb6ff; letter-spacing:.5px; }
.hlbox .m { margin-top:6px; font-size:15px; }
.tor { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
.chip { display:flex; align-items:center; gap:10px; padding:8px 16px 8px 8px; border-radius:999px; }
.hl .chip { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.16); }
.chip .badge { margin:0; background:#fff; }
.chip b { display:block; line-height:1.2; }
.chip small { color:var(--muted); font-size:12px; }
.hl .chip small { color:#b9bac4; }
.hall { border-color:var(--ink); }
.hall h2 { margin:0 0 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.tag { font:600 12px var(--font-body); padding:3px 11px; border-radius:999px; text-transform:none; letter-spacing:0; }
.tdone { background:#8fb6ff; color:var(--ink); }
.tlive { background:#16a34a; color:#fff; }
.hgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
.hbox { border-top:5px solid var(--accent); }
.hbox .ic { font-size:30px; }
.hbox .ht { font:700 18px var(--font-head); text-transform:uppercase; color:var(--accent); letter-spacing:.5px; }
.hbox .hm { font:700 24px/1.2 var(--font-head); margin-bottom:4px; }

/* ---------- golden boot ---------- */
.boot { display:grid; gap:10px; }
.brow { display:grid; grid-template-columns:34px 38px 1fr 48px; gap:10px; align-items:center; padding:11px 14px; background:var(--card); border:1px solid var(--line); border-radius:16px; position:relative; overflow:hidden; transition:transform .2s; }
.brow:hover { transform:translateY(-2px); }
.brow .fill { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg,rgba(229,32,46,.16),rgba(229,32,46,0)); z-index:0; transition:width .6s ease; }
.brow > *:not(.fill) { position:relative; z-index:1; }
.brow .rk { font:700 22px var(--font-head); color:var(--muted); text-align:center; }
.brow.first { border-color:var(--ink); border-width:2px; }
.brow .badge { margin:0; }
.brow small { display:block; color:var(--muted); }
.brow .g { font:800 28px var(--font-head); text-align:right; color:var(--accent); }

/* ---------- overview strip, progress ---------- */
.ov { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:18px; }
.ovc small { display:block; color:var(--muted); font-size:12px; }
.ovc b { display:block; font-size:24px; line-height:1.2; margin:2px 0; }
.pbar { height:6px; background:var(--soft); border-radius:99px; overflow:hidden; margin-top:6px; }
.pbar i { display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .9s ease; }
.info { background:none; border:1px solid var(--line); color:var(--muted); border-radius:50%; width:26px; height:26px; padding:0; cursor:pointer; font-size:13px; margin-left:6px; }
.info:hover { color:var(--accent); border-color:var(--accent); }

/* ---------- overlays ---------- */
.modal { position:fixed; inset:0; z-index:200; background:rgba(16,17,20,.55); display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn .25s ease both; }
.modalbox { background:var(--card); border-radius:22px; padding:24px; max-width:420px; width:100%; }
.modalbox h3 { margin:0 0 10px; }
.modalbox li { margin-bottom:8px; }
.ovl { position:fixed; inset:0; z-index:150; background:rgba(16,17,20,.55); display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .25s ease both; backdrop-filter:blur(3px); }
@media (min-width:640px) { .ovl { align-items:center; padding:20px; } }
.ovl.closing { animation:fadeOut .2s ease both; }
.ovp { background:var(--card); width:100%; max-width:580px; max-height:90vh; overflow:auto; border-radius:26px 26px 0 0; padding:22px; animation:sheetUp .35s cubic-bezier(.2,.9,.3,1.1) both; }
@media (min-width:640px) { .ovp { border-radius:26px; } }
.ovl.closing .ovp { animation:sheetDown .2s ease both; }
.ovx { float:right; background:none; border:1.5px solid var(--ink); color:var(--text); border-radius:50%; width:34px; height:34px; cursor:pointer; font-size:16px; }
.mscore { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; text-align:center; margin:14px 0; }
.mscore .t { font-weight:700; }
.mscore .s { font:800 52px/1 var(--font-head); letter-spacing:2px; }
.mteams { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
.mteam { text-align:center; background:var(--bg); }
.mteam .badge { margin:0 0 6px; }
.msec { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
.msec h4 { margin:0 0 6px; font:700 18px var(--font-head); text-transform:uppercase; letter-spacing:.8px; color:var(--accent); }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes fadeOut { from { opacity:1; } to { opacity:0; } }
@keyframes sheetUp { from { opacity:0; transform:translateY(40px) scale(.97); } to { opacity:1; transform:none; } }
@keyframes sheetDown { from { opacity:1; } to { opacity:0; transform:translateY(30px); } }

/* ---------- toast & loading ---------- */
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:300; background:var(--ink); color:#fff; padding:11px 20px; border-radius:999px; box-shadow:0 12px 30px rgba(0,0,0,.3); font-weight:600; animation:toastIn .3s ease both; }
.toast.err { background:var(--red); }
.toast.out { animation:toastOut .3s ease both; }
@keyframes toastIn { from { opacity:0; transform:translate(-50%,20px); } to { opacity:1; transform:translate(-50%,0); } }
@keyframes toastOut { from { opacity:1; transform:translate(-50%,0); } to { opacity:0; transform:translate(-50%,20px); } }
.skel { height:46px; border-radius:14px; margin-bottom:8px; background:linear-gradient(90deg,var(--soft) 25%,#fff 50%,var(--soft) 75%); background-size:200% 100%; animation:shimmer 1.2s linear infinite; }
@keyframes shimmer { from { background-position:200% 0; } to { background-position:-200% 0; } }
@keyframes pop { from { transform:scale(0); } to { transform:scale(1); } }
@keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

/* ---------- page transitions ---------- */
#app { view-transition-name:page; }
::view-transition-old(root),::view-transition-new(root) { animation:none; }
::view-transition-old(page) { animation:pgOut .16s ease both; }
::view-transition-new(page) { animation:pgIn .36s cubic-bezier(.22,.9,.3,1) both; }
@keyframes pgOut { to { opacity:0; transform:translateY(-6px); } }
@keyframes pgIn { from { opacity:0; transform:translateY(14px); } }
#app.enter > * { animation:fadeUp .4s ease both; }
html.vt #app.enter > * { animation:none; }
@media (prefers-reduced-motion:reduce) { *,::view-transition-group(*),::view-transition-old(*),::view-transition-new(*) { animation:none !important; transition:none !important; } }

/* ===================== MOBILE ===================== */
@media (max-width:700px) {
  main { padding:18px 12px calc(92px + env(safe-area-inset-bottom,0px)); }
  header.brand { padding:18px 14px 22px; padding-top:calc(18px + env(safe-area-inset-top,0px)); }
  .brand-logo { width:84px; } .brand-row { gap:12px; }
  .brand-text { flex:1 1 0; }
  .brand-kicker { letter-spacing:4px; font-size:11px; }
  .brand-title { font-size:46px; }
  .brand-title .seasonName { display:block; width:max-content; margin:8px 0 0; transform:none; }
  header.brand #subTitle { font-size:13px; }
  .brand-tools { width:100%; margin-left:0; } .sbar { width:100%; } .sbar select { flex:1; }
  .tick { font-size:14px; }
  nav { position:fixed; top:auto; bottom:0; left:0; right:0; z-index:60; gap:0; padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px)); background:rgba(255,255,255,.97);
    border-top:1px solid var(--line); box-shadow:0 -10px 28px rgba(16,17,20,.12); scroll-snap-type:x proximity; }
  nav button { min-height:48px; padding:10px 15px; font-size:15px; scroll-snap-align:center; }
  .toast { bottom:calc(86px + env(safe-area-inset-bottom,0px)); }
  .card { padding:15px; border-radius:18px; margin-bottom:14px; }
  input,select,textarea { font-size:16px; }
  .btn { min-height:46px; }
  .rounds { flex-wrap:nowrap; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .rounds button { flex:none; min-width:46px; min-height:42px; }
  .match { gap:6px; font-size:15px; } .match input { width:54px; height:46px; } .score { min-width:58px; }
  .po,.two,.sq { grid-template-columns:1fr; }
  .stats { grid-template-columns:repeat(3,1fr); }
  .plist { columns:1; }
  .feat { min-height:230px; padding:20px; border-radius:22px; }
  .feat::before { width:300px; height:300px; right:-90px; }
  .feat-txt { max-width:calc(100% - 92px); } .feat-txt h2 { font-size:clamp(32px,10.5vw,46px); }
  .feat-logo { width:84px; height:84px; } .feat-logo .badge.big { width:66px; height:66px; font-size:22px; }
  .strip b { font-size:26px; } .strip div { padding:10px 4px; }
  .ptitle h2 { font-size:clamp(40px,14vw,64px); }
  .brow { grid-template-columns:28px 36px 1fr 40px; gap:8px; padding:10px; }
  .modalbox,.ovp { max-height:86vh; overflow:auto; }
  .mfull { display:block; margin:0 0 10px auto; min-height:38px; padding:6px 16px; font-size:13px; }
  table.st { min-width:0; }
  table.st th,table.st td { padding:10px 4px; font-size:15px; }
  table.st th:nth-child(n+4):nth-child(-n+8),table.st td:nth-child(n+4):nth-child(-n+8) { display:none; }
  table.st td.left { white-space:normal; }
  table.st.full { min-width:540px; }
  table.st.full th:nth-child(n+4):nth-child(-n+8),table.st.full td:nth-child(n+4):nth-child(-n+8) { display:table-cell; }
}
@media (hover:none) { nav button:hover,.rounds button:hover,.btn:hover,.card:hover,.pocard:hover,.award:hover,.rec:hover,.hbox:hover,.chip:hover,.brow:hover { transform:none; box-shadow:none; } }

/* ===================== REFERENCE THEME: royal blue / white / navy ===================== */
body { background:linear-gradient(180deg,#f5f8fe 0,#e3e9f5 100%) fixed; }
h2,h3,h4 { font-weight:400; letter-spacing:.8px; }
.card h2,.card h3 { font-size:28px; }
.card { border-radius:6px; border-top:3px solid var(--blue); }
.pocard { border-radius:6px; }
.strip div,.stat,.award,.rec,.hlbox,.hbox,.ovc,.mteam,.brow { border-radius:6px; }
.chip { border-radius:999px; }
/* UI labels use the narrow label font */
nav button,th,.btn,.tick,.tickmsg,.rounds button,.sbar,.brand-kicker,.tag,.msec h4,.hbox .ht,.award b,.rec b,.pocard > b,.hlbox .t,.brand-title .seasonName,.shield,.ptitle span,.feat-txt small,.feat-num small,.strip small,.pill,.rk,.stat small { font-family:var(--font-ui); }
.pocard > b,.award b,.rec b,.hlbox .t,.hbox .ht,.msec h4 { font-weight:700; letter-spacing:1.5px; }
/* big display numbers & headlines: League Gothic */
.score,.stat b,.ovc b,.strip b,.mscore .s,.champ,td.pts,.brow .g,.hbox .hm,.brow .rk { font-family:var(--font-head); font-weight:400; font-style:normal; letter-spacing:1px; }
td.pts { font-size:24px; }
.score { font-size:26px; padding:3px 12px 1px; border-radius:4px; }

/* ===================================================================
   DARK RED THEME  ·  inspired by the Man United / ESPN style mockups
   Bebas Neue headings + Montserrat text. Drop a player cutout into
   --hero-img (below) to get the big hero image.
   =================================================================== */
:root {
  --bg:#0b0b0e; --card:#15151a; --line:#26262d; --text:#f4f4f6; --muted:#8c8c97;
  --accent:#c1121f; --gold:#f5b301; --red:#c1121f; --ink:#0b0b0e; --soft:#1e1e25; --blue:#e11d2e; --sky:#f5b301;
  --font-head:"Bebas Neue","League Gothic","Arial Narrow",Impact,sans-serif;
  --font-ui:"Montserrat","Barlow",system-ui,sans-serif;
  --font-body:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --hero-img:none;
}
body { background:var(--bg); font-size:15px; }
h1,h2,h3,h4,.score,.stat b,.ovc b,.strip b,td.pts,.champ { font-style:normal !important; font-weight:400 !important; letter-spacing:.5px; }
header.brand { background:#0b0b0e; border-bottom:1px solid var(--line); }
header.brand::after { border-color:rgba(193,18,31,.35); }
.brand-kicker { color:var(--gold); letter-spacing:5px; font-weight:600; }
.brand-title { font:400 clamp(52px,10vw,96px)/.9 var(--font-head) !important; font-style:normal !important; letter-spacing:1px; }
.brand-title .seasonName { background:var(--accent); color:#fff; border-radius:4px; font:600 13px var(--font-ui); letter-spacing:2px; }
.ticker { background:var(--accent); }
.tick em { background:#0b0b0e; }
nav { background:rgba(11,11,14,.92); border-bottom:1px solid var(--line); }
nav button { font:600 12px var(--font-ui); letter-spacing:1.6px; color:var(--muted); border-radius:4px; }
nav button:hover { color:#fff; background:var(--soft); }
nav button.on { background:var(--accent); color:#fff; }
nav button.inst { color:var(--gold); }
.ptitle { border-bottom:1px solid var(--line); }
.ptitle span { color:var(--gold); font:600 13px var(--font-ui); }
.ptitle h2 { font:400 clamp(48px,9vw,88px)/.9 var(--font-head) !important; font-style:normal !important; color:#fff; }
.card,.pocard,.strip div,.stat,.award,.rec,.hbox,.hlbox,.ovc,.mteam,.brow { background:var(--card); border-color:var(--line); color:var(--text); border-radius:8px; }
.card:hover,.pocard:hover { box-shadow:0 14px 34px rgba(0,0,0,.5); }
th { color:var(--muted); font-family:var(--font-ui); }
table tr:hover td { background:var(--soft); }
tr.top4 td:first-child { box-shadow:inset 4px 0 0 var(--accent); }
tr.top4 td { background:rgba(193,18,31,.12); }
.tl { color:#fff; }
.badge { background:var(--soft); color:#fff; }
.rounds button { background:var(--card); border-color:var(--line); color:var(--muted); border-radius:4px; }
.rounds button:hover { border-color:var(--accent); color:#fff; }
.rounds button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.score { background:var(--accent); border-radius:4px; }
.btn { background:var(--accent); color:#fff; border-radius:4px; }
.btn.out { background:transparent; color:#fff; border:1px solid var(--line); }
.btn.out:hover { background:var(--accent); }
input,select,textarea { background:var(--soft); color:#fff; border:1px solid var(--line); }
.legend,.owner { color:var(--muted); }
.status { color:var(--gold); }
.shield { background:var(--accent); color:#fff; border-radius:8px; }
.champ { background:var(--accent); color:#fff; border-radius:8px; }
.strip b { color:#fff; }
.modal { background:rgba(0,0,0,.75); }
.modalbox,.ovp { background:var(--card); color:var(--text); }

/* hero: red panel, giant faded numeral, ring + optional player cutout */
.feat { background:linear-gradient(120deg,#8e0d16,#c1121f 55%,#7a0a12); border-radius:6px; min-height:300px; }
.feat::before { right:-60px; width:440px; height:440px; background:transparent; border:2px solid rgba(255,255,255,.14); opacity:1; }
.feat::after { content:""; position:absolute; right:4%; bottom:0; width:42%; height:100%; background:var(--hero-img) no-repeat right bottom/contain; z-index:0; }
.feat-txt small { color:var(--gold); font:600 12px var(--font-ui); letter-spacing:3px; }
.feat-txt h2 { font:400 clamp(52px,9vw,96px)/.88 var(--font-head) !important; font-style:normal !important; }
.feat-txt .btn { background:#0b0b0e; color:#fff; }
.feat-txt .btn:hover { background:var(--gold); color:#0b0b0e; }
.feat-logo { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); }
.feat-logo .badge.big { background:#fff; color:#0b0b0e; }
.feat-num b { text-shadow:0 8px 40px rgba(0,0,0,.35); }
.feat-num small { color:var(--gold); }

/* home page */
body.home nav { display:none; }
.homefeat { min-height:340px; }
.nextbar { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:16px 20px; margin-bottom:18px; }
.nextbar small { color:var(--gold); font:600 11px var(--font-ui); letter-spacing:2px; text-transform:uppercase; }
.nextbar .nm { display:flex; align-items:center; gap:14px; font:400 28px var(--font-head); letter-spacing:.5px; text-transform:uppercase; flex-wrap:wrap; }
.nextbar .vsx { color:var(--accent); font-size:18px; }
.homegrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:8px; }
.tile { text-align:left; cursor:pointer; background:var(--card); color:#fff; border:1px solid var(--line); border-radius:6px; padding:16px; transition:background .2s, border-color .2s, transform .2s; }
.tile:hover { background:var(--accent); border-color:var(--accent); transform:translateY(-2px); }
.tile span { display:block; color:var(--gold); font:600 11px var(--font-ui); letter-spacing:2px; }
.tile b { display:block; font:400 26px var(--font-head); text-transform:uppercase; letter-spacing:.5px; margin:4px 0 2px; }
.tile small { color:var(--muted); font-size:12px; }
.tile:hover small { color:#fff; }

/* ===================================================================
   MOBILE OPTIMISATION  (placed last so it wins over the theme above)
   =================================================================== */
body { overflow-x:clip; }
button,.tile,.tl,nav button,.rounds button { touch-action:manipulation; }
@media (max-width:700px) {
  body { font-size:14px; }
  main { padding:16px max(12px,env(safe-area-inset-left)) calc(86px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right)); }
  /* header: compact */
  header.brand { padding:calc(14px + env(safe-area-inset-top,0px)) 14px 16px; }
  .brand-logo { width:72px; }
  .brand-title { font-size:clamp(44px,15vw,64px) !important; }
  header.brand #subTitle { font-size:12px; margin-top:6px; }
  .brand-kicker { font-size:10px; letter-spacing:3px; }
  /* bottom tab bar */
  nav { background:rgba(11,11,14,.97); border-top:1px solid var(--line); border-bottom:0; box-shadow:0 -8px 24px rgba(0,0,0,.5); padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px)); }
  nav button { min-height:46px; font-size:12px; padding:10px 14px; }
  nav button.on { box-shadow:inset 0 -3px 0 var(--gold); }
  /* page titles and heroes */
  .ptitle { margin-bottom:16px; padding-bottom:10px; }
  .ptitle h2 { font-size:clamp(44px,15vw,64px) !important; }
  .feat { min-height:210px; padding:18px; }
  .homefeat { min-height:250px; }
  .feat-txt h2 { font-size:clamp(38px,12vw,56px) !important; }
  .feat-num b { font-size:clamp(76px,24vw,110px); }
  .feat::after { width:55%; opacity:.9; }
  /* home page */
  .nextbar { padding:14px; gap:10px; }
  .nextbar .nm { font-size:22px; gap:8px; width:100%; }
  .nextbar .btn { width:100%; }
  .strip { grid-template-columns:repeat(2,1fr); }
  .strip b { font-size:32px; }
  .homegrid { grid-template-columns:1fr; }
  .tiles { grid-template-columns:repeat(2,1fr); }
  .tile { padding:14px 12px; min-height:92px; }
  .tile b { font-size:23px; }
  .tile:active { background:var(--accent); border-color:var(--accent); }
  /* tables, fixtures, cards */
  .card { padding:14px; }
  table.st th,table.st td { padding:11px 3px; font-size:14px; }
  .match { font-size:14px; padding:12px 0; }
  .score { font-size:20px; min-width:56px; }
  .btn { min-height:46px; }
  .modalbox,.ovp { max-height:86dvh; }
  .modal { padding:12px; align-items:flex-end; }
  .modalbox { width:100%; max-width:none; border-radius:14px 14px 8px 8px; padding-bottom:calc(20px + env(safe-area-inset-bottom,0px)); }
  .ticker { padding:8px 0; }
}
@media (max-width:360px) {
  .tiles { grid-template-columns:1fr 1fr; gap:8px; }
  .brand-title { font-size:42px !important; }
  nav button { padding:10px 11px; }
}

/* trophies, intro pop-up, recap */
.champ { margin:0 0 18px; }
.cabinet { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.trophy { text-align:center; padding:16px 10px; border-radius:8px; background:var(--soft); border:1px solid var(--line); }
.trophy .ti { display:block; font-size:38px; line-height:1.1; }
.trophy b { display:block; font:400 20px var(--font-head); text-transform:uppercase; letter-spacing:.5px; margin-top:4px; }
.trophy small { display:block; color:var(--muted); font-size:11px; }
.trophy .stars { color:var(--gold); letter-spacing:2px; margin-top:6px; font-size:13px; }
.trophy.s5 { background:linear-gradient(160deg,#8e0d16,#c1121f); border-color:var(--gold); grid-column:span 2; }
.trophy.s5 .ti { font-size:54px; } .trophy.s5 small { color:#ffd9dc; }
.trophy.s3 { border-color:var(--gold); } .trophy.s2 { border-color:#9a7a1a; }
.intro { position:fixed; inset:0; z-index:300; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px; background:rgba(5,5,8,.94); perspective:1000px; overflow:hidden; animation:iFade .3s both; }
.intro.out { opacity:0; transition:opacity .35s; }
.ilead { text-align:center; transform-style:preserve-3d; animation:iPop 1s cubic-bezier(.2,.9,.3,1.15) both; }
.ibadge { width:120px; height:120px; margin:0 auto 12px; border-radius:50%; background:#fff; color:#0b0b0e; display:flex; align-items:center; justify-content:center; font:400 46px var(--font-head); box-shadow:0 0 0 6px var(--accent),0 20px 60px rgba(193,18,31,.5); }
.ilead small { color:var(--gold); font:600 12px var(--font-ui); letter-spacing:3px; text-transform:uppercase; }
.ilead h2 { margin:6px 0 14px; font:400 clamp(44px,12vw,84px)/.95 var(--font-head); color:#fff; text-transform:uppercase; }
.istats { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.istats div { min-width:58px; padding:8px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); }
.istats b { display:block; font:400 26px var(--font-head); color:#fff; } .istats i { font:600 10px var(--font-ui); font-style:normal; letter-spacing:1.5px; color:var(--muted); }
.irest { display:none; width:100%; max-width:460px; flex-direction:column; gap:6px; perspective:900px; }
.intro.p2 .irest { display:flex; }
.intro.p2 .ilead { animation:iShrink .6s both; margin-bottom:-30px; }
.intro.p2 .ibadge { width:70px; height:70px; font-size:26px; } .intro.p2 .istats { display:none; }
.irow { display:grid; grid-template-columns:34px 1fr auto auto; gap:10px; align-items:center; padding:9px 12px; background:var(--card); border:1px solid var(--line); border-radius:6px; transform-origin:top; animation:iRow .5s both; }
.irow span { font:400 16px var(--font-head); color:var(--gold); } .irow b { color:#fff; font-size:14px; } .irow small,.irow em { color:var(--muted); font-size:11px; font-style:normal; }
.iskip { position:absolute; bottom:calc(14px + env(safe-area-inset-bottom,0px)); color:var(--muted); font-size:11px; letter-spacing:2px; text-transform:uppercase; }
.cf { position:absolute; top:-20px; width:8px; height:14px; animation:cfall linear both; }
@keyframes iFade { from { opacity:0; } to { opacity:1; } }
@keyframes iPop { from { opacity:0; transform:translateZ(-400px) rotateY(-100deg) rotateX(25deg) scale(.3); } to { opacity:1; transform:none; } }
@keyframes iShrink { to { transform:translateY(-4vh) scale(.62); } }
@keyframes iRow { from { opacity:0; transform:rotateX(-80deg) translateY(-14px); } to { opacity:1; transform:none; } }
@keyframes cfall { to { transform:translateY(112vh) rotate(720deg); } }

/* hall of fame bars, home logos */
.hb { position:relative; overflow:hidden; display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:center; padding:10px 12px; margin-bottom:6px; background:var(--card); border:1px solid var(--line); border-radius:6px; }

  .feat.half { padding:12px; min-height:130px; flex-direction:column; align-items:flex-start; justify-content:space-between; }
  .feat.half .feat-txt { max-width:none; } .feat.half .feat-txt h2 { font-size:clamp(22px,6.5vw,30px) !important; }

/* =====================================================================
   3D EFFECTS  (tilt cards, flip cards, shield, page depth, podium,
   goal celebration, animated table, three.js stage, 3D pitch)
   Everything here is additive. Reduced-motion users get no animation.
   ===================================================================== */

/* ---------- 1. tilt cards ---------- */
.fx-t { transition:transform .5s cubic-bezier(.2,.9,.3,1), box-shadow .3s; transform-style:flat; }
.fx-t:not(.fx-rest) { transition:transform .12s ease-out, box-shadow .3s; will-change:transform; }
.card.fx-t { position:relative; }
.card.fx-t::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0; transition:opacity .25s;
  background:radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.22), rgba(255,255,255,0) 58%); }
.card.fx-t.fx-on::after { opacity:1; }
.fx-t.fx-on { box-shadow:0 18px 36px rgba(6,16,70,.18); }

/* ---------- 2. flip card (player card popup) ---------- */
.fx-flip { perspective:900px; width:230px; max-width:100%; margin:6px auto 8px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.fx-flip-in { display:grid; transform-style:preserve-3d; transition:transform .75s cubic-bezier(.2,.9,.3,1.08); animation:fxFlipIn .95s cubic-bezier(.2,.9,.3,1.08) backwards; }
.fx-flip.flipped .fx-flip-in { transform:rotateY(180deg); }
.fx-face { grid-area:1/1; -webkit-backface-visibility:hidden; backface-visibility:hidden; }
.fx-back { transform:rotateY(180deg); border-radius:16px; padding:16px 14px; text-align:left; color:#fff; font-size:13px; line-height:1.35;
  display:flex; flex-direction:column; justify-content:center; gap:6px; box-shadow:0 12px 28px rgba(6,16,70,.35);
  background:linear-gradient(160deg,#061046,#0c3ce0); border:1px solid rgba(255,255,255,.18); }
.fx-back b.fx-bt { font:400 26px/1 var(--font-head); text-transform:uppercase; letter-spacing:.5px; }
.fx-back small { color:#b9c6f5; display:block; margin-bottom:4px; }
.fx-back div { border-top:1px solid rgba(255,255,255,.14); padding-top:5px; }
.fx-hint { text-align:center; margin:0 0 12px; }
@keyframes fxFlipIn { from { transform:rotateY(-180deg) scale(.55); opacity:0; } to { transform:rotateY(0) scale(1); opacity:1; } }

/* ---------- 3. header shield ---------- */
.brand-logo { position:relative; perspective:700px; cursor:pointer; }
.brand-logo::before { content:""; position:absolute; left:50%; top:50%; width:160%; height:160%; transform:translate(-50%,-50%); pointer-events:none;
  background:radial-gradient(circle at 35% 50%, rgba(60,120,255,.34), rgba(60,120,255,0) 58%), radial-gradient(circle at 65% 50%, rgba(255,50,60,.30), rgba(255,50,60,0) 58%); animation:fxGlow 3.4s ease-in-out infinite; }
.brand-svg { position:relative; transform-style:preserve-3d; animation:fxShield 7s ease-in-out infinite;
  filter:drop-shadow(0 10px 12px rgba(0,0,0,.5)) drop-shadow(0 0 10px rgba(70,130,255,.45)) drop-shadow(0 0 12px rgba(255,60,70,.30)); }
.brand-logo.fx-spin .brand-svg { animation:fxSpin 1.1s cubic-bezier(.3,.8,.3,1) both; }
@keyframes fxShield { 0%,100% { transform:rotateY(-22deg) rotateX(4deg) translateY(0); } 50% { transform:rotateY(22deg) rotateX(-3deg) translateY(-5px); } }
@keyframes fxSpin { from { transform:rotateY(0) scale(1); } 50% { transform:rotateY(540deg) scale(1.15); } to { transform:rotateY(1080deg) scale(1); } }
@keyframes fxGlow { 0%,100% { opacity:.55; } 50% { opacity:1; } }

/* ---------- 4. page transitions with depth ---------- */
::view-transition-old(page) { animation:fxPgOut .22s ease both; transform-origin:50% 0; }
::view-transition-new(page) { animation:fxPgIn .55s cubic-bezier(.22,.9,.3,1) both; transform-origin:50% 0; }
#app.fx-pg { animation:fxPgIn .55s cubic-bezier(.22,.9,.3,1) backwards; transform-origin:50% 0; }
@keyframes fxPgOut { to { opacity:0; transform:perspective(900px) translateZ(-90px) rotateX(5deg) translateY(-10px); } }
@keyframes fxPgIn { from { opacity:0; transform:perspective(900px) translateZ(-140px) rotateX(-8deg) translateY(26px); } }

/* ---------- 5. podium for the top three ---------- */
.fx-podium { display:flex; align-items:flex-end; justify-content:center; gap:22px; margin:0 0 18px; padding:20px 14px 0; border-radius:20px; overflow:hidden;
  perspective:900px; background:linear-gradient(180deg,#061046,#0c2a9a); }

.fxp-team { text-align:center; color:#fff; cursor:pointer; padding-bottom:12px; max-width:100%; animation:fxDrop .6s ease var(--d2,0s) backwards; }
.fxp-team .badge { margin:0 auto 4px; }
.fxp-team b { display:block; font:400 clamp(15px,4.1vw,24px)/1.05 var(--font-head); text-transform:uppercase; letter-spacing:.3px; overflow-wrap:break-word; }
.fxp-team small { display:block; color:#b9c6f5; font-size:12px; margin-top:2px; }
.fxp-crown { display:block; font-style:normal; font-size:30px; line-height:1; transform-style:preserve-3d; animation:fxCrown 3.2s ease-in-out infinite; }
.fxp-block { position:relative; width:100%; height:var(--h); display:flex; justify-content:center; background:var(--front);
  animation:fxRise .9s cubic-bezier(.2,.9,.25,1.05) var(--d,0s) backwards; }
.fxp-block > span { margin-top:10px; font:400 clamp(40px,10vw,64px)/1 var(--font-head); color:rgba(0,0,0,.3); }
.fxp-block::before { content:""; position:absolute; left:0; right:0; top:-14px; height:14px; background:var(--top); transform:skewX(-45deg); transform-origin:0 100%; }
.fxp-block::after { content:""; position:absolute; right:-14px; top:0; width:14px; height:100%; background:var(--side); transform:skewY(-45deg); transform-origin:0 0; }
.fxp-col.p1 { --h:150px; --d:.6s; --d2:1.2s; --front:linear-gradient(180deg,#ffd75e,#d99a00); --top:#fff0a8; --side:#a87400; }
.fxp-col.p2 { --h:112px; --d:.3s; --d2:.9s; --front:linear-gradient(180deg,#d6dce8,#8d98aa); --top:#f1f4f9; --side:#667283; }
.fxp-col.p3 { --h:84px;  --d:.1s; --d2:.7s; --front:linear-gradient(180deg,#e0a56d,#9b5f31); --top:#f3c697; --side:#704220; }
.fxp-col.p1 .fxp-block { filter:drop-shadow(0 0 16px rgba(255,200,40,.55)); }
@keyframes fxRise { from { height:0; } }
@keyframes fxDrop { from { opacity:0; transform:translateY(-26px) rotateX(40deg); } }
@keyframes fxCrown { 0%,100% { transform:rotateY(-35deg) translateY(0); } 50% { transform:rotateY(35deg) translateY(-4px); } }
@media (max-width:480px) {
  .fx-podium { gap:16px; padding:16px 10px 0; }
  .fxp-col.p1 { --h:120px; } .fxp-col.p2 { --h:90px; } .fxp-col.p3 { --h:66px; }
}
#app.fx-same .fx-podium *, #app.fx-same .fx-podium { animation:none !important; }

/* ---------- 6. goal celebration ---------- */
.fxg { position:fixed; inset:0; z-index:400; pointer-events:none; display:flex; flex-direction:column; align-items:center; justify-content:center; perspective:800px; overflow:hidden; }
.fxg-ball { font-size:110px; line-height:1; filter:drop-shadow(0 14px 18px rgba(0,0,0,.45)); animation:fxBall 2.8s cubic-bezier(.2,.9,.3,1) both; }
.fxg-card { margin-top:8px; text-align:center; color:#fff; background:rgba(6,16,70,.92); border:1px solid rgba(255,255,255,.25); border-radius:16px; padding:12px 22px;
  box-shadow:0 18px 40px rgba(0,0,0,.4); animation:fxGoalTxt 2.8s ease both; max-width:88vw; }
.fxg-card small { display:block; color:#8fb6ff; font:600 12px var(--font-head); letter-spacing:3px; text-transform:uppercase; }
.fxg-card b { display:block; font:400 clamp(26px,7vw,40px)/1.05 var(--font-head); text-transform:uppercase; letter-spacing:.5px; }
.fxg-card em { display:block; font-style:normal; color:#b9c6f5; font-size:12px; margin-top:2px; }
.fxg i { position:absolute; top:-4vh; width:9px; height:15px; border-radius:2px; transform-style:preserve-3d; animation:fxFall var(--t,2.4s) ease-in var(--dl,0s) both; }
@keyframes fxBall { 0% { transform:translateZ(-700px) rotateY(0) scale(.2); opacity:0; } 35% { opacity:1; }
  60% { transform:translateZ(0) rotateY(720deg) scale(1.18); } 100% { transform:translateZ(0) rotateY(1080deg) scale(1); opacity:1; } }
@keyframes fxGoalTxt { 0%,25% { opacity:0; transform:translateY(24px) rotateX(-50deg); } 45%,85% { opacity:1; transform:none; } 100% { opacity:0; transform:translateY(-10px); } }
@keyframes fxFall { 0% { transform:translate3d(0,0,0) rotateX(0) rotateY(0); opacity:1; } 100% { transform:translate3d(var(--dx,0),112vh,0) rotateX(720deg) rotateY(540deg); opacity:.9; } }

/* ---------- 7. animated league table: moved-row glow is done in JS (WAAPI) ---------- */
table.st td { position:relative; }

/* ---------- 8. three.js trophy / ball stage ---------- */
.fx-stage { position:relative; height:230px; margin:0 0 18px; border-radius:20px; overflow:hidden; border:1px solid rgba(255,255,255,.12);
  background:radial-gradient(ellipse at 50% 30%, #1b45e8 0%, #0a1f8f 45%, #061046 100%); box-shadow:0 14px 34px rgba(6,16,70,.25); }
.fx-stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:pan-y; cursor:grab; }
.fxs-top { position:absolute; left:14px; right:12px; top:12px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; color:#fff; }
.fxs-top small { display:block; color:#8fb6ff; font:600 12px var(--font-head); letter-spacing:3px; text-transform:uppercase; }
.fxs-top b { display:block; font:400 clamp(22px,5vw,30px)/1 var(--font-head); text-transform:uppercase; letter-spacing:.5px; }
.fxs-btns { display:flex; gap:6px; pointer-events:auto; }
.fxs-btns button { width:38px; height:38px; border-radius:50%; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.1); color:#fff; font-size:18px; cursor:pointer; }
.fxs-btns button.on { background:#fff; }
.fxs-hint { position:absolute; left:0; right:0; bottom:8px; text-align:center; color:rgba(255,255,255,.55); font-size:11px; letter-spacing:2px; text-transform:uppercase; pointer-events:none; }
@media (max-width:480px) { .fx-stage { height:200px; } }

/* ---------- 9. 3D pitch / line-up ---------- */
.fxp-ctl { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin:2px 0 6px; }
.fxp-ctl label { display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
.fxp-ctl input[type=range] { width:120px; padding:0; }
.fx-pw { --tilt:52deg; position:relative; max-width:440px; margin:0 auto; perspective:1000px; }
.fx-pitch { position:absolute; left:0; right:0; top:50%; aspect-ratio:3/4; transform:translateY(-50%) rotateX(var(--tilt)); transform-style:preserve-3d; border-radius:6px;
  background:repeating-linear-gradient(0deg,#2d9a4d 0 11.11%,#37ae5b 11.11% 22.22%); box-shadow:0 36px 44px rgba(0,0,0,.35), 0 0 0 4px #1f7a3b; }
.fx-pitch .ln { position:absolute; border:2px solid rgba(255,255,255,.85); pointer-events:none; }
.fx-pitch .l-out { inset:3%; }
.fx-pitch .l-mid { left:3%; right:3%; top:50%; height:0; border-width:2px 0 0; }
.fx-pitch .l-cc { left:38%; width:24%; top:calc(50% - 9%); aspect-ratio:1; border-radius:50%; }
.fx-pitch .l-pt { left:22%; width:56%; top:3%; height:15%; }
.fx-pitch .l-pb { left:22%; width:56%; bottom:3%; height:15%; }
.fx-pitch .l-st { left:36%; width:28%; top:3%; height:6%; }
.fx-pitch .l-sb { left:36%; width:28%; bottom:3%; height:6%; }
.fx-pl { position:absolute; width:0; height:0; transform-style:preserve-3d; }
.fx-pl > div { position:absolute; left:0; bottom:0; transform:translate(-50%,0) rotateX(calc(var(--tilt) * -1)); transform-origin:50% 100%; display:flex; flex-direction:column; align-items:center; animation:fxPlIn .6s cubic-bezier(.2,.9,.3,1.2) var(--pd,0s) backwards; }
.fx-pl .c { position:relative; width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#fff; color:#061046;
  font:700 11px var(--font-body); border:3px solid var(--ring,#0c3ce0); box-shadow:0 6px 10px rgba(0,0,0,.35); }
.fx-pl.GK .c { background:#ffd23f; --ring:#a87400; }
.fx-pl.DEF { --ring:#0c3ce0; } .fx-pl.MID { --ring:#0b9c8a; } .fx-pl.FWD { --ring:#d62839; }
.fx-pl .g { position:absolute; right:-9px; top:-8px; background:#061046; color:#fff; border-radius:9px; font:700 9px var(--font-body); padding:1px 4px; }
.fx-pl .n { margin-top:3px; max-width:78px; padding:1px 6px; border-radius:8px; background:rgba(6,16,70,.85); color:#fff; font:600 10px/1.3 var(--font-body); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@keyframes fxPlIn { from { opacity:0; transform:translate(-50%,-60px) rotateX(calc(var(--tilt) * -1)); } }
@media (max-width:480px) { .fx-pl .c { width:30px; height:30px; font-size:10px; } .fx-pl .n { font-size:9px; max-width:64px; } }

/* motion-sensitive users: no continuous 3D motion */
@media (prefers-reduced-motion:reduce) {
  .brand-svg, .brand-logo::before, .fxp-crown { animation:none !important; }
  .fx-t { transition:none !important; transform:none !important; }
}
</style>

<script id="fx3d">
/* =====================================================================
   3D EFFECTS  ·  additive layer. Reads the site's globals at run time
   (currentTab, results, teams, squads ...) and never edits site data.
   ===================================================================== */
(function () {
  "use strict";
  var app = document.getElementById("app");
  if (!app) { return; }
  var calm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  function G(fn, fallback) { try { return fn(); } catch (e) { return fallback; } }

  // ------------------------------------------------------------------
  // 5. PODIUM (called from pageStandings)
  // ------------------------------------------------------------------
  window.fxPodium = function (rows) {
    try {
      if (!rows || rows.length < 3 || !rows[0].played) { return ""; }
      var order = [1, 0, 2], cls = ["p2", "p1", "p3"];
      return "<div class='fx-podium' aria-label='Top three teams'>" + order.map(function (idx, k) {
        var r = rows[idx], gd = r.gf - r.ga;
        return "<div class='fxp-col " + cls[k] + "'><div class='fxp-team' onclick=\"openTeam('" + r.code + "')\">" +
          (idx === 0 ? "<i class='fxp-crown'>👑</i>" : "") +
          "<span class='badge'>" + esc(initials(r.name)) + "</span><b>" + esc(r.name) + "</b>" +
          "<small>" + r.points + " pts · GD " + (gd > 0 ? "+" + gd : gd) + "</small></div>" +
          "<div class='fxp-block'><span>" + (idx + 1) + "</span></div></div>";
      }).join("") + "</div>";
    } catch (e) { return ""; }
  };

  // ------------------------------------------------------------------
  // 1. TILT CARDS (mouse hover, touch press-and-hold)
  // ------------------------------------------------------------------
  var TILT_SEL = ".card:not(.scroll):not(.hall):not(.login), .pcard, .hlbox, .award, .ovc, .trophy, .stat, .mteam, .tile";
  function markTilt(root) {
    root.querySelectorAll(TILT_SEL).forEach(function (el) {
      if (el.getAttribute("data-fxt")) { return; }
      el.setAttribute("data-fxt", "1");
      if (el.querySelector("input,select,textarea,table") || el.closest(".ovl,.modal,.intro,.fx-stage,.fx-flip")) { return; }
      el.classList.add("fx-t", "fx-rest");
    });
  }
  var curEl = null, lastEv = null, raf = 0, holdTimer = 0, touchEl = null;
  function tiltTo(el, e) {
    var r = el.getBoundingClientRect();
    if (!r.width || !r.height) { return; }
    var px = (e.clientX - r.left) / r.width - 0.5, py = (e.clientY - r.top) / r.height - 0.5;
    var big = r.width > 380 || r.height > 260, max = big ? 3.5 : 9;
    el.classList.remove("fx-rest"); el.classList.add("fx-on");
    el.style.setProperty("--mx", ((px + 0.5) * 100).toFixed(1) + "%");
    el.style.setProperty("--my", ((py + 0.5) * 100).toFixed(1) + "%");
    el.style.transform = "perspective(900px)" + (el.classList.contains("pcard") ? " translateY(-5px)" : "") +
      " rotateX(" + (-py * 2 * max).toFixed(2) + "deg) rotateY(" + (px * 2 * max).toFixed(2) + "deg) scale(" + (big ? 1.004 : 1.03) + ")";
  }

    function find(code) { return table.find(function (row) { return row.code === code; }); }

    for (const m of getPlayedMatches()) {

      home.played++; away.played++;

      if (m.homeGoals > m.awayGoals) { home.won++; away.lost++; home.points += 3; home.form.push("W"); away.form.push("L"); }

    }

    // =============== AWARDS AND BADGES ===============
  function computeBadges(rows) {
    const out = {};
    rows.forEach(function (r) { out[r.code] = []; });
    function add(code, icon, name, why) { out[code].push({ icon: icon, name: name, why: why }); }

    // streaks, from each team's results in match order
    rows.forEach(function (r) {
      let wins = 0;
      for (let i = r.form.length - 1; i >= 0 && r.form[i] === "W"; i--) { wins++; }
      let unbeaten = 0;
      for (let i = r.form.length - 1; i >= 0 && r.form[i] !== "L"; i--) { unbeaten++; }
      if (wins >= 3) { add(r.code, "🔥", "On Fire", wins + " wins in a row"); }
      if (unbeaten >= 5) { add(r.code, "🎯", "Unbeaten", unbeaten + " matches unbeaten"); }
    });

    // best defence and top scorers (teams with at least 3 matches played)
    const enough = rows.filter(function (r) { return r.played >= 3; });
    if (enough.length) {
      const minGA = Math.min.apply(null, enough.map(function (r) { return r.ga; }));
      enough.filter(function (r) { return r.ga === minGA; })
            .forEach(function (r) { add(r.code, "🧱", "Best Defence", r.ga + " goals conceded"); });
      const maxGF = Math.max.apply(null, enough.map(function (r) { return r.gf; }));
      if (maxGF > 0) {
        enough.filter(function (r) { return r.gf === maxGF; })
              .forEach(function (r) { add(r.code, "⚡", "Top Scorers", r.gf + " goals scored"); });
      }
    }

    // giant killer: beat the team that is top of the table right now
    const leader = rows[0];
    if (leader && leader.played >= 3) {
      const killers = {};
      getPlayedMatches().forEach(function (m) {
        if (m.home === leader.code && m.awayGoals > m.homeGoals) { killers[m.away] = true; }
        if (m.away === leader.code && m.homeGoals > m.awayGoals) { killers[m.home] = true; }
      });
      Object.keys(killers).forEach(function (code) {
        add(code, "🗡️", "Giant Killer", "Beat league leaders " + leader.name);
      });
    }
    return out;
  }

  function badgeIcons(list) {

  function awardsCard(rows, badges) {
    const types = [
      ["🔥", "On Fire", "3+ wins in a row"],
      ["🎯", "Unbeaten", "5+ matches without a loss"],
      ["🧱", "Best Defence", "Fewest goals conceded"],
      ["⚡", "Top Scorers", "Most goals scored"],
      ["🗡️", "Giant Killer", "Beat the league leaders"]
    ];
    let html = "<div class='card'><h3>Awards</h3><div class='awards'>";
    types.forEach(function (t) {
      const holders = rows.filter(function (r) {
        return badges[r.code].some(function (b) { return b.icon === t[0]; });
      }).map(function (r) { return r.name; });
      html += "<div class='award'><span class='ic'>" + t[0] + "</span><b>" + t[1] + "</b><small>" + t[2] + "</small>" +
              (holders.length ? "<div class='who'>" + holders.join(", ") + "</div>" : "<div class='none'>Not awarded yet</div>") + "</div>";
    });
    return html + "</div></div>";
  }

    function pageStandings() {
    const rows = buildStandings();
    const badges = computeBadges(rows);
    const done = rows.every(function (r) { return r.played === SCHEDULE.length; });
    let html = "";
    if (done) { html += "<div class='shield'>🛡️ League Shield winners: " + rows[0].name + "</div>"; }
    html += (typeof fxPodium === "function" ? fxPodium(rows) : "");
    html += overviewStrip();
    const cerBtn = ceremonyButton();
    html += "<p style='display:flex;flex-wrap:wrap;gap:8px'>" + (lastPlayedRound() >= 2 ? "<button class='btn out' onclick='pulseTable()'>▶ Replay the last round's moves</button>" : "") + cerBtn + "</p>";
    html += "<button class='btn out mfull' onclick='toggleFull(this)'>⇄ Full stats</button><div class='card scroll'><table class='st'><tr><th>#</th><th class='left'>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>Form</th></tr>";
    rows.forEach(function (r, i) {
      const gd = r.gf - r.ga;
      const form = r.form.slice(-5).map(function (f) { return "<span class='" + f + "'>" + f + "</span>"; }).join("");
      html += "<tr class='" + (i < qualifiers() ? "top4" : "") + "' data-code='" + r.code + "'><td>" + (i + 1) + moveTag(r.code, i) + "</td>" +
        "<td class='left'><span class='badge'>" + initials(r.name) + "</span><a class='tl' onclick=\"openTeam('" + r.code + "')\">" + r.name + "</a>" + (i === 0 ? " 🛡️" : "") + badgeIcons(badges[r.code]) + "</td>" +
        "<td>" + r.played + "</td><td>" + r.won + "</td><td>" + r.drawn + "</td><td>" + r.lost + "</td>" +
        "<td>" + r.gf + "</td><td>" + r.ga + "</td><td>" + (gd > 0 ? "+" + gd : gd) + "</td>" +
        "<td class='pts'>" + r.points + "</td><td class='form'>" + form + "</td></tr>";
    });

    return html;

    // =============== ROUND HIGHLIGHTS ===============
  function roundHighlights(ri) {
    const ms = buildFixtures()[ri];
    const played = ms.filter(function (m) {
      const r = results[m.id];
      return r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "";
    }).map(function (m) { return { m: m, h: Number(results[m.id].h), a: Number(results[m.id].a) }; });
    if (!played.length) { return ""; }

    function line(p) {
      return teams[p.m.home] + " <b>" + p.h + " - " + p.a + "</b> " + teams[p.m.away];
    }
    function box(icon, title, note, text) {
      return "<div class='hlbox'><span class='ic'>" + icon + "</span><div class='t'>" + title + "</div><small>" + note + "</small><div class='m'>" + text + "</div></div>";
    }

    // match of the round: most goals, then biggest margin
    const motr = played.slice().sort(function (x, y) {
      return (y.h + y.a) - (x.h + x.a) || Math.abs(y.h - y.a) - Math.abs(x.h - x.a);
    })[0];
    // biggest win: largest margin, then most goals
    const big = played.filter(function (p) { return p.h !== p.a; }).sort(function (x, y) {
      return Math.abs(y.h - y.a) - Math.abs(x.h - x.a) || (y.h + y.a) - (x.h + x.a);
    })[0];

    // team of the round: best winning performances
    const perf = [];
    played.forEach(function (p) {
      perf.push({ code: p.m.home, gf: p.h, ga: p.a, opp: p.m.away });
      perf.push({ code: p.m.away, gf: p.a, ga: p.h, opp: p.m.home });
    });
    const winners = perf.filter(function (x) { return x.gf > x.ga; }).sort(function (x, y) {
      return (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf;
    }).slice(0, 3);

    let html = "<div class='card hl'><h3><span>🏅 Round " + (ri + 1) + " Highlights</span><span class='legend'>" +
               played.length + " of " + ms.length + " matches played</span></h3><div class='hlgrid'>";
    html += box("⭐", "Match of the Round", "Most goals scored", line(motr));
    if (big && big.m.id !== motr.m.id) {
      html += box("💥", "Biggest Win", "Largest winning margin", line(big));
    }
    html += "</div><div class='t' style='font-family:var(--font-head);letter-spacing:.5px;color:var(--gold)'>Team of the Round</div>";
    if (winners.length) {
      html += "<div class='tor'>" + winners.map(function (w) {
        return "<div class='chip'><span class='badge'>" + initials(teams[w.code]) + "</span><div><b>" + teams[w.code] +
               "</b><small>beat " + teams[w.opp] + " " + w.gf + "-" + w.ga + "</small></div></div>";
      }).join("") + "</div>";
    } else {
      html += "<p class='legend'>No winning team yet this round.</p>";
    }
    return html + "</div>";
  }

  async function savePlayoff(stage, a, b) {
    if (!isAdmin) return;
    const hv = document.getElementById("ph-" + stage).value, av = document.getElementById("pa-" + stage).value;
    const pick = document.getElementById("pw-" + stage);
    if ((hv === "") !== (av === "")) { return; }   // wait until both scores are typed
    const hasScore = hv !== "" && av !== "";
    let winner = pick ? pick.value : "";
    if (hasScore && Number(hv) !== Number(av)) { winner = Number(hv) > Number(av) ? a : b; }
    if (!hasScore && !winner) {
      const del = await sb.from("playoffs").delete().eq("season", currentSeason).eq("stage", stage);
      delete playoffWinners[stage]; delete playoffScores[stage];
      setStatus(del.error ? "Could not save: " + del.error.message : ""); render(); return;
    }
    if (!winner) { setStatus("Draw: pick who won on penalties, then it saves."); return; }
    const row = { season: currentSeason, stage: stage, winner: winner };
    if (hasScore) { row.home_goals = Number(hv); row.away_goals = Number(av); row.home_team = a; row.away_team = b; }
    else { row.home_goals = null; row.away_goals = null; row.home_team = null; row.away_team = null; }
    const res = await sb.from("playoffs").upsert(row, { onConflict: "season,stage" });

    // =============== LEAGUE RECORDS ===============
  function computeRecords() {
    const rounds = buildFixtures();
    const played = [];
    const roundGoals = [];
    rounds.forEach(function (round, ri) {
      let goals = 0, count = 0;
      round.forEach(function (m) {
        const r = results[m.id];
        if (r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "") {
          played.push({ ri: ri, home: m.home, away: m.away, h: Number(r.h), a: Number(r.a) });
          goals += Number(r.h) + Number(r.a);
          count++;
        }
      });
      roundGoals.push({ ri: ri, goals: goals, count: count, total: round.length });
    });
    const rec = { played: played };

    function pickMax(list, score) {
      let best = null;
      list.forEach(function (x) {
        const s = score(x);
        if (best === null || s > best.s) { best = { s: s, items: [x] }; }
        else if (s === best.s) { best.items.push(x); }
      });
      return best;
    }

    const wins = played.filter(function (p) { return p.h !== p.a; });
    rec.biggestWin = pickMax(wins, function (p) { return Math.abs(p.h - p.a) * 100 + p.h + p.a; });
    rec.mostGoals = pickMax(played, function (p) { return p.h + p.a; });

    const seq = {};
    Object.keys(teams).forEach(function (c) { seq[c] = []; });
    played.forEach(function (p) {
      seq[p.home].push(p.h > p.a ? "W" : p.h === p.a ? "D" : "L");
      seq[p.away].push(p.a > p.h ? "W" : p.h === p.a ? "D" : "L");
    });
    const streaks = Object.keys(teams).map(function (c) {
      let w = 0, bw = 0, u = 0, bu = 0;
      seq[c].forEach(function (x) {
        w = (x === "W") ? w + 1 : 0;
        u = (x !== "L") ? u + 1 : 0;
        if (w > bw) { bw = w; }
        if (u > bu) { bu = u; }
      });
      return { code: c, win: bw, unbeaten: bu };
    });
    rec.winStreak = pickMax(streaks, function (x) { return x.win; });
    rec.unbeaten = pickMax(streaks, function (x) { return x.unbeaten; });

    const home = {}, away = {};
    Object.keys(teams).forEach(function (c) {
      home[c] = { code: c, p: 0, pts: 0, gd: 0 };
      away[c] = { code: c, p: 0, pts: 0, gd: 0 };
    });
    played.forEach(function (p) {
      const hp = p.h > p.a ? 3 : p.h === p.a ? 1 : 0;
      const ap = p.a > p.h ? 3 : p.h === p.a ? 1 : 0;
      home[p.home].p++; home[p.home].pts += hp; home[p.home].gd += p.h - p.a;
      away[p.away].p++; away[p.away].pts += ap; away[p.away].gd += p.a - p.h;
    });
    function bestSide(table) {
      const list = Object.keys(table).map(function (c) { return table[c]; }).filter(function (x) { return x.p > 0; });
      return pickMax(list, function (x) { return x.pts * 1000 + x.gd * 10 + 500 - x.p; });
    }
    rec.bestHome = bestSide(home);
    rec.bestAway = bestSide(away);

    // only rounds where every match has been played
    const complete = roundGoals.filter(function (x) { return x.count === x.total; });
    rec.roundGoals = pickMax(complete, function (x) { return x.goals; });
    return rec;
  }

  function pageRecords() {
