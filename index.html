    return html + "</div>" + hatClubHtml(hatTrickList([currentSeason]), false);
  }
    // =============== TEAM PROFILE ===============
  function openTeam(code) {
    currentTeam = code;
    currentTab = "Team";
    render();
    window.scrollTo(0, 0);
  }

  function teamMatches(code) {
    const out = [];
    buildFixtures().forEach(function (round, ri) {
      round.forEach(function (m) {
        if (m.home !== code && m.away !== code) { return; }
        const r = results[m.id];
        const played = !!(r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "");
        const isHome = (m.home === code);
        const o = { ri: ri, isHome: isHome, opp: isHome ? m.away : m.home, played: played };
        if (played) {
          o.gf = Number(isHome ? r.h : r.a);
          o.ga = Number(isHome ? r.a : r.h);
          o.res = o.gf > o.ga ? "W" : (o.gf === o.ga ? "D" : "L");
        }
        out.push(o);
      });
    });
    return out;
  }

  function pointsChart(done) {
    if (!done.length) { return "<p class='legend'>The chart appears after the first result.</p>"; }
    const pts = [0];
    done.forEach(function (x) { pts.push(pts[pts.length - 1] + (x.res === "W" ? 3 : x.res === "D" ? 1 : 0)); });
    const max = Math.max(3, pts[pts.length - 1]);
    const n = done.length;
    function X(i) { return 12 + i * (296 / n); }
    function Y(v) { return 98 - (v / max) * 86; }
    const line = pts.map(function (v, i) { return X(i).toFixed(1) + "," + Y(v).toFixed(1); }).join(" ");
    const colors = { W: "#16a34a", D: "#9ca3af", L: "#ef4444" };
    let svg = "<svg viewBox='0 0 320 110' style='width:100%;height:auto'>" +
      "<line x1='12' y1='98' x2='308' y2='98' stroke='var(--line)'/>" +
      "<polyline points='" + line + "' fill='none' stroke='var(--accent)' stroke-width='2.5' stroke-linejoin='round'/>";
    done.forEach(function (x, i) {
      svg += "<circle cx='" + X(i + 1).toFixed(1) + "' cy='" + Y(pts[i + 1]).toFixed(1) + "' r='5' fill='" + colors[x.res] + "'/>";
    });
    return svg + "</svg><p class='legend'>Points after each match. Green = win, grey = draw, red = loss. Now: " + pts[pts.length - 1] + " pts.</p>";
  }

const STAGE_NAMES = { q1: "Qualifier 1", ko1: "Knockout 1", ko2: "Knockout 2", el: "Eliminator", el1: "Eliminator 1", q2: "Qualifier 2", f: "Final" };

  function teamPlayoffGames(code) {
    return Object.keys(playoffScores).filter(function (st) { return playoffScores[st].home === code || playoffScores[st].away === code; }).map(function (st) {
      const s = playoffScores[st], isH = s.home === code;
      const gf = isH ? s.hg : s.ag, ga = isH ? s.ag : s.hg;
      let res = gf > ga ? "W" : gf < ga ? "L" : "D";
      return { stage: st, opp: isH ? s.away : s.home, gf: gf, ga: ga, res: res, pens: gf === ga && playoffWinners[st] === code ? "won on pens" : (gf === ga ? "lost on pens" : "") };
    });
  }

  function allCompetitionsCard(code, row) {
    const po = teamPlayoffGames(code);
    if (!SEASONS[currentSeason].playoffScores) { return ""; }
    const t = { p: row.played, w: row.won, d: row.drawn, l: row.lost, gf: row.gf, ga: row.ga };
    po.forEach(function (g) { t.p++; t.gf += g.gf; t.ga += g.ga; if (g.res === "W") { t.w++; } else if (g.res === "L") { t.l++; } else { t.d++; } });
    function cell(label, v) { return "<div class='stat'><b>" + v + "</b><small>" + label + "</small></div>"; }
    let html = "<div class='card'><h3>All competitions <span style='color:var(--muted);font-size:13px;font-weight:400'>league + playoffs</span></h3>" +
      "<div class='stats'>" + cell("Played", t.p) + cell("W-D-L", t.w + "-" + t.d + "-" + t.l) + cell("Goals", t.gf + ":" + t.ga) + cell("Goal diff", (t.gf - t.ga > 0 ? "+" : "") + (t.gf - t.ga)) + "</div>";
    html += po.length ? "<h3 style='margin-top:14px'>Playoff games</h3>" + po.map(function (g) {
      return "<div class='tm'><span class='pill " + g.res + "'>" + g.res + "</span><span>" + STAGE_NAMES[g.stage] + " vs " + teams[g.opp] + (g.pens ? " <small style='color:var(--muted)'>(" + g.pens + ")</small>" : "") + "</span><b>" + g.gf + " - " + g.ga + "</b></div>";
    }).join("") : "<p class='legend'>No playoff games played yet. The table above counts league games only.</p>";
    return html + "</div>";
  }

  function pageTeam() {
    const code = currentTeam;
    if (!teams[code]) { return "<div class='card'>Team not found.</div>"; }
    const rows = buildStandings();
    const pos = rows.findIndex(function (r) { return r.code === code; });
    const row = rows[pos];
    const ms = teamMatches(code);
    const done = ms.filter(function (x) { return x.played; });
    const next = ms.filter(function (x) { return !x.played; }).slice(0, 5);
    const sq = squads[code] || { owner: "", players: "" };
    const list = playerList(sq.players);
    const gd = row.gf - row.ga;
    const form = row.form.slice(-5).map(function (f) { return "<span class='" + f + "'>" + f + "</span>"; }).join("");
    const bdg = (typeof computeBadges === "function" && typeof badgeIcons === "function") ? badgeIcons(computeBadges(rows)[code]) : "";

    function stat(label, value) { return "<div class='stat'><b>" + value + "</b><small>" + label + "</small></div>"; }
    function oppLink(c) { return "<a class='tl' onclick=\"openTeam('" + c + "')\">" + teams[c] + "</a>"; }

    let html = "<button class='btn out back' onclick=\"currentTab='Standings';render()\">← Back to standings</button>";
    html += heroTeam(code);
    html += "<div class='card thead'><span class='badge big'>" + initials(teams[code]) + "</span><div>" +
      "<h2>" + teams[code] + " " + (pos === 0 ? "🛡️" : "") + bdg + "</h2>" +
      "<div class='legend'>Owner: <b style='color:var(--text)'>" + (sq.owner ? esc(sq.owner) : "TBA") + "</b></div>" +
      "<div class='form' style='margin-top:6px'>" + form + "</div></div></div>";
    html += "<div class='stats'>" + stat("Position", "#" + (pos + 1)) + stat("Points", row.points) + stat("Played", row.played) +
      stat("W-D-L", row.won + "-" + row.drawn + "-" + row.lost) + stat("Goals", row.gf + ":" + row.ga) + stat("Goal diff", (gd > 0 ? "+" : "") + gd) + "</div>";

    html += teamExtras(teams[code]);
    html += teamTransfersCard(code);
    html += allCompetitionsCard(code, row);
    html += "<div class='card'><h3>Points progress</h3>" + pointsChart(done) + "</div>";

    html += "<div class='two'><div class='card'><h3>Results</h3>";
    if (done.length) {
      html += done.slice().reverse().map(function (x) {
        return "<div class='tm'><span class='pill " + x.res + "'>" + x.res + "</span><span>R" + (x.ri + 1) + " · " + (x.isHome ? "Home" : "Away") +
               " vs " + oppLink(x.opp) + "</span><b>" + x.gf + " - " + x.ga + "</b></div>";
      }).join("");
    } else { html += "<p class='legend'>No results yet.</p>"; }
    html += "</div><div class='card'><h3>Next fixtures</h3>";
    if (next.length) {
      html += next.map(function (x) {
        return "<div class='tm'><span class='pill D'>R" + (x.ri + 1) + "</span><span>" + (x.isHome ? "Home" : "Away") + " vs " + oppLink(x.opp) + "</span></div>";
      }).join("");
    } else { html += "<p class='legend'>All matches played.</p>"; }
    html += "</div></div>";

    html += "<div class='card'><h3>Squad (" + list.length + " players)</h3>";
    html += list.length ? "<ol class='plist'>" + list.map(function (p) { return "<li>" + esc(p) + goalTag(code, p) + "</li>"; }).join("") + "</ol>"
                        : "<p class='legend'>Squad not added yet.</p>";
    return html + "</div>";
  }

  // =============== GOLDEN BOOT ===============
  function bootTotals() {
    const map = {};
    goalLog.forEach(function (g) {
      const k = g.team + "|" + g.player;
      if (!map[k]) { map[k] = { team: g.team, player: g.player, goals: 0 }; }
      map[k].goals += g.goals;
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) {
      return b.goals - a.goals || a.player.localeCompare(b.player);
    });
  }

  async function saveGoal() {
    if (!isAdmin) { return; }
    const player = document.getElementById("bp").value;
    const goals = parseInt(document.getElementById("bg").value, 10);
    const round = document.getElementById("br").value;
    if (!player) { setStatus("Pick a player first (add the squad in the Squads tab)."); return; }
    if (!goals || goals < 1) { setStatus("Enter at least 1 goal."); return; }
    const row = { season: currentSeason, team: bootTeam, player: player, goals: goals };
    if (round) { if (round.indexOf("s:") === 0) { row.stage = round.slice(2); } else { row.round = Number(round); } }
    const res = await sb.from("goals").insert(row).select();
    if (res.error) { setStatus("Could not save: " + res.error.message); return; }
    goalLog.push(res.data[0]);
    setStatus(player + ": " + goals + " goal(s) saved.");
    render();
  }

  async function deleteGoal(id) {
    if (!isAdmin) { return; }
    const res = await sb.from("goals").delete().eq("id", id);
    if (res.error) { setStatus("Could not delete: " + res.error.message); return; }
    goalLog = goalLog.filter(function (g) { return g.id !== id; });
    render();
  }

  function pageBoot() {
    const list = bootTotals();
    const top = list.length ? list[0].goals : 1;
    let html = "<p class='legend'>The race for the league's top scorer. Goals are added by the admin after each match. Playoff goals count too.</p><p>" + shareBtn("boot") + "</p>";

    if (!list.length) {
      html += "<div class='card'><p class='legend'>No goals logged yet. The race starts after the first match.</p></div>";
    } else {
      html += "<div class='boot'>";
      let rank = 0, prev = null;
      list.slice(0, 15).forEach(function (p, i) {
        if (p.goals !== prev) { rank = i + 1; prev = p.goals; }
        html += "<div class='brow" + (rank === 1 ? " first" : "") + "'><span class='fill' style='width:" + Math.round(p.goals / top * 100) + "%'></span>" +
          "<span class='rk'>" + (rank === 1 ? "👟" : rank) + "</span><span class='badge'>" + initials(teams[p.team]) + "</span>" +
          "<div><b>" + esc(p.player) + "</b><small>" + teams[p.team] + "</small></div><span class='g'>" + p.goals + "</span></div>";
      });
      html += "</div>";
      if (list.length > 15) { html += "<p class='legend'>Showing the top 15 of " + list.length + " scorers.</p>"; }
    }

    if (isAdmin) {
      const pl = playerList((squads[bootTeam] || { players: "" }).players);
      html += "<div class='card' style='margin-top:16px'><h3>Admin: add goals</h3><div class='row'>" +
        "<select id='bt' onchange=\"bootTeam=this.value;render()\">" +
        Object.keys(teams).map(function (c) { return "<option value='" + c + "'" + (c === bootTeam ? " selected" : "") + ">" + teams[c] + "</option>"; }).join("") + "</select>" +
        "<select id='bp'>" + (pl.length ? pl.map(function (p) { return "<option value=\"" + esc(p) + "\">" + esc(p) + "</option>"; }).join("") :
          "<option value=''>Add this team's squad first</option>") + "</select>" +
        "<input id='bg' type='number' min='1' value='1' style='width:70px'>" +
        "<select id='br'><option value=''>Round (optional)</option>" +
        Array.from({ length: SCHEDULE.length }, function (_, i) { return "<option value='" + (i + 1) + "'>Round " + (i + 1) + "</option>"; }).join("") + "<optgroup label='Playoffs'>" + stageList().map(function (st) { return "<option value='s:" + st + "'>" + STAGE_NAMES[st] + "</option>"; }).join("") + "</optgroup></select>" +
        "<button class='btn' onclick='saveGoal()'>Add goals</button></div>";

      const rows = buildStandings();
      const logged = {};
      goalLog.forEach(function (g) { logged[g.team] = (logged[g.team] || 0) + g.goals; });
      const gaps = rows.filter(function (r) { return r.gf > (logged[r.code] || 0); });
      html += gaps.length
        ? "<p class='legend'>Goals still to assign: " + gaps.map(function (r) { return r.name + " " + (r.gf - (logged[r.code] || 0)); }).join(", ") + ". (Own goals count for the other team but not for the Golden Boot.)</p>"
        : "<p class='legend'>All team goals are assigned to players.</p>";

      html += "<h3 style='margin-top:14px'>Recent entries</h3>";
      const recent = goalLog.slice().sort(function (a, b) { return b.id - a.id; }).slice(0, 12);
      html += recent.length ? recent.map(function (g) {
        return "<div class='tm'><span>⚽ <b>" + esc(g.player) + "</b> (" + teams[g.team] + ") ×" + g.goals + (g.round ? " · R" + g.round : g.stage ? " · " + (STAGE_NAMES[g.stage] || g.stage) : "") +
               "</span><button class='g' onclick='deleteGoal(" + g.id + ")'>✕</button></div>";
      }).join("") : "<p class='legend'>Nothing logged yet.</p>";
      html += "</div>";
    }
    return html;
  }

    // =============== PLAYER STATS ===============
  function goalMap() {
    const map = {};
    goalLog.forEach(function (g) {
      const k = g.team + "|" + g.player;
      map[k] = (map[k] || 0) + g.goals;
    });
    return map;
  }

  function goalTag(team, player) {
    const n = goalMap()[team + "|" + player] || 0;
    return n ? " <span class='gt'>⚽ " + n + "</span>" : "";
  }

  function pageStats() {
    const map = goalMap();
    let rows = [];
    const seen = {};
    Object.keys(teams).forEach(function (c) {
      playerList((squads[c] || { players: "" }).players).forEach(function (p) {
        const k = c + "|" + p;
        if (seen[k]) { return; }
        seen[k] = true;
        rows.push({ team: c, player: p, goals: map[k] || 0, extra: false });
      });
    });
    // goals logged for a name that is no longer in the squad list are kept visible
    Object.keys(map).forEach(function (k) {
      if (!seen[k]) {
        const i = k.indexOf("|");
        rows.push({ team: k.slice(0, i), player: k.slice(i + 1), goals: map[k], extra: true });
      }
    });

    if (statTeam !== "all") { rows = rows.filter(function (r) { return r.team === statTeam; }); }
    rows.sort(function (a, b) {
      if (statSort === "name") { return a.player.localeCompare(b.player); }
      return b.goals - a.goals || a.player.localeCompare(b.player);
    });

    const totalGoals = rows.reduce(function (s, r) { return s + r.goals; }, 0);
    let html = "<div class='row'><select onchange=\"statTeam=this.value;render()\"><option value='all'>All teams</option>" +
      Object.keys(teams).map(function (c) { return "<option value='" + c + "'" + (c === statTeam ? " selected" : "") + ">" + teams[c] + "</option>"; }).join("") + "</select>" +
      "<select onchange=\"statSort=this.value;render()\"><option value='goals'" + (statSort === "goals" ? " selected" : "") + ">Sort: most goals</option>" +
      "<option value='name'" + (statSort === "name" ? " selected" : "") + ">Sort: name A-Z</option></select>" +
      "<span class='legend'>" + rows.length + " players · " + totalGoals + " goals logged</span></div>";

    if (!rows.length) {
      return html + "<div class='card'><p class='legend'>No players yet. Squads are added on the Squads tab.</p></div>";
    }
    html += "<p>" + shareBtn("stats") + "</p><div class='card scroll'><table><tr><th>#</th><th class='left'>Player</th><th class='left'>Team</th><th>Goals</th></tr>";
    rows.forEach(function (r, i) {
      html += "<tr><td>" + (i + 1) + "</td><td class='left'>" + esc(r.player) + (r.extra ? " <span class='legend'>(not in squad list)</span>" : "") +
        "</td><td class='left'><span class='badge'>" + initials(teams[r.team] || r.team) + "</span>" + (teams[r.team] || r.team) + "</td>" +
        "<td class='pts'>" + r.goals + "</td></tr>";
    });
    return html + "</table></div>";
  }
  // =============== HALL OF FAME ===============
  let allResults = [], allPlayoffs = [], allGoals = [], allSquads = [], allTransfers = [], allGk = [], allVotes = [];

  function seasonSummary(no) {
    const cfg = SEASONS[no];
    const res = {};
    allResults.forEach(function (r) { if ((r.season || 1) === no) { res[r.id] = r; } });

    const rows = {};
    Object.keys(cfg.teams).forEach(function (c) { rows[c] = { code: c, name: cfg.teams[c], p: 0, pts: 0, gf: 0, ga: 0 }; });
    let total = 0, played = 0;
    cfg.schedule.forEach(function (round, ri) {
      round.forEach(function (code, i) {
        total++;
        const t = code.split("-");
        const r = res["R" + (ri + 1) + "-" + (i + 1)];
        if (!r || r.home_goals === null || r.away_goals === null) { return; }
        played++;
        const h = rows[t[0]], a = rows[t[1]], hg = r.home_goals, ag = r.away_goals;
        h.p++; a.p++; h.gf += hg; h.ga += ag; a.gf += ag; a.ga += hg;
        if (hg > ag) { h.pts += 3; } else if (hg < ag) { a.pts += 3; } else { h.pts++; a.pts++; }
      });
    });
    const table = Object.keys(rows).map(function (c) { return rows[c]; }).sort(function (x, y) {
      return y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf;
    });
    const top = table.map(function (r) { return r.code; });

    const pw = {};
    allPlayoffs.forEach(function (p) { if ((p.season || 1) === no) { pw[p.stage] = p.winner; } });
    function ok(stage, a, b) { const w = pw[stage]; return (a && b && (w === a || w === b)) ? w : null; }
    const q1w = ok("q1", top[0], top[1]);
    const q1l = q1w ? (q1w === top[0] ? top[1] : top[0]) : null;
    let q2w;
    if (cfg.playoff === "six") {
      const k1 = ok("ko1", top[2], top[5]), k2 = ok("ko2", top[3], top[4]);
      q2w = ok("q2", q1l, ok("el1", k1, k2));
    } else {
      q2w = ok("q2", q1l, ok("el", top[2], top[3]));
    }
    const champion = ok("f", q1w, q2w);
    const runnerUp = champion ? (q1w === champion ? q2w : q1w) : null;

    const sums = {};
    allGoals.forEach(function (g) {
      if ((g.season || 1) === no) { const k = g.team + "|" + g.player; sums[k] = (sums[k] || 0) + g.goals; }
    });
    let best = 0, boot = [];
    Object.keys(sums).forEach(function (k) {
      if (sums[k] > best) { best = sums[k]; boot = [k]; } else if (sums[k] === best) { boot.push(k); }
    });
    boot = boot.map(function (k) {
      const i = k.indexOf("|");
      return { team: cfg.teams[k.slice(0, i)] || k.slice(0, i), code: k.slice(0, i), player: k.slice(i + 1) };
    });
    return { name: fullName(no), pots: potsWinner(no), played: played, total: total, complete: played === total, shield: table[0],
             champion: champion ? cfg.teams[champion] : null, runnerUp: runnerUp ? cfg.teams[runnerUp] : null,
             boot: boot, bootGoals: best };
  }

  function pageHall() {
    const nos = Object.keys(SEASONS).map(Number).sort(function (a, b) { return b - a; });
    function box(icon, title, note, main, sub) {
      return "<div class='hbox'><span class='ic'>" + icon + "</span><div class='ht'>" + title + "</div><small>" + note + "</small>" +
             "<div class='hm'>" + (main ? main : "<span class='legend'>Not decided yet</span>") + "</div>" +
             (sub ? "<div class='legend'>" + sub + "</div>" : "") + "</div>";
    }
    let html = "<p class='legend'>The winners of every season.</p>";
    nos.forEach(function (n) {
      const s = seasonSummary(n);
      const done = s.complete && s.champion;
      const started = s.played > 0;
      html += "<div class='card hall'><h2>" + esc(s.name) + " <span class='tag " + (done ? "tdone" : "tlive") + "'>" + (done ? "Complete" : "In progress") + "</span></h2><div class='hgrid'>";
      html += box("🛡️", "League Shield", s.complete ? "Winners" : "Current leaders",
                  started ? esc(s.shield.name) : null, started ? s.shield.pts + " points from " + s.shield.p + " matches" : "");
      html += box("🏆", "Champions", "Playoff winners", s.champion ? esc(s.champion) : null, s.runnerUp ? "Runners-up: " + esc(s.runnerUp) : "");
      html += box("👟", "Golden Boot", s.complete ? "Top scorer" : "Current leader",
                  s.boot.length ? s.boot.map(function (b) { return esc(b.player) + " <span class='legend'>(" + esc(b.team) + ")</span>"; }).join("<br>") : null,
                  s.boot.length ? s.bootGoals + " goals" : "");
      html += "</div></div>";
    });
    return html;
  }

  let loaded = false;

  // =============== TOAST, LOADING, OVERVIEW, MOVEMENT AND MATCH OVERLAY ===============
  function toast(msg, type) {
    const old = document.querySelector(".toast");
    if (old) { old.remove(); }
    const t = document.createElement("div");
    t.className = "toast" + (type === "err" ? " err" : "");
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () {
      t.classList.add("out");
      setTimeout(function () { t.remove(); }, 300);
    }, 3000);
  }

  function skeleton() {
    return Array.from({ length: 10 }, function () { return "<div class='skel'></div>"; }).join("");
  }

  // standings order using only the first n rounds
  function tableUpTo(nRounds) {
    const rows = {};
    Object.keys(teams).forEach(function (c) { rows[c] = { code: c, pts: 0, gf: 0, ga: 0 }; });
    SCHEDULE.slice(0, nRounds).forEach(function (round, ri) {
      round.forEach(function (code, i) {
        const r = results["R" + (ri + 1) + "-" + (i + 1)];
        if (!r || r.h === null || r.h === "" || r.a === null || r.a === "") { return; }
        const t = code.split("-"), hg = Number(r.h), ag = Number(r.a);
        rows[t[0]].gf += hg; rows[t[0]].ga += ag; rows[t[1]].gf += ag; rows[t[1]].ga += hg;
        if (hg > ag) { rows[t[0]].pts += 3; } else if (hg < ag) { rows[t[1]].pts += 3; } else { rows[t[0]].pts++; rows[t[1]].pts++; }
      });
    });
    return Object.keys(rows).map(function (c) { return rows[c]; }).sort(function (a, b) {
      return b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf;
    }).map(function (r) { return r.code; });
  }

  function lastPlayedRound() {
    let last = 0;
    SCHEDULE.forEach(function (round, ri) {
      round.forEach(function (code, i) {
        const r = results["R" + (ri + 1) + "-" + (i + 1)];

  // =============== ROUND SUMMARY FOR WHATSAPP ===============
  function tableDataUpTo(nRounds) {
    const rows = {};
    Object.keys(teams).forEach(function (c) { rows[c] = { code: c, p: 0, pts: 0, gf: 0, ga: 0 }; });
    SCHEDULE.slice(0, nRounds).forEach(function (round, ri) {
      round.forEach(function (code, i) {
        const r = results["R" + (ri + 1) + "-" + (i + 1)];
        if (!r || r.h === null || r.h === "" || r.a === null || r.a === "") { return; }
        const t = code.split("-"), hg = Number(r.h), ag = Number(r.a);
        rows[t[0]].p++; rows[t[1]].p++;
        rows[t[0]].gf += hg; rows[t[0]].ga += ag; rows[t[1]].gf += ag; rows[t[1]].ga += hg;
        if (hg > ag) { rows[t[0]].pts += 3; } else if (hg < ag) { rows[t[1]].pts += 3; } else { rows[t[0]].pts++; rows[t[1]].pts++; }
      });
    });
    return Object.keys(rows).map(function (c) { return rows[c]; }).sort(function (a, b) {
      return b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf;
    });
  }

  async function saveRound() {
    if (!isAdmin) { return; }
    const ri = currentRound, vals = {};
    document.querySelectorAll(".ovp .re").forEach(function (f) {
      const id = f.getAttribute("data-id");
      vals[id] = vals[id] || {};
      vals[id][f.getAttribute("data-side")] = f.value;
    });
    const save = [], clear = [];
    const ids = Object.keys(vals);
    for (let k = 0; k < ids.length; k++) {
      const id = ids[k], h = vals[id].h, a = vals[id].a;
      if (h === "" && a === "") { clear.push(id); }
      else if (h === "" || a === "") { toast("Fill both boxes for every match you save.", "err"); return; }
      else if (!(Number(h) >= 0 && Number(a) >= 0)) { toast("Scores must be 0 or more.", "err"); return; }
      else { save.push({ season: currentSeason, id: id, home_goals: Number(h), away_goals: Number(a) }); }
    }
    if (save.length) {
      const res = await sb.from("results").upsert(save, { onConflict: "season,id" });
      if (res.error) { setStatus("Could not save: " + res.error.message); return; }
    }
    if (clear.length) {
      const res = await sb.from("results").delete().eq("season", currentSeason).in("id", clear);

// =============== STAGE 2: NEWS, QUALIFICATION TRACKER, TITLE RACE ===============
  function isPlayed(r) { return r && r.h !== "" && r.a !== "" && r.h !== null && r.a !== null && r.h !== undefined; }
  function endRun(form, ok) { let n = 0; for (let i = form.length - 1; i >= 0 && ok(form[i]); i--) { n++; } return n; }

  function buildNews() {
    const items = [], table = buildStandings(), fx = buildFixtures();
    let last = -1;
    fx.forEach(function (rd, i) { if (rd.some(function (m) { return isPlayed(results[m.id]); })) { last = i; } });
    if (last < 0 && !Object.keys(playoffScores).length) { return [{ icon: "🕐", title: "Season not started", text: "Match reports appear here automatically after the first result." }]; }
    if (playoffWinners.f) {
      const sc = playoffScores.f;
      items.push({ icon: "🏆", title: teams[playoffWinners.f] + " are champions!", text: sc ? "Final: " + teams[sc.home] + " " + sc.hg + " - " + sc.ag + " " + teams[sc.away] + "." : "They won the playoff Final." });
    }
    Object.keys(playoffScores).filter(function (k) { return k !== "f"; }).forEach(function (k) {
      const sc = playoffScores[k];
      items.push({ icon: "⚔️", title: STAGE_NAMES[k] + ": " + teams[playoffWinners[k] || sc.home] + " go through", text: teams[sc.home] + " " + sc.hg + " - " + sc.ag + " " + teams[sc.away] + "." });
    });
    if (last >= 0) {
      const lead = table[0], gap = lead.points - table[1].points;
      items.push({ icon: "🛡️", title: teams[lead.code] + " lead the table", text: lead.points + " points" + (gap ? ", " + gap + " clear of " + teams[table[1].code] : ", level with " + teams[table[1].code]) + " after round " + (last + 1) + "." });
      const ms = fx[last].filter(function (m) { return isPlayed(results[m.id]); });
      let big = null, goals = null, draws = 0;
      ms.forEach(function (m) {
        const h = Number(results[m.id].h), a = Number(results[m.id].a);
        if (h === a) { draws++; }
        if (!big || Math.abs(h - a) > big.d) { big = { d: Math.abs(h - a), m: m, h: h, a: a }; }
        if (!goals || h + a > goals.t) { goals = { t: h + a, m: m, h: h, a: a }; }
      });
      if (big && big.d > 0) { items.push({ icon: "💥", title: "Round " + (last + 1) + " big win", text: teams[big.m.home] + " " + big.h + " - " + big.a + " " + teams[big.m.away] + " (margin " + big.d + ")." }); }
      if (goals && goals.t >= 5 && goals !== big) { items.push({ icon: "⚽", title: "Goal fest in round " + (last + 1), text: teams[goals.m.home] + " " + goals.h + " - " + goals.a + " " + teams[goals.m.away] + ": " + goals.t + " goals." }); }
      if (draws) { items.push({ icon: "🤝", title: draws + (draws === 1 ? " draw" : " draws") + " in round " + (last + 1), text: "Points shared in " + draws + " of " + ms.length + " matches." }); }
    }
    table.forEach(function (r) {
      const w = endRun(r.form, function (f) { return f === "W"; }), u = endRun(r.form, function (f) { return f !== "L"; }), l = endRun(r.form, function (f) { return f === "L"; });
      if (w >= 3) { items.push({ icon: "🔥", title: teams[r.code] + " on fire", text: w + " wins in a row." }); }
      else if (u >= 5) { items.push({ icon: "🧱", title: teams[r.code] + " unbeaten", text: u + " games without defeat." }); }
      if (l >= 3) { items.push({ icon: "📉", title: teams[r.code] + " in a slump", text: l + " defeats in a row." }); }
    });
    if (last >= 0) {
      const pw = potwForRound(last);
      if (pw) { items.push({ icon: "⭐", title: "Player of the Week: " + pw.player, text: teams[pw.team] + " · " + pw.detail + " (round " + (last + 1) + ")." }); }
    }
    hatTrickList([currentSeason]).slice(-3).forEach(function (h) { items.push({ icon: "🎩", title: "Hat-trick: " + h.player, text: h.goals + " goals for " + h.team + " in " + h.where + (h.vs ? " " + h.vs : "") + "." }); });

  function qualStatus() {
    const table = buildStandings(), q = qualifiers(), total = SCHEDULE.length;
    const rows = table.map(function (r) { return { r: r, left: total - r.played, max: r.points + 3 * (total - r.played) }; });
    return rows.map(function (x, i) {
      const others = rows.filter(function (y) { return y.r.code !== x.r.code; });
      const canCatch = others.filter(function (y) { return y.max >= x.r.points; }).length;
      const ahead = others.filter(function (y) { return y.r.points > x.max; }).length;
      const shield = others.every(function (y) { return y.max < x.r.points; });
      let st = "hunt", label = "In the hunt";
      if (x.left === 0 && i < q) { st = "in"; label = "Qualified"; }
      else if (canCatch < q) { st = "in"; label = "Qualified"; }
      else if (ahead >= q) { st = "out"; label = "Eliminated"; }
      if (shield) { label = "🛡️ Shield won"; }
      return { code: x.r.code, pos: i + 1, pts: x.r.points, left: x.left, max: x.max, st: st, label: label };
    });
  }

  const LINE_COLORS = ["#2ecc88", "#f5b301", "#ef4444", "#3b82f6", "#a855f7", "#f97316", "#14b8a6", "#ec4899", "#eab308", "#94a3b8"];

  function raceChart() {
    const fx = buildFixtures(), codes = Object.keys(teams), pts = {};
    codes.forEach(function (c) { pts[c] = [0]; });
    let rounds = 0;
    fx.forEach(function (rd, i) {
      const add = {}; let any = false;
      codes.forEach(function (c) { add[c] = 0; });
      rd.forEach(function (m) {
        const r = results[m.id]; if (!isPlayed(r)) { return; }
        any = true; const h = Number(r.h), a = Number(r.a);
        if (h > a) { add[m.home] += 3; } else if (h < a) { add[m.away] += 3; } else { add[m.home]++; add[m.away]++; }
      });
      if (any) { rounds = i + 1; }
      codes.forEach(function (c) { pts[c].push(pts[c][i] + add[c]); });
    });
    if (rounds < 1) { return "<p class='legend'>The chart appears after the first result.</p>"; }
    const W = 640, H = 300, L = 34, B = 24, T = 10, R = 10;
    let max = 3; codes.forEach(function (c) { max = Math.max(max, pts[c][rounds]); });
    const x = function (i) { return L + (W - L - R) * i / Math.max(rounds, 1); }, y = function (v) { return T + (H - T - B) * (1 - v / max); };
    const order = buildStandings().map(function (r) { return r.code; });
    let svg = "<svg viewBox='0 0 " + W + " " + H + "' style='width:100%;height:auto'>";
    for (let g = 0; g <= 4; g++) { const v = Math.round(max * g / 4); svg += "<line x1='" + L + "' x2='" + (W - R) + "' y1='" + y(v) + "' y2='" + y(v) + "' stroke='var(--line)'/><text x='4' y='" + (y(v) + 4) + "' fill='var(--muted)' font-size='11'>" + v + "</text>"; }
    for (let i = 0; i <= rounds; i++) { svg += "<text x='" + x(i) + "' y='" + (H - 6) + "' fill='var(--muted)' font-size='10' text-anchor='middle'>" + (i || "") + "</text>"; }
    order.slice().reverse().forEach(function (c) {
      const rank = order.indexOf(c), col = LINE_COLORS[rank % 10], top = rank < 3;
      svg += "<polyline fill='none' stroke='" + col + "' stroke-width='" + (top ? 3 : 1.5) + "' opacity='" + (top ? 1 : .55) + "' points='" + pts[c].slice(0, rounds + 1).map(function (v, i) { return x(i) + "," + y(v); }).join(" ") + "'/>";
    });
    svg += "</svg><div class='legend' style='display:flex;flex-wrap:wrap;gap:4px 14px'>" + order.map(function (c, i) { return "<span><b style='color:" + LINE_COLORS[i % 10] + "'>●</b> " + esc(teams[c]) + "</span>"; }).join("") + "</div>";
    return svg;
  }

  // ---------- transfer helpers (used by Transfers, Squads and team pages) ----------
  function normName(p) {
    return String(p || "").replace(/\(.*?\)/g, " ").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  }
  function sameName(a, b) {
    if (!a || !b) { return false; }
    if (a === b) { return true; }
    const s = a.length <= b.length ? a : b, l = s === a ? b : a;
    return s.length >= 4 && (" " + l + " ").indexOf(" " + s + " ") !== -1;
  }
  function seasonTransfers() {
    return allTransfers.filter(function (t) { return (t.season || 1) === currentSeason; }).slice().reverse();   // oldest first
  }
  function isNewSigning(t) { return t.from_team === "NEW"; }
  function transfersOn() { return !!(SEASONS[currentSeason] && SEASONS[currentSeason].transfers); }

  function squadAnalysis() {
    const codes = Object.keys(teams), tr = seasonTransfers(), rows = {}, issues = [], seen = {};
    codes.forEach(function (c) {
      const list = playerList((squads[c] || { players: "" }).players);
      rows[c] = { code: c, size: list.length, gk: list.filter(function (p) { return /\bGK\b|goalkeeper/i.test(p); }).length,
                  names: list.map(normName), inn: 0, out: 0 };
      rows[c].names.forEach(function (n) { if (n) { seen[n] = seen[n] || []; if (seen[n].indexOf(c) === -1) { seen[n].push(c); } } });
    });
    codes.forEach(function (c) {
      const r = rows[c];
      if (!r.size) { issues.push(teams[c] + ": squad not added yet."); return; }
      if (r.size < 23 || r.size > 25) { issues.push(teams[c] + ": " + r.size + " players (expected 23 to 25)."); }
      if (!r.gk) { issues.push(teams[c] + ": no goalkeeper tagged (GK)."); }
    });
    Object.keys(seen).forEach(function (n) {
      if (seen[n].length > 1) { issues.push("\"" + n + "\" appears in " + seen[n].map(function (c) { return teams[c]; }).join(" and ") + "."); }
    });
    tr.forEach(function (t) {
      const n = normName(t.player), from = rows[t.from_team], to = rows[t.to_team];
      if (to) { to.inn++; if (to.size && !to.names.some(function (x) { return sameName(x, n); })) { issues.push(t.player + " moved to " + teams[t.to_team] + " but is not in that squad."); } }
      if (from) { from.out++; if (from.size && from.names.some(function (x) { return sameName(x, n); })) { issues.push(t.player + " moved to " + (teams[t.to_team] || "?") + " but is still in the " + teams[t.from_team] + " squad."); } }
    });
    return { rows: rows, issues: issues, transfers: tr };
  }

  function squadAnalysisHtml() {

    const total = codes.reduce(function (n, c) { return n + a.rows[c].size; }, 0);

  // ---------- find transfers by comparing last season's squads with this season's (admin) ----------
  let detected = null;
  function cleanPlayer(p) { return String(p).replace(/\(.*?\)/g, "").replace(/\s+/g, " ").trim(); }

  function detectTransfers() {
    if (!isAdmin) { return; }
    const prevNo = currentSeason - 1, codes = Object.keys(teams), prevN = {}, curN = {}, prevRaw = {}, curRaw = {};
    const prevRows = allSquads.filter(function (r) { return (r.season || 1) === prevNo; });
    if (!prevRows.length) { setStatus("No squads found in " + (SEASONS[prevNo] ? SEASONS[prevNo].name : "Season " + prevNo) + "."); return; }
    prevRows.forEach(function (r) { prevRaw[r.team] = playerList(r.players || ""); });
    codes.forEach(function (c) {
      prevRaw[c] = prevRaw[c] || [];
      curRaw[c] = playerList((squads[c] || { players: "" }).players);
      prevN[c] = prevRaw[c].map(normName); curN[c] = curRaw[c].map(normName);
    });
    if (!codes.some(function (c) { return curRaw[c].length; })) { setStatus("Add the " + SEASONS[currentSeason].name + " squads first."); return; }
    function findIn(map, n, skip) {
      let hit = codes.find(function (c) { return c !== skip && map[c].some(function (x) { return x === n; }); });
      if (!hit) { hit = codes.find(function (c) { return c !== skip && map[c].some(function (x) { return sameName(x, n); }); }); }
      return hit;
    }
    const have = seasonTransfers(), moves = [], fresh = [], gone = [];
    codes.forEach(function (c) {
      curRaw[c].forEach(function (p, i) {
        const n = curN[c][i];
        if (!n || prevN[c].some(function (x) { return sameName(x, n); })) { return; }
        const from = findIn(prevN, n, c);
        if (from) {
          const done = have.some(function (t) { return t.to_team === c && sameName(normName(t.player), n); });
          moves.push({ player: cleanPlayer(p), from: from, to: c, done: done });
        } else {
          const done = have.some(function (t) { return t.to_team === c && sameName(normName(t.player), n); });
          fresh.push({ team: c, player: cleanPlayer(p), done: done });
        }
      });
      prevRaw[c].forEach(function (p, i) {
        const n = prevN[c][i];
        if (!n || curN[c].some(function (x) { return sameName(x, n); })) { return; }
        if (!findIn(curN, n, c)) { gone.push({ team: c, player: cleanPlayer(p) }); }
      });
    });
    detected = { prevNo: prevNo, moves: moves, fresh: fresh, gone: gone };
    render();
  }

  // =====================================================================
  //  SHARED HELPERS: played matches in order, table after N rounds
  // =====================================================================
  var newsRound = -1, cardTeam = "all", cardSort = "ovr", lastCards = [], wrState = null;

  function nth(n) { const v = n % 100, s = ["th", "st", "nd", "rd"]; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function hashStr(s) { let h = 7; for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; } return h; }
  function pickOne(arr, seed) { return arr[seed % arr.length]; }

  function chronoMatches() {
    const out = [];
    buildFixtures().forEach(function (rd, ri) {
      rd.forEach(function (m) {
        const r = results[m.id];
        if (isPlayed(r)) { out.push({ id: m.id, ri: ri, home: m.home, away: m.away, hg: Number(r.h), ag: Number(r.a) }); }
      });
    });
    return out;
  }
  function tableRowsUpTo(n) {
    const rows = {};
    Object.keys(teams).forEach(function (c) { rows[c] = { code: c, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0, form: [] }; });
    chronoMatches().filter(function (m) { return m.ri < n; }).forEach(function (m) {
      const h = rows[m.home], a = rows[m.away];
      h.p++; a.p++; h.gf += m.hg; h.ga += m.ag; a.gf += m.ag; a.ga += m.hg;
      if (m.hg > m.ag) { h.w++; a.l++; h.pts += 3; h.form.push("W"); a.form.push("L"); }
      else if (m.hg < m.ag) { a.w++; h.l++; a.pts += 3; a.form.push("W"); h.form.push("L"); }
      else { h.d++; a.d++; h.pts++; a.pts++; h.form.push("D"); a.form.push("D"); }
    });
    return Object.keys(rows).map(function (c) { return rows[c]; }).sort(function (x, y) {
      return y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf || teams[x.code].localeCompare(teams[y.code]);
    });
  }
  function posMap(tbl) { const o = {}; tbl.forEach(function (r, i) { o[r.code] = i + 1; }); return o; }

  // =====================================================================
  //  1. PUNDIT COMMENTARY
  // =====================================================================
  function punditReport(id) {
    const m = chronoMatches().find(function (x) { return x.id === id; });
    if (!m) { return null; }
    const seed = hashStr(id + "|" + currentSeason);
    const pre = tableRowsUpTo(m.ri), post = tableRowsUpTo(m.ri + 1), pp = posMap(pre), qp = posMap(post);
    function row(c) { return pre.find(function (r) { return r.code === c; }); }
    const H = teams[m.home], A = teams[m.away], tot = m.hg + m.ag, diff = Math.abs(m.hg - m.ag);
    let w = null, l = null;
    if (m.hg > m.ag) { w = m.home; l = m.away; } else if (m.ag > m.hg) { w = m.away; l = m.home; }
    const W = w ? teams[w] : "", L = l ? teams[l] : "";
    const wg = Math.max(m.hg, m.ag), lg = Math.min(m.hg, m.ag), score = wg + "-" + lg;
    const lines = [];

    // 1) the headline
    if (!w) {
      if (tot === 0) { lines.push(pickOne([H + " and " + A + " cancelled each other out in a goalless stalemate.", "Nothing to separate " + H + " and " + A + " as the match ended 0-0.", "A cagey goalless draw: both defences on top, both attacks quiet."], seed)); }
      else if (tot >= 4) { lines.push(pickOne(["What a game! " + H + " and " + A + " shared " + tot + " goals in a " + m.hg + "-" + m.ag + " thriller.", "End to end stuff: " + H + " " + m.hg + "-" + m.ag + " " + A + ", and the points are shared.", "Pure entertainment as " + H + " and " + A + " trade blows and settle for a draw."], seed)); }
      else { lines.push(pickOne(["Honours even: " + H + " " + m.hg + "-" + m.ag + " " + A + ".", H + " and " + A + " share the spoils in a " + m.hg + "-" + m.ag + " draw.", "A fair result, with " + H + " and " + A + " taking a point each."], seed)); }
    } else {
      const away = w === m.away, gap = m.ri > 0 ? pp[w] - pp[l] : 0;
      if (gap >= 4) { lines.push(pickOne(["SHOCK! " + W + " (" + nth(pp[w]) + ") stun " + L + " (" + nth(pp[l]) + ") with a " + score + " win.", "A huge upset: " + W + " climb out of the pack to beat " + L + " " + score + ".", "Nobody saw that coming. " + W + " topple " + L + " " + score + "."], seed)); }
      else if (diff >= 4) { lines.push(pickOne([W + " destroy " + L + " " + score + ". An absolute masterclass.", "A rout! " + W + " run riot with a " + score + " win over " + L + ".", L + " were simply blown away as " + W + " won " + score + "."], seed)); }
      else if (diff === 3) { lines.push(pickOne([W + " were ruthless in a " + score + " win over " + L + ".", "Total control from " + W + ", who beat " + L + " " + score + ".", W + " put " + L + " to the sword, " + score + "."], seed)); }
      else if (diff === 2) { lines.push(pickOne([W + " are good value for a " + score + " win against " + L + ".", "A solid " + score + " for " + W + (away ? " away from home" : "") + " against " + L + ".", W + " get the job done, beating " + L + " " + score + "."], seed)); }
      else if (tot >= 5) { lines.push(pickOne([W + " edge a " + tot + "-goal thriller, " + score + " against " + L + ".", "A wild one! " + W + " just about survive, winning " + score + " over " + L + "."], seed)); }
      else { lines.push(pickOne([W + " scrape past " + L + " " + score + " in a tight one.", "Fine margins decide it: " + W + " " + score + " " + L + ".", W + " take all three points " + (away ? "on the road " : "") + "with a narrow " + score + " win."], seed)); }
    }

    // 2) one detail: leader beaten, big clash, scorers, clean sheet or a streak
    const wr = w ? row(w) : null, lr = l ? row(l) : null;
    const sc = goalLog.filter(function (g) { return Number(g.round) === m.ri + 1 && (g.team === m.home || g.team === m.away); });
    const agg = {};
    sc.forEach(function (g) { const k = g.team + "|" + g.player; agg[k] = agg[k] || { team: g.team, player: g.player, goals: 0 }; agg[k].goals += g.goals; });
    const top = Object.keys(agg).map(function (k) { return agg[k]; }).sort(function (a, b) { return b.goals - a.goals; })[0];
    const detail = [];
    if (w && m.ri > 0 && pp[l] === 1) { detail.push("The league leaders have been beaten, and the title race just got interesting."); }
    if (m.ri > 0 && pp[m.home] <= 3 && pp[m.away] <= 3) { detail.push("A big clash between two top-three sides."); }
    if (top && top.goals >= 3) { detail.push(top.player + " grabbed a hat-trick for " + teams[top.team] + ". Remember the name!"); }
    else if (top && top.goals === 2) { detail.push(top.player + " bagged a brace for " + teams[top.team] + "."); }
    if (w && lg === 0) {
      const k = gkLog.find(function (g) { return g.match_ref === id && g.team === w; });
      detail.push(k ? k.player + " kept a clean sheet for " + W + (k.saves ? " with " + k.saves + " save" + (k.saves === 1 ? "" : "s") + "." : ".") : W + " kept a clean sheet.");
    }
    if (w) {
      const ws = endRun(wr.form, function (f) { return f === "W"; }) + 1, ls = endRun(lr.form, function (f) { return f === "L"; }) + 1;
      if (ws >= 3) { detail.push("That makes it " + ws + " wins in a row for " + W + "."); }
      if (ls >= 3) { detail.push(L + " have now lost " + ls + " on the bounce. The pressure is building."); }
    } else {
      [m.home, m.away].forEach(function (c) { const u = endRun(row(c).form, function (f) { return f !== "L"; }) + 1; if (u >= 4) { detail.push(teams[c] + " stay unbeaten, now " + u + " games without defeat."); } });
    }
    if (detail.length) { lines.push(detail[seed % detail.length]); }

    // 3) table effect
    if (w) {
      if (qp[w] === 1 && pp[w] !== 1 && m.ri > 0) { lines.push(W + " go top of the table."); }
      else if (qp[w] < pp[w] && m.ri > 0) { lines.push(W + " climb from " + nth(pp[w]) + " to " + nth(qp[w]) + "."); }
      else if (qp[l] > pp[l] && m.ri > 0) { lines.push(L + " slip down to " + nth(qp[l]) + "."); }
    }
    return { match: m, text: lines.join(" ") };
  }

  function punditBox(id) {
    const r = punditReport(id);
    return r ? "<div class='msec'><h4>🎙️ Pundit says</h4><div>" + esc(r.text) + "</div></div>" : "";
  }

  function punditNewsHtml() {
    const ms = chronoMatches();
    if (!ms.length) { return ""; }
    const rounds = []; ms.forEach(function (m) { if (rounds.indexOf(m.ri) === -1) { rounds.push(m.ri); } });
    const sel = rounds.indexOf(newsRound) === -1 ? rounds[rounds.length - 1] : newsRound;
    let html = "<div class='card' style='margin-top:16px'><h3>🎙️ Pundit match reports <span class='legend'>written automatically</span></h3>" +
      "<select onchange='newsRound=Number(this.value);render()'>" + rounds.map(function (ri) { return "<option value='" + ri + "'" + (ri === sel ? " selected" : "") + ">Round " + (ri + 1) + "</option>"; }).join("") + "</select>";
    ms.filter(function (m) { return m.ri === sel; }).forEach(function (m) {
      const r = punditReport(m.id);
      html += "<div class='tm' style='display:block;cursor:pointer' onclick=\"openMatch('" + m.id + "')\"><b>" + esc(teams[m.home]) + " " + m.hg + " - " + m.ag + " " + esc(teams[m.away]) + "</b><div class='legend' style='margin-top:4px'>" + esc(r.text) + "</div></div>";
    });
    return html + "</div>";
  }

  // =====================================================================
  //  2. UPSET AND DRAMA AWARDS
  // =====================================================================
  function dramaList() {
    const ms = chronoMatches();
    if (ms.length < 5) { return []; }
    const nR = Math.max.apply(null, ms.map(function (m) { return m.ri; })) + 1, cache = {};
    function pos(n) { return cache[n] || (cache[n] = posMap(tableRowsUpTo(n))); }
    let upset = null, thrash = null, thriller = null;
    const kill = {}, oneGoal = {}, draws = {}, out = [];
    ms.forEach(function (m) {
      const diff = Math.abs(m.hg - m.ag), tot = m.hg + m.ag, p = pos(m.ri);
      if (!thriller || tot > thriller.tot || (tot === thriller.tot && diff < thriller.diff)) { thriller = { m: m, tot: tot, diff: diff }; }
      if (m.hg === m.ag) { draws[m.home] = (draws[m.home] || 0) + 1; draws[m.away] = (draws[m.away] || 0) + 1; return; }
      const w = m.hg > m.ag ? m.home : m.away, l = w === m.home ? m.away : m.home;
      if (!thrash || diff > thrash.diff || (diff === thrash.diff && tot > thrash.tot)) { thrash = { m: m, diff: diff, tot: tot }; }
      if (diff === 1) { oneGoal[l] = (oneGoal[l] || 0) + 1; }
      if (m.ri > 0) {
        const gap = p[w] - p[l];
        if (gap >= 3 && (!upset || gap > upset.gap || (gap === upset.gap && diff > upset.diff))) { upset = { m: m, w: w, l: l, gap: gap, diff: diff, pw: p[w], pl: p[l] }; }
        if (p[l] <= 3 && p[w] > 3) { kill[w] = (kill[w] || 0) + 1; }
      }
    });
    function maxOf(map, min) {
      let best = 0, codes = [];
      Object.keys(map).forEach(function (c) { if (map[c] > best) { best = map[c]; codes = [c]; } else if (map[c] === best) { codes.push(c); } });
      return best >= min ? { n: best, codes: codes } : null;
    }
    function names(codes) { return codes.map(function (c) { return teams[c]; }).join(" & "); }
    function sc(m) { return teams[m.home] + " " + m.hg + "-" + m.ag + " " + teams[m.away]; }
    if (upset) { out.push({ icon: "😱", title: "Biggest Upset", main: teams[upset.w], code: upset.w, detail: "Beat " + teams[upset.l] + " " + Math.max(upset.m.hg, upset.m.ag) + "-" + Math.min(upset.m.hg, upset.m.ag) + " in round " + (upset.m.ri + 1) + " (" + nth(upset.pw) + " beat " + nth(upset.pl) + ")" }); }
    const gk = maxOf(kill, 1);
    if (gk) { out.push({ icon: "🗡️", title: "Giant Killers", main: names(gk.codes), code: gk.codes[0], detail: gk.n + " win" + (gk.n === 1 ? "" : "s") + " over top-three sides from outside the top three" }); }
    if (thriller && thriller.tot >= 4) { out.push({ icon: "🎢", title: "Thriller of the Season", main: sc(thriller.m), detail: thriller.tot + " goals in round " + (thriller.m.ri + 1) }); }
    if (thrash && thrash.diff >= 3) { out.push({ icon: "💥", title: "Biggest Thrashing", main: sc(thrash.m), detail: "Won by " + thrash.diff + " goals in round " + (thrash.m.ri + 1) }); }
    const hl = maxOf(oneGoal, 2);
    if (hl) { out.push({ icon: "💔", title: "Hard Luck Club", main: names(hl.codes), code: hl.codes[0], detail: hl.n + " defeats by a single goal" }); }
    const dk = maxOf(draws, 3);
    if (dk) { out.push({ icon: "🤝", title: "Draw Kings", main: names(dk.codes), code: dk.codes[0], detail: dk.n + " draws" }); }
    let changes = 0, prev = null;
    for (let n = 1; n <= nR; n++) { const lead = tableRowsUpTo(n)[0].code; if (prev && lead !== prev) { changes++; } prev = lead; }
    if (changes >= 2) { out.push({ icon: "🔄", title: "Title Race Drama", main: changes + " lead changes", detail: "Top spot changed hands " + changes + " times after " + nR + " rounds" }); }
    if (nR >= 4) {
      const mid = Math.floor(nR / 2), pm = pos(mid), pn = pos(nR);
      let up = null, down = null;
      Object.keys(teams).forEach(function (c) {
        const d = pm[c] - pn[c];
        if (d >= 2 && (!up || d > up.d)) { up = { c: c, d: d }; }
        if (d <= -2 && (!down || d < down.d)) { down = { c: c, d: d }; }
      });
      if (up) { out.push({ icon: "🚀", title: "Biggest Climber", main: teams[up.c], code: up.c, detail: "Up " + up.d + " places since round " + mid + " (" + nth(pm[up.c]) + " to " + nth(pn[up.c]) + ")" }); }
      if (down) { out.push({ icon: "🪂", title: "Biggest Faller", main: teams[down.c], code: down.c, detail: "Down " + (-down.d) + " places since round " + mid + " (" + nth(pm[down.c]) + " to " + nth(pn[down.c]) + ")" }); }
    }
    return out;
  }

  function dramaHtml() {
    const list = dramaList();
    if (!list.length) { return ""; }
    return "<h3 style='margin:22px 0 10px'>🎭 Upsets &amp; Drama</h3><div class='po'>" + list.map(function (x) {
      return "<div class='pocard' style='border-left-color:var(--red)'><small>" + x.icon + " " + esc(x.title) + "</small><div style='display:flex;align-items:center;gap:10px'>" +
        (x.code ? "<span class='badge big'>" + esc(initials(teams[x.code])) + "</span>" : "") + "<div><b style='font-size:18px'>" + esc(x.main) + "</b><div class='legend'>" + esc(x.detail) + "</div></div></div></div>";
    }).join("") + "</div><p class='legend'>Drama awards are worked out from the table position of each team before every match.</p>";
  }

  // =====================================================================
  //  3. PLAYER CARDS
  // =====================================================================
  // Masters League uses plain base cards; Mini League uses every kind (tiers + special editions)
  function cardMode() { return SEASONS[currentSeason].league === "mini" ? "all" : "base"; }

  function playerCards() {
    const codes = Object.keys(teams), rows = buildStandings(), byCode = {};
    rows.forEach(function (r) { byCode[r.code] = r; });
    const gkRows = gkAgg([currentSeason]), potw = potwAll(), trs = transfersOn() ? seasonTransfers() : [], cards = [];
    codes.forEach(function (c) {
      const tr = byCode[c], ppg = tr && tr.played ? tr.points / tr.played : 1.3;
      playerList((squads[c] || { players: "" }).players).forEach(function (raw) {
        const name = cleanPlayer(raw), n = normName(raw);
        if (!n) { return; }
        const mine = goalLog.filter(function (g) { return g.team === c && sameName(normName(g.player), n); });
        let goals = 0; const per = {};
        mine.forEach(function (g) { goals += g.goals; const k = g.round ? "R" + g.round : g.stage ? "S" + g.stage : "#" + g.id; per[k] = (per[k] || 0) + g.goals; });
        const hat = Object.keys(per).filter(function (k) { return per[k] >= 3; }).length;
        const gk = gkRows.find(function (r) { return r.team === teams[c] && sameName(normName(r.player), n); });
        const isGK = /\bGK\b|goalkeeper/i.test(raw) || !!gk;
        const pw = potw.filter(function (w) { return w.team === c && sameName(normName(w.player), n); }).length;
        const t = trs.find(function (x) { return x.to_team === c && sameName(normName(x.player), n); });
        let ovr;
        if (isGK) {
          const x = gk || { m: 0, cs: 0, saves: 0, ga: 0 }, gpm = x.m ? x.ga / x.m : 1.2;
          ovr = 62 + x.cs * 2.5 + x.saves * 0.35 + pw * 3 + (ppg - 1.3) * 5 - (gpm - 1.2) * 4;
        } else { ovr = 60 + goals * 2.4 + hat * 4 + pw * 3 + (ppg - 1.3) * 5; }
        ovr = Math.max(50, Math.min(99, Math.round(ovr)));
        cards.push({ key: c + "|" + n, team: c, name: name, isGK: isGK, ovr: ovr, goals: goals, hat: hat, potw: pw, gk: gk || null, tp: tr ? tr.points : 0, joined: t || null,
                     tier: cardMode() === "base" ? "base" : ovr >= 85 ? "elite" : ovr >= 75 ? "gold" : ovr >= 65 ? "silver" : "bronze" });
      });
    });
    const topG = cards.reduce(function (m, x) { return Math.max(m, x.goals); }, 0);
    const topCs = cards.reduce(function (m, x) { return Math.max(m, x.gk ? x.gk.cs : 0); }, 0);
    cards.forEach(function (x) {
      x.boot = topG > 0 && x.goals === topG; x.glove = topCs > 0 && !!x.gk && x.gk.cs === topCs;
      // special editions exist in the Mini League only
      x.special = cardMode() === "all" ? (x.boot ? "boot" : x.glove ? "glove" : x.potw > 0 ? "star" : "") : "";
    });
    return cards;
  }

  function cardFace(x, i) {
    const stats = x.isGK
      ? [[x.gk ? x.gk.cs : 0, "CS"], [x.gk ? x.gk.saves : 0, "SV"], [x.gk && x.gk.m ? (x.gk.ga / x.gk.m).toFixed(1) : "-", "GA/M"], [x.potw, "POTW"]]
      : [[x.goals, "GLS"], [x.hat, "HAT"], [x.potw, "POTW"], [x.tp, "TEAM PTS"]];
    return "<div class='pcard " + (x.special || x.tier) + "' onclick='openCard(" + i + ")'>" + (x.special ? "<div class='pedi'>" + ({ boot: "GOLDEN BOOT", glove: "GOLDEN GLOVE", star: "PLAYER OF THE WEEK" })[x.special] + "</div>" : "") +
      "<div class='ptop'><div><div class='ovr'>" + x.ovr + "</div><div class='ppos'>" + (x.isGK ? "GK" : "PLR") + "</div></div><span class='pbdg'>" + esc(initials(teams[x.team])) + "</span></div>" +
      "<div class='pic'>" + (x.isGK ? "🧤" : "⚽") + "</div><div class='pnm'>" + esc(x.name) + "</div>" +
      "<div class='pst'>" + stats.map(function (s) { return "<span><b>" + s[0] + "</b> " + s[1] + "</span>"; }).join("") + "</div>" +
      "<div class='ptm'>" + esc(teams[x.team]) + "</div>" +
      "<div class='prib'>" + (x.boot ? "<i title='Golden Boot leader'>👟</i>" : "") + (x.glove ? "<i title='Golden Glove leader'>🧤</i>" : "") + (x.joined ? "<i title='Joined this season'>" + (isNewSigning(x.joined) ? "🆕" : "🔁") + "</i>" : "") + "</div></div>";
  }

  function pageCards() {
    let cards = playerCards();
    if (!cards.length) { return "<div class='card'><p class='legend'>Cards appear once squads are added for this season.</p></div>"; }
    const all = cardMode() === "all", counts = { elite: 0, gold: 0, silver: 0, bronze: 0, special: 0, base: 0 };
    cards.forEach(function (x) { if (x.special) { counts.special++; } if (counts[x.tier] !== undefined) { counts[x.tier]++; } });
    cards = cards.filter(function (x) { return cardTeam === "all" || x.team === cardTeam; });
    cards.sort(function (a, b) {
      if (cardSort === "goals") { return b.goals - a.goals || b.ovr - a.ovr || a.name.localeCompare(b.name); }
      if (cardSort === "name") { return a.name.localeCompare(b.name); }
      return b.ovr - a.ovr || b.goals - a.goals || a.name.localeCompare(b.name);
    });
    lastCards = cards;
    let html = "<p class='legend'><b>" + (all ? "Mini League cards: every kind of card." : "Masters League cards: base cards.") + "</b> " + (all ? "Bronze, silver, gold and elite tiers, plus special editions for the Golden Boot leader, Golden Glove leader and Players of the Week. " : "One standard card for every player, with no tiers or special editions. ") + "Every player gets a card. Ratings come from real goals, hat-tricks, clean sheets, saves, Player of the Week awards and team results, so they change after every round. Tap a card for the breakdown.</p>" +
      "<div class='row' style='display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0'><select onchange=\"cardTeam=this.value;render()\"><option value='all'>All teams</option>" +
      Object.keys(teams).map(function (c) { return "<option value='" + c + "'" + (c === cardTeam ? " selected" : "") + ">" + esc(teams[c]) + "</option>"; }).join("") + "</select>" +
      "<select onchange=\"cardSort=this.value;render()\"><option value='ovr'" + (cardSort === "ovr" ? " selected" : "") + ">Sort: rating</option><option value='goals'" + (cardSort === "goals" ? " selected" : "") + ">Sort: goals</option><option value='name'" + (cardSort === "name" ? " selected" : "") + ">Sort: name</option></select>" +
      "<span class='legend'>" + (all ? "✨ " + counts.elite + " elite · 🥇 " + counts.gold + " gold · 🥈 " + counts.silver + " silver · 🥉 " + counts.bronze + " bronze · 🌟 " + counts.special + " special" : counts.base + " base cards") + "</span></div>" +
      "<div class='pc-grid'>" + cards.map(cardFace).join("") + "</div>";
    return html;
  }

  function openCard(i) {
    const x = lastCards[i];
    if (!x) { return; }
    const lines = [];
    if (x.isGK) {
      const g = x.gk || { m: 0, cs: 0, saves: 0, ga: 0 };
      lines.push("Base 62", "Clean sheets: " + g.cs + " (+" + (g.cs * 2.5).toFixed(1) + ")", "Saves: " + g.saves + " (+" + (g.saves * 0.35).toFixed(1) + ")", "Player of the Week: " + x.potw + " (+" + (x.potw * 3) + ")", "Goals conceded per match: " + (g.m ? (g.ga / g.m).toFixed(2) : "n/a"));

  function hallData() {
    const by = {}, boots = {}, ORDER = ["q1", "ko1", "ko2", "el", "el1", "q2", "f"];
    function get(n) { return by[n] || (by[n] = { name: n, p: 0, lp: 0, pp: 0, cs: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0, seq: [], tr: [] }); }
    Object.keys(SEASONS).map(Number).sort(function (a, b) { return a - b; }).forEach(function (no) {
      const cfg = SEASONS[no], sum = seasonSummary(no);
      withSeason(no, function () {
        const rows = buildStandings(), badges = computeBadges(rows);
        getPlayedMatches().forEach(function (m) { if (m.awayGoals === 0) { get(cfg.teams[m.home]).cs++; } if (m.homeGoals === 0) { get(cfg.teams[m.away]).cs++; } });
        rows.forEach(function (r) {
          const a = get(r.name);
          a.p += r.played; a.lp += r.played; a.w += r.won; a.d += r.drawn; a.l += r.lost; a.gf += r.gf; a.ga += r.ga; a.pts += r.points;
          r.form.forEach(function (f) { a.seq.push(f); });
          if (sum.complete) { badges[r.code].forEach(function (b) { a.tr.push({ icon: b.icon, title: b.name, season: fullName(no), rank: 1 }); }); }
        });
      });
      ORDER.forEach(function (st) {
        allPlayoffs.forEach(function (p) {
          if ((p.season || 1) !== no || p.stage !== st || p.home_goals == null || p.away_goals == null || p.home_goals === "" || p.away_goals === "") { return; }
          const hn = cfg.teams[p.home_team], an = cfg.teams[p.away_team];
          if (!hn || !an) { return; }
          const h = get(hn), a = get(an), hg = Number(p.home_goals), ag = Number(p.away_goals);
          h.p++; a.p++; h.pp++; a.pp++; if (ag === 0) { h.cs++; } if (hg === 0) { a.cs++; } h.gf += hg; h.ga += ag; a.gf += ag; a.ga += hg;
          if (hg > ag) { h.w++; a.l++; h.seq.push("W"); a.seq.push("L"); }
          else if (hg < ag) { a.w++; h.l++; h.seq.push("L"); a.seq.push("W"); }
          else { h.d++; a.d++; h.seq.push("D"); a.seq.push("D"); }
        });
      });
      if (sum.complete) {
        if (sum.champion) { get(sum.champion).tr.push({ icon: "🏆", title: "League Champions", season: sum.name, rank: 5 }); }
        get(sum.shield.name).tr.push({ icon: "🛡️", title: "League Shield", season: sum.name, rank: 3 });
        sum.boot.forEach(function (b) { get(b.team).tr.push({ icon: "👟", title: "Golden Boot", season: sum.name, rank: 2 }); });
        if (sum.pots) { sum.pots.players.forEach(function (pw) { get(pw.team).tr.push({ icon: "🌟", title: "Player of the Season", season: sum.name + " · " + pw.player, rank: 4 }); }); }
      }
      allGoals.forEach(function (g) {
        if ((g.season || 1) !== no) { return; }
        const k = (cfg.teams[g.team] || g.team) + "|" + g.player; boots[k] = (boots[k] || 0) + g.goals;
      });
    });
    Object.keys(by).forEach(function (k) {
      const a = by[k]; let run = 0, best = 0;

    const table = buildStandings(), six = SEASONS[currentSeason].playoff !== "four";
    const t = table.slice(0, six ? 6 : 4).map(function (r) { return r.code; });
    const list = [];
    const q1w = validWinner("q1", t[0], t[1]);
    const q1l = q1w ? (q1w === t[0] ? t[1] : t[0]) : null;
    list.push({ stage: "q1", a: t[0], b: t[1] });
    let feeder;
    if (six) {
      const k1 = validWinner("ko1", t[2], t[5]), k2 = validWinner("ko2", t[3], t[4]);
      list.push({ stage: "ko1", a: t[2], b: t[5] }, { stage: "ko2", a: t[3], b: t[4] }, { stage: "el1", a: k1, b: k2 });
      feeder = validWinner("el1", k1, k2);
    } else {
      list.push({ stage: "el", a: t[2], b: t[3] });
      feeder = validWinner("el", t[2], t[3]);
    }
    const q2w = validWinner("q2", q1l, feeder);
    list.push({ stage: "q2", a: q1l, b: feeder }, { stage: "f", a: q1w, b: q2w });
    const champion = validWinner("f", q1w, q2w);
    list.forEach(function (m) {
      m.title = STAGE_NAMES[m.stage];
      const s = playoffScores[m.stage];
      m.sc = (s && m.a && m.b && s.home === m.a && s.away === m.b) ? s : null;
      m.w = validWinner(m.stage, m.a, m.b);
    });
    return { list: list, champion: champion };
  }

  // ---------- every played match in the current season (league + playoffs) ----------
  function matchRefs() {
    const out = [];
    buildFixtures().forEach(function (round, ri) {
      round.forEach(function (m) {
        const r = results[m.id];
        if (isPlayed(r)) { out.push({ ref: m.id, kind: "league", ri: ri, label: "R" + (ri + 1), home: m.home, away: m.away, hg: Number(r.h), ag: Number(r.a) }); }
      });
    });
    PO_ORDER.forEach(function (st) {
      const s = playoffScores[st];
      if (s && teams[s.home] && teams[s.away]) { out.push({ ref: st, kind: "playoff", ri: null, label: STAGE_NAMES[st] || st, home: s.home, away: s.away, hg: s.hg, ag: s.ag }); }
    });
    return out;
  }

  function cleanSheetRows() {
    const rows = {};
    Object.keys(teams).forEach(function (c) { rows[c] = { code: c, name: teams[c], p: 0, cs: 0, ga: 0 }; });
    matchRefs().forEach(function (m) {
      rows[m.home].p++; rows[m.away].p++;
      rows[m.home].ga += m.ag; rows[m.away].ga += m.hg;
      if (m.ag === 0) { rows[m.home].cs++; }
      if (m.hg === 0) { rows[m.away].cs++; }
    });
    return Object.keys(rows).map(function (c) { return rows[c]; }).sort(function (a, b) { return b.cs - a.cs || a.ga - b.ga || a.name.localeCompare(b.name); });
  }

  // goalkeeper totals; goals conceded and clean sheets come from the fixture results
  function gkAgg(nos) {
    const map = {};
    nos.forEach(function (no) {
      withSeason(no, function () {
        const refs = {};
        matchRefs().forEach(function (m) { refs[m.ref] = m; });
        gkLog.forEach(function (g) {
          const m = refs[g.match_ref];
          if (!m) { return; }
          const conc = (m.home === g.team) ? m.ag : m.hg;
          const tn = SEASONS[no].teams[g.team] || g.team, k = tn + "|" + g.player;
          const x = map[k] || (map[k] = { team: tn, player: g.player, m: 0, saves: 0, ga: 0, cs: 0 });
          x.m++; x.saves += g.saves || 0; x.ga += conc;
          if (conc === 0) { x.cs++; }
        });
      });
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) {
      return b.cs - a.cs || (a.ga / a.m) - (b.ga / b.m) || b.saves - a.saves || a.player.localeCompare(b.player);
    });
  }

    const res = await sb.from("gk_stats").upsert({ season: currentSeason, match_ref: ref, team: team, player: player, saves: saves }, { onConflict: "season,match_ref,team" }).select();
    if (res.error) { setStatus("Could not save: " + res.error.message); return; }
    allGk = allGk.filter(function (g) { return !((g.season || 1) === currentSeason && g.match_ref === ref && g.team === team); }).concat(res.data);

    gkSel = { ref: ref, team: m ? (m.home === team ? m.away : m.home) : "" };

  // ---------- hat-trick club ----------
  function hatTrickList(nos) {
    const out = [];
    nos.forEach(function (no) {
      withSeason(no, function () {
        const cfg = SEASONS[no], agg = {};
        goalLog.forEach(function (g) {
          const w = g.round ? "R" + g.round : g.stage ? "S" + g.stage : "#" + g.id;
          const k = g.team + "|" + g.player + "|" + w;
          if (!agg[k]) { agg[k] = { team: g.team, player: g.player, round: g.round, stage: g.stage, goals: 0 }; }
          agg[k].goals += g.goals;
        });
        Object.keys(agg).forEach(function (k) {
          const x = agg[k];
          if (x.goals < 3) { return; }
          let where = "match not set", vs = "";
          if (x.round) {
            where = "Round " + x.round;
            const m = (buildFixtures()[x.round - 1] || []).find(function (f) { return f.home === x.team || f.away === x.team; });
            if (m) {
              const opp = m.home === x.team ? m.away : m.home, r = results[m.id];
              vs = "vs " + teams[opp] + (isPlayed(r) ? " (" + r.h + "-" + r.a + ")" : "");
            }
          } else if (x.stage) {
            where = STAGE_NAMES[x.stage] || x.stage;
            const s = playoffScores[x.stage];
            if (s && (s.home === x.team || s.away === x.team)) { vs = "vs " + teams[s.home === x.team ? s.away : s.home] + " (" + s.hg + "-" + s.ag + ")"; }
          }
          out.push({ player: x.player, team: cfg.teams[x.team] || x.team, goals: x.goals, season: no, where: where, vs: vs });
        });
      });
    });
    return out;
  }

  function hatClub(list) {
    const m = {};
    list.forEach(function (h) {
      const k = h.team + "|" + h.player;
      const x = m[k] || (m[k] = { team: h.team, player: h.player, n: 0, best: 0, items: [] });
      x.n++; x.best = Math.max(x.best, h.goals); x.items.push(h);
    });
    return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return b.n - a.n || b.best - a.best || a.player.localeCompare(b.player); });
  }

  function hatClubHtml(list, showLeague) {
    const club = hatClub(list);
    if (!club.length) { return "<div class='card'><h3>🎩 Hat-trick club</h3><p class='legend'>No hat-tricks yet. A hat-trick is 3 or more goals by one player in one match. Choose the round or playoff stage when adding goals.</p></div>"; }
    return "<div class='card'><h3>🎩 Hat-trick club <span class='legend'>" + club.length + " player" + (club.length === 1 ? "" : "s") + " · " + list.length + " hat-trick" + (list.length === 1 ? "" : "s") + "</span></h3>" + club.map(function (c) {
      return "<div class='tm' style='align-items:flex-start'><span><span class='badge'>" + esc(initials(c.team)) + "</span><b>" + esc(c.player) + "</b> <span class='legend'>" + esc(c.team) + "</span><div class='legend' style='margin:4px 0 0 38px'>" +
        c.items.map(function (h) { return (showLeague ? esc(fullName(h.season)) + " · " : "") + esc(h.where) + " · " + h.goals + " goals" + (h.vs ? " " + esc(h.vs) : ""); }).join("<br>") + "</div></span><b style='font:400 28px var(--font-head)'>" + c.n + "×</b></div>";
    }).join("") + "</div>";
  }

  // ---------- player of the week (automatic) ----------
  function potwForRound(ri) {
    const fx = buildFixtures()[ri] || [], outcome = {}, players = {};
    let played = 0;
    fx.forEach(function (m) {
      const r = results[m.id];
      if (!isPlayed(r)) { return; }
      played++;
      const h = Number(r.h), a = Number(r.a);
      outcome[m.home] = { res: h > a ? "W" : h < a ? "L" : "D", gf: h, ga: a, id: m.id };
      outcome[m.away] = { res: a > h ? "W" : a < h ? "L" : "D", gf: a, ga: h, id: m.id };
    });
    if (!played) { return null; }
    function get(team, player) { const k = team + "|" + player; return players[k] || (players[k] = { team: team, player: player, goals: 0, saves: 0, gk: false, cs: false, score: 0 }); }
    goalLog.forEach(function (g) { if (Number(g.round) === ri + 1 && outcome[g.team]) { get(g.team, g.player).goals += g.goals; } });
    gkLog.forEach(function (k) {
      const o = outcome[k.team];
      if (!o || k.match_ref !== o.id) { return; }
      const p = get(k.team, k.player);
      p.gk = true; p.saves = k.saves || 0; p.cs = o.ga === 0;
    });
    let best = null;
    Object.keys(players).forEach(function (k) {
      const p = players[k], o = outcome[p.team];
      p.res = o.res; p.gf = o.gf; p.ga = o.ga;
      p.score = p.goals * 3 + (p.goals >= 3 ? 3 : 0) + (o.res === "W" ? 2 : o.res === "D" ? 1 : 0);
      if (p.gk) { p.score += (p.cs ? 4 : 0) + p.saves * 0.5 - o.ga * 0.5; }
      if (!best || p.score > best.score || (p.score === best.score && (p.goals > best.goals || (p.goals === best.goals && p.saves > best.saves)))) { best = p; }
    });
    if (!best) { return null; }
    const parts = [];
    if (best.goals) { parts.push(best.goals + " goal" + (best.goals === 1 ? "" : "s")); }
    if (best.gk) { parts.push((best.cs ? "clean sheet, " : "") + best.saves + " save" + (best.saves === 1 ? "" : "s")); }
    parts.push(best.res + " " + best.gf + "-" + best.ga);
    return { player: best.player, team: best.team, score: best.score, goals: best.goals, saves: best.saves, round: ri + 1, complete: played === fx.length, detail: parts.join(" · ") };
  }
  function potwAll() {
    const out = [];
    for (let ri = 0; ri < SCHEDULE.length; ri++) { const w = potwForRound(ri); if (w) { out.push(w); } }
    return out;
  }
  function potwCard(ri) {
    const w = potwForRound(ri);
    if (!w) { return ""; }
    return "<div class='card hl'><h3><span>⭐ Player of the Week · Round " + (ri + 1) + "</span><span class='legend'>" + (w.complete ? "Final" : "Provisional") + "</span></h3><div class='tor'><div class='chip'><span class='badge'>" + esc(initials(teams[w.team])) + "</span><div><b>" + esc(w.player) + "</b><small>" + esc(teams[w.team]) + " · " + esc(w.detail) + "</small></div></div></div>" +
      "<p class='legend'>Picked automatically from goals, goalkeeper stats and the team result (needs goals or keepers logged for the round).</p></div>";
  }

  // ---------- player of the season (vote) ----------
  function voteTally(votes, teamMap) {
    const m = {};
    votes.forEach(function (v) {
      const k = v.candidate_team + "|" + v.player;
      if (!m[k]) { m[k] = { code: v.candidate_team, team: teamMap[v.candidate_team] || v.candidate_team, player: v.player, n: 0 }; }
      m[k].n++;
    });
    return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return b.n - a.n || a.player.localeCompare(b.player); });
  }
  function potsWinner(no) {
    const t = voteTally(allVotes.filter(function (v) { return (v.season || 1) === no; }), SEASONS[no].teams);
    if (!t.length) { return null; }
    return { players: t.filter(function (x) { return x.n === t[0].n; }), votes: t[0].n };
  }

  function seasonPlayers() {
    const rows = buildStandings(), n = rows.length, pos = {}, map = {}, per = {};
    rows.forEach(function (r, i) { pos[r.name] = i; });
    function get(team, player) { const k = team + "|" + player; return map[k] || (map[k] = { team: team, player: player, goals: 0, hat: 0, cs: 0, saves: 0, potw: 0, score: 0 }); }
    goalLog.forEach(function (g) {
      const tn = teams[g.team] || g.team, p = get(tn, g.player);
      p.goals += g.goals;
      const k = tn + "|" + g.player + "|" + (g.round ? "R" + g.round : g.stage ? "S" + g.stage : "#" + g.id);
      per[k] = per[k] || { p: p, n: 0 }; per[k].n += g.goals;
    });
    Object.keys(per).forEach(function (k) { if (per[k].n >= 3) { per[k].p.hat++; } });
    gkAgg([currentSeason]).forEach(function (g) { const p = get(g.team, g.player); p.cs = g.cs; p.saves = g.saves; });
    potwAll().forEach(function (w) { get(teams[w.team], w.player).potw++; });
    return Object.keys(map).map(function (k) {
      const p = map[k], ps = pos[p.team] == null ? n : pos[p.team];
      p.score = p.goals * 2 + p.hat * 3 + p.cs * 2 + p.saves * 0.2 + p.potw * 3 + Math.max(0, n - 1 - ps) * 0.4;
      return p;
    }).sort(function (a, b) { return b.score - a.score || b.goals - a.goals || a.player.localeCompare(b.player); });
  }

  async function castVote() {

    const res = await sb.from("potm_votes").insert({ season: currentSeason, voter_team: voter, candidate_team: code, player: player }).select();
    if (res.error) { setStatus(/duplicate|unique/i.test(res.error.message) ? "That team has already voted." : "Could not vote: " + res.error.message); return; }
    allVotes = allVotes.concat(res.data);

  // ---------- all matches across every league (rivalries, best results) ----------
  function allMatchList() {
    const out = [];
    Object.keys(SEASONS).map(Number).forEach(function (no) {
      const cfg = SEASONS[no], res = {};
      allResults.forEach(function (r) { if ((r.season || 1) === no) { res[r.id] = r; } });
      cfg.schedule.forEach(function (round, ri) {
        round.forEach(function (code, i) {
          const r = res["R" + (ri + 1) + "-" + (i + 1)];
          if (!r || r.home_goals == null || r.away_goals == null) { return; }
          const t = code.split("-");
          out.push({ season: no, home: cfg.teams[t[0]], away: cfg.teams[t[1]], hg: r.home_goals, ag: r.away_goals, po: false, label: "Round " + (ri + 1) });
        });
      });
      allPlayoffs.forEach(function (p) {
        if ((p.season || 1) !== no || p.home_goals == null || p.away_goals == null || !p.home_team || !p.away_team) { return; }
        if (!cfg.teams[p.home_team] || !cfg.teams[p.away_team]) { return; }
        out.push({ season: no, home: cfg.teams[p.home_team], away: cfg.teams[p.away_team], hg: p.home_goals, ag: p.away_goals, po: true, label: STAGE_NAMES[p.stage] || p.stage });
      });
    });
    return out;
  }

  function rivalryRows() {
    const map = {};
    allMatchList().forEach(function (m) {
      const a = m.home < m.away ? m.home : m.away, b = a === m.home ? m.away : m.home, k = a + "|" + b;
      const ag = a === m.home ? m.hg : m.ag, bg = a === m.home ? m.ag : m.hg;
      const x = map[k] || (map[k] = { a: a, b: b, p: 0, aw: 0, d: 0, bw: 0, ag: 0, bg: 0 });
      x.p++; x.ag += ag; x.bg += bg;
      if (ag > bg) { x.aw++; } else if (ag < bg) { x.bw++; } else { x.d++; }
    });
    return Object.keys(map).map(function (k) { return map[k]; });
  }

  function rivalLine(x, dom) {
    let a = x.a, b = x.b, aw = x.aw, bw = x.bw, ag = x.ag, bg = x.bg;
    if (dom && bw > aw) { a = x.b; b = x.a; aw = x.bw; bw = x.aw; ag = x.bg; bg = x.ag; }
    return "<div class='tm'><span><span class='badge'>" + esc(initials(a)) + "</span><b>" + esc(a) + "</b> <span class='legend'>vs</span> <b>" + esc(b) + "</b><div class='legend' style='margin-left:38px'>" + x.p + " played · " + esc(a) + " " + aw + "W " + x.d + "D " + bw + "L · goals " + ag + "-" + bg + "</div></span><b style='font:400 26px var(--font-head)'>" + (dom ? (ag - bg > 0 ? "+" : "") + (ag - bg) : x.p) + "</b></div>";
  }

  function pageRivalries() {
    const all = rivalryRows();
    if (!all.length) { return "<div class='card'><p class='legend'>Rivalries appear after the first results.</p></div>"; }
    const most = all.slice().sort(function (x, y) { return y.p - x.p || Math.abs(x.aw - x.bw) - Math.abs(y.aw - y.bw) || (y.ag + y.bg) - (x.ag + x.bg); }).slice(0, 8);
    const one = all.filter(function (x) { return x.p >= 2 && x.aw !== x.bw; }).sort(function (x, y) {
      return Math.abs(y.aw - y.bw) / y.p - Math.abs(x.aw - x.bw) / x.p || Math.abs(y.ag - y.bg) - Math.abs(x.ag - x.bg) || y.p - x.p;
    }).slice(0, 8);
    return "<p class='legend'>Head-to-head records across every league, playoffs included.</p>" +
      "<div class='card'><h3>🔥 Most played</h3>" + most.map(function (x) { return rivalLine(x, false); }).join("") + "</div>" +
      "<div class='card'><h3>💥 Most one-sided</h3>" + (one.length ? one.map(function (x) { return rivalLine(x, true); }).join("") + "<p class='legend'>At least 2 meetings. The number on the right is the goal difference for the dominant team.</p>" : "<p class='legend'>Needs two meetings with a clear winner.</p>") + "</div>";
  }

  // ---------- season comparison chart ----------
  function lineChart(series, maxX, maxY) {
    const W = 640, H = 300, L = 34, B = 24, T = 10, R = 10;
    const x = function (i) { return L + (W - L - R) * i / Math.max(maxX, 1); }, y = function (v) { return T + (H - T - B) * (1 - v / Math.max(maxY, 1)); };
    let svg = "<svg viewBox='0 0 " + W + " " + H + "' style='width:100%;height:auto'>";
    for (let g = 0; g <= 4; g++) { const v = Math.round(maxY * g / 4); svg += "<line x1='" + L + "' x2='" + (W - R) + "' y1='" + y(v) + "' y2='" + y(v) + "' stroke='var(--line)'/><text x='4' y='" + (y(v) + 4) + "' fill='var(--muted)' font-size='11'>" + v + "</text>"; }
    for (let i = 0; i <= maxX; i++) { svg += "<text x='" + x(i) + "' y='" + (H - 6) + "' fill='var(--muted)' font-size='10' text-anchor='middle'>" + (i || "") + "</text>"; }
    series.forEach(function (s) {
      svg += "<polyline fill='none' stroke='" + s.color + "' stroke-width='3' stroke-linejoin='round' points='" + s.pts.map(function (v, i) { return x(i) + "," + y(v); }).join(" ") + "'/>";
      const last = s.pts.length - 1; svg += "<circle cx='" + x(last) + "' cy='" + y(s.pts[last]) + "' r='4' fill='" + s.color + "'/>";
    });
    return svg + "</svg><div class='legend' style='display:flex;flex-wrap:wrap;gap:4px 14px'>" + series.map(function (s) { return "<span><b style='color:" + s.color + "'>●</b> " + esc(s.label) + "</span>"; }).join("") + "</div>";
  }

  function teamSeasonLines(name) {
