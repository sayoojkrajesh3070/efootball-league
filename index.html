          const played = r.score !== "vs";
          ctx.fillStyle = played ? CARDC.red : CARDC.line; cardRR(ctx, W / 2 - 92, mid - 38, 184, 60, 10); ctx.fill();
          ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.font = "400 " + (played ? 52 : 34) + "px " + HEADF; ctx.fillText(r.score, W / 2, mid - 6);
          if (r.note) { ctx.fillStyle = CARDC.muted; ctx.font = "600 17px " + BODYF; ctx.fillText(r.note, W / 2, y + h - 14); }
        } else if (r.t === "table") {
          if (r.hl) { ctx.fillStyle = CARDC.red; ctx.fillRect(x0, y + 8, 6, h - 16); }
          ctx.fillStyle = CARDC.gold; ctx.textAlign = "center"; ctx.font = "400 40px " + HEADF; ctx.fillText(String(r.pos), x0 + 44, mid + 3);
          cardBadge(ctx, logos, r.name, x0 + 106, mid, 26);
          ctx.fillStyle = CARDC.text; ctx.textAlign = "left"; cardFont(ctx, r.name, 330, 27, "700", BODYF, 17); ctx.fillText(r.name, x0 + 148, mid);
          ctx.textAlign = "right"; ctx.fillStyle = CARDC.muted; ctx.font = "600 26px " + BODYF; ctx.fillText(String(r.p), W - PAD - 330, mid); ctx.fillText(r.gd, W - PAD - 215, mid);
          ctx.fillStyle = "#fff"; ctx.font = "400 46px " + HEADF; ctx.fillText(String(r.pts), W - PAD - 30, mid + 3);
        } else if (r.t === "stat") {
          ctx.fillStyle = CARDC.gold; ctx.textAlign = "center"; ctx.font = "400 40px " + HEADF; ctx.fillText(String(r.rank), x0 + 44, mid + 3);
          cardBadge(ctx, logos, r.team, x0 + 106, mid, 28);
          ctx.fillStyle = CARDC.text; ctx.textAlign = "left"; cardFont(ctx, r.name, 520, 28, "700", BODYF, 18); ctx.fillText(r.name, x0 + 152, mid - 12);
          ctx.fillStyle = CARDC.muted; cardFont(ctx, r.sub, 520, 20, "600", BODYF, 14); ctx.fillText(r.sub, x0 + 152, mid + 20);
          ctx.fillStyle = "#fff"; ctx.textAlign = "right"; ctx.font = "400 54px " + HEADF; ctx.fillText(String(r.value), x0 + w0 - 30, mid + 3);
        } else if (r.t === "award") {
          ctx.textAlign = "center"; ctx.font = "44px " + BODYF; ctx.fillStyle = "#fff"; ctx.fillText(r.icon, x0 + 60, mid);
          ctx.textAlign = "left"; ctx.fillStyle = CARDC.gold; ctx.font = "700 18px " + BODYF; ctx.fillText(r.title.toUpperCase(), x0 + 118, mid - 30);
          ctx.fillStyle = CARDC.text; cardFont(ctx, r.main, w0 - 160, 32, "700", BODYF, 18); ctx.fillText(r.main, x0 + 118, mid + 2);
          ctx.fillStyle = CARDC.muted; cardFont(ctx, r.detail, w0 - 160, 21, "600", BODYF, 13); ctx.fillText(r.detail, x0 + 118, mid + 34);
        }
      }
      y += h + GAP;
    });
    ctx.textBaseline = "alphabetic"; ctx.textAlign = "center";
    ctx.fillStyle = CARDC.red; ctx.fillRect(0, H - FOOT + 10, W, 4);
    ctx.fillStyle = "#fff"; ctx.font = "400 44px " + HEADF; ctx.fillText("EFOOTBALL FRIENDS LEAGUE", W / 2, H - 60);
    ctx.fillStyle = CARDC.muted; cardFont(ctx, siteUrl().replace(/^https?:\/\//, ""), W - 2 * PAD, 22, "600", BODYF, 14); ctx.fillText(siteUrl().replace(/^https?:\/\//, ""), W / 2, H - 24);
    return cv;
  }

  function showCardModal(cv, filename, caption) {
    cv.toBlob(function (blob) {
      if (!blob) { toast("Could not create the image.", "err"); return; }
      const url = URL.createObjectURL(blob);
      let file = null;
      try { file = new File([blob], filename, { type: "image/png" }); } catch (e) {}
      closeOverlay(true);
      const o = document.createElement("div");
      o.className = "ovl"; o.id = "ovl";
      o.innerHTML = "<div class='ovp'><button class='ovx' onclick='closeOverlay()'>✕</button><h3 style='margin:0 0 10px'>Share card</h3><img src='" + url + "' alt='League card' style='width:100%;border-radius:8px;border:1px solid var(--line)'>" +
        "<div style='display:flex;flex-wrap:wrap;gap:8px;margin-top:12px'><button class='btn' id='cardShare'>📤 Share</button><a class='btn out' href='" + url + "' download='" + filename + "' style='text-decoration:none;display:inline-flex;align-items:center'>⬇ Download</a></div>" +
        "<p class='legend'>Share opens your phone's share sheet (WhatsApp, etc.). If it does not, download the image and post it in the group.</p></div>";
      o.addEventListener("click", function (e) { if (e.target === o) { closeOverlay(); } });
      document.body.appendChild(o);
      document.getElementById("cardShare").onclick = function () {
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], text: caption || "" }).catch(function () {}); }
        else { toast("Sharing is not supported here. Use Download.", "err"); }
      };
    }, "image/png");
  }

  function cardSpec(kind) {
    const nm = fullName(currentSeason), q = qualifiers();
    if (kind === "round") {
      let rows, title, kicker, file;
      if (currentRound === "PO") {
        const b = bracketData();
        rows = b.list.map(function (m) { return { t: "match", home: m.a ? teams[m.a] : "TBD", away: m.b ? teams[m.b] : "TBD", score: m.sc ? m.sc.hg + " - " + m.sc.ag : "vs", note: m.title + (m.w ? " · " + teams[m.w] + " win" : "") }; });
        if (b.champion) { rows.push({ t: "award", icon: "🏆", title: "Champions", main: teams[b.champion], detail: nm }); }
        title = "PLAYOFFS"; kicker = ""; file = "playoffs.png";
      } else {
        const fx = buildFixtures()[currentRound];
        let n = 0;
        rows = fx.map(function (m) {
          const r = results[m.id], ok = isPlayed(r);
          if (ok) { n++; }
          return { t: "match", home: teams[m.home], away: teams[m.away], score: ok ? r.h + " - " + r.a : "vs", note: "" };
        });
        const w = potwForRound(currentRound);
        if (w) { rows.push({ t: "award", icon: "⭐", title: "Player of the Week", main: w.player + " (" + teams[w.team] + ")", detail: w.detail }); }
        title = "ROUND " + (currentRound + 1); kicker = n === fx.length ? " · Results" : n === 0 ? " · Fixtures" : " · Results & fixtures";
        file = "round-" + (currentRound + 1) + ".png";
      }
      return { title: title, sub: nm + (kicker || ""), rows: rows, file: file, caption: title + " · " + nm };
    }
    if (kind === "table") {
      const t = buildStandings(), last = lastPlayedRound();
      const rows = [{ t: "thead" }].concat(t.map(function (r, i) { const gd = r.gf - r.ga; return { t: "table", pos: i + 1, name: r.name, p: r.played, gd: gd > 0 ? "+" + gd : String(gd), pts: r.points, hl: i < q }; }));
      rows.push({ t: "line", text: "Red bar = playoff places (top " + q + ")" });
      return { title: "LEAGUE TABLE", sub: nm + (last ? " · After round " + last : ""), rows: rows, file: "table.png", caption: "League table · " + nm };
    }
    if (kind === "stats") {
      const played = getPlayedMatches(), goals = played.reduce(function (n, m) { return n + m.homeGoals + m.awayGoals; }, 0);
      const rows = [{ t: "line", text: played.length + " matches · " + goals + " goals · " + (played.length ? (goals / played.length).toFixed(1) : "0.0") + " per match" }];
      const boot = bootTotals().slice(0, 5), gk = gkAgg([currentSeason]).slice(0, 3), cs = cleanSheetRows().slice(0, 3).filter(function (r) { return r.cs > 0; });
      if (boot.length) { rows.push({ t: "head", text: "Golden Boot" }); boot.forEach(function (p, i) { rows.push({ t: "stat", rank: i + 1, name: p.player, team: teams[p.team], sub: teams[p.team], value: p.goals }); }); }
      if (gk.length) { rows.push({ t: "head", text: "Golden Glove" }); gk.forEach(function (g, i) { rows.push({ t: "stat", rank: i + 1, name: g.player, team: g.team, sub: g.team + " · " + g.saves + " saves · " + g.ga + " conceded", value: g.cs }); }); rows.push({ t: "line", text: "Value shown = clean sheets" }); }
      if (cs.length) { rows.push({ t: "head", text: "Clean sheets by team" }); cs.forEach(function (r, i) { rows.push({ t: "stat", rank: i + 1, name: r.name, team: r.name, sub: r.p + " played · " + r.ga + " conceded", value: r.cs }); }); }
      if (!boot.length && !gk.length) { rows.push({ t: "line", text: "Player stats appear after goals are logged." }); }
      return { title: "SEASON STATS", sub: nm, rows: rows, file: "stats.png", caption: "Season stats · " + nm };
    }
    if (kind === "awards") {
      const A = awardsList();
      if (!A.list.length) { return null; }
      return { title: "AWARDS", sub: nm + (A.done ? " · Final" : " · Provisional"), rows: A.list.map(function (x) { return { t: "award", icon: x.icon, title: x.title, main: x.main, detail: x.detail }; }), file: "awards.png", caption: "Awards · " + nm };
    }
    return null;
  }

  async function shareCard(kind) {
    const spec = cardSpec(kind);
    if (!spec) { toast("Nothing to share yet.", "err"); return; }
    toast("Building image…");
    try { const cv = await renderCard(spec); showCardModal(cv, spec.file, spec.caption); }
    catch (e) { toast("Could not build the image: " + e.message, "err"); }
  }


  // =============== START ===============
  async function start() {
    applySeason();
    buildSeasonSelect();
    const s = await sb.auth.getSession();
    isAdmin = !!(s.data && s.data.session);
    render();
    loadData();
    // refresh every 30 seconds, but not while someone is typing
    setInterval(function () {
      const tag = document.activeElement ? document.activeElement.tagName : "";
      if (tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA") { loadData(); }
    }, 30000);
  }


    let deferredInstall = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstall = e;
  });
  window.addEventListener("appinstalled", function () {
    deferredInstall = null;
    render();
  });

  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }

  function installButton() {
    return isStandalone() ? "" : "<button class='inst' onclick='installApp()'>📲 Install</button>";
  }

  async function installApp() {
    if (deferredInstall) {
      deferredInstall.prompt();
      await deferredInstall.userChoice;
      deferredInstall = null;
      render();
      return;
    }
    showInstallHelp();
  }

  function showInstallHelp() {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const steps = ios
      ? "<ol><li>Open this site in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with an arrow).</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol>"
      : "<ol><li>Open this site in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu (top right).</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>";
    const box = document.createElement("div");
    box.className = "modal";
    box.innerHTML = "<div class='modalbox'><h3>📲 Install the league app</h3>" + steps +
      "<p class='legend'>If you opened this link inside WhatsApp or another app, first choose <b>Open in browser</b> from its menu.</p>" +
      "<button class='btn' onclick='this.closest(\".modal\").remove()'>Got it</button></div>";
    box.addEventListener("click", function (e) { if (e.target === box) { box.remove(); } });
    document.body.appendChild(box);
  }

  start();
    // lets the site be installed as an app
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

</script>
