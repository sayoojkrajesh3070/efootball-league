<style>
  :root { --bg:#0b1220; --card:#131c2e; --line:#243049; --text:#e8edf5; --muted:#94a3b8;
          --accent:#2ecc88; --gold:#f5b301; --red:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Inter",system-ui,Arial,sans-serif; line-height:1.5; }
  h1,h2,h3,nav button,.rounds button { font-family:"Oswald","Inter",sans-serif; }

  header { background:linear-gradient(135deg,#5a0000,#7b0101 45%,#0b1220); padding:28px 16px 22px; border-bottom:1px solid var(--line); }
  .wrap { max-width:980px; margin:0 auto; }
  header h1 { margin:0; font-size:32px; letter-spacing:1px; text-transform:uppercase; }
  header p { margin:6px 0 0; color:#f1d6d6; font-size:14px; }

  nav { position:sticky; top:0; z-index:10; background:var(--card); border-bottom:1px solid var(--line); display:flex; overflow-x:auto; padding:0 8px; }
  nav button { background:none; border:0; color:var(--muted); font-size:16px; letter-spacing:.5px; padding:14px 18px; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; }
  nav button:hover { color:var(--text); }
  nav button.on { color:var(--accent); border-bottom-color:var(--accent); }
  main { padding:18px 14px 40px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  .card h2,.card h3 { margin:0 0 10px; }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:520px; }
  th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.6px; }
  th,td { padding:10px 8px; text-align:center; border-bottom:1px solid var(--line); }
  th.left,td.left { text-align:left; }
  tr.top4 td:first-child { box-shadow:inset 4px 0 0 var(--accent); }
  tr.top4 { background:rgba(46,204,136,.08); }
  td.pts { font-weight:800; font-size:16px; }
  .badge { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; background:#1e2a44; color:var(--accent); font-size:11px; font-weight:800; margin-right:8px; vertical-align:middle; }
  .form span { display:inline-block; width:20px; height:20px; line-height:20px; border-radius:4px; font-size:11px; font-weight:700; margin-right:2px; color:#fff; }
  .W { background:#16a34a; } .D { background:#6b7280; } .L { background:var(--red); }
  .legend { color:var(--muted); font-size:13px; margin:4px 2px; }

  .rounds { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .rounds button { background:var(--card); border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:6px 11px; cursor:pointer; font-size:14px; }
  .rounds button.on { background:var(--accent); color:#05281a; border-color:var(--accent); font-weight:700; }
  .match { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
  .match .h { text-align:right; } .match .a { text-align:left; }
  .score { min-width:70px; text-align:center; font-weight:800; font-size:18px; }
  input { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .match input { width:46px; text-align:center; font-weight:700; padding:7px 4px; }

  .po { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
  .pocard { background:var(--card); border:1px solid var(--line); border-left-width:6px; border-radius:14px; padding:14px; }
  .pocard small { color:var(--muted); display:block; margin-bottom:8px; }
  .pocard .vs { font-weight:600; margin-bottom:10px; }
  select { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:7px; width:100%; }
  .champ { text-align:center; font-size:22px; font-weight:800; color:var(--gold); background:rgba(245,179,1,.1); border:1px solid var(--gold); border-radius:14px; padding:20px; margin-top:16px; }
  .shield { background:rgba(245,179,1,.1); border:1px solid var(--gold); color:var(--gold); border-radius:12px; padding:12px 16px; margin-bottom:14px; font-weight:700; }

  .login input { display:block; width:100%; max-width:320px; margin-bottom:10px; }
  .btn { background:var(--accent); color:#05281a; border:0; border-radius:8px; padding:10px 18px; font:inherit; font-weight:700; cursor:pointer; }
  .btn.out { background:none; border:1px solid var(--line); color:var(--text); }
  .status { color:var(--gold); font-size:13px; margin:0 0 10px; min-height:18px; }
    .sq { display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:14px; }
  .sq .card { margin:0; }
  .sq label { display:block; margin:10px 0 4px; }
  .sq input, .sq textarea { width:100%; }
  textarea { font:inherit; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; }
  .owner { color:var(--muted); margin:0 0 10px; }
  .plist { margin:0; padding-left:22px; columns:2; font-size:14px; }
  .plist li { margin-bottom:3px; }
  li { margin-bottom:8px; }
  @media (max-width:520px) { header h1 { font-size:24px; } .match { font-size:14px; } }
  /* ===== SPORTS LOOK ===== */
  header { position:relative; overflow:hidden;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 70px, transparent 70px 140px),
      linear-gradient(135deg,#5a0000,#7b0101 50%,#0b1220); }
  header::after { content:""; position:absolute; right:-70px; top:-70px; width:240px; height:240px;
    border:3px solid rgba(255,255,255,.12); border-radius:50%; }
  header h1 { animation: slideDown .7s ease both; }
  header p  { animation: slideDown .7s .15s ease both; }

  /* live results ticker */
  .ticker { background:#05080f; border-bottom:2px solid var(--accent); overflow:hidden; white-space:nowrap; padding:8px 0; }
  .track { display:inline-block; animation: scroll 40s linear infinite; }
  .ticker:hover .track { animation-play-state: paused; }
  .tick { display:inline-block; margin:0 22px; font-family:"Oswald",sans-serif; letter-spacing:.5px; font-size:14px; color:var(--muted); }
  .tick b { color:var(--text); }
  .tick em { font-style:normal; color:var(--accent); background:#10301f; padding:2px 8px; border-radius:4px; margin:0 6px; }
  .tickmsg { padding:0 16px; color:var(--muted); font-family:"Oswald",sans-serif; }
  @keyframes scroll { from { transform:translateX(0); } to { transform:translateX(-50%); } }

  /* page transitions */
  #app.enter > * { animation: fadeUp .45s ease both; }
  #app.enter > *:nth-child(2) { animation-delay:.08s; }
  #app.enter > *:nth-child(3) { animation-delay:.16s; }
  #app.enter tr { animation: rowIn .4s ease both; }
  #app.enter tr:nth-child(2){animation-delay:.05s} #app.enter tr:nth-child(3){animation-delay:.1s}
  #app.enter tr:nth-child(4){animation-delay:.15s} #app.enter tr:nth-child(5){animation-delay:.2s}
  #app.enter tr:nth-child(6){animation-delay:.25s} #app.enter tr:nth-child(7){animation-delay:.3s}
  #app.enter tr:nth-child(8){animation-delay:.35s} #app.enter tr:nth-child(9){animation-delay:.4s}
  #app.enter tr:nth-child(10){animation-delay:.45s} #app.enter tr:nth-child(11){animation-delay:.5s}
  @keyframes fadeUp   { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes rowIn    { from { opacity:0; transform:translateX(-18px); } to { opacity:1; transform:none; } }
  @keyframes slideDown{ from { opacity:0; transform:translateY(-14px); } to { opacity:1; transform:none; } }

  /* interactive feel */
  tbody tr, table tr { transition: background .2s; }
  table tr:hover td { background: rgba(255,255,255,.04); }

  nav button, .rounds button, .btn { transition: transform .15s, background .2s, color .2s, box-shadow .2s; }
  nav button:hover, .rounds button:hover { transform: translateY(-2px); }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(46,204,136,.35); }
  .btn:active, .rounds button:active { transform: scale(.95); }
  .card { transition: transform .25s, box-shadow .25s, border-color .25s; }
  .card:hover { border-color: #33466b; }
  .badge { transition: transform .25s; }
  tr:hover .badge { transform: scale(1.18) rotate(-6deg); }

  /* scoreboard look for scores */
  .score { font-family:"Oswald",sans-serif; background:#05080f; border:1px solid var(--line); border-radius:8px; padding:4px 12px; letter-spacing:2px; color:var(--accent); }
  .match { transition: background .2s; }
  .match:hover { background: rgba(46,204,136,.06); }
  .rounds button.on { box-shadow: 0 0 14px rgba(46,204,136,.5); }

  /* top of the table glows */
  tr.top4 td:first-child { animation: pulseBar 2.4s ease-in-out infinite; }
  @keyframes pulseBar { 0%,100% { box-shadow: inset 4px 0 0 var(--accent); } 50% { box-shadow: inset 7px 0 0 var(--accent); } }
  .shield { animation: glow 2s ease-in-out infinite alternate; }
  .form span:last-child { animation: pop .5s ease both; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

  /* turn animations off for people who prefer less motion */
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  @keyframes glow { from { box-shadow: 0 0 6px rgba(245,179,1,.3); } to { box-shadow: 0 0 28px rgba(245,179,1,.8); } }

  /* ===== OPENING INTRO ===== */
  #intro { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:20px; cursor:pointer; overflow:hidden;
    background: radial-gradient(circle at center, #0f2a1f 0%, #0b1220 70%);
    transition: opacity .8s ease, transform .8s ease; }
  #intro.hide { opacity:0; transform:scale(1.08); pointer-events:none; }
  #intro::before { content:""; position:absolute; width:520px; height:520px; max-width:90vw; max-height:90vw;
    border:3px solid rgba(46,204,136,.25); border-radius:50%; animation: ring 2.4s ease-out both; }
  #intro::after { content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:rgba(46,204,136,.18);
    transform-origin:center; animation: line 1.2s ease-out both; }
  .i-shield { font-size:86px; animation: shieldIn 1.2s cubic-bezier(.2,1.4,.4,1) both, spin3d 3s 1.2s linear infinite; position:relative; z-index:1; }
  .i-title { font-family:"Oswald",sans-serif; font-size:clamp(28px,7vw,54px); letter-spacing:3px; text-transform:uppercase;
    margin:14px 0 4px; position:relative; z-index:1; }
  .i-title span { display:inline-block; opacity:0; animation: letterIn .5s ease forwards; }
  .i-sub { font-family:"Oswald",sans-serif; font-size:clamp(16px,4vw,24px); letter-spacing:6px; color:var(--accent);
    opacity:0; animation: fadeUp .8s 1.6s ease forwards; position:relative; z-index:1; }
  .i-skip { position:absolute; bottom:28px; color:var(--muted); font-size:13px; opacity:0; animation: fadeUp .6s 1.2s ease forwards; }
  @keyframes shieldIn { from { transform:scale(0) rotate(-200deg); opacity:0; } to { transform:scale(1) rotate(0); opacity:1; } }
  @keyframes letterIn { from { opacity:0; transform:translateY(24px) scale(.7); } to { opacity:1; transform:none; } }
  @keyframes ring { from { transform:scale(.2); opacity:1; } to { transform:scale(1.5); opacity:0; } }
  @keyframes line { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  @keyframes spin3d { from { transform:rotateY(0deg); } to { transform:rotateY(360deg); } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

  /* ===== COUNTDOWN INTRO ===== */
  #intro::before { animation: pulseRing 1.2s ease-out infinite; }
  .i-top { font-family:"Oswald",sans-serif; letter-spacing:4px; font-size:clamp(14px,3.6vw,20px); color:var(--muted);
    text-transform:uppercase; position:relative; z-index:1; animation: fadeUp .6s ease both; }
  .count { position:relative; z-index:1; min-height:clamp(130px,40vw,270px); display:flex; align-items:center; justify-content:center; }
  .count span { display:block; font-family:"Oswald",sans-serif; font-weight:700; line-height:1;
    font-size:clamp(120px,40vw,260px); color:var(--text); text-shadow:0 0 40px rgba(46,204,136,.5);
    animation: numPop 1.2s ease both; }
  .count span.go { font-size:clamp(46px,14vw,110px); color:var(--gold); letter-spacing:4px; text-transform:uppercase;
    text-shadow:0 0 36px rgba(245,179,1,.7); animation: kick 1.2s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes pulseRing { from { transform:scale(.3); opacity:.9; } to { transform:scale(1.4); opacity:0; } }
  @keyframes numPop { 0% { transform:scale(2.4); opacity:0; } 25% { transform:scale(1); opacity:1; } 80% { opacity:1; } 100% { transform:scale(.85); opacity:.15; } }
  @keyframes kick { 0% { transform:scale(.3); opacity:0; } 45% { transform:scale(1.15); opacity:1; } 100% { transform:scale(1); opacity:1; } }
  /* ===== BADGES ===== */
  .bdg { margin-left:5px; font-size:15px; cursor:help; display:inline-block; animation: pop .5s ease both; }
  .bdg:hover { transform: scale(1.4); }
  .awards { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
  .award { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px; transition: transform .2s, border-color .2s; }
  .award:hover { transform: translateY(-3px); border-color: var(--accent); }
  .award .ic { font-size:28px; }
  .award b { display:block; font-family:"Oswald",sans-serif; letter-spacing:.5px; }
  .award small { display:block; color:var(--muted); margin-bottom:6px; }
  .award .who { font-size:14px; }
  .award .none { color:var(--muted); font-size:13px; }

  /* ===== ROUND HIGHLIGHTS ===== */
  .hl { border-color: var(--gold); background: linear-gradient(135deg, rgba(245,179,1,.08), var(--card) 60%); }
  .hl h3 { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .hl h3 .legend { margin:0; font-family:"Inter",sans-serif; font-weight:400; }
  .hlgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; margin-bottom:14px; }
  .hlbox { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:12px 14px; animation: fadeUp .5s ease both; }
  .hlbox .ic { font-size:26px; }
  .hlbox small { display:block; color:var(--muted); }
  .hlbox .t { font-family:"Oswald",sans-serif; letter-spacing:.5px; color:var(--gold); font-size:16px; }
  .hlbox .m { margin-top:6px; font-size:15px; }
  .tor { display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
  .chip { display:flex; align-items:center; gap:10px; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:8px 14px 8px 8px; animation: fadeUp .5s ease both; transition: transform .2s; }
  .chip:hover { transform: translateY(-3px); border-color: var(--gold); }
  .chip .badge { margin:0; }
  .chip b { display:block; line-height:1.2; }
  .chip small { color:var(--muted); font-size:12px; }

    /* ===== THEME TOGGLE ===== */
  .themebtn { position:absolute; top:14px; right:14px; z-index:2; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3);
    color:#fff; border-radius:999px; padding:6px 14px; cursor:pointer; font:inherit; font-size:13px; transition: background .2s, transform .15s; }
  .themebtn:hover { background:rgba(255,255,255,.25); transform: translateY(-1px); }
  :root[data-theme="light"] { --bg:#f1f5f9; --card:#ffffff; --line:#d9e0ea; --text:#0f172a; --muted:#5b6b82; --accent:#0a8f58; --gold:#b7791f; --red:#dc2626; }
  :root[data-theme="light"] .ticker { background:#e8eef5; }
  :root[data-theme="light"] .badge { background:#e3f4ec; }
  :root[data-theme="light"] .score { background:#eef3f8; }
  :root[data-theme="light"] tr.top4 { background:rgba(10,143,88,.08); }
  :root[data-theme="light"] .btn, :root[data-theme="light"] .rounds button.on { color:#fff; }
  :root[data-theme="light"] #intro { background: radial-gradient(circle at center, #e3f4ec 0%, #f1f5f9 70%); }
  :root[data-theme="light"] .count span { text-shadow:none; }

    /* ===== RECORDS ===== */
  .recs { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; }
  .rec { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; animation: fadeUp .5s ease both; transition: transform .2s, border-color .2s; }
  .rec:hover { transform: translateY(-3px); border-color: var(--gold); }
  .rec .ic { font-size:28px; }
  .rec b { display:block; font-family:"Oswald",sans-serif; letter-spacing:.5px; color:var(--gold); }

<style id="redesign">

    background:linear-gradient(112deg,#070a1c 0 58%,var(--red) 58% 59.5%,#0d1330 59.5%); }

  & nav button.on { background:var(--gold); color:#070a1c; }
  & .card, & .pocard { position:relative; background:linear-gradient(160deg,rgba(18,28,72,.85),rgba(9,14,42,.9)); border:1px solid var(--line); border-radius:4px;

  & .card::before { content:""; position:absolute; left:0; top:0; width:64px; height:3px; background:var(--gold); }

  function buildFixtures() {
    return SCHEDULE.map(function (round, r) {
      return round.map(function (code, i) {
        const t = code.split("-");
        return { id: "R" + (r + 1) + "-" + (i + 1), home: t[0], away: t[1] };
      });
    });
  }

  // =============== STANDINGS LOGIC ===============
  function getPlayedMatches() {
    const played = [];
    buildFixtures().flat().forEach(function (m) {
      const r = results[m.id];
      if (r && r.h !== "" && r.a !== "" && r.h !== null && r.a !== null) {
        played.push({ home: m.home, away: m.away, homeGoals: Number(r.h), awayGoals: Number(r.a) });
      }
    });
    return played;
  }

  function buildStandings() {
    const table = Object.keys(teams).map(function (code) {
      return { code: code, name: teams[code], played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, points: 0, form: [] };
    });
    function find(code) { return table.find(function (row) { return row.code === code; }); }

    for (const m of getPlayedMatches()) {
      const home = find(m.home), away = find(m.away);
      home.played++; away.played++;
      home.gf += m.homeGoals; home.ga += m.awayGoals;
      away.gf += m.awayGoals; away.ga += m.homeGoals;
      if (m.homeGoals > m.awayGoals) { home.won++; away.lost++; home.points += 3; home.form.push("W"); away.form.push("L"); }
      else if (m.homeGoals < m.awayGoals) { away.won++; home.lost++; away.points += 3; away.form.push("W"); home.form.push("L"); }
      else { home.drawn++; away.drawn++; home.points++; away.points++; home.form.push("D"); away.form.push("D"); }
    }
    table.sort(function (a, b) {
      return b.points - a.points || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf;
    });
    return table;
  }

  // =============== SAVING (admin only; the database also enforces this) ===============
  async function saveScore(id) {
    if (!isAdmin) return;
    const h = document.getElementById("h-" + id).value;
    const a = document.getElementById("a-" + id).value;
    results[id] = { h: h, a: a };
    if (h === "" && a === "") {
      const res = await sb.from("results").delete().eq("season", currentSeason).eq("id", id);
      delete results[id];
      if (res.error) { setStatus("Could not delete: " + res.error.message); }
    } else if (h !== "" && a !== "") {
      const res = await sb.from("results").upsert({ season: currentSeason, id: id, home_goals: Number(h), away_goals: Number(a) }, { onConflict: "season,id" });
      setStatus(res.error ? "Could not save: " + res.error.message : ""); if (!res.error) { toast("Saved ✓"); } if (!res.error) { toast("Saved ✓"); }
    }
    render();
  }

  async function pickWinner(stage, code) {
    if (!isAdmin) return;
    let res;
    if (code === "") {
      delete playoffWinners[stage];
      res = await sb.from("playoffs").delete().eq("season", currentSeason).eq("stage", stage);
    } else {
      playoffWinners[stage] = code;
      res = await sb.from("playoffs").upsert({ season: currentSeason, stage: stage, winner: code }, { onConflict: "season,stage" });
    }
    setStatus(res.error ? "Could not save: " + res.error.message : ""); if (!res.error) { toast("Saved ✓"); } if (!res.error) { toast("Saved ✓"); }

  }

    // =============== AWARDS AND BADGES ===============
  function computeBadges(rows) {
    const out = {};
    rows.forEach(function (r) { out[r.code] = []; });
    function add(code, icon, name, why) { out[code].push({ icon: icon, name: name, why: why }); }

    // streaks, from each team's results in match order
    rows.forEach(function (r) {
      let wins = 0;
      for (let i = r.form.length - 1; i >= 0 && r.form[i] === "W"; i--) { wins++; }
      let unbeaten = 0;
      for (let i = r.form.length - 1; i >= 0 && r.form[i] !== "L"; i--) { unbeaten++; }
      if (wins >= 3) { add(r.code, "🔥", "On Fire", wins + " wins in a row"); }
      if (unbeaten >= 5) { add(r.code, "🎯", "Unbeaten", unbeaten + " matches unbeaten"); }
    });

    // best defence and top scorers (teams with at least 3 matches played)
    const enough = rows.filter(function (r) { return r.played >= 3; });
    if (enough.length) {
      const minGA = Math.min.apply(null, enough.map(function (r) { return r.ga; }));
      enough.filter(function (r) { return r.ga === minGA; })
            .forEach(function (r) { add(r.code, "🧱", "Best Defence", r.ga + " goals conceded"); });
      const maxGF = Math.max.apply(null, enough.map(function (r) { return r.gf; }));
      if (maxGF > 0) {
        enough.filter(function (r) { return r.gf === maxGF; })
              .forEach(function (r) { add(r.code, "⚡", "Top Scorers", r.gf + " goals scored"); });
      }
    }

    // giant killer: beat the team that is top of the table right now
    const leader = rows[0];
    if (leader && leader.played >= 3) {
      const killers = {};
      getPlayedMatches().forEach(function (m) {
        if (m.home === leader.code && m.awayGoals > m.homeGoals) { killers[m.away] = true; }
        if (m.away === leader.code && m.homeGoals > m.awayGoals) { killers[m.home] = true; }
      });
      Object.keys(killers).forEach(function (code) {
        add(code, "🗡️", "Giant Killer", "Beat league leaders " + leader.name);
      });
    }
    return out;
  }

  function badgeIcons(list) {
    return list.map(function (b) {
      return "<span class='bdg' title='" + b.name + ": " + b.why + "'>" + b.icon + "</span>";
    }).join("");
  }

  function awardsCard(rows, badges) {
    const types = [
      ["🔥", "On Fire", "3+ wins in a row"],
      ["🎯", "Unbeaten", "5+ matches without a loss"],
      ["🧱", "Best Defence", "Fewest goals conceded"],
      ["⚡", "Top Scorers", "Most goals scored"],
      ["🗡️", "Giant Killer", "Beat the league leaders"]
    ];
    let html = "<div class='card'><h3>Awards</h3><div class='awards'>";
    types.forEach(function (t) {
      const holders = rows.filter(function (r) {
        return badges[r.code].some(function (b) { return b.icon === t[0]; });
      }).map(function (r) { return r.name; });
      html += "<div class='award'><span class='ic'>" + t[0] + "</span><b>" + t[1] + "</b><small>" + t[2] + "</small>" +
              (holders.length ? "<div class='who'>" + holders.join(", ") + "</div>" : "<div class='none'>Not awarded yet</div>") + "</div>";
    });
    return html + "</div></div>";
  }

    function pageStandings() {
    const rows = buildStandings();
    const badges = computeBadges(rows);
    const done = rows.every(function (r) { return r.played === SCHEDULE.length; });
    let html = "";
    if (done) { html += "<div class='shield'>🛡️ League Shield winners: " + rows[0].name + "</div>"; }
    html += overviewStrip();
    html += "<button class='btn out mfull' onclick='toggleFull(this)'>⇄ Full stats</button><div class='card scroll'><table class='st'><tr><th>#</th><th class='left'>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>Form</th></tr>";
    rows.forEach(function (r, i) {
      const gd = r.gf - r.ga;
      const form = r.form.slice(-5).map(function (f) { return "<span class='" + f + "'>" + f + "</span>"; }).join("");
      html += "<tr class='" + (i < qualifiers() ? "top4" : "") + "'><td>" + (i + 1) + moveTag(r.code, i) + "</td>" +
        "<td class='left'><span class='badge'>" + initials(r.name) + "</span><a class='tl' onclick=\"openTeam('" + r.code + "')\">" + r.name + "</a>" + (i === 0 ? " 🛡️" : "") + badgeIcons(badges[r.code]) + "</td>" +
        "<td>" + r.played + "</td><td>" + r.won + "</td><td>" + r.drawn + "</td><td>" + r.lost + "</td>" +
        "<td>" + r.gf + "</td><td>" + r.ga + "</td><td>" + (gd > 0 ? "+" + gd : gd) + "</td>" +
        "<td class='pts'>" + r.points + "</td><td class='form'>" + form + "</td></tr>";
    });
    html += "</table></div><p class='legend'>Green bar = playoff places (top " + qualifiers() + "). 1st place after " + SCHEDULE.length + " rounds wins the League Shield. Ties are split by goal difference, then goals scored. Hover over a badge to see why it was awarded.</p>";
    html += awardsCard(rows, badges);
    return html;
  }

    // =============== ROUND HIGHLIGHTS ===============
  function roundHighlights(ri) {
    const ms = buildFixtures()[ri];
    const played = ms.filter(function (m) {
      const r = results[m.id];
      return r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "";
    }).map(function (m) { return { m: m, h: Number(results[m.id].h), a: Number(results[m.id].a) }; });
    if (!played.length) { return ""; }

    function line(p) {
      return teams[p.m.home] + " <b>" + p.h + " - " + p.a + "</b> " + teams[p.m.away];
    }
    function box(icon, title, note, text) {
      return "<div class='hlbox'><span class='ic'>" + icon + "</span><div class='t'>" + title + "</div><small>" + note + "</small><div class='m'>" + text + "</div></div>";
    }

    // match of the round: most goals, then biggest margin
    const motr = played.slice().sort(function (x, y) {
      return (y.h + y.a) - (x.h + x.a) || Math.abs(y.h - y.a) - Math.abs(x.h - x.a);
    })[0];
    // biggest win: largest margin, then most goals
    const big = played.filter(function (p) { return p.h !== p.a; }).sort(function (x, y) {
      return Math.abs(y.h - y.a) - Math.abs(x.h - x.a) || (y.h + y.a) - (x.h + x.a);
    })[0];

    // team of the round: best winning performances
    const perf = [];
    played.forEach(function (p) {
      perf.push({ code: p.m.home, gf: p.h, ga: p.a, opp: p.m.away });
      perf.push({ code: p.m.away, gf: p.a, ga: p.h, opp: p.m.home });
    });
    const winners = perf.filter(function (x) { return x.gf > x.ga; }).sort(function (x, y) {
      return (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf;
    }).slice(0, 3);

    let html = "<div class='card hl'><h3><span>🏅 Round " + (ri + 1) + " Highlights</span><span class='legend'>" +
               played.length + " of " + ms.length + " matches played</span></h3><div class='hlgrid'>";
    html += box("⭐", "Match of the Round", "Most goals scored", line(motr));
    if (big && big.m.id !== motr.m.id) {
      html += box("💥", "Biggest Win", "Largest winning margin", line(big));
    }
    html += "</div><div class='t' style='font-family:Oswald,sans-serif;letter-spacing:.5px;color:var(--gold)'>Team of the Round</div>";
    if (winners.length) {
      html += "<div class='tor'>" + winners.map(function (w) {
        return "<div class='chip'><span class='badge'>" + initials(teams[w.code]) + "</span><div><b>" + teams[w.code] +
               "</b><small>beat " + teams[w.opp] + " " + w.gf + "-" + w.ga + "</small></div></div>";
      }).join("") + "</div>";
    } else {
      html += "<p class='legend'>No winning team yet this round.</p>";
    }
    return html + "</div>";
  }

    function pageFixtures() {
    const rounds = buildFixtures();
    let html = "<div class='rounds'>";
    for (let i = 0; i < SCHEDULE.length; i++) {
      html += "<button class='" + (i === currentRound ? "on" : "") + "' onclick='currentRound=" + i + ";render()'>R" + (i + 1) + "</button>";
    }
    html += "</div><div class='card'><h3>Round " + (currentRound + 1) + " <span style='color:var(--muted);font-size:13px;font-weight:400'>" +
            (SEASONS[currentSeason].single ? "" : (currentRound < SCHEDULE.length / 2 ? "First leg" : "Second leg")) + "</span></h3>";
    rounds[currentRound].forEach(function (m) {
      const r = results[m.id] || { h: "", a: "" };
      const h = (r.h === null) ? "" : r.h, a = (r.a === null) ? "" : r.a;
      let middle;
      if (isAdmin) {
        middle = "<input id='h-" + m.id + "' type='number' min='0' value='" + h + "' onchange=\"saveScore('" + m.id + "')\"> : " +
                 "<input id='a-" + m.id + "' type='number' min='0' value='" + a + "' onchange=\"saveScore('" + m.id + "')\">";
      } else {
        middle = "<span class='score'>" + ((h !== "" && a !== "") ? h + " : " + a : "vs") + "</span>";
      }
      html += "<div class='match'><span class='h'>" + teams[m.home] + "</span><span>" + middle + "</span><span class='a'>" + teams[m.away] + " <button class='info' title='Match details' onclick=\"openMatch('" + m.id + "')\">ⓘ</button></span></div>";
    });
    return html + "</div>" + roundHighlights(currentRound) + summaryButtons();
  }

  function validWinner(stage, a, b) {
    const w = playoffWinners[stage];
    return (a && b && (w === a || w === b)) ? w : null;
  }

  function formDots(code) {
    const row = buildStandings().find(function (r) { return r.code === code; });
    return row ? "<span class='form'>" + row.form.slice(-5).map(function (f) { return "<span class='" + f + "'>" + f + "</span>"; }).join("") + "</span>" : "";
  }

  async function savePlayoff(stage, a, b) {
    if (!isAdmin) return;
    const hv = document.getElementById("ph-" + stage).value, av = document.getElementById("pa-" + stage).value;
    const pick = document.getElementById("pw-" + stage);
    const hasScore = hv !== "" && av !== "";
    let winner = pick ? pick.value : "";
    if (hasScore && Number(hv) !== Number(av)) { winner = Number(hv) > Number(av) ? a : b; }
    if (!hasScore && !winner) {
      const del = await sb.from("playoffs").delete().eq("season", currentSeason).eq("stage", stage);
      delete playoffWinners[stage]; delete playoffScores[stage];
      setStatus(del.error ? "Could not save: " + del.error.message : ""); render(); return;
    }
    if (!winner) { setStatus("Draw: pick who won on penalties, then it saves."); return; }
    const row = { season: currentSeason, stage: stage, winner: winner };
    if (hasScore) { row.home_goals = Number(hv); row.away_goals = Number(av); row.home_team = a; row.away_team = b; }
    else { row.home_goals = null; row.away_goals = null; row.home_team = null; row.away_team = null; }
    const res = await sb.from("playoffs").upsert(row, { onConflict: "season,stage" });
    setStatus(res.error ? "Could not save: " + res.error.message : "");
    if (!res.error) {
      playoffWinners[stage] = winner;
      if (hasScore) { playoffScores[stage] = { home: a, away: b, hg: Number(hv), ag: Number(av) }; } else { delete playoffScores[stage]; }
      toast("Saved ✓");
    }
    render();
  }

  function matchCard(stage, title, note, a, b, color) {
    if (SEASONS[currentSeason].playoffScores) { return matchCardScores(stage, title, note, a, b, color); }
    return matchCardOld(stage, title, note, a, b, color);
  }

  function matchCardScores(stage, title, note, a, b, color) {
    let html = "<div class='pocard' style='border-left-color:" + color + ";--pc:" + color + "'>";
    html += "<b style='color:" + color + "'>" + title + "</b><small>" + note + "</small>";
    if (!(a && b)) { return html + "<div class='vs'>" + (a ? teams[a] : "TBD") + " <span style='color:var(--muted)'>vs</span> " + (b ? teams[b] : "TBD") + "</div></div>"; }
    const sc = playoffScores[stage] && playoffScores[stage].home === a && playoffScores[stage].away === b ? playoffScores[stage] : null;
    const w = validWinner(stage, a, b);
    html += "<div class='vs'>" + teams[a] + "<br>" + formDots(a) + "</div>";
    if (isAdmin) {
      html += "<div style='margin:8px 0'><input id='ph-" + stage + "' type='number' min='0' style='width:52px;text-align:center' value='" + (sc ? sc.hg : "") + "' onchange=\"savePlayoff('" + stage + "','" + a + "','" + b + "')\"> : " +
        "<input id='pa-" + stage + "' type='number' min='0' style='width:52px;text-align:center' value='" + (sc ? sc.ag : "") + "' onchange=\"savePlayoff('" + stage + "','" + a + "','" + b + "')\"></div>";
    } else {
      html += "<div class='score' style='margin:8px 0'>" + (sc ? sc.hg + " : " + sc.ag : "vs") + "</div>";
    }
    html += "<div class='vs'>" + teams[b] + "<br>" + formDots(b) + "</div>";
    if (isAdmin) {
      html += "<select id='pw-" + stage + "' onchange=\"savePlayoff('" + stage + "','" + a + "','" + b + "')\"><option value=''>Winner (set automatically; pick if drawn)</option>" +
        "<option value='" + a + "'" + (w === a ? " selected" : "") + ">" + teams[a] + "</option><option value='" + b + "'" + (w === b ? " selected" : "") + ">" + teams[b] + "</option></select>";
    } else {
      const pens = sc && sc.hg === sc.ag && w ? " (on penalties)" : "";
      html += "<div>" + (w ? "Winner: <b>" + teams[w] + "</b>" + pens : "<span style='color:var(--muted)'>Not played yet</span>") + "</div>";
    }
    return html + "</div>";
  }

  function matchCardOld(stage, title, note, a, b, color) {
    let html = "<div class='pocard' style='border-left-color:" + color + ";--pc:" + color + "'>";
    html += "<b style='color:" + color + "'>" + title + "</b><small>" + note + "</small>";
    html += "<div class='vs'>" + (a ? teams[a] : "TBD") + " <span style='color:var(--muted)'>vs</span> " + (b ? teams[b] : "TBD") + "</div>";
    if (a && b) {
      if (isAdmin) {
        html += "<select onchange=\"pickWinner('" + stage + "', this.value)\"><option value=''>Pick winner...</option>" +
          "<option value='" + a + "'" + (playoffWinners[stage] === a ? " selected" : "") + ">" + teams[a] + "</option>" +
          "<option value='" + b + "'" + (playoffWinners[stage] === b ? " selected" : "") + ">" + teams[b] + "</option></select>";
      } else {
        const w = validWinner(stage, a, b);
        html += "<div>" + (w ? "Winner: <b>" + teams[w] + "</b>" : "<span style='color:var(--muted)'>Not played yet</span>") + "</div>";
      }
    }
    return html + "</div>";

    // =============== LEAGUE RECORDS ===============
  function computeRecords() {
    const rounds = buildFixtures();
    const played = [];
    const roundGoals = [];
    rounds.forEach(function (round, ri) {
      let goals = 0, count = 0;
      round.forEach(function (m) {
        const r = results[m.id];
        if (r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "") {
          played.push({ ri: ri, home: m.home, away: m.away, h: Number(r.h), a: Number(r.a) });
          goals += Number(r.h) + Number(r.a);
          count++;
        }
      });
      roundGoals.push({ ri: ri, goals: goals, count: count, total: round.length });
    });
    const rec = { played: played };

    function pickMax(list, score) {
      let best = null;
      list.forEach(function (x) {
        const s = score(x);
        if (best === null || s > best.s) { best = { s: s, items: [x] }; }
        else if (s === best.s) { best.items.push(x); }
      });
      return best;
    }

    const wins = played.filter(function (p) { return p.h !== p.a; });
    rec.biggestWin = pickMax(wins, function (p) { return Math.abs(p.h - p.a) * 100 + p.h + p.a; });
    rec.mostGoals = pickMax(played, function (p) { return p.h + p.a; });

    const seq = {};
    Object.keys(teams).forEach(function (c) { seq[c] = []; });
    played.forEach(function (p) {
      seq[p.home].push(p.h > p.a ? "W" : p.h === p.a ? "D" : "L");
      seq[p.away].push(p.a > p.h ? "W" : p.h === p.a ? "D" : "L");
    });
    const streaks = Object.keys(teams).map(function (c) {
      let w = 0, bw = 0, u = 0, bu = 0;
      seq[c].forEach(function (x) {
        w = (x === "W") ? w + 1 : 0;
        u = (x !== "L") ? u + 1 : 0;
        if (w > bw) { bw = w; }
        if (u > bu) { bu = u; }
      });
      return { code: c, win: bw, unbeaten: bu };
    });
    rec.winStreak = pickMax(streaks, function (x) { return x.win; });
    rec.unbeaten = pickMax(streaks, function (x) { return x.unbeaten; });

    const home = {}, away = {};
    Object.keys(teams).forEach(function (c) {
      home[c] = { code: c, p: 0, pts: 0, gd: 0 };
      away[c] = { code: c, p: 0, pts: 0, gd: 0 };
    });
    played.forEach(function (p) {
      const hp = p.h > p.a ? 3 : p.h === p.a ? 1 : 0;
      const ap = p.a > p.h ? 3 : p.h === p.a ? 1 : 0;
      home[p.home].p++; home[p.home].pts += hp; home[p.home].gd += p.h - p.a;
      away[p.away].p++; away[p.away].pts += ap; away[p.away].gd += p.a - p.h;
    });
    function bestSide(table) {
      const list = Object.keys(table).map(function (c) { return table[c]; }).filter(function (x) { return x.p > 0; });
      return pickMax(list, function (x) { return x.pts * 1000 + x.gd * 10 + 500 - x.p; });
    }
    rec.bestHome = bestSide(home);
    rec.bestAway = bestSide(away);

    // only rounds where every match has been played
    const complete = roundGoals.filter(function (x) { return x.count === x.total; });
    rec.roundGoals = pickMax(complete, function (x) { return x.goals; });
    return rec;
  }

  function pageRecords() {
    const r = computeRecords();
    if (!r.played.length) {

    function line(p) {

    function card(icon, title, note, text) {

    html += card("💥", "Biggest Win", "Largest winning margin",

    html += card("✈️", "Best Away Record", "Most away points, then goal difference",

    return html + "</div>";
  }
    // =============== TEAM PROFILE ===============
  function openTeam(code) {
    currentTeam = code;
    currentTab = "Team";

  function teamMatches(code) {
    const out = [];
    buildFixtures().forEach(function (round, ri) {
      round.forEach(function (m) {
        if (m.home !== code && m.away !== code) { return; }
        const r = results[m.id];
        const played = !!(r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "");
        const isHome = (m.home === code);
        const o = { ri: ri, isHome: isHome, opp: isHome ? m.away : m.home, played: played };
        if (played) {
          o.gf = Number(isHome ? r.h : r.a);
          o.ga = Number(isHome ? r.a : r.h);
          o.res = o.gf > o.ga ? "W" : (o.gf === o.ga ? "D" : "L");
        }
        out.push(o);
      });
    });
    return out;
  }

  function pointsChart(done) {
    if (!done.length) { return "<p class='legend'>The chart appears after the first result.</p>"; }
    const pts = [0];
    done.forEach(function (x) { pts.push(pts[pts.length - 1] + (x.res === "W" ? 3 : x.res === "D" ? 1 : 0)); });
    const max = Math.max(3, pts[pts.length - 1]);
    const n = done.length;
    function X(i) { return 12 + i * (296 / n); }
    function Y(v) { return 98 - (v / max) * 86; }
    const line = pts.map(function (v, i) { return X(i).toFixed(1) + "," + Y(v).toFixed(1); }).join(" ");
    const colors = { W: "#16a34a", D: "#9ca3af", L: "#ef4444" };
    let svg = "<svg viewBox='0 0 320 110' style='width:100%;height:auto'>" +
      "<line x1='12' y1='98' x2='308' y2='98' stroke='var(--line)'/>" +
      "<polyline points='" + line + "' fill='none' stroke='var(--accent)' stroke-width='2.5' stroke-linejoin='round'/>";
    done.forEach(function (x, i) {
      svg += "<circle cx='" + X(i + 1).toFixed(1) + "' cy='" + Y(pts[i + 1]).toFixed(1) + "' r='5' fill='" + colors[x.res] + "'/>";
    });
    return svg + "</svg><p class='legend'>Points after each match. Green = win, grey = draw, red = loss. Now: " + pts[pts.length - 1] + " pts.</p>";
  }

const STAGE_NAMES = { q1: "Qualifier 1", ko1: "Knockout 1", ko2: "Knockout 2", el: "Eliminator", el1: "Eliminator 1", q2: "Qualifier 2", f: "Final" };

  function teamPlayoffGames(code) {
    return Object.keys(playoffScores).filter(function (st) { return playoffScores[st].home === code || playoffScores[st].away === code; }).map(function (st) {
      const s = playoffScores[st], isH = s.home === code;
      const gf = isH ? s.hg : s.ag, ga = isH ? s.ag : s.hg;
      let res = gf > ga ? "W" : gf < ga ? "L" : "D";
      return { stage: st, opp: isH ? s.away : s.home, gf: gf, ga: ga, res: res, pens: gf === ga && playoffWinners[st] === code ? "won on pens" : (gf === ga ? "lost on pens" : "") };
    });
  }

  function allCompetitionsCard(code, row) {
    const po = teamPlayoffGames(code);
    if (!SEASONS[currentSeason].playoffScores) { return ""; }
    const t = { p: row.played, w: row.won, d: row.drawn, l: row.lost, gf: row.gf, ga: row.ga };
    po.forEach(function (g) { t.p++; t.gf += g.gf; t.ga += g.ga; if (g.res === "W") { t.w++; } else if (g.res === "L") { t.l++; } else { t.d++; } });
    function cell(label, v) { return "<div class='stat'><b>" + v + "</b><small>" + label + "</small></div>"; }
    let html = "<div class='card'><h3>All competitions <span style='color:var(--muted);font-size:13px;font-weight:400'>league + playoffs</span></h3>" +
      "<div class='stats'>" + cell("Played", t.p) + cell("W-D-L", t.w + "-" + t.d + "-" + t.l) + cell("Goals", t.gf + ":" + t.ga) + cell("Goal diff", (t.gf - t.ga > 0 ? "+" : "") + (t.gf - t.ga)) + "</div>";
    html += po.length ? "<h3 style='margin-top:14px'>Playoff games</h3>" + po.map(function (g) {
      return "<div class='tm'><span class='pill " + g.res + "'>" + g.res + "</span><span>" + STAGE_NAMES[g.stage] + " vs " + teams[g.opp] + (g.pens ? " <small style='color:var(--muted)'>(" + g.pens + ")</small>" : "") + "</span><b>" + g.gf + " - " + g.ga + "</b></div>";
    }).join("") : "<p class='legend'>No playoff games played yet. The table above counts league games only.</p>";

  // =============== GOLDEN BOOT ===============
  function bootTotals() {
    const map = {};
    goalLog.forEach(function (g) {
      const k = g.team + "|" + g.player;
      if (!map[k]) { map[k] = { team: g.team, player: g.player, goals: 0 }; }
      map[k].goals += g.goals;
    });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) {
      return b.goals - a.goals || a.player.localeCompare(b.player);
    });
  }

  async function saveGoal() {
    if (!isAdmin) { return; }
    const player = document.getElementById("bp").value;
    const goals = parseInt(document.getElementById("bg").value, 10);
    const round = document.getElementById("br").value;
    if (!player) { setStatus("Pick a player first (add the squad in the Squads tab)."); return; }
    if (!goals || goals < 1) { setStatus("Enter at least 1 goal."); return; }
    const row = { season: currentSeason, team: bootTeam, player: player, goals: goals };
    if (round) { row.round = Number(round); }
    const res = await sb.from("goals").insert(row).select();
    if (res.error) { setStatus("Could not save: " + res.error.message); return; }
    goalLog.push(res.data[0]);
    setStatus(player + ": " + goals + " goal(s) saved.");
    render();
  }

    if (res.error) { setStatus("Could not delete: " + res.error.message); return; }
    goalLog = goalLog.filter(function (g) { return g.id !== id; });
    render();

    // =============== PLAYER STATS ===============
  function goalMap() {
    const map = {};
    goalLog.forEach(function (g) {
      const k = g.team + "|" + g.player;

  function pageStats() {
    const map = goalMap();
    let rows = [];
    const seen = {};
    Object.keys(teams).forEach(function (c) {
      playerList((squads[c] || { players: "" }).players).forEach(function (p) {

        if (seen[k]) { return; }
        seen[k] = true;
        rows.push({ team: c, player: p, goals: map[k] || 0, extra: false });
      });
    });
    // goals logged for a name that is no longer in the squad list are kept visible
    Object.keys(map).forEach(function (k) {

        const i = k.indexOf("|");
        rows.push({ team: k.slice(0, i), player: k.slice(i + 1), goals: map[k], extra: true });
      }
    });

    if (statTeam !== "all") { rows = rows.filter(function (r) { return r.team === statTeam; }); }
    rows.sort(function (a, b) {
      if (statSort === "name") { return a.player.localeCompare(b.player); }
      return b.goals - a.goals || a.player.localeCompare(b.player);
    });

    const totalGoals = rows.reduce(function (s, r) { return s + r.goals; }, 0);

      "<select onchange=\"statSort=this.value;render()\"><option value='goals'" + (statSort === "goals" ? " selected" : "") + ">Sort: most goals</option>" +
      "<option value='name'" + (statSort === "name" ? " selected" : "") + ">Sort: name A-Z</option></select>" +

        "</td><td class='left'><span class='badge'>" + initials(teams[r.team] || r.team) + "</span>" + (teams[r.team] || r.team) + "</td>" +
        "<td class='pts'>" + r.goals + "</td></tr>";

  // =============== HALL OF FAME ===============
  let allResults = [], allPlayoffs = [], allGoals = [], allSquads = [], allTransfers = [], allCards = [];

  function seasonSummary(no) {
    const cfg = SEASONS[no];
    const res = {};
    allResults.forEach(function (r) { if ((r.season || 1) === no) { res[r.id] = r; } });

    const rows = {};
    Object.keys(cfg.teams).forEach(function (c) { rows[c] = { code: c, name: cfg.teams[c], p: 0, pts: 0, gf: 0, ga: 0 }; });
    let total = 0, played = 0;
    cfg.schedule.forEach(function (round, ri) {
      round.forEach(function (code, i) {
        total++;
        const t = code.split("-");
        const r = res["R" + (ri + 1) + "-" + (i + 1)];
        if (!r || r.home_goals === null || r.away_goals === null) { return; }
        played++;
        const h = rows[t[0]], a = rows[t[1]], hg = r.home_goals, ag = r.away_goals;
        h.p++; a.p++; h.gf += hg; h.ga += ag; a.gf += ag; a.ga += hg;
        if (hg > ag) { h.pts += 3; } else if (hg < ag) { a.pts += 3; } else { h.pts++; a.pts++; }
      });
    });
    const table = Object.keys(rows).map(function (c) { return rows[c]; }).sort(function (x, y) {
      return y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf;
    });
    const top = table.map(function (r) { return r.code; });

    const pw = {};
    allPlayoffs.forEach(function (p) { if ((p.season || 1) === no) { pw[p.stage] = p.winner; } });
    function ok(stage, a, b) { const w = pw[stage]; return (a && b && (w === a || w === b)) ? w : null; }
    const q1w = ok("q1", top[0], top[1]);
    const q1l = q1w ? (q1w === top[0] ? top[1] : top[0]) : null;
    let q2w;
    if (cfg.playoff === "six") {
      const k1 = ok("ko1", top[2], top[5]), k2 = ok("ko2", top[3], top[4]);
      q2w = ok("q2", q1l, ok("el1", k1, k2));
    } else {
      q2w = ok("q2", q1l, ok("el", top[2], top[3]));
    }
    const champion = ok("f", q1w, q2w);
    const runnerUp = champion ? (q1w === champion ? q2w : q1w) : null;

    const sums = {};
    allGoals.forEach(function (g) {
      if ((g.season || 1) === no) { const k = g.team + "|" + g.player; sums[k] = (sums[k] || 0) + g.goals; }
    });
    let best = 0, boot = [];
    Object.keys(sums).forEach(function (k) {
      if (sums[k] > best) { best = sums[k]; boot = [k]; } else if (sums[k] === best) { boot.push(k); }
    });
    boot = boot.map(function (k) {
      const i = k.indexOf("|");
      return { team: cfg.teams[k.slice(0, i)] || k.slice(0, i), player: k.slice(i + 1) };
    });
    return { name: cfg.name, played: played, total: total, complete: played === total, shield: table[0],
             champion: champion ? cfg.teams[champion] : null, runnerUp: runnerUp ? cfg.teams[runnerUp] : null,
             boot: boot, bootGoals: best };
  }

        const t = code.split("-"), hg = Number(r.h), ag = Number(r.a);
        rows[t[0]].gf += hg; rows[t[0]].ga += ag; rows[t[1]].gf += ag; rows[t[1]].ga += hg;
        if (hg > ag) { rows[t[0]].pts += 3; } else if (hg < ag) { rows[t[1]].pts += 3; } else { rows[t[0]].pts++; rows[t[1]].pts++; }
      });
    });
    return Object.keys(rows).map(function (c) { return rows[c]; }).sort(function (a, b) {

  // arrow showing how a team moved since before the latest round
  function moveTag(code, pos) {
    const last = lastPlayedRound();
    if (last < 2) { return ""; }
    const d = tableUpTo(last - 1).indexOf(code) - pos;
    if (d > 0) { return "<span class='mv up' title='Up since the previous round'>▲" + d + "</span>"; }
    if (d < 0) { return "<span class='mv down' title='Down since the previous round'>▼" + (-d) + "</span>"; }

  function overviewStrip() {
    const total = SCHEDULE.reduce(function (s, r) { return s + r.length; }, 0);

  // numbers count up and the progress bar fills, once each time you open a page

  function animateCounts() {
    if (!loaded) { return; }
    const key = currentSeason + "|" + currentTab;
    if (key === lastCountKey) { return; }
    lastCountKey = key;
    document.querySelectorAll("[data-count]").forEach(function (el) {
      const to = Number(el.getAttribute("data-count")), start = performance.now();
      function step(t) {
        const p = Math.min(1, (t - start) / 700);
        el.textContent = Math.round(to * p);
        if (p < 1) { requestAnimationFrame(step); }

// =============== STAGE 2: NEWS, QUALIFICATION TRACKER, TITLE RACE ===============
  function isPlayed(r) { return r && r.h !== "" && r.a !== "" && r.h !== null && r.a !== null && r.h !== undefined; }
  function endRun(form, ok) { let n = 0; for (let i = form.length - 1; i >= 0 && ok(form[i]); i--) { n++; } return n; }

  function buildNews() {
    const items = [], table = buildStandings(), fx = buildFixtures();
    let last = -1;
    fx.forEach(function (rd, i) { if (rd.some(function (m) { return isPlayed(results[m.id]); })) { last = i; } });
    if (last < 0 && !Object.keys(playoffScores).length) { return [{ icon: "🕐", title: "Season not started", text: "Match reports appear here automatically after the first result." }]; }
    if (playoffWinners.f) {
      const sc = playoffScores.f;
      items.push({ icon: "🏆", title: teams[playoffWinners.f] + " are champions!", text: sc ? "Final: " + teams[sc.home] + " " + sc.hg + " - " + sc.ag + " " + teams[sc.away] + "." : "They won the playoff Final." });
    }
    Object.keys(playoffScores).filter(function (k) { return k !== "f"; }).forEach(function (k) {
      const sc = playoffScores[k];
      items.push({ icon: "⚔️", title: STAGE_NAMES[k] + ": " + teams[playoffWinners[k] || sc.home] + " go through", text: teams[sc.home] + " " + sc.hg + " - " + sc.ag + " " + teams[sc.away] + "." });
    });
    if (last >= 0) {
      const lead = table[0], gap = lead.points - table[1].points;
      items.push({ icon: "🛡️", title: teams[lead.code] + " lead the table", text: lead.points + " points" + (gap ? ", " + gap + " clear of " + teams[table[1].code] : ", level with " + teams[table[1].code]) + " after round " + (last + 1) + "." });
      const ms = fx[last].filter(function (m) { return isPlayed(results[m.id]); });
      let big = null, goals = null, draws = 0;
      ms.forEach(function (m) {
        const h = Number(results[m.id].h), a = Number(results[m.id].a);
        if (h === a) { draws++; }
        if (!big || Math.abs(h - a) > big.d) { big = { d: Math.abs(h - a), m: m, h: h, a: a }; }
        if (!goals || h + a > goals.t) { goals = { t: h + a, m: m, h: h, a: a }; }
      });
      if (big && big.d > 0) { items.push({ icon: "💥", title: "Round " + (last + 1) + " big win", text: teams[big.m.home] + " " + big.h + " - " + big.a + " " + teams[big.m.away] + " (margin " + big.d + ")." }); }
      if (goals && goals.t >= 5 && goals !== big) { items.push({ icon: "⚽", title: "Goal fest in round " + (last + 1), text: teams[goals.m.home] + " " + goals.h + " - " + goals.a + " " + teams[goals.m.away] + ": " + goals.t + " goals." }); }
      if (draws) { items.push({ icon: "🤝", title: draws + (draws === 1 ? " draw" : " draws") + " in round " + (last + 1), text: "Points shared in " + draws + " of " + ms.length + " matches." }); }
    }
    table.forEach(function (r) {
      const w = endRun(r.form, function (f) { return f === "W"; }), u = endRun(r.form, function (f) { return f !== "L"; }), l = endRun(r.form, function (f) { return f === "L"; });
      if (w >= 3) { items.push({ icon: "🔥", title: teams[r.code] + " on fire", text: w + " wins in a row." }); }
      else if (u >= 5) { items.push({ icon: "🧱", title: teams[r.code] + " unbeaten", text: u + " games without defeat." }); }
      if (l >= 3) { items.push({ icon: "📉", title: teams[r.code] + " in a slump", text: l + " defeats in a row." }); }
    });
    const boot = typeof bootTotals === "function" ? bootTotals() : [];
    if (boot.length) { items.push({ icon: "👟", title: "Golden Boot: " + boot[0].player, text: boot[0].goals + " goals for " + teams[boot[0].team] + "." }); }
    return items;
  }

  function qualStatus() {
    const table = buildStandings(), q = qualifiers(), total = SCHEDULE.length;
    const rows = table.map(function (r) { return { r: r, left: total - r.played, max: r.points + 3 * (total - r.played) }; });
    return rows.map(function (x, i) {
      const others = rows.filter(function (y) { return y.r.code !== x.r.code; });
      const canCatch = others.filter(function (y) { return y.max >= x.r.points; }).length;
      const ahead = others.filter(function (y) { return y.r.points > x.max; }).length;
      const shield = others.every(function (y) { return y.max < x.r.points; });
      let st = "hunt", label = "In the hunt";
      if (x.left === 0 && i < q) { st = "in"; label = "Qualified"; }
      else if (canCatch < q) { st = "in"; label = "Qualified"; }
      else if (ahead >= q) { st = "out"; label = "Eliminated"; }
      if (shield) { label = "🛡️ Shield won"; }
      return { code: x.r.code, pos: i + 1, pts: x.r.points, left: x.left, max: x.max, st: st, label: label };
    });
  }

  const LINE_COLORS = ["#2ecc88", "#f5b301", "#ef4444", "#3b82f6", "#a855f7", "#f97316", "#14b8a6", "#ec4899", "#eab308", "#94a3b8"];

  function raceChart() {
    const fx = buildFixtures(), codes = Object.keys(teams), pts = {};
    codes.forEach(function (c) { pts[c] = [0]; });
    let rounds = 0;
    fx.forEach(function (rd, i) {
      const add = {}; let any = false;
      codes.forEach(function (c) { add[c] = 0; });
      rd.forEach(function (m) {
        const r = results[m.id]; if (!isPlayed(r)) { return; }
        any = true; const h = Number(r.h), a = Number(r.a);
        if (h > a) { add[m.home] += 3; } else if (h < a) { add[m.away] += 3; } else { add[m.home]++; add[m.away]++; }
      });
      if (any) { rounds = i + 1; }
      codes.forEach(function (c) { pts[c].push(pts[c][i] + add[c]); });
    });
    if (rounds < 1) { return "<p class='legend'>The chart appears after the first result.</p>"; }
    const W = 640, H = 300, L = 34, B = 24, T = 10, R = 10;
    let max = 3; codes.forEach(function (c) { max = Math.max(max, pts[c][rounds]); });
    const x = function (i) { return L + (W - L - R) * i / Math.max(rounds, 1); }, y = function (v) { return T + (H - T - B) * (1 - v / max); };
    const order = buildStandings().map(function (r) { return r.code; });
    let svg = "<svg viewBox='0 0 " + W + " " + H + "' style='width:100%;height:auto'>";
    for (let g = 0; g <= 4; g++) { const v = Math.round(max * g / 4); svg += "<line x1='" + L + "' x2='" + (W - R) + "' y1='" + y(v) + "' y2='" + y(v) + "' stroke='var(--line)'/><text x='4' y='" + (y(v) + 4) + "' fill='var(--muted)' font-size='11'>" + v + "</text>"; }
    for (let i = 0; i <= rounds; i++) { svg += "<text x='" + x(i) + "' y='" + (H - 6) + "' fill='var(--muted)' font-size='10' text-anchor='middle'>" + (i || "") + "</text>"; }
    order.slice().reverse().forEach(function (c) {
      const rank = order.indexOf(c), col = LINE_COLORS[rank % 10], top = rank < 3;
      svg += "<polyline fill='none' stroke='" + col + "' stroke-width='" + (top ? 3 : 1.5) + "' opacity='" + (top ? 1 : .55) + "' points='" + pts[c].slice(0, rounds + 1).map(function (v, i) { return x(i) + "," + y(v); }).join(" ") + "'/>";
    });
    svg += "</svg><div class='legend' style='display:flex;flex-wrap:wrap;gap:4px 14px'>" + order.map(function (c, i) { return "<span><b style='color:" + LINE_COLORS[i % 10] + "'>●</b> " + esc(teams[c]) + "</span>"; }).join("") + "</div>";
    return svg;
  }

  function pageRace() {
    let html = "<div class='card'><h3>Title race <span class='legend'>points after each round</span></h3>" + raceChart() + "</div>";
    html += "<div class='card'><h3>Qualification tracker <span class='legend'>top " + qualifiers() + " reach the playoffs</span></h3><div class='scroll'><table><tr><th>#</th><th class='left'>Team</th><th>Pts</th><th>Left</th><th>Max pts</th><th>Status</th></tr>";

    }).join("");
    return html + "</table></div><p class='legend'>Status counts points only. Teams level on points are split by goal difference, so a team marked Qualified or Eliminated is mathematically certain.</p></div>";

  function pageAwards() {
    const table = buildStandings(), fx = buildFixtures().flat();
    const done = table.every(function (r) { return r.played === SCHEDULE.length; });
    const boot = typeof bootTotals === "function" ? bootTotals() : [];
    function best(key, dir) { return table.slice().sort(function (a, b) { return dir * (a[key] - b[key]); })[0]; }
    let big = null;
    fx.forEach(function (m) { const r = results[m.id]; if (!isPlayed(r)) { return; } const d = Math.abs(r.h - r.a); if (!big || d > big.d) { big = { d: d, m: m, r: r }; } });
    const cards = [];
    function aw(icon, title, code, detail) { cards.push("<div class='pocard' style='border-left-color:var(--gold)'><small>" + icon + " " + title + "</small><div style='display:flex;align-items:center;gap:10px'>" +
      (code ? playerImg(starPlayer(code), "cm-img") + "<span class='badge big'>" + initials(teams[code]) + "</span>" : "") + "<div><b style='font-size:18px'>" + esc(code ? teams[code] : detail[0]) + "</b><div class='legend'>" + esc(code ? detail[0] : detail[1]) + "</div></div></div></div>"); }
    if (playoffWinners.f) { aw("🏆", "Champions", playoffWinners.f, ["Playoff winners"]); }
    if (table[0].played > 0) { aw("🛡️", done ? "League Shield" : "League Shield (leaders now)", table[0].code, [table[0].points + " points"]); }
    if (boot.length) { aw("👟", "Golden Boot", boot[0].team, [boot[0].player + " · " + boot[0].goals + " goals"]); }
    if (table[0].played > 0) {
      const a = best("gf", -1), d = best("ga", 1), w = best("won", -1);
      aw("⚔️", "Best attack", a.code, [a.gf + " goals scored"]); aw("🧤", "Best defence", d.code, [d.ga + " goals conceded"]); aw("💪", "Most wins", w.code, [w.won + " wins"]);
    }
    if (big && big.d > 0) { aw("💥", "Biggest win", big.r.h > big.r.a ? big.m.home : big.m.away, [teams[big.m.home] + " " + big.r.h + " - " + big.r.a + " " + teams[big.m.away]]); }
    if (!cards.length) { return "<div class='card'><p class='legend'>Awards appear as the season is played.</p></div>"; }
    return "<p class='legend'>" + (done ? "Final awards for the season." : "Provisional awards: they update with every result.") + "</p><div class='po comic'>" + cards.join("") + "</div>";
  }

  function heroStrip() {

    const goals = played.reduce(function (n, m) { return n + m.homeGoals + m.awayGoals; }, 0);

  function playWipe() {
    if (currentSeason === 1 || document.documentElement.getAttribute("data-theme") === "light") { return; }
    let w = document.getElementById("wipe");
    if (!w) { w = document.createElement("div"); w.id = "wipe"; w.innerHTML = "<i></i><i></i><i></i>"; document.body.appendChild(w); }
    w.classList.remove("go"); void w.offsetWidth; w.classList.add("go");
  }

  // 3D tilt on cards (mouse only)
  document.addEventListener("pointermove", function (e) {
    if (currentSeason === 1 || e.pointerType !== "mouse") { return; }
    const c = e.target.closest ? e.target.closest(".pocard,.hero") : null;
    document.querySelectorAll(".tilting").forEach(function (x) { if (x !== c) { x.classList.remove("tilting"); x.style.transform = ""; } });
    if (!c) { return; }
    const r = c.getBoundingClientRect(), px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
    c.classList.add("tilting"); c.style.transform = "perspective(900px) rotateY(" + (px * 7) + "deg) rotateX(" + (-py * 7) + "deg)";
  });

function toggleFull(b) { b.nextElementSibling.querySelector("table").classList.toggle("full"); }

// ---- smooth transitions ----
  if (document.startViewTransition) { document.documentElement.classList.add("vt"); }
  let lastSeasonShown = null;

  // keeps the tab buttons in place and only moves the highlight, so the change can animate
  function setNav(html) {
    const nav = document.getElementById("nav");
    const sig = html.replace(/class='on'/g, "class=''");
    if (nav.getAttribute("data-sig") !== sig) { nav.innerHTML = html; nav.setAttribute("data-sig", sig); }
    nav.querySelectorAll("button[data-tab]").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-tab") === currentTab); });
    const on = nav.querySelector("button.on");
    if (on && nav.scrollTo) { nav.scrollTo({ left: on.offsetLeft - nav.clientWidth / 2 + on.offsetWidth / 2, behavior: "smooth" }); }
  }

// =============== PLAYER PHOTO HERO + CARDS ===============
  // Photos live in a folder called "players" next to index.html, named by the player's name:
  // "John Smith" -> players/john-smith.png (a transparent PNG cut-out looks best)
const photoCache = {};
  function wikiPhoto(name) {
    const k = slug(name);
    if (photoCache[k] !== undefined) { return Promise.resolve(photoCache[k]); }
    try { const c = localStorage.getItem("pp:" + k); if (c !== null) { photoCache[k] = c === "-" ? null : c; return Promise.resolve(photoCache[k]); } } catch (e) {}
    return fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(playerBase(name).replace(/ /g, "_")))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        const ok = d && d.type === "standard" && /footbal|soccer|goalkeeper|midfielder|defender|forward|striker|winger/i.test(d.description || "");
        const url = ok && d.thumbnail ? d.thumbnail.source : null;
        photoCache[k] = url; try { localStorage.setItem("pp:" + k, url || "-"); } catch (e) {}
        return url;
      }).catch(function () { return null; });
  }
  // players/ folder first; if that file is missing, look the player up online
  function photoFallback(img) {
    if (img.getAttribute("data-tried")) { img.style.display = "none"; return; }
    img.setAttribute("data-tried", "1");
    wikiPhoto(img.getAttribute("data-name")).then(function (url) {
      if (url) { img.classList.add("online"); img.src = url; } else { img.style.display = "none"; }
    });
  }

// =============== EFOOTBALL-STYLE PLAYER CARDS ===============
  let cardTeam = "T1";
  function findCard(code, name) {
    const k = slug(name);
    return allCards.find(function (c) { return c.season === currentSeason && c.team === code && slug(c.player) === k; }) || null;
  }
  function safeUrl(u) { return /^(https?:\/\/|players\/)/i.test(u || "") ? u : ""; }
  function heroPhoto(code, star) {
    const c = findCard(code, star);
    if (c && safeUrl(c.image_url)) { return "<img class='h2-player' src='" + esc(safeUrl(c.image_url)) + "' alt='' onerror=\"this.style.display='none'\">"; }
    return playerImg(star, "h2-player");
  }
  function cardHtml(c, name, admin) {
    const st = [["PAS", c.pas], ["SPD", c.spd], ["SHO", c.sho], ["DRI", c.dri]].map(function (x) { return "<div><b>" + (x[1] === null || x[1] === undefined ? "-" : x[1]) + "</b><small>" + x[0] + "</small></div>"; }).join("");
    const img = safeUrl(c.image_url) ? "<img class='efc-img' src='" + esc(safeUrl(c.image_url)) + "' alt='' loading='lazy' onerror=\"this.style.display='none'\">" : "";
    return "<div class='efc t-" + slug(c.card_type || "standard") + "'><div class='efc-top'><b>" + (c.overall || "-") + "</b><span>" + esc(c.position || "") + "</span></div>" + img +
      "<div class='efc-body'><div class='efc-name'>" + esc(playerBase(name || c.player)) + "</div><div class='efc-stats'>" + st + "</div>" +
      "<div class='efc-meta'>" + esc(c.card_type || "Standard") + (c.max_level ? " · Lv " + c.max_level : "") + (c.foot ? " · " + esc(c.foot) : "") + (c.form ? " · Form " + esc(c.form) : "") + "</div>" +
      (admin ? "<div class='efc-adm'><button class='btn out' onclick='editCard(" + c.id + ")'>Edit</button><button class='btn out' onclick='deleteCard(" + c.id + ")'>✕</button></div>" : "") + "</div></div>";
  }
  function num(id) { const v = document.getElementById(id).value; return v === "" ? null : Number(v); }
  async function saveCard() {
    if (!isAdmin) { return; }
    const player = document.getElementById("cdP").value.trim();
    if (!player) { setStatus("Enter the player name."); return; }
    const url = document.getElementById("cdImg").value.trim();
    if (url && !safeUrl(url)) { setStatus("The image link must start with https:// or players/"); return; }
    const row = { season: currentSeason, team: cardTeam, player: player, image_url: url || null, overall: num("cdOvr"), position: document.getElementById("cdPos").value.trim().toUpperCase(),
      max_level: num("cdLvl"), card_type: document.getElementById("cdType").value, foot: document.getElementById("cdFoot").value, form: document.getElementById("cdForm").value.trim(),
      pas: num("cdPas"), spd: num("cdSpd"), sho: num("cdSho"), dri: num("cdDri") };
    const res = await sb.from("player_cards").upsert(row, { onConflict: "season,team,player" }).select();
    if (res.error) { setStatus("Could not save: " + res.error.message); return; }
    setStatus(""); const saved = res.data[0];
    allCards = allCards.filter(function (c) { return !(c.season === saved.season && c.team === saved.team && c.player === saved.player); }).concat([saved]);
    toast("Card saved ✓"); render();
  }
  async function deleteCard(id) {
    if (!isAdmin || !confirm("Delete this card?")) { return; }
    const res = await sb.from("player_cards").delete().eq("id", id);
    if (res.error) { setStatus("Could not delete: " + res.error.message); return; }
    allCards = allCards.filter(function (c) { return c.id !== id; }); render();
  }
  function editCard(id) {
    const c = allCards.find(function (x) { return x.id === id; }); if (!c) { return; }
    const set = function (i, v) { document.getElementById(i).value = (v === null || v === undefined) ? "" : v; };
    set("cdP", c.player); set("cdImg", c.image_url); set("cdOvr", c.overall); set("cdPos", c.position); set("cdLvl", c.max_level); set("cdType", c.card_type || "Standard");
    set("cdFoot", c.foot); set("cdForm", c.form); set("cdPas", c.pas); set("cdSpd", c.spd); set("cdSho", c.sho); set("cdDri", c.dri);
    document.getElementById("cdP").scrollIntoView({ behavior: "smooth", block: "center" });
  }
  function pageCards() {
    if (!teams[cardTeam]) { cardTeam = Object.keys(teams)[0]; }
    const sq = squads[cardTeam] ? playerList(squads[cardTeam].players) : [];
    const mine = allCards.filter(function (c) { return c.season === currentSeason && c.team === cardTeam; });
    let html = "<div class='card'><h3>Player cards</h3><select onchange=\"cardTeam=this.value;render()\">" + Object.keys(teams).map(function (c) {
      return "<option value='" + c + "'" + (c === cardTeam ? " selected" : "") + ">" + esc(teams[c]) + "</option>"; }).join("") + "</select></div>";
    html += mine.length ? "<div class='efcs'>" + mine.map(function (c) { return cardHtml(c, c.player, isAdmin); }).join("") + "</div>" : "<div class='card'><p class='legend'>No cards added for this team yet.</p></div>";
    if (isAdmin) {
      const types = ["Standard", "Epic", "Big Time", "Featured", "Legend"].map(function (t) { return "<option>" + t + "</option>"; }).join("");
      html += "<div class='card'><h3>Add or edit a card</h3><datalist id='cdPl'>" + sq.map(function (p) { return "<option value='" + esc(playerBase(p)) + "'>"; }).join("") + "</datalist>" +
        "<div class='cform'><input id='cdP' list='cdPl' placeholder='Player name'><input id='cdImg' placeholder='Image link (https://... or players/x.png)'><input id='cdOvr' type='number' placeholder='Overall'><input id='cdPos' placeholder='Position (CF)'>" +
        "<input id='cdLvl' type='number' placeholder='Max level'><select id='cdType'>" + types + "</select><select id='cdFoot'><option value=''>Foot</option><option>Right</option><option>Left</option></select><input id='cdForm' placeholder='Form (A-E)'>" +
        "<input id='cdPas' type='number' placeholder='PAS'><input id='cdSpd' type='number' placeholder='SPD'><input id='cdSho' type='number' placeholder='SHO'><input id='cdDri' type='number' placeholder='DRI'></div>" +
        "<p class='legend'>Saving a card for a player that already has one replaces it.</p><button class='btn' onclick='saveCard()'>Save card</button></div>";
    }
    return html;
  }

  function playerBase(p) { return String(p).split("(")[0].split(" - ")[0].trim(); }
  function slug(n) { return playerBase(n).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }
  function playerImg(name, cls) {
    return "<img class='" + cls + "' src='players/" + slug(name) + ".png' alt='' loading='lazy' data-name='" + esc(playerBase(name)) + "' onerror=\"photoFallback(this)\">";
  }
  function starPlayer(code) {
    const top = (typeof bootTotals === "function" ? bootTotals() : []).filter(function (g) { return g.team === code; })[0];
    if (top) { return top.player; }
    const sq = squads[code]; const list = sq ? playerList(sq.players) : [];
    return list.length ? list[0] : "";
  }
  function heroBase(code, label, extra) {
    const c = (typeof CLUBS !== "undefined" && CLUBS[teams[code]]) || { bg: "#d3122b", fg: "#fff" };
    const star = starPlayer(code);
    return "<div class='h2' style='--club:" + c.bg + "'><div class='h2-dots'></div><div class='h2-circle'></div><div class='h2-name'>" + esc(teams[code]) + "</div>" +
      "<span class='badge big h2-logo'>" + initials(teams[code]) + "</span>" + (star ? heroPhoto(code, star) : "") +
      "<div class='h2-info'><small>" + label + "</small><h2>" + esc(teams[code]) + "</h2>" + extra + "</div></div>";
  }
  function heroLeader() {
    const table = buildStandings(), lead = table[0], played = getPlayedMatches();
    if (!played.length) { return ""; }
    const goals = played.reduce(function (n, m) { return n + m.homeGoals + m.awayGoals; }, 0);
    function cell(v, l) { return "<div><b>" + v + "</b><small>" + l + "</small></div>"; }
    return heroBase(lead.code, "LEAGUE LEADERS", "<div class='legend'>" + lead.points + " pts · " + lead.won + "W " + lead.drawn + "D " + lead.lost + "L · GD " + (lead.gf - lead.ga) + "</div>" +
      "<button class='btn' onclick=\"openTeam('" + lead.code + "')\">Team profile</button>") +
      "<div class='strip'>" + cell(played.length, "Matches") + cell(goals, "Goals") + cell((goals / played.length).toFixed(1), "Goals / match") + cell(lead.points, "Leader pts") + "</div>";
  }
  function heroTeam(code) {
    const row = buildStandings().find(function (r) { return r.code === code; });
    const sq = squads[code] || { owner: "" };
    const form = row.form.slice(-5).map(function (f) { return "<span class='" + f + "'>" + f + "</span>"; }).join("");
    return heroBase(code, "OWNER · " + (sq.owner ? esc(sq.owner) : "TBA"), "<div class='form'>" + form + "</div>");
  }
  function playerCards(code, list) {
    return "<div class='plcs'>" + list.map(function (p, i) {
      const fc = findCard(code, p); if (fc) { return cardHtml(fc, p, false); }
      return "<div class='plc'><span class='plc-no'>" + (i + 1) + "</span>" + playerImg(p, "plc-img") + "<div class='plc-name'>" + esc(playerBase(p)) + goalTag(code, p) + "</div></div>";
    }).join("") + "</div>";
  }

  function render() {
    const key = currentTab + (currentTab === "Fixtures" ? currentRound : "");
    const changed = loaded && lastKey !== "" && (key !== lastKey || currentSeason !== lastSeasonShown);
    lastSeasonShown = currentSeason;
    const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (changed && document.startViewTransition && !calm) { document.startViewTransition(function () { renderNow(); }); }
    else { renderNow(); }
  }

  function renderNow() {
    const navHtml = seasonTabs().map(function (t) {
      const label = (t === "Admin" && isAdmin) ? "Admin ✓" : t;
      return "<button data-tab='" + t + "' class='" + (t === currentTab ? "on" : "") + "' onclick=\"currentTab='" + t + "';render()\">" + label + "</button>";
    }).join("") + installButton();
    setNav(navHtml);
    const pages = { Cards: pageCards, Awards: pageAwards, Transfers: pageTransfers, News: pageNews, Race: pageRace, Standings: pageStandings, Fixtures: pageFixtures, Playoffs: pagePlayoffs, Squads: pageSquads, Records: pageRecords, "Golden Boot": pageBoot, "Player Stats": pageStats, "Hall of Fame": pageHall, Rules: pageRules, Admin: pageAdmin, Team: pageTeam };
    const app = document.getElementById("app");
    app.innerHTML = loaded ? (currentTab === "Standings" && currentSeason !== 1 ? heroLeader() : "") + pages[currentTab]() : skeleton();

    // play the entrance animation only when the tab or round changes
    const key = currentTab + (currentTab === "Fixtures" ? currentRound : "");
    if (key !== lastKey) {
      app.classList.remove("enter");
      void app.offsetWidth;          // restarts the animation
      app.classList.add("enter");
      lastKey = key;
    }
    applyLogos(app);
    renderTicker();
    animateCounts();
  }

  // =============== START ===============
  async function start() {
    applySeason();
    buildSeasonSelect();
    const s = await sb.auth.getSession();
    isAdmin = !!(s.data && s.data.session);
    render();
    loadData();
    // refresh every 30 seconds, but not while someone is typing
    setInterval(function () {
      const tag = document.activeElement ? document.activeElement.tagName : "";
      if (tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA") { loadData(); }
    }, 30000);
  }

    function themeLabel() {
    const light = document.documentElement.getAttribute("data-theme") === "light";
    document.getElementById("themeBtn").textContent = light ? "🌙 Dark" : "☀️ Light";
  }
  function toggleTheme() {
    document.documentElement.classList.add("theming");
    setTimeout(function () { document.documentElement.classList.remove("theming"); }, 450);
    const light = document.documentElement.getAttribute("data-theme") === "light";
    if (light) { document.documentElement.removeAttribute("data-theme"); }
    else { document.documentElement.setAttribute("data-theme", "light"); }
    try { localStorage.setItem("theme", light ? "dark" : "light"); } catch (e) {}
    themeLabel();
  }
  themeLabel();

    let deferredInstall = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstall = e;
  });
  window.addEventListener("appinstalled", function () {
    deferredInstall = null;
    render();
  });

  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }

  function installButton() {
    return isStandalone() ? "" : "<button class='inst' onclick='installApp()'>📲 Install</button>";
  }

  async function installApp() {
    if (deferredInstall) {
      deferredInstall.prompt();
      await deferredInstall.userChoice;
      deferredInstall = null;
      render();
      return;
    }
    showInstallHelp();
  }

  function showInstallHelp() {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const steps = ios
      ? "<ol><li>Open this site in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with an arrow).</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol>"
      : "<ol><li>Open this site in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu (top right).</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>";
    const box = document.createElement("div");
    box.className = "modal";
    box.innerHTML = "<div class='modalbox'><h3>📲 Install the league app</h3>" + steps +
      "<p class='legend'>If you opened this link inside WhatsApp or another app, first choose <b>Open in browser</b> from its menu.</p>" +
      "<button class='btn' onclick='this.closest(\".modal\").remove()'>Got it</button></div>";
    box.addEventListener("click", function (e) { if (e.target === box) { box.remove(); } });
    document.body.appendChild(box);
  }

  start();
    // lets the site be installed as an app
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

</script>

</html>
