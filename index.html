  let ovTeam = "";
  function pickOv(n) { ovTeam = n; render(); }
  function withSeason(no, fn) {
    const keep = currentSeason;
    function set(n) { currentSeason = n; teams = SEASONS[n].teams; SCHEDULE = SEASONS[n].schedule; filterSeasonData(); }
    try { set(no); return fn(); } finally { set(keep); }
  }
  function stars(n) { return "★".repeat(n) + "<span style='opacity:.25'>" + "★".repeat(5 - n) + "</span>"; }

  function overallData() {
    const by = {};
    function get(name) { return by[name] || (by[name] = { name: name, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0, seasons: [], trophies: [] }); }
    Object.keys(SEASONS).map(Number).sort(function (a, b) { return a - b; }).forEach(function (no) {
      const sum = seasonSummary(no);
      withSeason(no, function () {
        const rows = buildStandings(), badges = computeBadges(rows);
        rows.forEach(function (r, i) {
          const a = get(r.name);
          a.p += r.played; a.w += r.won; a.d += r.drawn; a.l += r.lost; a.gf += r.gf; a.ga += r.ga; a.pts += r.points;
          a.seasons.push({ name: SEASONS[no].name, p: r.played, w: r.won, d: r.drawn, l: r.lost, gf: r.gf, ga: r.ga, pts: r.points, pos: i + 1 });
          if (sum.complete) { badges[r.code].forEach(function (b) { a.trophies.push({ icon: b.icon, title: b.name, season: SEASONS[no].name, stars: 1 }); }); }
        });
      });
      if (sum.complete) {
        if (sum.champion) { get(sum.champion).trophies.push({ icon: "🏆", title: "League Champions", season: sum.name, stars: 5 }); }
        get(sum.shield.name).trophies.push({ icon: "🛡️", title: "League Shield", season: sum.name, stars: 3 });
        sum.boot.forEach(function (b) { get(b.team).trophies.push({ icon: "👟", title: "Golden Boot", season: sum.name, detail: b.player + " · " + sum.bootGoals + " goals", stars: 2 }); });
      }
    });
    Object.keys(by).forEach(function (k) { by[k].trophies.sort(function (x, y) { return y.stars - x.stars; }); });
    return by;
  }

  function cabinet(a) {
    if (!a.trophies.length) { return "<p class='legend'>No trophies yet. Awards are added when a league finishes.</p>"; }
    return "<div class='cabinet'>" + a.trophies.map(function (t) {
      return "<div class='trophy s" + t.stars + "'><span class='ti'>" + t.icon + "</span><b>" + esc(t.title) + "</b><small>" + esc(t.season) + (t.detail ? " · " + esc(t.detail) : "") + "</small><div class='stars'>" + stars(t.stars) + "</div></div>";
    }).join("") + "</div>";
  }

  function pageTeamStats() {
    const by = overallData(), names = Object.keys(by).sort();
    function gd(a) { const d = a.gf - a.ga; return d > 0 ? "+" + d : d; }
    function cell(v, l) { return "<div><b>" + v + "</b><small>" + l + "</small></div>"; }
    let h = "<p class='legend'>Combined results from every league so far: main leagues and the mini league together.</p>" +
      "<select onchange='pickOv(this.value)' style='margin-bottom:16px;max-width:380px'><option value=''>All teams combined</option>" +
      names.map(function (n) { return "<option value=\"" + esc(n) + "\"" + (n === ovTeam ? " selected" : "") + ">" + esc(n) + "</option>"; }).join("") + "</select>";
    if (ovTeam && by[ovTeam]) {
      const a = by[ovTeam];
      h += "<div class='card'><h3>" + esc(a.name) + "</h3><div class='strip'>" + cell(a.p, "Matches") + cell(a.w, "Won") + cell(a.d, "Drawn") + cell(a.l, "Lost") + cell(a.gf, "Goals for") + cell(a.ga, "Against") + cell(gd(a), "Goal diff") + cell(a.pts, "Points") + cell(a.p ? Math.round(a.w / a.p * 100) + "%" : "0%", "Win rate") + "</div></div>";
      h += "<div class='card'><h3>Trophy cabinet</h3>" + cabinet(a) + "</div>";
      h += "<div class='card scroll'><h3>By league</h3><table style='min-width:0'><tr><th class='left'>League</th><th>Pos</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>" +
        a.seasons.map(function (s) { return "<tr><td class='left'>" + esc(s.name) + "</td><td>" + s.pos + "</td><td>" + s.p + "</td><td>" + s.w + "</td><td>" + s.d + "</td><td>" + s.l + "</td><td>" + (s.gf - s.ga) + "</td><td class='pts'>" + s.pts + "</td></tr>"; }).join("") + "</table></div>";
      return h;
    }
    const list = names.map(function (n) { return by[n]; }).sort(function (x, y) { return y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga); });
    h += "<div class='card scroll'><table style='min-width:0'><tr><th>#</th><th class='left'>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th><th>🏆</th></tr>" +
      list.map(function (a, i) { return "<tr><td>" + (i + 1) + "</td><td class='left'><a class='tl' data-n=\"" + esc(a.name) + "\" onclick='pickOv(this.dataset.n)'>" + esc(a.name) + "</a></td><td>" + a.p + "</td><td>" + a.w + "</td><td>" + a.d + "</td><td>" + a.l + "</td><td>" + gd(a) + "</td><td class='pts'>" + a.pts + "</td><td>" + a.trophies.length + "</td></tr>"; }).join("") + "</table></div>" +
      "<p class='legend'>Pick a team above to see its trophy cabinet. Stars: Champions ★★★★★, League Shield ★★★, Golden Boot ★★, every other award ★.</p>";
    return h;
  }

  function recapHtml(sum) {
    const fx = buildFixtures().flat(); let big = null, hi = null, goals = 0, n = 0;
    fx.forEach(function (m) {
      const r = results[m.id]; if (!isPlayed(r)) { return; }
      const d = Math.abs(r.h - r.a), t = Number(r.h) + Number(r.a); goals += t; n++;
      if (!big || d > big.d) { big = { d: d, m: m, r: r }; }
      if (!hi || t > hi.t) { hi = { t: t, m: m, r: r }; }
    });
    function line(x) { return x ? esc(teams[x.m.home]) + " " + x.r.h + "-" + x.r.a + " " + esc(teams[x.m.away]) : "-"; }
    function box(icon, t, main, sub) { return "<div class='hbox'><span class='ic'>" + icon + "</span><div class='ht'>" + t + "</div><div class='hm'>" + main + "</div><div class='legend'>" + sub + "</div></div>"; }
    return "<div class='card hall'><h2>Season recap <span class='tag tdone'>" + esc(sum.name) + "</span></h2><div class='hgrid'>" +
      box("🏆", "Champions", esc(sum.champion), "Runners-up: " + esc(sum.runnerUp || "-") + "<br>" + stars(5)) +
      box("🛡️", "League Shield", esc(sum.shield.name), sum.shield.pts + " points from " + sum.shield.p + " matches<br>" + stars(3)) +
      box("👟", "Golden Boot", sum.boot.length ? sum.boot.map(function (b) { return esc(b.player); }).join(", ") : "-", sum.bootGoals + " goals<br>" + stars(2)) +
      box("⚽", "Goals", goals, n + " matches · " + (n ? (goals / n).toFixed(1) : 0) + " per match") +
      box("💥", "Biggest win", line(big), "") + box("🔥", "Highest scoring", line(hi), "") + "</div></div>";
  }

  // 3D pop-up when entering Standings, Golden Boot, or the Playoffs after a season ends
  function introFor(tab) {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) { return; }
    let lead = null, rest = [], party = false;
    if (tab === "Standings") {
      const t = buildStandings(); if (!t.some(function (r) { return r.played; })) { return; }
      const r = t[0];
      lead = { badge: initials(r.name), title: r.name, sub: "League leaders", stats: [["P", r.played], ["W", r.won], ["D", r.drawn], ["L", r.lost], ["GD", r.gf - r.ga], ["PTS", r.points]] };
      rest = t.slice(1).map(function (x, i) { return { badge: initials(x.name), title: x.name, sub: "#" + (i + 2), right: x.points + " pts" }; });
    } else if (tab === "Golden Boot") {
      const l = bootTotals(); if (!l.length) { return; }
      lead = { badge: initials(teams[l[0].team]), title: l[0].player, sub: "Golden Boot leader · " + teams[l[0].team], stats: [["GOALS", l[0].goals]] };
      rest = l.slice(1, 9).map(function (x) { return { badge: initials(teams[x.team]), title: x.player, sub: teams[x.team], right: x.goals + " goals" }; });
    } else if (tab === "Playoffs") {
      const s = seasonSummary(currentSeason); if (!(s.complete && s.champion)) { return; }
      lead = { badge: "🏆", title: s.champion, sub: "Champions · " + s.name, stats: [["RUNNERS-UP", s.runnerUp || "-"]] }; party = true;
    } else { return; }
    const old = document.querySelector(".intro"); if (old) { old.remove(); }
    const el = document.createElement("div"); el.className = "intro";
    let cf = "";
    if (party) { for (let i = 0; i < 44; i++) { cf += "<i class='cf' style='left:" + Math.round(Math.random() * 100) + "%;background:" + ["#f5b301", "#c1121f", "#fff", "#ff5a67"][i % 4] + ";animation-delay:" + (Math.random() * 1.2).toFixed(2) + "s;animation-duration:" + (2 + Math.random() * 1.8).toFixed(2) + "s'></i>"; } }
    el.innerHTML = "<div class='ilead'><div class='ibadge'>" + esc(lead.badge) + "</div><small>" + esc(lead.sub) + "</small><h2>" + esc(lead.title) + "</h2><div class='istats'>" +
      lead.stats.map(function (s) { return "<div><b>" + esc(String(s[1])) + "</b><i>" + s[0] + "</i></div>"; }).join("") + "</div></div>" +
      "<div class='irest'>" + rest.map(function (x, i) { return "<div class='irow' style='animation-delay:" + (i * 0.1).toFixed(1) + "s'><span>" + esc(x.badge) + "</span><b>" + esc(x.title) + "</b><small>" + esc(x.sub) + "</small><em>" + esc(x.right) + "</em></div>"; }).join("") + "</div>" + cf + "<div class='iskip'>Tap to skip</div>";
    let closed = false;
    function close() { if (closed) { return; } closed = true; el.classList.add("out"); setTimeout(function () { el.remove(); }, 350); }
    el.onclick = close; document.body.appendChild(el);
    if (rest.length) { setTimeout(function () { el.classList.add("p2"); }, 1700); setTimeout(close, 1700 + rest.length * 100 + 1500); }
    else { setTimeout(close, 3800); }
  }

  // =============== HOME PAGE ===============
  const TILE_INFO = { Standings: "League table", "Team Stats": "Combined stats & trophies", News: "Latest stories", Race: "Title & top-6 race", Fixtures: "Every match", Playoffs: "Road to the final", Awards: "Season awards", Transfers: "Deals done", Squads: "Team rosters", Records: "Best & worst", "Golden Boot": "Top scorers", "Player Stats": "Player numbers", "Hall of Fame": "Past champions", Rules: "How it works", Admin: "Manage league" };
  function goTab(t) { currentTab = t; render(); window.scrollTo(0, 0); }
  function pageHome() {
    const table = buildStandings(), played = getPlayedMatches();
    const goals = played.reduce(function (n, m) { return n + m.homeGoals + m.awayGoals; }, 0);
    const lead = table[0], codes = Object.keys(teams);
    const all = buildFixtures();
    let next = null, nextRound = 0, last = [];
    all.forEach(function (round, ri) { round.forEach(function (m) {
      const r = results[m.id], done = r && r.h !== "" && r.a !== "" && r.h !== null && r.a !== null;
      if (done) { last.push({ m: m, r: r }); } else if (!next) { next = m; nextRound = ri + 1; }
    }); });
    last = last.slice(-5).reverse();
    const sum = seasonSummary(currentSeason), fin = !!(sum.complete && sum.champion);
    const kick = played.length ? teams[lead.code] + " lead the league" : "Season " + currentSeason + " kicks off soon";
    let h = "<section class='feat homefeat'><div class='feat-txt'><small>" + (fin ? "Season champions" : played.length ? "League leaders" : "Welcome") + "</small><h2>" + esc(fin ? sum.champion : kick) + "</h2>" +
      "<p class='legend'>" + (fin ? "League Shield: " + esc(sum.shield.name) + " · Runners-up: " + esc(sum.runnerUp || "-") : played.length ? lead.won + "W " + lead.drawn + "D " + lead.lost + "L · " + (lead.gf - lead.ga) + " goal difference" : codes.length + " teams · home & away") + "</p>" +
      "<button class='btn' onclick=\"goTab('" + (fin ? "Playoffs" : "Standings") + "')\">" + (fin ? "Playoffs →" : "Full table →") + "</button></div>" +
      "<div class='feat-side'><div class='feat-num'><b>" + (fin ? "🏆" : played.length ? lead.points : codes.length) + "</b><small>" + (fin ? "CHAMPIONS" : played.length ? "POINTS" : "TEAMS") + "</small></div></div></section>";
    h += "<div class='nextbar'><div><small>Next match" + (next ? " · Round " + nextRound : "") + "</small></div>" +
      (next ? "<div class='nm'><b>" + esc(teams[next.home]) + "</b><span class='vsx'>VS</span><b>" + esc(teams[next.away]) + "</b></div>" : "<div class='nm'><b>All fixtures played</b></div>") +
      "<button class='btn out' onclick=\"goTab('Fixtures')\">View all</button></div>";
    function cell(v, l) { return "<div><b>" + v + "</b><small>" + l + "</small></div>"; }
    h += "<div class='strip'>" + cell(played.length, "Matches") + cell(goals, "Goals") + cell(played.length ? (goals / played.length).toFixed(1) : "0.0", "Goals / match") + cell(codes.length, "Teams") + "</div>";
    if (fin) { h += recapHtml(sum); }
    h += "<div class='homegrid'><div class='card'><h3>Top 5</h3><div class='scroll'><table style='min-width:0'><tr><th>#</th><th class='left'>Team</th><th>P</th><th>GD</th><th>Pts</th></tr>" +
      table.slice(0, 5).map(function (r, i) { return "<tr class='" + (i < 4 ? "top4" : "") + "'><td>" + (i + 1) + "</td><td class='left'><span class='tl' onclick=\"openTeam('" + r.code + "')\">" + esc(r.name) + "</span></td><td>" + r.played + "</td><td>" + (r.gf - r.ga) + "</td><td class='pts'>" + r.points + "</td></tr>"; }).join("") +
      "</table></div></div><div class='card'><h3>Latest results</h3>" +
      (last.length ? last.map(function (x) { return "<div class='match' style='grid-template-columns:1fr auto 1fr'><span class='h'>" + esc(teams[x.m.home]) + "</span><span class='score'>" + x.r.h + " - " + x.r.a + "</span><span class='a'>" + esc(teams[x.m.away]) + "</span></div>"; }).join("") : "<p class='legend'>No results yet.</p>") + "</div></div>";
    h += "<div class='tiles'>" + seasonTabs().filter(function (t) { return t !== "Home"; }).map(function (t, i) {
      return "<button class='tile' onclick=\"goTab('" + t + "')\"><span>" + (i < 9 ? "0" : "") + (i + 1) + "</span><b>" + t + "</b><small>" + (TILE_INFO[t] || "") + "</small></button>"; }).join("") + "</div>";
    return h;
  }

  function renderNow() {
    const navHtml = seasonTabs().map(function (t) {
      const label = (t === "Admin" && isAdmin) ? "Admin ✓" : t;
      return "<button data-tab='" + t + "' class='" + (t === currentTab ? "on" : "") + "' onclick=\"currentTab='" + t + "';render()\">" + label + "</button>";
    }).join("") + installButton();
    setNav(navHtml);
    const pages = { "Team Stats": pageTeamStats, Home: pageHome, Awards: pageAwards, Transfers: pageTransfers, News: pageNews, Race: pageRace, Standings: pageStandings, Fixtures: pageFixtures, Playoffs: pagePlayoffs, Squads: pageSquads, Records: pageRecords, "Golden Boot": pageBoot, "Player Stats": pageStats, "Hall of Fame": pageHall, Rules: pageRules, Admin: pageAdmin, Team: pageTeam };
    const app = document.getElementById("app");
    app.innerHTML = loaded ? pageHead() + (currentTab === "Standings" ? heroLeader() : "") + pages[currentTab]() : skeleton();

    // play the entrance animation only when the tab or round changes
    const key = currentTab + (currentTab === "Fixtures" ? currentRound : "");
    const entering = key !== lastKey && lastKey !== "";
    if (key !== lastKey) {
      app.classList.remove("enter");
      void app.offsetWidth;          // restarts the animation
      app.classList.add("enter");
      lastKey = key;
    }
    document.body.classList.toggle("home", currentTab === "Home");
    applyLogos(app);
    renderTicker();
    animateCounts();
    if (entering && loaded) { introFor(currentTab); }
  }

  // =============== START ===============
  async function start() {
    applySeason();
    buildSeasonSelect();
    const s = await sb.auth.getSession();
    isAdmin = !!(s.data && s.data.session);
    render();
    loadData();
    // refresh every 30 seconds, but not while someone is typing
    setInterval(function () {
      const tag = document.activeElement ? document.activeElement.tagName : "";
      if (tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA") { loadData(); }
    }, 30000);
  }


    let deferredInstall = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstall = e;
  });
  window.addEventListener("appinstalled", function () {
    deferredInstall = null;
    render();
  });

  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }

  function installButton() {
    return isStandalone() ? "" : "<button class='inst' onclick='installApp()'>📲 Install</button>";
  }

  async function installApp() {
    if (deferredInstall) {
      deferredInstall.prompt();
      await deferredInstall.userChoice;
      deferredInstall = null;
      render();
      return;
    }
    showInstallHelp();
  }

  function showInstallHelp() {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const steps = ios
      ? "<ol><li>Open this site in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with an arrow).</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol>"
      : "<ol><li>Open this site in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu (top right).</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>";
    const box = document.createElement("div");
    box.className = "modal";
    box.innerHTML = "<div class='modalbox'><h3>📲 Install the league app</h3>" + steps +
      "<p class='legend'>If you opened this link inside WhatsApp or another app, first choose <b>Open in browser</b> from its menu.</p>" +
      "<button class='btn' onclick='this.closest(\".modal\").remove()'>Got it</button></div>";
    box.addEventListener("click", function (e) { if (e.target === box) { box.remove(); } });
    document.body.appendChild(box);
  }

  start();
    // lets the site be installed as an app
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

</script>
</body>
</html>
