  let currentRound = 0;
  let currentTeam = "T1";

  function setStatus(text) { document.getElementById("status").textContent = text || ""; }

  function initials(name) {
    const w = name.split(" ");
    return (w.length > 1 ? w[0][0] + w[1][0] : name.slice(0, 3)).toUpperCase();
  }

  // =============== LOAD FROM DATABASE ===============
  async function loadData() {
    const r = await sb.from("results").select("*");
    const p = await sb.from("playoffs").select("*");
    const s = await sb.from("squads").select("*");
    if (r.error || p.error || s.error) { setStatus("Could not load data. Check your internet and refresh."); return; }
    setStatus("");
    results = {};
    r.data.forEach(function (row) { results[row.id] = { h: row.home_goals, a: row.away_goals }; });
    playoffWinners = {};
    p.data.forEach(function (row) { playoffWinners[row.stage] = row.winner; });
    squads = {};
    s.data.forEach(function (row) { squads[row.team] = { owner: row.owner || "", players: row.players || "" }; });
    render();
  }

    // =============== FIXTURE LIST (fixed, checked: no 3 home or away games in a row) ===============
  const SCHEDULE = [
    ["T10-T7", "T8-T9", "T6-T3", "T4-T2", "T1-T5"],  // Round 1
    ["T6-T7", "T8-T4", "T1-T10", "T5-T9", "T2-T3"],  // Round 2
    ["T7-T5", "T2-T1", "T3-T4", "T9-T6", "T10-T8"],  // Round 3

    ["T7-T3", "T2-T9", "T10-T5", "T8-T1", "T6-T4"],  // Round 6
    ["T9-T7", "T3-T10", "T2-T8", "T5-T6", "T4-T1"],  // Round 7
    ["T7-T2", "T3-T5", "T1-T9", "T4-T10", "T6-T8"],  // Round 8
    ["T1-T7", "T5-T4", "T2-T6", "T8-T3", "T10-T9"],  // Round 9
    ["T6-T2", "T3-T8", "T7-T1", "T4-T5", "T9-T10"],  // Round 10
    ["T2-T7", "T8-T6", "T5-T3", "T9-T1", "T10-T4"],  // Round 11
    ["T1-T4", "T6-T5", "T7-T9", "T8-T2", "T10-T3"],  // Round 12
    ["T9-T2", "T1-T8", "T3-T7", "T4-T6", "T5-T10"],  // Round 13
    ["T6-T1", "T9-T3", "T2-T10", "T7-T4", "T5-T8"],  // Round 14
    ["T2-T5", "T3-T1", "T10-T6", "T8-T7", "T4-T9"],  // Round 15
    ["T6-T9", "T8-T10", "T1-T2", "T4-T3", "T5-T7"],  // Round 16
    ["T9-T8", "T5-T1", "T2-T4", "T3-T6", "T7-T10"],  // Round 17
    ["T9-T5", "T7-T6", "T4-T8", "T10-T1", "T3-T2"]   // Round 18
  ];
  // each entry is "HOME-AWAY", for example "T10-T7" means T10 is at home against T7

  function buildFixtures() {
    return SCHEDULE.map(function (round, r) {
      return round.map(function (code, i) {
        const t = code.split("-");
        return { id: "R" + (r + 1) + "-" + (i + 1), home: t[0], away: t[1] };
      });
    });
  }

  // =============== STANDINGS LOGIC ===============
  function getPlayedMatches() {
    const played = [];
    buildFixtures().flat().forEach(function (m) {
      const r = results[m.id];
      if (r && r.h !== "" && r.a !== "" && r.h !== null && r.a !== null) {
        played.push({ home: m.home, away: m.away, homeGoals: Number(r.h), awayGoals: Number(r.a) });
      }
    });
    return played;
  }

  function buildStandings() {
    const table = Object.keys(teams).map(function (code) {
      return { code: code, name: teams[code], played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, points: 0, form: [] };
    });
    function find(code) { return table.find(function (row) { return row.code === code; }); }

    for (const m of getPlayedMatches()) {
      const home = find(m.home), away = find(m.away);
      home.played++; away.played++;
      home.gf += m.homeGoals; home.ga += m.awayGoals;
      away.gf += m.awayGoals; away.ga += m.homeGoals;
      if (m.homeGoals > m.awayGoals) { home.won++; away.lost++; home.points += 3; home.form.push("W"); away.form.push("L"); }
      else if (m.homeGoals < m.awayGoals) { away.won++; home.lost++; away.points += 3; away.form.push("W"); home.form.push("L"); }
      else { home.drawn++; away.drawn++; home.points++; away.points++; home.form.push("D"); away.form.push("D"); }
    }
    table.sort(function (a, b) {
      return b.points - a.points || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf;
    });
    return table;
  }

  // =============== SAVING (admin only; the database also enforces this) ===============
  async function saveScore(id) {
    if (!isAdmin) return;
    const h = document.getElementById("h-" + id).value;
    const a = document.getElementById("a-" + id).value;
    results[id] = { h: h, a: a };
    if (h === "" && a === "") {
      const res = await sb.from("results").delete().eq("id", id);
      delete results[id];
      if (res.error) { setStatus("Could not delete: " + res.error.message); }
    } else if (h !== "" && a !== "") {
      const res = await sb.from("results").upsert({ id: id, home_goals: Number(h), away_goals: Number(a) });
      setStatus(res.error ? "Could not save: " + res.error.message : "");
    }
    render();
  }

  async function pickWinner(stage, code) {
    if (!isAdmin) return;
    let res;
    if (code === "") {
      delete playoffWinners[stage];
      res = await sb.from("playoffs").delete().eq("stage", stage);
    } else {
      playoffWinners[stage] = code;
      res = await sb.from("playoffs").upsert({ stage: stage, winner: code });
    }
    setStatus(res.error ? "Could not save: " + res.error.message : "");
    render();
  }

  // =============== LOGIN ===============

    const res = await sb.auth.signInWithPassword({ email: email, password: password });
    if (res.error) { setStatus("Login failed: " + res.error.message); return; }

  // =============== PAGES ===============
    // =============== AWARDS AND BADGES ===============
  function computeBadges(rows) {
    const out = {};
    rows.forEach(function (r) { out[r.code] = []; });
    function add(code, icon, name, why) { out[code].push({ icon: icon, name: name, why: why }); }

    // streaks, from each team's results in match order
    rows.forEach(function (r) {
      let wins = 0;
      for (let i = r.form.length - 1; i >= 0 && r.form[i] === "W"; i--) { wins++; }
      let unbeaten = 0;
      for (let i = r.form.length - 1; i >= 0 && r.form[i] !== "L"; i--) { unbeaten++; }
      if (wins >= 3) { add(r.code, "🔥", "On Fire", wins + " wins in a row"); }
      if (unbeaten >= 5) { add(r.code, "🎯", "Unbeaten", unbeaten + " matches unbeaten"); }
    });

    // best defence and top scorers (teams with at least 3 matches played)
    const enough = rows.filter(function (r) { return r.played >= 3; });
    if (enough.length) {
      const minGA = Math.min.apply(null, enough.map(function (r) { return r.ga; }));
      enough.filter(function (r) { return r.ga === minGA; })
            .forEach(function (r) { add(r.code, "🧱", "Best Defence", r.ga + " goals conceded"); });
      const maxGF = Math.max.apply(null, enough.map(function (r) { return r.gf; }));
      if (maxGF > 0) {
        enough.filter(function (r) { return r.gf === maxGF; })
              .forEach(function (r) { add(r.code, "⚡", "Top Scorers", r.gf + " goals scored"); });
      }
    }

    // giant killer: beat the team that is top of the table right now
    const leader = rows[0];
    if (leader && leader.played >= 3) {
      const killers = {};
      getPlayedMatches().forEach(function (m) {
        if (m.home === leader.code && m.awayGoals > m.homeGoals) { killers[m.away] = true; }
        if (m.away === leader.code && m.homeGoals > m.awayGoals) { killers[m.home] = true; }
      });
      Object.keys(killers).forEach(function (code) {
        add(code, "🗡️", "Giant Killer", "Beat league leaders " + leader.name);
      });
    }
    return out;
  }

  function badgeIcons(list) {
    return list.map(function (b) {
      return "<span class='bdg' title='" + b.name + ": " + b.why + "'>" + b.icon + "</span>";
    }).join("");
  }

  function awardsCard(rows, badges) {
    const types = [
      ["🔥", "On Fire", "3+ wins in a row"],
      ["🎯", "Unbeaten", "5+ matches without a loss"],
      ["🧱", "Best Defence", "Fewest goals conceded"],
      ["⚡", "Top Scorers", "Most goals scored"],
      ["🗡️", "Giant Killer", "Beat the league leaders"]
    ];
    let html = "<div class='card'><h3>Awards</h3><div class='awards'>";
    types.forEach(function (t) {
      const holders = rows.filter(function (r) {
        return badges[r.code].some(function (b) { return b.icon === t[0]; });
      }).map(function (r) { return r.name; });
      html += "<div class='award'><span class='ic'>" + t[0] + "</span><b>" + t[1] + "</b><small>" + t[2] + "</small>" +
              (holders.length ? "<div class='who'>" + holders.join(", ") + "</div>" : "<div class='none'>Not awarded yet</div>") + "</div>";
    });
    return html + "</div></div>";
  }

    function pageStandings() {
    const rows = buildStandings();
    const badges = computeBadges(rows);
    const done = rows.every(function (r) { return r.played === 18; });
    let html = "";
    if (done) { html += "<div class='shield'>🛡️ League Shield winners: " + rows[0].name + "</div>"; }
    html += "<div class='card scroll'><table><tr><th>#</th><th class='left'>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>Form</th></tr>";
    rows.forEach(function (r, i) {

      const form = r.form.slice(-5).map(function (f) { return "<span class='" + f + "'>" + f + "</span>"; }).join("");
      html += "<tr class='" + (i < 4 ? "top4" : "") + "'><td>" + (i + 1) + "</td>" +
        "<td class='left'><span class='badge'>" + initials(r.name) + "</span><a class='tl' onclick=\"openTeam('" + r.code + "')\">" + r.name + "</a>" + (i === 0 ? " 🛡️" : "") + badgeIcons(badges[r.code]) + "</td>" +
        "<td>" + r.played + "</td><td>" + r.won + "</td><td>" + r.drawn + "</td><td>" + r.lost + "</td>" +
        "<td>" + r.gf + "</td><td>" + r.ga + "</td><td>" + (gd > 0 ? "+" + gd : gd) + "</td>" +
        "<td class='pts'>" + r.points + "</td><td class='form'>" + form + "</td></tr>";
    });
    html += "</table></div><p class='legend'>Green bar = playoff places (top 4). 1st place after 18 rounds wins the League Shield. Ties are split by goal difference, then goals scored. Hover over a badge to see why it was awarded.</p>";
    html += awardsCard(rows, badges);
    return html;
  }

    // =============== ROUND HIGHLIGHTS ===============
  function roundHighlights(ri) {
    const ms = buildFixtures()[ri];
    const played = ms.filter(function (m) {
      const r = results[m.id];
      return r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "";
    }).map(function (m) { return { m: m, h: Number(results[m.id].h), a: Number(results[m.id].a) }; });
    if (!played.length) { return ""; }

    function line(p) {
      return teams[p.m.home] + " <b>" + p.h + " - " + p.a + "</b> " + teams[p.m.away];
    }
    function box(icon, title, note, text) {
      return "<div class='hlbox'><span class='ic'>" + icon + "</span><div class='t'>" + title + "</div><small>" + note + "</small><div class='m'>" + text + "</div></div>";
    }

    // match of the round: most goals, then biggest margin
    const motr = played.slice().sort(function (x, y) {
      return (y.h + y.a) - (x.h + x.a) || Math.abs(y.h - y.a) - Math.abs(x.h - x.a);
    })[0];
    // biggest win: largest margin, then most goals
    const big = played.filter(function (p) { return p.h !== p.a; }).sort(function (x, y) {
      return Math.abs(y.h - y.a) - Math.abs(x.h - x.a) || (y.h + y.a) - (x.h + x.a);
    })[0];

    // team of the round: best winning performances
    const perf = [];
    played.forEach(function (p) {
      perf.push({ code: p.m.home, gf: p.h, ga: p.a, opp: p.m.away });
      perf.push({ code: p.m.away, gf: p.a, ga: p.h, opp: p.m.home });
    });
    const winners = perf.filter(function (x) { return x.gf > x.ga; }).sort(function (x, y) {
      return (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf;
    }).slice(0, 3);

    let html = "<div class='card hl'><h3><span>🏅 Round " + (ri + 1) + " Highlights</span><span class='legend'>" +
               played.length + " of " + ms.length + " matches played</span></h3><div class='hlgrid'>";
    html += box("⭐", "Match of the Round", "Most goals scored", line(motr));
    if (big && big.m.id !== motr.m.id) {
      html += box("💥", "Biggest Win", "Largest winning margin", line(big));
    }
    html += "</div><div class='t' style='font-family:Oswald,sans-serif;letter-spacing:.5px;color:var(--gold)'>Team of the Round</div>";
    if (winners.length) {
      html += "<div class='tor'>" + winners.map(function (w) {
        return "<div class='chip'><span class='badge'>" + initials(teams[w.code]) + "</span><div><b>" + teams[w.code] +
               "</b><small>beat " + teams[w.opp] + " " + w.gf + "-" + w.ga + "</small></div></div>";
      }).join("") + "</div>";
    } else {
      html += "<p class='legend'>No winning team yet this round.</p>";
    }
    return html + "</div>";
  }

    function pageFixtures() {
    const rounds = buildFixtures();
    let html = "<div class='rounds'>";
    for (let i = 0; i < 18; i++) {
      html += "<button class='" + (i === currentRound ? "on" : "") + "' onclick='currentRound=" + i + ";render()'>R" + (i + 1) + "</button>";
    }
    html += "</div><div class='card'><h3>Round " + (currentRound + 1) + " <span style='color:var(--muted);font-size:13px;font-weight:400'>" +
            (currentRound < 9 ? "First leg" : "Second leg") + "</span></h3>";
    rounds[currentRound].forEach(function (m) {
      const r = results[m.id] || { h: "", a: "" };
      const h = (r.h === null) ? "" : r.h, a = (r.a === null) ? "" : r.a;
      let middle;
      if (isAdmin) {
        middle = "<input id='h-" + m.id + "' type='number' min='0' value='" + h + "' onchange=\"saveScore('" + m.id + "')\"> : " +
                 "<input id='a-" + m.id + "' type='number' min='0' value='" + a + "' onchange=\"saveScore('" + m.id + "')\">";
      } else {
        middle = "<span class='score'>" + ((h !== "" && a !== "") ? h + " : " + a : "vs") + "</span>";
      }
      html += "<div class='match'><span class='h'>" + teams[m.home] + "</span><span>" + middle + "</span><span class='a'>" + teams[m.away] + "</span></div>";
    });
    return html + "</div>" + roundHighlights(currentRound);
  }

  function validWinner(stage, a, b) {
    const w = playoffWinners[stage];
    return (a && b && (w === a || w === b)) ? w : null;
  }

  function matchCard(stage, title, note, a, b, color) {
    let html = "<div class='pocard' style='border-left-color:" + color + "'>";
    html += "<b style='color:" + color + "'>" + title + "</b><small>" + note + "</small>";
    html += "<div class='vs'>" + (a ? teams[a] : "TBD") + " <span style='color:var(--muted)'>vs</span> " + (b ? teams[b] : "TBD") + "</div>";
    if (a && b) {
      if (isAdmin) {
        html += "<select onchange=\"pickWinner('" + stage + "', this.value)\"><option value=''>Pick winner...</option>" +
          "<option value='" + a + "'" + (playoffWinners[stage] === a ? " selected" : "") + ">" + teams[a] + "</option>" +
          "<option value='" + b + "'" + (playoffWinners[stage] === b ? " selected" : "") + ">" + teams[b] + "</option></select>";
      } else {
        const w = validWinner(stage, a, b);
        html += "<div>" + (w ? "Winner: <b>" + teams[w] + "</b>" : "<span style='color:var(--muted)'>Not played yet</span>") + "</div>";
      }
    }
    return html + "</div>";
  }

  function pagePlayoffs() {
    const table = buildStandings();
    const done = table.every(function (r) { return r.played === 18; });
    const top = table.slice(0, 4).map(function (r) { return r.code; });
    const t1 = top[0], t2 = top[1], t3 = top[2], t4 = top[3];
    const q1Winner = validWinner("q1", t1, t2);
    const q1Loser = q1Winner ? (q1Winner === t1 ? t2 : t1) : null;
    const elWinner = validWinner("el", t3, t4);
    const q2Winner = validWinner("q2", q1Loser, elWinner);
    const champion = validWinner("f", q1Winner, q2Winner);

    let html = "<p class='legend'>" + (done ? "League stage complete. The playoff line-up is set." :
               "Provisional: based on the current top 4. Final after all 18 rounds.") + "</p><div class='po'>";
    html += matchCard("q1", "Qualifier 1", "1st vs 2nd. Winner goes to the Final", t1, t2, "#2ecc88");
    html += matchCard("el", "Eliminator", "3rd vs 4th. Loser is out", t3, t4, "#ef4444");
    html += matchCard("q2", "Qualifier 2", "Loser of Q1 vs winner of Eliminator", q1Loser, elWinner, "#3b82f6");
    html += matchCard("f", "Final", "Winner of Q1 vs winner of Q2", q1Winner, q2Winner, "#f5b301");
    html += "</div>";
    if (champion) { html += "<div class='champ'>🏆 Champions: " + teams[champion] + "</div>"; }
    return html;
  }
  function esc(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function playerList(text) {
    return text.split("\n").map(function (x) { return x.trim(); }).filter(function (x) { return x !== ""; });
  }

  async function saveSquad(code) {
    if (!isAdmin) return;
    const owner = document.getElementById("own-" + code).value.trim();
    const players = document.getElementById("pl-" + code).value;

    if (res.error) { setStatus("Could not save: " + res.error.message); return; }
    squads[code] = { owner: owner, players: players };
    setStatus(teams[code] + " saved. " + ((count < 23 || count > 25) ? "Note: squad has " + count + " players (expected 23 to 25)." : count + " players."));
    render();

  function pageSquads() {
    let html = "<p class='legend'>Team owners and squads (23 to 25 players each).</p><div class='sq'>";
    Object.keys(teams).forEach(function (code) {
      const s = squads[code] || { owner: "", players: "" };

      if (isAdmin) {

                "<p><button class='btn' onclick=\"saveSquad('" + code + "')\">Save squad</button></p>";
      } else {
        html += "<p class='owner'>Owner: <b style='color:var(--text)'>" + (s.owner ? esc(s.owner) : "TBA") + "</b></p>";
        if (list.length) {
          html += "<p class='legend'>" + list.length + " players</p><ol class='plist'>" +
                  list.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ol>";
        } else {
          html += "<p class='legend'>Squad not added yet.</p>";
        }
      }
      html += "</div>";

  }
    // =============== LEAGUE RECORDS ===============
  function computeRecords() {
    const rounds = buildFixtures();
    const played = [];
    const roundGoals = [];
    rounds.forEach(function (round, ri) {
      let goals = 0, count = 0;
      round.forEach(function (m) {
        const r = results[m.id];
        if (r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "") {
          played.push({ ri: ri, home: m.home, away: m.away, h: Number(r.h), a: Number(r.a) });
          goals += Number(r.h) + Number(r.a);
          count++;
        }
      });
      roundGoals.push({ ri: ri, goals: goals, count: count, total: round.length });
    });
    const rec = { played: played };

    function pickMax(list, score) {
      let best = null;
      list.forEach(function (x) {
        const s = score(x);
        if (best === null || s > best.s) { best = { s: s, items: [x] }; }
        else if (s === best.s) { best.items.push(x); }
      });
      return best;
    }

    const wins = played.filter(function (p) { return p.h !== p.a; });
    rec.biggestWin = pickMax(wins, function (p) { return Math.abs(p.h - p.a) * 100 + p.h + p.a; });
    rec.mostGoals = pickMax(played, function (p) { return p.h + p.a; });

    const seq = {};
    Object.keys(teams).forEach(function (c) { seq[c] = []; });
    played.forEach(function (p) {
      seq[p.home].push(p.h > p.a ? "W" : p.h === p.a ? "D" : "L");
      seq[p.away].push(p.a > p.h ? "W" : p.h === p.a ? "D" : "L");
    });
    const streaks = Object.keys(teams).map(function (c) {
      let w = 0, bw = 0, u = 0, bu = 0;
      seq[c].forEach(function (x) {
        w = (x === "W") ? w + 1 : 0;
        u = (x !== "L") ? u + 1 : 0;
        if (w > bw) { bw = w; }
        if (u > bu) { bu = u; }
      });
      return { code: c, win: bw, unbeaten: bu };
    });
    rec.winStreak = pickMax(streaks, function (x) { return x.win; });
    rec.unbeaten = pickMax(streaks, function (x) { return x.unbeaten; });

    const home = {}, away = {};
    Object.keys(teams).forEach(function (c) {
      home[c] = { code: c, p: 0, pts: 0, gd: 0 };
      away[c] = { code: c, p: 0, pts: 0, gd: 0 };
    });
    played.forEach(function (p) {
      const hp = p.h > p.a ? 3 : p.h === p.a ? 1 : 0;
      const ap = p.a > p.h ? 3 : p.h === p.a ? 1 : 0;
      home[p.home].p++; home[p.home].pts += hp; home[p.home].gd += p.h - p.a;
      away[p.away].p++; away[p.away].pts += ap; away[p.away].gd += p.a - p.h;
    });
    function bestSide(table) {
      const list = Object.keys(table).map(function (c) { return table[c]; }).filter(function (x) { return x.p > 0; });
      return pickMax(list, function (x) { return x.pts * 1000 + x.gd * 10 + 500 - x.p; });
    }
    rec.bestHome = bestSide(home);
    rec.bestAway = bestSide(away);

    // only rounds where every match has been played
    const complete = roundGoals.filter(function (x) { return x.count === x.total; });
    rec.roundGoals = pickMax(complete, function (x) { return x.goals; });
    return rec;
  }

  function pageRecords() {
    const r = computeRecords();
    if (!r.played.length) {
      return "<div class='card'><h2>League Records</h2><p class='legend'>Records appear after the first results are entered.</p></div>";
    }
    function line(p) {
      return teams[p.home] + " <b>" + p.h + " - " + p.a + "</b> " + teams[p.away] + " <span class='legend'>(Round " + (p.ri + 1) + ")</span>";
    }
    function card(icon, title, note, text) {
      return "<div class='rec'><span class='ic'>" + icon + "</span><b>" + title + "</b><small>" + note + "</small><div class='who'>" + text + "</div></div>";
    }
    const none = "<span class='legend'>Not set yet</span>";
    let html = "<p class='legend'>Records update automatically from the results.</p><div class='recs'>";

    html += card("💥", "Biggest Win", "Largest winning margin",
      r.biggestWin ? r.biggestWin.items.map(line).join("<br>") : none);
    html += card("⚽", "Highest-Scoring Match", "Most goals in one game",
      r.mostGoals ? r.mostGoals.items.map(line).join("<br>") : none);
    html += card("🔥", "Longest Winning Streak", "Wins in a row",
      (r.winStreak && r.winStreak.s > 0) ? r.winStreak.items.map(function (x) { return teams[x.code]; }).join(", ") + " <b>(" + r.winStreak.s + ")</b>" : none);
    html += card("🎯", "Longest Unbeaten Run", "Matches without a loss",
      (r.unbeaten && r.unbeaten.s > 0) ? r.unbeaten.items.map(function (x) { return teams[x.code]; }).join(", ") + " <b>(" + r.unbeaten.s + ")</b>" : none);
    html += card("🏠", "Best Home Record", "Most home points, then goal difference",
      r.bestHome ? r.bestHome.items.map(function (x) { return teams[x.code] + " <b>" + x.pts + " pts</b> from " + x.p + " home games"; }).join("<br>") : none);
    html += card("✈️", "Best Away Record", "Most away points, then goal difference",
      r.bestAway ? r.bestAway.items.map(function (x) { return teams[x.code] + " <b>" + x.pts + " pts</b> from " + x.p + " away games"; }).join("<br>") : none);
    html += card("📈", "Most Goals in a Round", "Counts completed rounds only",
      r.roundGoals ? r.roundGoals.items.map(function (x) { return "Round " + (x.ri + 1) + " <b>(" + x.goals + " goals)</b>"; }).join("<br>") : "<span class='legend'>Needs a fully played round</span>");

    return html + "</div>";
  }
    // =============== TEAM PROFILE ===============
  function openTeam(code) {
    currentTeam = code;
    currentTab = "Team";
    render();
    window.scrollTo(0, 0);
  }

  function teamMatches(code) {
    const out = [];
    buildFixtures().forEach(function (round, ri) {
      round.forEach(function (m) {
        if (m.home !== code && m.away !== code) { return; }
        const r = results[m.id];
        const played = !!(r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "");
        const isHome = (m.home === code);
        const o = { ri: ri, isHome: isHome, opp: isHome ? m.away : m.home, played: played };
        if (played) {
          o.gf = Number(isHome ? r.h : r.a);
          o.ga = Number(isHome ? r.a : r.h);
          o.res = o.gf > o.ga ? "W" : (o.gf === o.ga ? "D" : "L");
        }
        out.push(o);
      });
    });
    return out;
  }

  function pointsChart(done) {
    if (!done.length) { return "<p class='legend'>The chart appears after the first result.</p>"; }
    const pts = [0];
    done.forEach(function (x) { pts.push(pts[pts.length - 1] + (x.res === "W" ? 3 : x.res === "D" ? 1 : 0)); });
    const max = Math.max(3, pts[pts.length - 1]);
    const n = done.length;
    function X(i) { return 12 + i * (296 / n); }
    function Y(v) { return 98 - (v / max) * 86; }
    const line = pts.map(function (v, i) { return X(i).toFixed(1) + "," + Y(v).toFixed(1); }).join(" ");
    const colors = { W: "#16a34a", D: "#9ca3af", L: "#ef4444" };
    let svg = "<svg viewBox='0 0 320 110' style='width:100%;height:auto'>" +
      "<line x1='12' y1='98' x2='308' y2='98' stroke='var(--line)'/>" +
      "<polyline points='" + line + "' fill='none' stroke='var(--accent)' stroke-width='2.5' stroke-linejoin='round'/>";
    done.forEach(function (x, i) {
      svg += "<circle cx='" + X(i + 1).toFixed(1) + "' cy='" + Y(pts[i + 1]).toFixed(1) + "' r='5' fill='" + colors[x.res] + "'/>";
    });
    return svg + "</svg><p class='legend'>Points after each match. Green = win, grey = draw, red = loss. Now: " + pts[pts.length - 1] + " pts.</p>";
  }

  function pageTeam() {
    const code = currentTeam;
    if (!teams[code]) { return "<div class='card'>Team not found.</div>"; }
    const rows = buildStandings();
    const pos = rows.findIndex(function (r) { return r.code === code; });
    const row = rows[pos];
    const ms = teamMatches(code);
    const done = ms.filter(function (x) { return x.played; });
    const next = ms.filter(function (x) { return !x.played; }).slice(0, 5);
    const sq = squads[code] || { owner: "", players: "" };
    const list = playerList(sq.players);
    const gd = row.gf - row.ga;
    const form = row.form.slice(-5).map(function (f) { return "<span class='" + f + "'>" + f + "</span>"; }).join("");
    const bdg = (typeof computeBadges === "function" && typeof badgeIcons === "function") ? badgeIcons(computeBadges(rows)[code]) : "";

    function stat(label, value) { return "<div class='stat'><b>" + value + "</b><small>" + label + "</small></div>"; }
    function oppLink(c) { return "<a class='tl' onclick=\"openTeam('" + c + "')\">" + teams[c] + "</a>"; }

    let html = "<button class='btn out back' onclick=\"currentTab='Standings';render()\">← Back to standings</button>";
    html += "<div class='card thead'><span class='badge big'>" + initials(teams[code]) + "</span><div>" +
      "<h2>" + teams[code] + " " + (pos === 0 ? "🛡️" : "") + bdg + "</h2>" +
      "<div class='legend'>Owner: <b style='color:var(--text)'>" + (sq.owner ? esc(sq.owner) : "TBA") + "</b></div>" +
      "<div class='form' style='margin-top:6px'>" + form + "</div></div></div>";
    html += "<div class='stats'>" + stat("Position", "#" + (pos + 1)) + stat("Points", row.points) + stat("Played", row.played) +
      stat("W-D-L", row.won + "-" + row.drawn + "-" + row.lost) + stat("Goals", row.gf + ":" + row.ga) + stat("Goal diff", (gd > 0 ? "+" : "") + gd) + "</div>";

    html += "<div class='card'><h3>Points progress</h3>" + pointsChart(done) + "</div>";

    html += "<div class='two'><div class='card'><h3>Results</h3>";
    if (done.length) {
      html += done.slice().reverse().map(function (x) {
        return "<div class='tm'><span class='pill " + x.res + "'>" + x.res + "</span><span>R" + (x.ri + 1) + " · " + (x.isHome ? "Home" : "Away") +
               " vs " + oppLink(x.opp) + "</span><b>" + x.gf + " - " + x.ga + "</b></div>";
      }).join("");
    } else { html += "<p class='legend'>No results yet.</p>"; }
    html += "</div><div class='card'><h3>Next fixtures</h3>";
    if (next.length) {
      html += next.map(function (x) {
        return "<div class='tm'><span class='pill D'>R" + (x.ri + 1) + "</span><span>" + (x.isHome ? "Home" : "Away") + " vs " + oppLink(x.opp) + "</span></div>";
      }).join("");
    } else { html += "<p class='legend'>All matches played.</p>"; }
    html += "</div></div>";

    html += "<div class='card'><h3>Squad (" + list.length + " players)</h3>";
    html += list.length ? "<ol class='plist'>" + list.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ol>"
                        : "<p class='legend'>Squad not added yet.</p>";
    return html + "</div>";
  }

  function pageRules() {
    return "<div class='card'><h2>League rules</h2><ol>" +
      "<li><b>Format:</b> 10 teams, home and away. Each team plays every other team twice, so 18 matches each.</li>" +
      "<li><b>Game:</b> Matches are played in the eFootball 2027 app (friend match). The home player creates the room.</li>" +
      "<li><b>Points:</b> Win 3, draw 1, loss 0.</li>" +
      "<li><b>Ranking:</b> Points, then goal difference, then goals scored.</li>" +
      "<li><b>League Shield:</b> The team in 1st place after the league stage wins the shield.</li>" +
      "<li><b>Playoffs (IPL format):</b> Top 4 qualify. Qualifier 1: 1st vs 2nd (winner to the Final). Eliminator: 3rd vs 4th (loser out). Qualifier 2: loser of Q1 vs winner of the Eliminator. Final: winner of Q1 vs winner of Q2.</li>" +
      "<li><b>Results:</b> Both players confirm the score after full time and share a screenshot in the group chat. The admin enters the result on this site.</li>" +
      "<li><b>Disputes:</b> The league admin's decision is final.</li></ol></div>";
  }

  function pageAdmin() {
    if (isAdmin) {
      return "<div class='card'><h2>Admin</h2><p>You are logged in. Enter scores in <b>Fixtures</b> and pick winners in <b>Playoffs</b>. Everyone sees the changes.</p>" +
             "<button class='btn out' onclick='logout()'>Log out</button></div>";
    }
    return "<div class='card login'><h2>Admin login</h2><p class='legend'>Only the league admin can enter results.</p>" +
           "<input id='em' type='email' placeholder='Email' autocomplete='username'>" +
           "<input id='pw' type='password' placeholder='Password' autocomplete='current-password'>" +
           "<button class='btn' onclick='login()'>Log in</button></div>";
  }

  // =============== DRAW THE PAGE ===============
    let lastKey = "";
  let lastTicker = "";

  function renderTicker() {
    const played = buildFixtures().flat().filter(function (m) {
      const r = results[m.id];
      return r && r.h !== null && r.h !== "" && r.a !== null && r.a !== "";
    }).slice(-10);
    let html;
    if (played.length === 0) {
      html = "<div class='tickmsg'>⚽ Season kicks off soon. Latest results will scroll here.</div>";
    } else {
      const items = played.map(function (m) {
        const r = results[m.id];
        return "<span class='tick'><b>" + teams[m.home] + "</b><em>" + r.h + " - " + r.a + "</em><b>" + teams[m.away] + "</b></span>";
      }).join("");
      html = "<div class='track'>" + items + items + "</div>";
    }
    if (html !== lastTicker) {
      document.getElementById("ticker").innerHTML = html;
      lastTicker = html;
    }
  }

  function render() {
    document.getElementById("nav").innerHTML = tabs.map(function (t) {
      const label = (t === "Admin" && isAdmin) ? "Admin ✓" : t;
      return "<button class='" + (t === currentTab ? "on" : "") + "' onclick=\"currentTab='" + t + "';render()\">" + label + "</button>";
    }).join("") + installButton();
    const pages = { Standings: pageStandings, Fixtures: pageFixtures, Playoffs: pagePlayoffs, Squads: pageSquads, Records: pageRecords, Rules: pageRules, Admin: pageAdmin, Team: pageTeam };
    const app = document.getElementById("app");
    app.innerHTML = pages[currentTab]();

    // play the entrance animation only when the tab or round changes
    const key = currentTab + (currentTab === "Fixtures" ? currentRound : "");
    if (key !== lastKey) {
      app.classList.remove("enter");
      void app.offsetWidth;          // restarts the animation
      app.classList.add("enter");
      lastKey = key;
    }
    renderTicker();
  }

  // =============== START ===============
  async function start() {
    const s = await sb.auth.getSession();
    isAdmin = !!(s.data && s.data.session);
    render();
    loadData();
    // refresh every 30 seconds, but not while someone is typing
    setInterval(function () {
      const tag = document.activeElement ? document.activeElement.tagName : "";
      if (tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA") { loadData(); }
    }, 30000);
  }

    function themeLabel() {
    const light = document.documentElement.getAttribute("data-theme") === "light";
    document.getElementById("themeBtn").textContent = light ? "🌙 Dark" : "☀️ Light";
  }
  function toggleTheme() {
    const light = document.documentElement.getAttribute("data-theme") === "light";
    if (light) { document.documentElement.removeAttribute("data-theme"); }
    else { document.documentElement.setAttribute("data-theme", "light"); }
    try { localStorage.setItem("theme", light ? "dark" : "light"); } catch (e) {}
    themeLabel();
  }
  themeLabel();

    let deferredInstall = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredInstall = e;
  });
  window.addEventListener("appinstalled", function () {
    deferredInstall = null;
    render();
  });

  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }

  function installButton() {
    return isStandalone() ? "" : "<button class='inst' onclick='installApp()'>📲 Install</button>";
  }

  async function installApp() {
    if (deferredInstall) {
      deferredInstall.prompt();
      await deferredInstall.userChoice;
      deferredInstall = null;
      render();
      return;
    }
    showInstallHelp();
  }

  function showInstallHelp() {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const steps = ios
      ? "<ol><li>Open this site in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (square with an arrow).</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol>"
      : "<ol><li>Open this site in <b>Chrome</b>.</li><li>Tap the <b>⋮</b> menu (top right).</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li></ol>";
    const box = document.createElement("div");
    box.className = "modal";
    box.innerHTML = "<div class='modalbox'><h3>📲 Install the league app</h3>" + steps +
      "<p class='legend'>If you opened this link inside WhatsApp or another app, first choose <b>Open in browser</b> from its menu.</p>" +
      "<button class='btn' onclick='this.closest(\".modal\").remove()'>Got it</button></div>";
    box.addEventListener("click", function (e) { if (e.target === box) { box.remove(); } });
    document.body.appendChild(box);
  }

  start();
    // =============== OPENING COUNTDOWN ===============
  (function () {
    const intro = document.getElementById("intro");
    let seen = false;
    try { seen = sessionStorage.getItem("introSeen") === "1"; } catch (e) {}
    if (seen) { intro.remove(); return; }

    const box = document.getElementById("count");
    const steps = ["3", "2", "1", "KICK OFF!"];
    let i = 0;

    function closeIntro() {
      intro.classList.add("hide");
      try { sessionStorage.setItem("introSeen", "1"); } catch (e) {}
      setTimeout(function () { intro.remove(); }, 900);
    }

    function show() {
      const last = (i === steps.length - 1);
      // a fresh element each time, so the animation restarts
      box.innerHTML = "<span class='" + (last ? "go" : "") + "'>" + steps[i] + "</span>";
      i++;
      if (i < steps.length) { setTimeout(show, 1200); }
      else { setTimeout(closeIntro, 1800); }
    }

    intro.addEventListener("click", closeIntro);
    show();

      // lets the site be installed as an app
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  })();

</script>
